<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMG — Client Matching</title>
<!--
  The first page of the new platform. One job: link each ledger client to its
  QuickBooks parent customer, once. The link lives in clients.qbo_customer_id and is
  what gives a client its payment curve, its invoice attribution, and (later) its
  hour-tracking rollup. Set here, remembered everywhere, never asked again.

  Deliberately a single self-contained file with no build step while the platform
  shell is still to come; it talks straight to PostgREST with the publishable key and
  a login, and RLS does the enforcement.
-->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e9ef; --dim:#8b93a3;
          --accent:#19a789; --warn:#d1a13b; --danger:#d1453b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:10px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1 1 220px; }
  .name { font-weight:600; }
  .hint { color:var(--dim); font-size:12px; }
  select, input[type=text], input[type=email], input[type=password] {
    width:100%; padding:8px 10px; background:#0c0e12; color:var(--text);
    border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line);
           background:#20242e; color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06231d; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .pill.linked { color:var(--accent); border-color:var(--accent); }
  .pill.todo { color:var(--warn); border-color:var(--warn); }
  .ok { color:var(--accent); } .err { color:var(--danger); white-space:pre-wrap; }
  .toolbar { display:flex; gap:10px; align-items:center; margin:18px 0; flex-wrap:wrap; }
  .count { color:var(--dim); }
  #login { max-width:360px; margin:80px auto; }
  .muted { color:var(--dim); }
</style>
</head>
<body>

<div id="login" class="card" hidden>
  <h1>EMG Ledger</h1>
  <p class="sub">Sign in to manage client matching.</p>
  <div class="row" style="flex-direction:column; align-items:stretch;">
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="signin" class="primary">Sign in</button>
    <div id="loginmsg" class="err"></div>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <h1>Client matching</h1>
  <div class="sub">Link each client to its QuickBooks customer. Set once — invoices,
    payment behaviour and hour tracking all follow this link from then on.</div>

  <div class="toolbar">
    <input id="filter" type="text" placeholder="filter clients…" style="max-width:260px">
    <label class="muted"><input type="checkbox" id="onlytodo" checked> only unlinked</label>
    <span class="count" id="count"></span>
    <span style="flex:1"></span>
    <button id="refresh">Refresh</button>
    <button id="signout">Sign out</button>
  </div>

  <div id="list"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supa = createClient(
  'https://zytmlowigbfchfqcilrr.supabase.co',
  'sb_publishable_0kcl48Yn5YsoTB0zrK-Rsg_c76JTGvR'
);

const $ = s => document.querySelector(s);
let clients = [], parents = [], takenBy = {};

async function requireSession() {
  const { data: { session } } = await supa.auth.getSession();
  $('#login').hidden = !!session;
  $('#app').hidden = !session;
  return session;
}

$('#signin').onclick = async () => {
  $('#loginmsg').textContent = '';
  const { error } = await supa.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value
  });
  if (error) { $('#loginmsg').textContent = error.message; return; }
  await requireSession(); load();
};
$('#signout').onclick = async () => { await supa.auth.signOut(); requireSession(); };

async function load() {
  const [c, q] = await Promise.all([
    supa.from('clients').select('id,name,qbo_customer_id,active').order('name'),
    supa.from('qbo_projects').select('id,name,active')
        .is('parent_id', null).order('name')
  ]);
  if (c.error || q.error) { $('#list').innerHTML =
    `<div class="card err">${(c.error||q.error).message}</div>`; return; }
  clients = c.data; parents = q.data;
  takenBy = {};
  clients.forEach(cl => { if (cl.qbo_customer_id) takenBy[cl.qbo_customer_id] = cl.name; });
  render();
}

function render() {
  const f = $('#filter').value.trim().toLowerCase();
  const onlyTodo = $('#onlytodo').checked;
  const shown = clients.filter(c =>
    (!onlyTodo || !c.qbo_customer_id) &&
    (!f || c.name.toLowerCase().includes(f)));
  $('#count').textContent =
    `${clients.filter(c=>!c.qbo_customer_id).length} unlinked of ${clients.length}`;
  $('#list').innerHTML = shown.map(c => {
    const linkedName = c.qbo_customer_id
      ? (parents.find(p => p.id === c.qbo_customer_id) || {}).name || c.qbo_customer_id
      : null;
    // Free parents first, then taken ones (visible but marked) — a wrong link is
    // fixable here, so nothing is hidden, only labelled.
    const opts = parents.map(p => {
      const taken = takenBy[p.id] && takenBy[p.id] !== c.name;
      return `<option value="${p.id}" ${taken ? 'data-taken="1"' : ''}>` +
             `${esc(p.name)}${taken ? ` — already linked to ${esc(takenBy[p.id])}` : ''}</option>`;
    }).join('');
    return `<div class="card" data-id="${c.id}">
      <div class="row">
        <div class="grow">
          <div class="name">${esc(c.name)}</div>
          <div class="hint">${linkedName ? 'linked to ' + esc(linkedName) : 'not linked to QuickBooks'}</div>
        </div>
        <span class="pill ${linkedName ? 'linked' : 'todo'}">${linkedName ? 'linked' : 'needs link'}</span>
        <div class="grow">
          <select class="pick">
            <option value="">— choose QuickBooks customer —</option>${opts}
          </select>
        </div>
        <button class="save primary" disabled>Save</button>
        ${linkedName ? '<button class="unlink">Unlink</button>' : ''}
      </div>
      <div class="hint msg"></div>
    </div>`;
  }).join('') || '<div class="card muted">Nothing to show.</div>';

  document.querySelectorAll('.card[data-id]').forEach(card => {
    const pick = card.querySelector('.pick');
    const save = card.querySelector('.save');
    const msg  = card.querySelector('.msg');
    pick.onchange = () => { save.disabled = !pick.value; };
    save.onclick = async () => {
      save.disabled = true;
      const chosen = pick.selectedOptions[0];
      if (chosen.dataset.taken &&
          !confirm(`${chosen.textContent.trim()}\n\nThis QuickBooks customer is already linked to another client. Move the link here?`)) {
        save.disabled = false; return;
      }
      // Moving a link: clear it from the previous holder first (unique column).
      if (chosen.dataset.taken) {
        const prev = clients.find(x => x.qbo_customer_id === pick.value);
        if (prev) {
          const { error } = await supa.from('clients')
            .update({ qbo_customer_id: null, set_by: userEmail(), set_at: new Date().toISOString() })
            .eq('id', prev.id);
          if (error) { msg.textContent = error.message; msg.className = 'hint err'; return; }
        }
      }
      const { error } = await supa.from('clients')
        .update({ qbo_customer_id: pick.value, set_by: userEmail(), set_at: new Date().toISOString() })
        .eq('id', card.dataset.id);
      msg.textContent = error ? error.message : 'saved';
      msg.className = error ? 'hint err' : 'hint ok';
      if (!error) load();
    };
    const unlink = card.querySelector('.unlink');
    if (unlink) unlink.onclick = async () => {
      const { error } = await supa.from('clients')
        .update({ qbo_customer_id: null, set_by: userEmail(), set_at: new Date().toISOString() })
        .eq('id', card.dataset.id);
      if (!error) load();
    };
  });
}

function userEmail() { return (supa.auth.getSession && window.__email) || 'matching-page'; }
supa.auth.getSession().then(({ data: { session } }) => {
  window.__email = session && session.user ? session.user.email : null;
});

function esc(s) { return String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('#filter').oninput = render;
$('#onlytodo').onchange = render;
$('#refresh').onclick = load;

const session = await requireSession();
if (session) load();
</script>
</body>
</html>
