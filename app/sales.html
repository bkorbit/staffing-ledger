<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>
/* Layout and chart styling carried over from sales-forecast-draft.html — the design
   the page is modelled on — trimmed to what the shell doesn't already provide. */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.toggroup{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:6px}
.tog>span{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate)}
.cfg{font-family:var(--font-mono);font-size:10px;color:var(--slate)}
.seg{font-family:var(--font-mono);font-size:10px;padding:6px 11px;border:1px solid var(--line);
  background:var(--paper-raised);border-radius:5px;cursor:pointer;color:var(--slate)}

.rp .seg:first-child{border-left:none}

.csvg{padding:6px 12px 0}
.csvg.scroll{overflow-x:auto;padding-bottom:6px}
svg.sfchart{width:100%;height:auto;display:block}
svg.sfchart .ax{font-family:var(--font-mono);font-size:10px;fill:var(--slate)}
svg.sfchart .bt{font-family:var(--font-mono);font-size:10.5px;font-weight:500;fill:var(--brand)}

  border-top:1px solid var(--line);background:#f2f2f2;border-radius:0 0 6px 6px}
.legend span{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;color:var(--ink)}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}
.cover{font-family:var(--font-mono);font-size:11px;padding:10px 13px;border-radius:6px;margin-bottom:4px;margin-top:8px;line-height:1.6}
.cover.good{background:var(--mint)} .cover.warn{background:var(--amber-bg)} .cover.bad{background:var(--rust-bg)}

  border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.infobtn.good{color:var(--brand);border-color:var(--brand-2);background:var(--mint)}
.infobtn.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-bg)}

table.fc{width:100%;border-collapse:collapse;background:var(--paper-raised)}
table.fc th{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--slate);text-align:left;padding:9px 8px;border:none;border-bottom:1px solid var(--line);background:transparent}
table.fc td{padding:7px 8px;border:none;border-bottom:1px solid #efefef;font-family:var(--font-mono);font-size:11.5px;vertical-align:top}

table.fc th.cl,table.fc td.cl{min-width:230px} table.fc td.cl{font-family:var(--font-body)}
table.fc th.pr,table.fc td.pr{min-width:120px} table.fc th.fl,table.fc td.fl{min-width:150px}
.crow{cursor:pointer}
.crow td{background:#fafaf8;font-weight:700;font-family:var(--font-display);font-size:12.5px;border-top:1px solid var(--line)}
.crow td.n{font-family:var(--font-mono);font-size:11.5px}
.crow:focus-visible,.drow.hasitems:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--brand-2),inset 0 0 0 4px var(--mint)}
.drow td.cl{padding-left:22px}
.drow.dim td{opacity:.55}
.drow.hasitems{cursor:pointer}
.disc{display:inline-block;width:12px;color:var(--slate)}
.parts{font-size:9px;color:var(--slate);margin-top:2px;font-family:var(--font-mono)}
td.pr{font-size:10px;color:var(--slate)}
td.pr .p{display:inline-block;margin-left:5px;background:var(--brand);color:#fff;border-radius:5px;padding:0 4px;font-size:9px}
td.tot{font-weight:700;color:var(--brand)}
.z{color:#c8c8c8}
.grand td{background:var(--brand);color:#fff;font-weight:700;border-top:2px solid var(--brand)}
.flag{display:inline-block;font-size:9px;border-radius:5px;padding:1px 5px;margin:1px 3px 1px 0;font-family:var(--font-mono)}
.flag.t{background:var(--rust-bg);color:var(--rust)} .flag.w{background:var(--amber-bg);color:var(--amber)} .flag.i{background:#f2f2f2;color:var(--slate)}
.empty{padding:30px;text-align:center;color:var(--slate);font-family:var(--font-mono);font-size:11px}
</style></head><body>
<script type="module">
import { boot, esc, fetchAll } from './assets/shell.js?v=15660b3';
/*
  The Sales Forecast, modelled on sales-forecast-draft.html and wired to the mirror.
  Gross profit is derived from HubSpot line items through the same type map the
  ledger uses; deals that cannot be forecast say why instead of disappearing. The
  bars stack pipeline by stage confidence ON TOP of committed GP from shaped deals —
  the draft faked that base layer; here it is v_deal_month_forecast for real.
*/
boot('sales', async (supa, el) => {
  // pipeline_deals is a full, unfiltered mirror of every HubSpot deal ever
  // synced (see sync-hubspot.mjs) and v_deal_month_forecast can run to many
  // rows too — both can outgrow Supabase's 1000-row cap, so both page.
  const [pd, st, fc, promoted] = await Promise.all([
    fetchAll(() => supa.from('pipeline_deals').select('*')),
    supa.from('settings').select('key,value')
      .in('key', ['sales_probability_threshold','programmatic_margin_default']),
    fetchAll(() => supa.from('v_deal_month_forecast').select('month,gp')),
    fetchAll(() => supa.from('deals').select('hubspot_deal_id,reviewed_at')
      .eq('origin','hubspot').in('status',['won','active']))
  ]);
  for (const r of [pd, st, fc, promoted]) if (r.error) throw r.error;
  const setting = k => (st.data||[]).find(s=>s.key===k)?.value;
  const minProb = +(setting('sales_probability_threshold') ?? 10);
  const PROG_MARGIN = +(setting('programmatic_margin_default') ?? 35);

  // committed GP by month, real
  const LEDGER = {};
  (fc.data||[]).forEach(r => LEDGER[r.month.slice(0,7)] = (LEDGER[r.month.slice(0,7)]||0) + r.gp);

  /* ------------------------------------------------------------- plumbing */
  const money = c => (c<0?'-':'') + '$' + Math.round(Math.abs(c)/100).toLocaleString();
  const mk = d => (d||'').slice(0,7);
  const shift = (k,n)=>{const[y,m]=k.split('-').map(Number);
    return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);};
  const label = k=>{const[y,m]=k.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})+" '"+String(y).slice(2);};
  const monthsRange=(a,b)=>{const out=[];let c=a,g=0;while(c<=b&&g<48){out.push(c);c=shift(c,1);g++;}return out;};
  const monthsBetween=(a,b)=>{const out=[];let c=mk(a);const e=mk(b);let g=0;
    while(c<=e&&g<60){out.push(c);c=shift(c,1);g++;}return out;};
  const TODAY = new Date().toISOString().slice(0,10);

  // stage confidence tiers: deep teal certain -> pale gold early — every
  // step is a confirmed brand token (two teal steps, then two gold steps),
  // not an invented in-between color
  const TIER_COLORS = ['#19a789','#3bc9ac','#e2f5ef','#fabf4d','#fdf3dc'];
  const tierOf = p => p>=0.85?0 : p>=0.65?1 : p>=0.45?2 : p>=0.25?3 : 4;
  const LEDGER_COLOR = '#0a493c';

  // the ledger's line-item type map, verbatim from the draft
  const MAP={ 'programmatic media':['programmatic','budget'], 'programmatic buying fee':['programmatic','fee'],
   'paid search media':['search','budget'], 'paid search fee':['search','fee'],
   'paid social media':['social','budget'], 'paid social fee':['social','fee'],
   'paid search hourly':['hourly','flat'], 'paid social hourly':['hourly','flat'],
   'creative retainer':['retainer','flat'], 'creative services':['retainer','flat'],
   'planning':['retainer','flat'], 'dashboard':['retainer','flat'] };

  function dealGP(items){
    const g={}, flags=[];
    (items||[]).forEach(li=>{
      const amt = Math.round(parseFloat(li.amount||0)*100);
      const key = String(li.name||'').split(':').pop().trim().toLowerCase();
      const m = MAP[key];
      if(!m){ flags.push('unmapped: '+(li.name||'?')); return; }
      const [type,role]=m;
      (g[type]=g[type]||{budget:0,fee:0,flat:0})[role]+= amt;
    });
    let gp=0; const parts=[];
    Object.entries(g).forEach(([type,v])=>{
      if(type==='search'||type==='social'){
        if(v.budget>0){ const pct=v.fee/v.budget*100; gp+=v.budget*pct/100;
          parts.push(`${type} ${pct.toFixed(1)}% of ${money(v.budget)}`);
          if(v.fee<=0) flags.push(type+' media with no fee line'); }
        else if(v.fee>0){ gp+=v.fee; parts.push(`${type} fee ${money(v.fee)} (no media)`); }
        gp+=v.flat;
      } else if(type==='programmatic'){
        if(v.budget>0){ const pct=v.fee>0? v.fee/v.budget*100 : 0; const rate=pct+PROG_MARGIN;
          gp+=v.budget*rate/100; parts.push(`programmatic ${rate.toFixed(1)}% of ${money(v.budget)}${v.fee>0?'':' (margin only)'}`); }
        else if(v.fee>0){ gp+=v.fee; parts.push(`programmatic fee ${money(v.fee)} (no media)`);
          flags.push('programmatic fee with no media line'); }
        gp+=v.flat;
      } else { gp+=v.flat+v.fee+v.budget; parts.push(`${type} ${money(v.flat+v.fee+v.budget)}`); }
    });
    return {gp:Math.round(gp),parts,flags};
  }

  // the effective margin a deal's programmatic items are expected to earn —
  // same formula dealGP() uses internally (fee%, if any, plus the configured
  // default margin), exposed separately so it can be tagged onto the raw
  // line item itself, not just folded into the deal's summary line
  function programmaticRate(items){
    let budget=0, fee=0;
    (items||[]).forEach(li=>{
      const key = String(li.name||'').split(':').pop().trim().toLowerCase();
      const m = MAP[key];
      if(!m || m[0]!=='programmatic') return;
      const amt = Math.round(parseFloat(li.amount||0)*100);
      if(m[1]==='budget') budget+=amt; else if(m[1]==='fee') fee+=amt;
    });
    if(budget<=0) return null;
    return (fee>0? fee/budget*100 : 0) + PROG_MARGIN;
  }

  /* ------------------------------------------------------------- the rows */
  const CUTOFF = '2026-01-01';
  const touches2026 = d => !d.campaign_end || d.campaign_end >= CUTOFF;
  const open = (pd.data||[]).filter(d => !d.is_won && (d.probability??0) > 0 && touches2026(d));
  // won deals pass over automatically: show the door's recent traffic
  const promotedBy = {}; (promoted.data||[]).forEach(x => promotedBy[x.hubspot_deal_id] = x);
  const wonRecent = (pd.data||[]).filter(d => d.is_won && touches2026(d));
  const pipelines = [...new Set(open.map(d=>d.pipeline).filter(Boolean))].sort();
  let pipeline = pipelines.includes('agency') ? 'agency' : (pipelines[0]||'__all__');
  let weighted=true, showAll=false, chartOn=true;
  try { chartOn = localStorage.getItem('sf-chart')!=='0'; } catch(e) {}
  let rangeFrom = TODAY.slice(0,7), rangeTo = shift(rangeFrom,5);
  // collapsed by default — a client shows its deals, a deal shows its line
  // items, only once clicked open
  let openClients = new Set(), openDeals = new Set(), coverageOpen = false;

  function build(){
    return open
      .filter(d => (pipeline==='__all__' || d.pipeline===pipeline)
                && Math.round((d.probability||0)*100) >= minProb)
      .map(d => {
        const {gp,parts,flags} = dealGP(d.line_items);
        const f=[...flags];
        if(!d.line_items || !d.line_items.length) f.push('no line items');
        if(d.close_date && d.close_date < TODAY) f.push('close date passed');
        if(d.campaign_start && d.campaign_start < TODAY) f.push('start date passed');
        if(!d.campaign_start || !d.campaign_end) f.push('no campaign dates');
        if(d.campaign_start && d.campaign_end && d.campaign_end < d.campaign_start)
          f.push('campaign ends before it starts');
        const months = (d.campaign_start && d.campaign_end && d.campaign_end >= d.campaign_start)
          ? monthsBetween(d.campaign_start, d.campaign_end)
          : (d.close_date ? [mk(d.close_date)] : []);
        const client = d.company || String(d.name||'').split(' - ')[0].trim();
        const rest = d.company ? d.name : (String(d.name||'').split(' - ').slice(1).join(' - ') || d.name);
        return { id:d.hubspot_deal_id, client, rest, name:d.name, amount:d.amount||0, stage:d.stage,
                 prob:d.probability||0, tier:tierOf(d.probability||0), close:d.close_date,
                 items:d.line_items||[],
                 gp, parts, flags:f, months, forecastable: gp>0 && months.length>0 };
      });
  }

  /* --------------------------------------------------------------- render */
  el.innerHTML = `
    <div class="bar">
      <div class="toggroup">
        <div class="tog"><label for="pl">Pipeline</label>
          <select id="pl" style="height:30px">${pipelines.map(p=>`<option ${p===pipeline?'selected':''}>${esc(p)}</option>`).join('')}<option value="__all__">all</option></select></div>
        <div class="tog"><span id="lbl-value">Value</span>
          <span role="group" aria-labelledby="lbl-value" style="display:flex;gap:6px">
            <button class="seg on" data-w="1" aria-pressed="true">Weighted</button><button class="seg" data-w="0" aria-pressed="false">Total</button></span></div>
        <div class="tog"><span id="lbl-show">Show</span>
          <span role="group" aria-labelledby="lbl-show" style="display:flex;gap:6px">
            <button class="seg on" data-f="0" aria-pressed="true">Forecastable</button><button class="seg" data-f="1" aria-pressed="false">All deals</button></span></div>
      </div>
      <div style="flex:1"></div>
      <div class="cfg">min probability ${minProb}% · programmatic margin ${PROG_MARGIN}% ·
        <a href="./settings.html">settings</a></div>
    </div>
    <div id="coverage"></div>
    <div class="sc-panel chartpanel" style="padding:0">
      <div class="range">
        <span class="rl" id="lbl-range">Range</span>
        <input type="month" id="r-from" aria-label="Range from">
        <span class="rd">to</span>
        <input type="month" id="r-to" aria-label="Range to">
        <span class="rp" role="group" aria-labelledby="lbl-range">
          <button class="seg" data-span="3" aria-pressed="false">3mo</button>
          <button class="seg on" data-span="6" aria-pressed="true">6mo</button>
          <button class="seg" data-span="12" aria-pressed="false">12mo</button>
          <button class="seg" data-span="18" aria-pressed="false">18mo</button></span>
        <button class="seg" id="chart-toggle" style="margin-left:auto" aria-expanded="true" aria-controls="chartwrap"></button>
      </div>
      <div id="chartwrap"></div>
    </div>
    <div class="sc-panel" style="padding:4px;overflow-x:auto"><div id="tbl"></div></div>`;

  function renderChart(cols, shown){
    const wrap = el.querySelector('#chartwrap');
    const btn = el.querySelector('#chart-toggle');
    btn.textContent = chartOn ? 'Hide chart' : 'Show chart';
    btn.setAttribute('aria-expanded', String(chartOn));
    el.querySelector('.chartpanel').classList.toggle('collapsed', !chartOn);
    if(!chartOn){ wrap.innerHTML=''; return; }
    const n=cols.length;
    const W=Math.max(960,Math.round(60*n)+90), H=300,PL=70,PR=18,PT=26,PB=54,IW=W-PL-PR,IH=H-PT-PB;
    const dense=n>10, verydense=n>16;
    const data=cols.map(c=>{
      const byTier=[0,0,0,0,0];
      shown.forEach(r=>{
        if(!r.months.includes(c)||!r.gp) return;
        byTier[r.tier]+= r.gp*(weighted?r.prob:1)/r.months.length;
      });
      return { c, ledger:LEDGER[c]||0, byTier, pipe:byTier.reduce((a,b)=>a+b,0) };
    });
    const max=Math.max(1,...data.map(d=>d.ledger+d.pipe));
    const stepC=max>120000000?40000000:max>60000000?20000000:max>20000000?10000000:max>6000000?2000000:1000000;
    const top=Math.ceil(max/stepC)*stepC;
    const y=v=>PT+IH-(v/top)*IH;
    const bw=Math.min(96,IW/n*0.6), gap=IW/n;
    let g='';
    for(let v=0;v<=top;v+=stepC)
      g+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="var(--line)"/>`+
         `<text x="${PL-12}" y="${y(v)+3.5}" text-anchor="end" class="ax">$${Math.round(v/100000)/10}k</text>`;
    data.forEach((d,i)=>{
      const cx=PL+gap*i+gap/2, x=cx-bw/2; let acc=0;
      // every segment gets a hairline stroke: the two palest confidence tiers
      // (mint/amber tint) are nearly invisible as a fill alone against white —
      // the edge is what makes them perceivable
      if(d.ledger>0){ const h=(d.ledger/top)*IH; acc+=d.ledger;
        g+=`<rect x="${x}" y="${y(acc)}" width="${bw}" height="${h}" fill="${LEDGER_COLOR}" stroke="var(--line)" stroke-width="1"><title>${label(d.c)} committed ${money(d.ledger)}</title></rect>`; }
      d.byTier.forEach((v,tIdx)=>{
        if(v<=0) return;
        const h=(v/top)*IH; const yTop=y(acc+v); acc+=v;
        g+=`<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${TIER_COLORS[tIdx]}" stroke="var(--line)" stroke-width="1"><title>${label(d.c)} ${money(v)}</title></rect>`;
      });
      if(acc>0&&!dense) g+=`<text x="${cx}" y="${y(acc)-6}" text-anchor="middle" class="bt">${money(acc)}</text>`;
      if(!verydense||i%2===0) g+=`<text x="${cx}" y="${H-33}" text-anchor="middle" class="ax">${label(d.c)}</text>`;
      if(d.pipe>0&&!dense) g+=`<text x="${cx}" y="${H-18}" text-anchor="middle" class="pl">+${money(d.pipe)} pipeline</text>`;
    });
    const tiersPresent=[...new Set(shown.filter(r=>r.gp&&r.months.length).map(r=>r.tier))].sort();
    const tierLabel=t=>[...new Set(shown.filter(r=>r.tier===t).map(r=>r.stage))].join(' / ');
    const totals=data.reduce((a,d)=>({l:a.l+d.ledger,p:a.p+d.pipe}),{l:0,p:0});
    const chartSummary=`Committed GP plus pipeline by month, ${weighted?'weighted by stage':'total value'}, `+
      `${n} months from ${label(cols[0])} to ${label(cols[n-1])}: committed ${money(totals.l)}, `+
      `pipeline ${money(Math.round(totals.p))}, total ${money(Math.round(totals.l+totals.p))}.`;
    // wide/dense views (many months) keep their real bar width and scroll
    // horizontally instead of squeezing every bar and label down to fit
    const svgStyle = dense ? ` style="width:${W}px;max-width:none"` : '';
    wrap.innerHTML =
      `<div class="chead"><h3>Committed revenue plus pipeline — ${weighted?'weighted by stage':'total value at 100%'}</h3>
       <div class="csum">${n} months · committed ${money(totals.l)} · pipeline ${money(Math.round(totals.p))} · total ${money(Math.round(totals.l+totals.p))}</div></div>
       <div class="csvg${dense?' scroll':''}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="sfchart" role="img" aria-label="${esc(chartSummary)}"${svgStyle}><title>${esc(chartSummary)}</title>${g}</svg></div>
       <div class="legend"><span><i style="background:${LEDGER_COLOR}"></i>Committed GP (shaped deals)</span>` +
       tiersPresent.map(t=>`<span><i style="background:${TIER_COLORS[t]}"></i>${esc(tierLabel(t))}</span>`).join('') + `</div>`;
  }

  function render(){
    const rows = build();
    const shown = rows.filter(r=>showAll||r.forecastable);
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    const cols = monthsRange(rangeFrom, rangeTo);
    el.querySelector('#r-from').value = rangeFrom;
    el.querySelector('#r-to').value = rangeTo;
    el.querySelectorAll('[data-span]').forEach(b=>{
      const on = +b.dataset.span===cols.length;
      b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
    });

    const nF=rows.filter(r=>r.forecastable).length;
    const noLI=rows.filter(r=>r.flags.includes('no line items')).length;
    const stale=rows.filter(r=>r.flags.includes('close date passed')).length;
    const pct=rows.length?Math.round(nF/rows.length*100):0;
    const wonPromoted = wonRecent.filter(d=>promotedBy[d.hubspot_deal_id]);
    const wonReview = wonPromoted.filter(d=>!promotedBy[d.hubspot_deal_id].reviewed_at);
    const wonWaiting = wonRecent.length - wonPromoted.length;
    // both banners collapse behind one info pill — its color still carries the
    // at-a-glance health signal even while the detail text is hidden
    const covCls = rows.length ? (pct>=70?'good':pct>=40?'warn':'bad') : 'good';
    el.querySelector('#coverage').innerHTML =
      (rows.length || wonRecent.length ? `<button class="infobtn ${covCls}" id="covtoggle" aria-expanded="${coverageOpen}">`+
        `ⓘ pipeline health${rows.length?` — ${pct}% forecastable`:''}${coverageOpen?' ▾':' ▸'}</button>` : '') +
      (coverageOpen ? (
        (rows.length ? `<div class="cover ${covCls}">
          ${nF} of ${rows.length} deals forecastable (${pct}%) —
          ${noLI} without line items, ${stale} past their close date.
          GP needs line items and campaign dates in HubSpot; fixing them there brings deals in on the next sync.</div>` : '') +
        (wonRecent.length ? `<div class="cover good">Closed won: ${wonPromoted.length} passed to the
          <a href="./forecast.html">Forecast</a> automatically${wonReview.length?` — ${wonReview.length} still awaiting review there`:''}${wonWaiting?`; ${wonWaiting} will pass on the next sync`:''}.
          Mappable line items are flighted out on arrival; the rest get a skeleton and a reason.</div>` : '')
      ) : '');
    const covBtn = el.querySelector('#covtoggle');
    if (covBtn) covBtn.onclick = () => { coverageOpen = !coverageOpen; render(); };

    renderChart(cols, shown);

    const by={}; shown.forEach(r=>(by[r.client]=by[r.client]||[]).push(r));
    const clients=Object.keys(by).sort((a,b)=>{
      const t=x=>by[x].reduce((s,r)=>s+r.gp*(weighted?r.prob:1),0);
      return t(b)-t(a);
    });
    let h='<table class="fc"><thead><tr><th class="cl">Client / deal</th><th class="pr">Stage</th><th class="n">Close</th>'+
      cols.map(c=>`<th class="n">${label(c)}</th>`).join('')+'<th class="n tot">Total</th><th class="fl">Flags</th></tr></thead><tbody>';
    const colTot={}; let grand=0;
    clients.forEach(cn=>{
      const ds=by[cn];
      const cTot={}; let cSum=0;
      ds.forEach(r=>{ const per=r.months.length? r.gp*(weighted?r.prob:1)/r.months.length : 0;
        r.months.forEach(m=>{ if(cols.includes(m)) cTot[m]=(cTot[m]||0)+per; });
        cSum+=r.gp*(weighted?r.prob:1); });
      // totals above are for EVERY deal regardless of collapse state — only
      // the row markup below is conditional, so collapsing a client can
      // never change the grand total at the bottom of the table
      const clientOpen = openClients.has(cn);
      h+=`<tr class="crow" data-client="${esc(cn)}" tabindex="0" role="button" aria-expanded="${clientOpen}">`+
        `<td class="cl"><span class="disc">${clientOpen?'▾':'▸'}</span>${esc(cn)}</td><td></td><td></td>`+
        cols.map(c=>`<td class="n">${cTot[c]?money(Math.round(cTot[c])):'<span class=z>·</span>'}</td>`).join('')+
        `<td class="n tot">${money(Math.round(cSum))}</td><td></td></tr>`;
      ds.sort((a,b)=>b.gp*(weighted?b.prob:1)-a.gp*(weighted?a.prob:1)).forEach(r=>{
        const per=r.months.length? r.gp*(weighted?r.prob:1)/r.months.length : 0;
        const tot=r.gp*(weighted?r.prob:1);
        cols.forEach(c=>{ if(r.months.includes(c)) colTot[c]=(colTot[c]||0)+per; });
        grand+=tot;
        if (!clientOpen) return;
        const hasItems = r.items.length > 0;
        const dealOpen = hasItems && openDeals.has(r.id);
        h+=`<tr class="drow${r.forecastable?'':' dim'}${hasItems?' hasitems':''}" data-deal="${hasItems?esc(r.id||''):''}" `+
          `${hasItems?`tabindex="0" role="button" aria-expanded="${dealOpen}"`:''}>`+
          `<td class="cl"><span class="disc">${hasItems?(dealOpen?'▾':'▸'):''}</span><span class="ellip" title="${esc(r.rest)}">${esc(r.rest)}</span>`+
          (r.parts.length?`<div class="parts">${esc(r.parts.join(' · '))}</div>`:'')+`</td>`+
          `<td class="pr">${esc(r.stage)}<span class="p">${Math.round(r.prob*100)}%</span></td>`+
          `<td class="n">${r.close?label(mk(r.close)):'<span class=z>·</span>'}</td>`+
          cols.map(c=>`<td class="n">${r.months.includes(c)&&per?money(Math.round(per)):'<span class=z>·</span>'}</td>`).join('')+
          `<td class="n tot">${tot?money(Math.round(tot)):'—'}</td>`+
          `<td class="fl">${r.flags.map(f=>`<span class="flag ${/passed|before/.test(f)?'t':/no line|unmapped/.test(f)?'w':'i'}">${esc(f)}</span>`).join('')}</td></tr>`;
        const progRate = dealOpen ? programmaticRate(r.items) : null;
        if (dealOpen) r.items.forEach(li2=>{
          // flighted: the raw HubSpot line-item amount spread evenly across
          // the DEAL's own campaign months — the same spread the deal-level
          // row above uses for its GP, just applied to this item's own amount
          const amt = Math.round(parseFloat(li2.amount||0)*100);
          const iper = r.months.length ? amt/r.months.length : 0;
          const key2 = String(li2.name||'').split(':').pop().trim().toLowerCase();
          const mapped2 = MAP[key2];
          // only the media/budget line earns a margin — the buying fee is
          // already the dollar fee itself, passed through at 100%, not a
          // rate applied on top of something else
          const isProgBudget = mapped2 && mapped2[0]==='programmatic' && mapped2[1]==='budget';
          const isProgFee = mapped2 && mapped2[0]==='programmatic' && mapped2[1]==='fee';
          const rateTag = isProgBudget && progRate!=null
            ? ` <span class="pill" title="expected margin: the configured default${(progRate-PROG_MARGIN)>0.05?' plus this deal’s own buying fee':''}">${progRate.toFixed(1)}% margin</span>`
            : isProgFee ? ` <span class="pill" title="the buying fee is passed through in full — it isn't marked up on top of itself">100% billed</span>` : '';
          h+=`<tr class="drow dim li"><td class="cl" style="padding-left:38px;font-size:9.5px;color:var(--slate)">↳ ${esc(li2.name||'?')}${rateTag}</td>`+
            `<td></td><td></td>`+
            cols.map(c=>`<td class="n" style="font-size:9.5px;color:var(--slate)">${r.months.includes(c)&&iper?money(Math.round(iper)):'<span class=z>·</span>'}</td>`).join('')+
            `<td class="n" style="font-size:9.5px;color:var(--slate)">${amt?money(amt):''}</td><td></td></tr>`;
        });
      });
    });
    h+=`<tr class="grand"><td class="cl">Pipeline total — ${weighted?'weighted':'unweighted'}</td><td></td><td></td>`+
      cols.map(c=>`<td class="n">${money(Math.round(colTot[c]||0))}</td>`).join('')+
      `<td class="n tot">${money(Math.round(grand))}</td><td></td></tr></tbody></table>`;
    el.querySelector('#tbl').innerHTML = shown.length ? h :
      '<div class="empty">No forecastable deals in this pipeline above the threshold. Switch to “All deals” to see what is blocking them.</div>';

    el.querySelectorAll('tr.crow').forEach(tr => {
      const activate = () => {
        const cn = tr.dataset.client;
        openClients.has(cn) ? openClients.delete(cn) : openClients.add(cn);
        render();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.target!==tr) return; if (e.key==='Enter'||e.key===' ') { e.preventDefault(); activate(); } };
    });
    el.querySelectorAll('tr.drow.hasitems').forEach(tr => {
      const activate = () => {
        const id = tr.dataset.deal;
        openDeals.has(id) ? openDeals.delete(id) : openDeals.add(id);
        render();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.target!==tr) return; if (e.key==='Enter'||e.key===' ') { e.preventDefault(); activate(); } };
    });
  }

  /* --------------------------------------------------------------- wiring */
  el.querySelector('#pl').onchange = e => { pipeline = e.target.value; render(); };
  el.querySelector('#r-from').onchange = e => { rangeFrom = e.target.value; render(); };
  el.querySelector('#r-to').onchange = e => { rangeTo = e.target.value; render(); };
  el.querySelector('#chart-toggle').onclick = () => {
    chartOn = !chartOn; try { localStorage.setItem('sf-chart', chartOn?'1':'0'); } catch(e) {}
    render();
  };
  el.querySelectorAll('[data-span]').forEach(b => b.onclick = () => {
    rangeTo = shift(rangeFrom, +b.dataset.span - 1); render();
  });
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    weighted = b.dataset.w==='1';
    el.querySelectorAll('[data-w]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));}); render();
  });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    showAll = b.dataset.f==='1';
    el.querySelectorAll('[data-f]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));}); render();
  });
  render();
});
</script></body></html>
