<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>EMG — Sales Forecast</title><link rel="stylesheet" href="./assets/style.css?v=f2a2801">
<style>
/* Layout and chart styling carried over from sales-forecast-draft.html — the design
   the page is modelled on — trimmed to what the shell doesn't already provide. */
/* matches .summary-strip's own margin-bottom (style.css) so the KPI-ribbon-to-bar
   gap and the bar-to-chart gap read as one consistent rhythm, not two different ones.
   padding matches .sc-panel's own 18px horizontal inset so the bar's leftmost
   control lines up with the chart panel's and table panel's inner content below it. */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding:0 18px}
.toggroup{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:6px}
.tog>span{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate)}
.bardiv{width:1px;align-self:stretch;background:var(--line)}
.cfg{font-family:var(--font-mono);font-size:10px;color:var(--slate)}
/* height:34px matches the bar's other controls (#pl select, the range month
   inputs) — .seg used to fall back to its own ~26px padding-derived height,
   the same mismatch app.css's shared .range/.toolbar button rule already
   fixed for bare buttons elsewhere; this is that same fix, local to .seg */
.seg{font-family:var(--font-mono);font-size:10px;padding:0 11px;height:34px;display:inline-flex;
  align-items:center;border:1px solid var(--line);
  background:var(--paper-raised);border-radius:5px;cursor:pointer;color:var(--slate)}
.seg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* the settings link now lives in the chart's grey footer, sized to sit flush
   with its lg-item neighbors (the swatches, the pipeline-health toggle)
   rather than the boxed toolbar-button treatment it started with */
/* padding expands the real clickable box to the WCAG 24x24px minimum; the
   matching negative margin cancels it back out visually */
.chart-legend a.iconbtn{display:flex;align-items:center;color:inherit;padding:6px;margin:-6px}
.chart-legend a.iconbtn:hover{color:var(--brand)}
.chart-legend a.iconbtn:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px;border-radius:4px}
.chart-legend a.iconbtn svg{width:12px;height:12px}
.rl{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate)}
.rd{font-family:var(--font-mono);font-size:10px;color:var(--slate)}
.rp{display:inline-flex;margin-left:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper-raised)}
.rp .seg{border:none;border-radius:0;border-left:1px solid var(--line)}
.rp .seg:first-child{border-left:none}
.chead{padding:12px 22px 0}
.chead h3{margin:0 0 5px;font-size:14px;color:var(--brand)}
.csum{font-family:var(--font-mono);font-size:10px;color:var(--slate);margin:0 0 4px}
.csvg{padding:4px 12px 0}
.csvg.scroll{overflow-x:auto;padding-bottom:6px}
svg.sfchart{width:100%;height:auto;display:block}
svg.sfchart .ax{font-family:var(--font-mono);font-size:10px;fill:var(--slate)}
svg.sfchart .bt{font-family:var(--font-mono);font-size:10.5px;font-weight:500;fill:var(--brand)}
svg.sfchart .pl{font-family:var(--font-mono);font-size:9px;fill:var(--slate)}
svg.sfchart .colgroup{outline:none}
svg.sfchart .colgroup:focus-visible{outline:2px solid var(--brand-2);outline-offset:-2px}
table.fc{width:100%;border-collapse:collapse;background:var(--paper-raised)}
table.fc th{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--slate);text-align:left;padding:9px 8px;border:none;border-bottom:1px solid var(--line);background:transparent}
table.fc td{padding:7px 8px;border:none;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:11.5px;vertical-align:top}
table.fc th.n,table.fc td.n{text-align:right;white-space:nowrap}
table.fc th.cl,table.fc td.cl{min-width:230px} table.fc td.cl{font-family:var(--font-body)}
table.fc th.pr,table.fc td.pr{min-width:120px} table.fc th.fl,table.fc td.fl{min-width:150px}
.crow{cursor:pointer}
.crow td{background:#fafaf8;font-weight:700;font-family:var(--font-display);font-size:12.5px;border-top:1px solid var(--line)}
.crow td.n{font-family:var(--font-mono);font-size:11.5px}
.crow:focus-visible,.drow.hasitems:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--brand-2),inset 0 0 0 4px var(--mint)}
.drow td.cl{padding-left:22px}
.drow.dim td{opacity:.55}
.drow.hasitems{cursor:pointer}
.disc{display:inline-block;width:12px;color:var(--slate)}
.parts{font-size:9px;color:var(--slate);margin-top:2px;font-family:var(--font-mono)}
td.pr{font-size:10px;color:var(--slate)}
td.pr .p{display:inline-block;margin-left:5px;background:var(--brand);color:#fff;border-radius:5px;padding:0 4px;font-size:9px}
td.tot{font-weight:700;color:var(--brand)}
.z{color:var(--line)}
.grand td{background:var(--brand);color:#fff;font-weight:700;border-top:2px solid var(--brand)}
.flag{display:inline-block;font-size:9px;border-radius:5px;padding:1px 5px;margin:1px 3px 1px 0;font-family:var(--font-mono)}
.flag.t{background:var(--rust-bg);color:var(--rust)} .flag.w{background:var(--amber-bg);color:var(--amber)} .flag.i{background:#f2f2f2;color:var(--slate)}
.empty{padding:30px;text-align:center;color:var(--slate);font-family:var(--font-mono);font-size:11px}
</style></head><body>
<script type="module">
import { boot, esc, fetchAll } from './assets/shell.js?v=f2a2801';
/*
  The Sales Forecast, modelled on sales-forecast-draft.html and wired to the mirror.
  Gross profit is derived from HubSpot line items through the same type map the
  ledger uses; deals that cannot be forecast say why instead of disappearing. The
  bars stack pipeline by stage confidence ON TOP of committed GP from shaped deals —
  the draft faked that base layer; here it is v_deal_month_forecast for real.
*/
boot('sales', async (supa, el) => {
  // pipeline_deals is a full, unfiltered mirror of every HubSpot deal ever
  // synced (see sync-hubspot.mjs) and v_deal_month_forecast can run to many
  // rows too — both can outgrow Supabase's 1000-row cap, so both page.
  const [pd, st, fc, promoted, clientsR, aliasesR, projectsR, blockedR, approvalsR, dismissedR] = await Promise.all([
    fetchAll(() => supa.from('pipeline_deals').select('*')),
    supa.from('settings').select('key,value')
      .in('key', ['sales_probability_threshold','programmatic_margin_default','hubspot_promote_pipelines']),
    fetchAll(() => supa.from('v_deal_month_forecast').select('month,gp')),
    fetchAll(() => supa.from('deals').select('hubspot_deal_id,reviewed_at,qbo_project_id')
      .eq('origin','hubspot').in('status',['won','active'])),
    supa.from('clients').select('id,name,qbo_customer_id').eq('active', true),
    supa.from('client_aliases').select('client_id,alias'),
    fetchAll(() => supa.from('qbo_projects').select('id,name,parent_id,hidden,effective_jobcode')),
    supa.from('blocked_company_names').select('name_key'),
    supa.from('promotion_approvals').select('*'),
    supa.from('won_deal_dismissals').select('hubspot_deal_id')
  ]);
  for (const r of [pd, st, fc, promoted, clientsR, aliasesR, projectsR, blockedR, approvalsR, dismissedR]) if (r.error) throw r.error;
  const dismissedIds = new Set((dismissedR.data||[]).map(r=>r.hubspot_deal_id));
  const setting = k => (st.data||[]).find(s=>s.key===k)?.value;
  const minProb = +(setting('sales_probability_threshold') ?? 10);
  const PROG_MARGIN = +(setting('programmatic_margin_default') ?? 35);

  // ---- the promotion gate: every won HubSpot deal is a human decision now,
  // not an automatic nightly insert (see scripts/sync-hubspot.mjs's rewrite).
  // This section resolves what the gate needs: client identity (same
  // nameKey/alias matching the sync used to do itself), the pipeline
  // allowlist (the one pre-filter that survives — Recruiting etc. never
  // shows up as a candidate at all), and a live-computed suggested QBO
  // project match (same jobcode logic match_deals_to_projects() encodes,
  // just run here instead of in a nightly batch).
  const nameKey = s => String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
  const clientByKey = {};
  (clientsR.data||[]).forEach(c => clientByKey[nameKey(c.name)] = c.id);
  (aliasesR.data||[]).forEach(a => clientByKey[nameKey(a.alias)] = a.client_id);
  const clientsById = {}; (clientsR.data||[]).forEach(c => clientsById[c.id] = c);
  const allowedPipelines = new Set((setting('hubspot_promote_pipelines')||[]).map(nameKey));
  const blockedNames = new Set((blockedR.data||[]).map(r=>r.name_key));
  const approvalByHsId = {}; (approvalsR.data||[]).forEach(a => approvalByHsId[a.hubspot_deal_id] = a);
  const allProjects = (projectsR.data||[]).filter(p => !p.hidden);
  const projectClaimedBy = {}; // qbo_project_id -> hubspot_deal_id, from already-promoted deals
  (promoted.data||[]).forEach(d => { if (d.qbo_project_id) projectClaimedBy[d.qbo_project_id] = d.hubspot_deal_id; });

  // committed GP by month, real
  const LEDGER = {};
  (fc.data||[]).forEach(r => LEDGER[r.month.slice(0,7)] = (LEDGER[r.month.slice(0,7)]||0) + r.gp);

  /* ------------------------------------------------------------- plumbing */
  const money = c => (c<0?'-':'') + '$' + Math.round(Math.abs(c)/100).toLocaleString();
  const mk = d => (d||'').slice(0,7);
  const shift = (k,n)=>{const[y,m]=k.split('-').map(Number);
    return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);};
  const label = k=>{const[y,m]=k.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})+" '"+String(y).slice(2);};
  const monthsRange=(a,b)=>{const out=[];let c=a,g=0;while(c<=b&&g<48){out.push(c);c=shift(c,1);g++;}return out;};
  const monthsBetween=(a,b)=>{const out=[];let c=mk(a);const e=mk(b);let g=0;
    while(c<=e&&g<60){out.push(c);c=shift(c,1);g++;}return out;};
  const TODAY = new Date().toISOString().slice(0,10);

  // stage confidence tiers: deep teal certain -> pale gold early — every
  // step is a confirmed brand token (two teal steps, then two gold steps),
  // not an invented in-between color
  const TIER_COLORS = ['#19a789','#3bc9ac','#e2f5ef','#fabf4d','#fdf3dc'];
  const tierOf = p => p>=0.85?0 : p>=0.65?1 : p>=0.45?2 : p>=0.25?3 : 4;
  const LEDGER_COLOR = 'var(--brand)';

  // the ledger's line-item type map, verbatim from the draft
  const MAP={ 'programmatic media':['programmatic','budget'], 'programmatic buying fee':['programmatic','fee'],
   'paid search media':['search','budget'], 'paid search fee':['search','fee'],
   'paid social media':['social','budget'], 'paid social fee':['social','fee'],
   'paid search hourly':['hourly','flat'], 'paid social hourly':['hourly','flat'],
   'creative retainer':['retainer','flat'], 'creative services':['retainer','flat'],
   'planning':['retainer','flat'], 'dashboard':['retainer','flat'] };

  function dealGP(items){
    const g={}, flags=[];
    (items||[]).forEach(li=>{
      const amt = Math.round(parseFloat(li.amount||0)*100);
      const key = String(li.name||'').split(':').pop().trim().toLowerCase();
      const m = MAP[key];
      if(!m){ flags.push('unmapped: '+(li.name||'?')); return; }
      const [type,role]=m;
      (g[type]=g[type]||{budget:0,fee:0,flat:0})[role]+= amt;
    });
    let gp=0; const parts=[];
    Object.entries(g).forEach(([type,v])=>{
      if(type==='search'||type==='social'){
        if(v.budget>0){ const pct=v.fee/v.budget*100; gp+=v.budget*pct/100;
          parts.push(`${type} ${pct.toFixed(1)}% of ${money(v.budget)}`);
          if(v.fee<=0) flags.push(type+' media with no fee line'); }
        else if(v.fee>0){ gp+=v.fee; parts.push(`${type} fee ${money(v.fee)} (no media)`); }
        gp+=v.flat;
      } else if(type==='programmatic'){
        if(v.budget>0){ const pct=v.fee>0? v.fee/v.budget*100 : 0; const rate=pct+PROG_MARGIN;
          gp+=v.budget*rate/100; parts.push(`programmatic ${rate.toFixed(1)}% of ${money(v.budget)}${v.fee>0?'':' (margin only)'}`); }
        else if(v.fee>0){ gp+=v.fee; parts.push(`programmatic fee ${money(v.fee)} (no media)`);
          flags.push('programmatic fee with no media line'); }
        gp+=v.flat;
      } else { gp+=v.flat+v.fee+v.budget; parts.push(`${type} ${money(v.flat+v.fee+v.budget)}`); }
    });
    return {gp:Math.round(gp),parts,flags};
  }

  // the effective margin a deal's programmatic items are expected to earn —
  // same formula dealGP() uses internally (fee%, if any, plus the configured
  // default margin), exposed separately so it can be tagged onto the raw
  // line item itself, not just folded into the deal's summary line
  function programmaticRate(items){
    let budget=0, fee=0;
    (items||[]).forEach(li=>{
      const key = String(li.name||'').split(':').pop().trim().toLowerCase();
      const m = MAP[key];
      if(!m || m[0]!=='programmatic') return;
      const amt = Math.round(parseFloat(li.amount||0)*100);
      if(m[1]==='budget') budget+=amt; else if(m[1]==='fee') fee+=amt;
    });
    if(budget<=0) return null;
    return (fee>0? fee/budget*100 : 0) + PROG_MARGIN;
  }

  /* ------------------------------------------------------------- the rows */
  const CUTOFF = '2026-01-01';
  const touches2026 = d => !d.campaign_end || d.campaign_end >= CUTOFF;
  const open = (pd.data||[]).filter(d => !d.is_won && (d.probability??0) > 0 && touches2026(d));
  // won deals pass over automatically: show the door's recent traffic
  const promotedBy = {}; (promoted.data||[]).forEach(x => promotedBy[x.hubspot_deal_id] = x);
  const wonRecent = (pd.data||[]).filter(d => d.is_won && touches2026(d));

  // ---- the promotion gate's candidate pool: won, not yet promoted, pipeline
  // allowed (the one pre-filter that survives — Recruiting etc. never shows
  // up at all), split into ready-to-review vs blocked (missing/invalid
  // campaign dates — a genuine data-completeness problem, not a judgment
  // call, fixed in HubSpot rather than overridden here).
  const notYetPromoted = wonRecent.filter(d => !promotedBy[d.hubspot_deal_id] &&
    allowedPipelines.has(nameKey(d.pipeline)) && !dismissedIds.has(d.hubspot_deal_id));
  const dateBlocker = d => !d.campaign_start ? 'no campaign start date'
    : !d.campaign_end ? 'no campaign end date'
    : d.campaign_end < d.campaign_start ? 'campaign ends before it starts' : null;
  const setupReady = notYetPromoted.filter(d => !dateBlocker(d) && !approvalByHsId[d.hubspot_deal_id]);
  const setupBlocked = notYetPromoted.filter(d => dateBlocker(d) && !approvalByHsId[d.hubspot_deal_id]);
  const setupApproved = notYetPromoted.filter(d => approvalByHsId[d.hubspot_deal_id]);

  const parseQboId = link => { const m = String(link||'').match(/[?&](?:id|nameId)=(\d+)/); return m ? m[1] : null; };
  function suggestClient(d) { return clientByKey[nameKey(d.company)] || null; }
  function suggestProject(d, clientId) {
    const client = clientsById[clientId] || {};
    const qid = parseQboId(d.qbo_link);
    if (qid && allProjects.find(p => p.id === qid)) return qid;
    if (!d.jobcode) return null;
    const matches = allProjects.filter(p => p.effective_jobcode &&
      p.effective_jobcode.toLowerCase() === d.jobcode.toLowerCase());
    const mine = matches.find(p => client.qbo_customer_id &&
      (p.parent_id === client.qbo_customer_id || p.id === client.qbo_customer_id));
    if (mine) return mine.id;
    return matches.find(p => !projectClaimedBy[p.id])?.id || null;
  }
  function clientOptionsHtml(selectedId) {
    const sorted = [...(clientsR.data||[])].sort((a,b)=>a.name.localeCompare(b.name));
    return `<option value="">— pick a client —</option>` +
      sorted.map(c=>`<option value="${esc(c.id)}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`).join('') +
      `<option value="__new__">+ Create new client…</option>`;
  }
  function projectOptionsHtml(clientId, selectedId) {
    const client = clientsById[clientId] || {};
    const mine = allProjects.filter(p => client.qbo_customer_id &&
      (p.parent_id === client.qbo_customer_id || p.id === client.qbo_customer_id));
    const mineIds = new Set(mine.map(p=>p.id));
    const rest = allProjects.filter(p => !mineIds.has(p.id));
    const opt = p => `<option value="${esc(p.id)}" ${p.id===selectedId?'selected':''}>${esc(p.name)}${projectClaimedBy[p.id]?' — already linked':''}</option>`;
    return `<option value="">— pick a QBO project —</option>` +
      (mine.length ? `<optgroup label="${esc(client.name||'this client')}'s projects">${mine.map(opt).join('')}</optgroup>` : '') +
      (rest.length ? `<optgroup label="other projects">${rest.map(opt).join('')}</optgroup>` : '');
  }

  const pipelines = [...new Set(open.map(d=>d.pipeline).filter(Boolean))].sort();
  let pipeline = pipelines.includes('agency') ? 'agency' : (pipelines[0]||'__all__');
  let weighted=true, showAll=false, chartOn=true;
  try { chartOn = localStorage.getItem('sf-chart')!=='0'; } catch(e) {}
  let rangeFrom = TODAY.slice(0,7), rangeTo = shift(rangeFrom,5);
  // collapsed by default — a client shows its deals, a deal shows its line
  // items, only once clicked open
  let openClients = new Set(), openDeals = new Set(), coverageOpen = false;

  function build(){
    return open
      .filter(d => (pipeline==='__all__' || d.pipeline===pipeline)
                && Math.round((d.probability||0)*100) >= minProb)
      .map(d => {
        const {gp,parts,flags} = dealGP(d.line_items);
        const f=[...flags];
        if(!d.line_items || !d.line_items.length) f.push('no line items');
        if(d.close_date && d.close_date < TODAY) f.push('close date passed');
        if(d.campaign_start && d.campaign_start < TODAY) f.push('start date passed');
        if(!d.campaign_start || !d.campaign_end) f.push('no campaign dates');
        if(d.campaign_start && d.campaign_end && d.campaign_end < d.campaign_start)
          f.push('campaign ends before it starts');
        const months = (d.campaign_start && d.campaign_end && d.campaign_end >= d.campaign_start)
          ? monthsBetween(d.campaign_start, d.campaign_end)
          : (d.close_date ? [mk(d.close_date)] : []);
        const client = d.company || String(d.name||'').split(' - ')[0].trim();
        const rest = d.company ? d.name : (String(d.name||'').split(' - ').slice(1).join(' - ') || d.name);
        return { id:d.hubspot_deal_id, client, rest, name:d.name, amount:d.amount||0, stage:d.stage,
                 prob:d.probability||0, tier:tierOf(d.probability||0), close:d.close_date,
                 items:d.line_items||[],
                 gp, parts, flags:f, months, forecastable: gp>0 && months.length>0 };
      });
  }

  /* --------------------------------------------------------------- render */
  el.innerHTML = `
    <div class="bar">
      <div class="toggroup">
        <div class="tog"><label for="pl">Pipeline</label>
          <select id="pl">${pipelines.map(p=>`<option ${p===pipeline?'selected':''}>${esc(p)}</option>`).join('')}<option value="__all__">all</option></select></div>
        <div class="tog"><span id="lbl-value">Value</span>
          <span role="group" aria-labelledby="lbl-value" style="display:flex;gap:6px">
            <button class="seg on" data-w="1" aria-pressed="true">Weighted</button><button class="seg" data-w="0" aria-pressed="false">Total</button></span></div>
        <div class="tog"><span id="lbl-show">Show</span>
          <span role="group" aria-labelledby="lbl-show" style="display:flex;gap:6px">
            <button class="seg on" data-f="0" aria-pressed="true">Forecastable</button><button class="seg" data-f="1" aria-pressed="false">All deals</button></span></div>
        <span class="bardiv"></span>
        <div class="tog">
          <span class="rl" id="lbl-range">Range</span>
          <input type="month" id="r-from" aria-label="Range from">
          <span class="rd">to</span>
          <input type="month" id="r-to" aria-label="Range to">
          <span class="rp" role="group" aria-labelledby="lbl-range">
            <button class="seg" data-span="3" aria-pressed="false">3mo</button>
            <button class="seg on" data-span="6" aria-pressed="true">6mo</button>
            <button class="seg" data-span="12" aria-pressed="false">12mo</button>
            <button class="seg" data-span="18" aria-pressed="false">18mo</button></span></div>
      </div>
      <div style="flex:1"></div>
      <button class="seg" id="chart-toggle" aria-expanded="true" aria-controls="chartwrap">Hide chart</button>
    </div>
    <div class="summary-strip" id="kpis"></div>
    <div class="sc-panel" id="setup"></div>
    <div class="sc-panel chartpanel">
      <div id="chartwrap"></div>
    </div>
    <div class="sc-panel" style="padding:4px;overflow-x:auto"><div id="tbl"></div></div>`;

  function renderChart(cols, shown, health){
    const wrap = el.querySelector('#chartwrap');
    const btn = el.querySelector('#chart-toggle');
    btn.textContent = chartOn ? 'Hide chart' : 'Show chart';
    btn.setAttribute('aria-expanded', String(chartOn));
    el.querySelector('.chartpanel').style.display = chartOn ? '' : 'none';
    const n=cols.length;
    // ledger/pipeline totals are computed unconditionally — the KPI ribbon
    // needs them even when the chart itself is collapsed
    const data=cols.map(c=>{
      const byTier=[0,0,0,0,0];
      shown.forEach(r=>{
        if(!r.months.includes(c)||!r.gp) return;
        byTier[r.tier]+= r.gp*(weighted?r.prob:1)/r.months.length;
      });
      return { c, ledger:LEDGER[c]||0, byTier, pipe:byTier.reduce((a,b)=>a+b,0) };
    });
    const totals=data.reduce((a,d)=>({l:a.l+d.ledger,p:a.p+d.pipe}),{l:0,p:0});
    if(!chartOn){ wrap.innerHTML=''; return totals; }
    // shrunk from the original 300/26/54: the KPI ribbon now carries the
    // headline committed/pipeline numbers, so the chart's job is the trend
    // shape, not the primary read — it doesn't need the vertical room it had
    const W=Math.max(960,Math.round(60*n)+90), H=210,PL=70,PR=18,PT=20,PB=40,IW=W-PL-PR,IH=H-PT-PB;
    const dense=n>10, verydense=n>16;
    const max=Math.max(1,...data.map(d=>d.ledger+d.pipe));
    const stepC=max>120000000?40000000:max>60000000?20000000:max>20000000?10000000:max>6000000?2000000:1000000;
    const top=Math.ceil(max/stepC)*stepC;
    const y=v=>PT+IH-(v/top)*IH;
    const bw=Math.min(96,IW/n*0.6), gap=IW/n;
    // anchored off the plot's own bottom edge (not H) so the month label
    // always gets a real gap below the last gridline instead of nearly
    // touching it — the axis labels had no breathing room from the chart
    const plotBottom=PT+IH;
    const tiersPresent=[...new Set(shown.filter(r=>r.gp&&r.months.length).map(r=>r.tier))].sort();
    const tierLabel=t=>[...new Set(shown.filter(r=>r.tier===t).map(r=>r.stage))].join(' / ');
    // one plain-text line per column, shared by the keyboard focus label and
    // the mouse/touch tooltip below — so both paths describe the same thing
    const colParts = d => {
      const parts=[];
      if(d.ledger>0) parts.push(`Committed GP ${money(d.ledger)}`);
      d.byTier.forEach((v,tIdx)=>{ if(v>0) parts.push(`${tierLabel(tIdx)} ${money(Math.round(v))}`); });
      return parts;
    };
    let g='';
    for(let v=0;v<=top;v+=stepC)
      g+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="var(--line)"/>`+
         `<text x="${PL-12}" y="${y(v)+3.5}" text-anchor="end" class="ax">$${Math.round(v/100000)/10}k</text>`;
    data.forEach((d,i)=>{
      const cx=PL+gap*i+gap/2, x=cx-bw/2; let acc=0;
      let colG='';
      if(d.ledger>0){ const h=(d.ledger/top)*IH; acc+=d.ledger;
        colG+=`<rect x="${x}" y="${y(acc)}" width="${bw}" height="${h}" fill="${LEDGER_COLOR}"><title>${label(d.c)} committed ${money(d.ledger)}</title></rect>`; }
      d.byTier.forEach((v,tIdx)=>{
        if(v<=0) return;
        const h=(v/top)*IH; const yTop=y(acc+v); acc+=v;
        colG+=`<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${TIER_COLORS[tIdx]}"><title>${label(d.c)} ${money(v)}</title></rect>`;
      });
      if(acc>0&&!dense) colG+=`<text x="${cx}" y="${y(acc)-6}" text-anchor="middle" class="bt">${money(acc)}</text>`;
      if(!verydense||i%2===0) colG+=`<text x="${cx}" y="${plotBottom+14}" text-anchor="middle" class="ax">${label(d.c)}</text>`;
      if(d.pipe>0&&!dense) colG+=`<text x="${cx}" y="${plotBottom+28}" text-anchor="middle" class="pl">+${money(d.pipe)} pipeline</text>`;
      // the whole column is one keyboard focus stop — Tab reaches every
      // month in order, and focus shows the same aggregate tooltip a mouse
      // hover does, so the per-stage breakdown isn't mouse/touch-only
      const parts = colParts(d);
      const colSummary = `${label(d.c)}: ${parts.length?parts.join(', '):'nothing forecastable'}`;
      g+=`<g tabindex="0" role="img" aria-label="${esc(colSummary)}" class="colgroup" data-idx="${i}">${colG}</g>`;
    });
    const chartSummary=`Committed GP plus pipeline by month, ${weighted?'weighted by stage':'total value'}, `+
      `${n} months from ${label(cols[0])} to ${label(cols[n-1])}: committed ${money(totals.l)}, `+
      `pipeline ${money(Math.round(totals.p))}, total ${money(Math.round(totals.l+totals.p))}.`;
    // wide/dense views (many months) keep their real bar width and scroll
    // horizontally instead of squeezing every bar and label down to fit
    const svgStyle = dense ? ` style="width:${W}px;max-width:none"` : '';
    // the pipeline-health toggle and its detail live in the chart's own grey
    // footer now — another legend row entry, not a floating callout — so its
    // dot color, not a separate pill background, carries the at-a-glance signal
    const { covCls, pct, totalRows, coverageOpen, nF, noLI, stale, wonRecent, wonPromoted, wonReview, wonWaiting } = health;
    const healthColor = covCls==='good' ? 'var(--brand-2)' : covCls==='warn' ? 'var(--amber)' : 'var(--rust)';
    const showHealth = totalRows>0 || wonRecent.length>0;
    const detailHtml = coverageOpen ? `<div class="chart-detail" id="health-detail">` +
      (totalRows ? `<div>${nF} of ${totalRows} deals forecastable (${pct}%) — ${noLI} without line items,
        ${stale} past their close date. GP needs line items and campaign dates in HubSpot;
        fixing them there brings deals in on the next sync.</div>` : '') +
      (wonRecent.length ? `<div>Closed won: ${wonPromoted.length} passed to the
        <a href="./forecast.html">Forecast</a> automatically${wonReview.length?` — ${wonReview.length} still awaiting review there`:''}${wonWaiting?`; ${wonWaiting} will pass on the next sync`:''}.
        Mappable line items are flighted out on arrival; the rest get a skeleton and a reason.</div>` : '') +
      `</div>` : '';
    wrap.style.position='relative';
    wrap.innerHTML =
      `<div class="chead"><h3>Committed revenue plus pipeline — ${weighted?'weighted by stage':'total value at 100%'}</h3>
       <div class="csum">${n} months · committed ${money(totals.l)} · pipeline ${money(Math.round(totals.p))} · total ${money(Math.round(totals.l+totals.p))}</div></div>
       <div class="csvg${dense?' scroll':''}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="sfchart" role="img" aria-label="${esc(chartSummary)}"${svgStyle}><title>${esc(chartSummary)}</title>${g}</svg></div>
       <div class="chart-tip"></div>
       <div class="chart-legend">
         <span class="lg-item"><i class="lg-dot" style="background:${LEDGER_COLOR}"></i>Committed GP (shaped deals)</span>` +
       tiersPresent.map(t=>`<span class="lg-item"><i class="lg-dot" style="background:${TIER_COLORS[t]}"></i>${esc(tierLabel(t))}</span>`).join('') +
       `<span style="flex:1"></span>` +
       (showHealth ? `<button class="lg-item toggle" id="covtoggle" aria-expanded="${coverageOpen}" aria-controls="health-detail">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:13px;height:13px;flex:none;color:${healthColor}">
             <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
           </svg>
           pipeline health${totalRows?` — ${pct}% forecastable`:''}${coverageOpen?' ▾':' ▸'}</button>` : '') +
       `<span class="cfg">min probability ${minProb}% · programmatic margin ${PROG_MARGIN}%</span>
         <a class="iconbtn" href="./settings.html" title="Settings" aria-label="Settings">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
             <circle cx="12" cy="12" r="3"/>
             <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
           </svg>
         </a>` +
       `</div>${detailHtml}`;

    // real hover tooltip, same pattern as the other charts: the per-rect
    // <title> stays as a no-JS/a11y floor, but this is instant and aggregates
    // every stage present in the hovered month, not just one segment. Shared
    // by mouse/touch (showAt, from cursor position) AND keyboard (each
    // column's own tabindex="0" focus, below) so the breakdown isn't
    // mouse/touch-only.
    const svgEl = wrap.querySelector('svg.sfchart');
    const tip = wrap.querySelector('.chart-tip');
    const tipHtmlFor = idx => {
      const d = data[idx];
      const rows = [];
      if (d.ledger > 0) rows.push(`<div class="tip-row"><span class="tip-dot" style="background:${LEDGER_COLOR}"></span>Committed GP <b>${money(d.ledger)}</b></div>`);
      d.byTier.forEach((v, tIdx) => { if (v > 0) rows.push(
        `<div class="tip-row"><span class="tip-dot" style="background:${TIER_COLORS[tIdx]}"></span>${esc(tierLabel(tIdx))} <b>${money(Math.round(v))}</b></div>`); });
      return `<div class="tip-label">${label(d.c)}</div>` + (rows.length ? rows.join('') : '<div class="tip-row">nothing forecastable</div>');
    };
    const positionNear = (clientX, clientY) => {
      const wrapBox = wrap.getBoundingClientRect();
      tip.style.top = (clientY - wrapBox.top - 10) + 'px';
      const left = Math.min(wrapBox.width - tip.offsetWidth, Math.max(0, clientX - wrapBox.left + 12));
      tip.style.left = left + 'px';
    };
    const showAt = (clientX, clientY) => {
      const svgBox = svgEl.getBoundingClientRect();
      const scale = W / svgBox.width;
      const vx = (clientX - svgBox.left) * scale;
      let idx = Math.floor((vx - PL) / gap);
      idx = Math.max(0, Math.min(n - 1, idx));
      tip.innerHTML = tipHtmlFor(idx);
      tip.style.opacity = '1';
      positionNear(clientX, clientY);
    };
    const hideTip = () => { tip.style.opacity = '0'; };
    svgEl.onmousemove = e => showAt(e.clientX, e.clientY);
    svgEl.onmouseleave = hideTip;
    svgEl.ontouchstart = svgEl.ontouchmove = e => { if (e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
    svgEl.ontouchend = hideTip;
    wrap.querySelectorAll('.colgroup').forEach(colEl => {
      const idx = +colEl.dataset.idx;
      colEl.onfocus = () => {
        tip.innerHTML = tipHtmlFor(idx);
        tip.style.opacity = '1';
        const r = colEl.getBoundingClientRect();
        positionNear(r.left + r.width / 2, r.top);
      };
      colEl.onblur = hideTip;
    });
    return totals;
  }

  // ---- the promotion gate itself. Rendered once, separately from render() —
  // render() reruns on every pipeline/weighted/range toggle, and rebuilding
  // this panel on every one of those would wipe out a half-made client/project
  // choice before a human got to click Approve.
  function renderSetup(){
    const box = el.querySelector('#setup');
    if (!setupReady.length && !setupBlocked.length && !setupApproved.length) {
      box.innerHTML = `<div class="muted" style="padding:8px 0">Nothing needs setup — every won deal is either promoted or already approved.</div>`;
      return;
    }
    box.innerHTML = `<div class="muted" style="margin-bottom:8px">Needs setup — every closed-won deal passes through here once, confirming the client and QBO project before it enters the live forecast</div>
      ${setupReady.length ? setupReady.map(d => {
        const cid = suggestClient(d);
        const pid = cid ? suggestProject(d, cid) : null;
        const blockedBadge = blockedNames.has(nameKey(d.company)) ?
          `<span class="flag t" title="this company name is on the blocked list (Clients tab) — advisory only, decide anyway">blocked-list name</span>` : '';
        return `<div class="setup-row" data-hs="${esc(d.hubspot_deal_id)}" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="min-width:220px"><b>${esc(d.name)}</b> ${blockedBadge}<div class="muted" style="font-size:10px">${esc(d.company||'(no company)')} · ${d.campaign_start||'?'} → ${d.campaign_end||'?'}${d.jobcode?` · ${esc(d.jobcode)}`:''}</div></div>
          <select class="setup-client" style="min-width:180px">${clientOptionsHtml(cid)}</select>
          <input class="setup-newclient" placeholder="new client name…" style="display:none;min-width:180px">
          <select class="setup-project" style="min-width:220px">${projectOptionsHtml(cid, pid)}</select>
          <button class="primary setup-approve" disabled>Approve</button>
          <button class="danger setup-dismiss" data-dismiss="${esc(d.hubspot_deal_id)}" title="Old/abandoned deal — remove it from this list for good">Dismiss</button>
          <a href="${esc(d.url)}" target="_blank" rel="noopener">HubSpot ↗</a>
        </div>`;
      }).join('') : ''}
      ${setupBlocked.length ? `<div class="sc-eyebrow" style="margin-top:10px">Missing campaign dates — fix in HubSpot (${setupBlocked.length})</div>` +
        setupBlocked.map(d => `<div style="display:flex;gap:10px;align-items:center;padding:6px 0;opacity:.65">
          <div style="min-width:220px">${esc(d.name)}<div class="muted" style="font-size:10px">${esc(d.company||'')}</div></div>
          <span class="flag t">${esc(dateBlocker(d))}</span>
          <a href="${esc(d.url)}" target="_blank" rel="noopener">HubSpot ↗</a>
          <button class="danger setup-dismiss" data-dismiss="${esc(d.hubspot_deal_id)}" title="Old/abandoned deal — remove it from this list for good">Dismiss</button>
        </div>`).join('') : ''}
      ${setupApproved.length ? `<div class="sc-eyebrow" style="margin-top:10px">Approved — promotes on the next sync (${setupApproved.length})</div>` +
        setupApproved.map(d => { const a = approvalByHsId[d.hubspot_deal_id];
          const proj = allProjects.find(p=>p.id===a.qbo_project_id);
          return `<div style="display:flex;gap:10px;align-items:center;padding:6px 0" class="muted">
            <div style="min-width:220px;color:var(--ink)">${esc(d.name)}</div>
            <div>${esc((clientsById[a.client_id]||{}).name||'?')} → ${esc(proj?proj.name:a.qbo_project_id)}</div>
          </div>`; }).join('') : ''}`;

    box.querySelectorAll('.setup-row').forEach(row => {
      const hsId = row.dataset.hs;
      const clientSel = row.querySelector('.setup-client');
      const newClientInput = row.querySelector('.setup-newclient');
      const projectSel = row.querySelector('.setup-project');
      const approveBtn = row.querySelector('.setup-approve');
      const refreshApprove = () => { approveBtn.disabled = !projectSel.value || !clientSel.value; };
      refreshApprove();
      clientSel.onchange = () => {
        newClientInput.style.display = clientSel.value === '__new__' ? '' : 'none';
        projectSel.innerHTML = clientSel.value && clientSel.value !== '__new__'
          ? projectOptionsHtml(clientSel.value, null) : projectOptionsHtml(null, null);
        refreshApprove();
      };
      projectSel.onchange = refreshApprove;
      approveBtn.onclick = async () => {
        let clientId = clientSel.value;
        if (!clientId) { alert('Pick a client first.'); return; }
        approveBtn.disabled = true; approveBtn.textContent = '…';
        if (clientId === '__new__') {
          const name = newClientInput.value.trim();
          if (!name) { alert('Enter a name for the new client.'); approveBtn.disabled = false; approveBtn.textContent = 'Approve'; return; }
          const { data, error } = await supa.from('clients').insert({ name, set_by: window.__email }).select('id').single();
          if (error) { alert(error.message); approveBtn.disabled = false; approveBtn.textContent = 'Approve'; return; }
          clientId = data.id;
        }
        const { error } = await supa.from('promotion_approvals').upsert({
          hubspot_deal_id: hsId, client_id: clientId, qbo_project_id: projectSel.value,
          approved_by: window.__email, approved_at: new Date().toISOString()
        }, { onConflict: 'hubspot_deal_id' });
        if (error) { alert(error.message); approveBtn.disabled = false; approveBtn.textContent = 'Approve'; return; }
        location.reload();
      };
    });

    box.querySelectorAll('.setup-dismiss').forEach(btn => btn.onclick = async () => {
      if (!confirm('Dismiss this deal from the setup list for good?\n\nIt never enters the forecast — this just stops it from showing up here. Reversible only by deleting its row from won_deal_dismissals.')) return;
      btn.disabled = true; btn.textContent = '…';
      const { error } = await supa.from('won_deal_dismissals').upsert({
        hubspot_deal_id: btn.dataset.dismiss, dismissed_by: window.__email, dismissed_at: new Date().toISOString()
      }, { onConflict: 'hubspot_deal_id' });
      if (error) { alert(error.message); btn.disabled = false; btn.textContent = 'Dismiss'; return; }
      location.reload();
    });
  }

  function render(){
    const rows = build();
    const shown = rows.filter(r=>showAll||r.forecastable);
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    const cols = monthsRange(rangeFrom, rangeTo);
    el.querySelector('#r-from').value = rangeFrom;
    el.querySelector('#r-to').value = rangeTo;
    el.querySelectorAll('[data-span]').forEach(b=>{
      const on = +b.dataset.span===cols.length;
      b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
    });

    const nF=rows.filter(r=>r.forecastable).length;
    const noLI=rows.filter(r=>r.flags.includes('no line items')).length;
    const stale=rows.filter(r=>r.flags.includes('close date passed')).length;
    const pct=rows.length?Math.round(nF/rows.length*100):0;
    const wonPromoted = wonRecent.filter(d=>promotedBy[d.hubspot_deal_id]);
    const wonReview = wonPromoted.filter(d=>!promotedBy[d.hubspot_deal_id].reviewed_at);
    const wonWaiting = wonRecent.length - wonPromoted.length;
    const covCls = rows.length ? (pct>=70?'good':pct>=40?'warn':'bad') : 'good';

    const chartTotals = renderChart(cols, shown,
      { covCls, pct, totalRows: rows.length, coverageOpen, nF, noLI, stale, wonRecent, wonPromoted, wonReview, wonWaiting });
    const covBtn = el.querySelector('#covtoggle');
    if (covBtn) covBtn.onclick = () => { coverageOpen = !coverageOpen; render(); };
    // headline numbers, sourced from the exact same totals the chart draws
    // from — so the ribbon and the chart's own summary line can never disagree
    el.querySelector('#kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">Committed GP</div>
        <div class="summary-value pos">${money(chartTotals.l)}</div>
        <div class="summary-note">shaped deals, this range</div></div>
      <div class="summary-cell"><div class="summary-label">${weighted?'Weighted':'Total'} pipeline</div>
        <div class="summary-value">${money(Math.round(chartTotals.p))}</div>
        <div class="summary-note">${label(cols[0])}–${label(cols[cols.length-1])}</div></div>
      <div class="summary-cell"><div class="summary-label">Forecastable</div>
        <div class="summary-value">${pct}%</div>
        <div class="summary-note">${nF} of ${rows.length} deals</div></div>
      <div class="summary-cell"><div class="summary-label">Closed won</div>
        <div class="summary-value">${wonPromoted.length}</div>
        <div class="summary-note">${wonReview.length ? wonReview.length+' awaiting review' : wonWaiting ? wonWaiting+' pending next sync' : 'all reviewed'}</div></div>`;

    const by={}; shown.forEach(r=>(by[r.client]=by[r.client]||[]).push(r));
    const clients=Object.keys(by).sort((a,b)=>{
      const t=x=>by[x].reduce((s,r)=>s+r.gp*(weighted?r.prob:1),0);
      return t(b)-t(a);
    });
    let h='<table class="fc"><thead><tr><th class="cl">Client / deal</th><th class="pr">Stage</th><th class="n">Close</th>'+
      cols.map(c=>`<th class="n">${label(c)}</th>`).join('')+'<th class="n tot">Total</th><th class="fl">Flags</th></tr></thead><tbody>';
    const colTot={}; let grand=0;
    clients.forEach(cn=>{
      const ds=by[cn];
      const cTot={}; let cSum=0;
      ds.forEach(r=>{ const per=r.months.length? r.gp*(weighted?r.prob:1)/r.months.length : 0;
        r.months.forEach(m=>{ if(cols.includes(m)) cTot[m]=(cTot[m]||0)+per; });
        cSum+=r.gp*(weighted?r.prob:1); });
      // totals above are for EVERY deal regardless of collapse state — only
      // the row markup below is conditional, so collapsing a client can
      // never change the grand total at the bottom of the table
      const clientOpen = openClients.has(cn);
      h+=`<tr class="crow" data-client="${esc(cn)}" tabindex="0" role="button" aria-expanded="${clientOpen}">`+
        `<td class="cl"><span class="disc">${clientOpen?'▾':'▸'}</span>${esc(cn)}</td><td></td><td></td>`+
        cols.map(c=>`<td class="n">${cTot[c]?money(Math.round(cTot[c])):'<span class=z>·</span>'}</td>`).join('')+
        `<td class="n tot">${money(Math.round(cSum))}</td><td></td></tr>`;
      ds.sort((a,b)=>b.gp*(weighted?b.prob:1)-a.gp*(weighted?a.prob:1)).forEach(r=>{
        const per=r.months.length? r.gp*(weighted?r.prob:1)/r.months.length : 0;
        const tot=r.gp*(weighted?r.prob:1);
        cols.forEach(c=>{ if(r.months.includes(c)) colTot[c]=(colTot[c]||0)+per; });
        grand+=tot;
        if (!clientOpen) return;
        const hasItems = r.items.length > 0;
        const dealOpen = hasItems && openDeals.has(r.id);
        h+=`<tr class="drow${r.forecastable?'':' dim'}${hasItems?' hasitems':''}" data-deal="${hasItems?esc(r.id||''):''}" `+
          `${hasItems?`tabindex="0" role="button" aria-expanded="${dealOpen}"`:''}>`+
          `<td class="cl"><span class="disc">${hasItems?(dealOpen?'▾':'▸'):''}</span><span class="ellip" title="${esc(r.rest)}">${esc(r.rest)}</span>`+
          (r.parts.length?`<div class="parts">${esc(r.parts.join(' · '))}</div>`:'')+`</td>`+
          `<td class="pr">${esc(r.stage)}<span class="p">${Math.round(r.prob*100)}%</span></td>`+
          `<td class="n">${r.close?label(mk(r.close)):'<span class=z>·</span>'}</td>`+
          cols.map(c=>`<td class="n">${r.months.includes(c)&&per?money(Math.round(per)):'<span class=z>·</span>'}</td>`).join('')+
          `<td class="n tot">${tot?money(Math.round(tot)):'—'}</td>`+
          `<td class="fl">${r.flags.map(f=>`<span class="flag ${/passed|before/.test(f)?'t':/no line|unmapped/.test(f)?'w':'i'}">${esc(f)}</span>`).join('')}</td></tr>`;
        const progRate = dealOpen ? programmaticRate(r.items) : null;
        if (dealOpen) r.items.forEach(li2=>{
          // flighted: the raw HubSpot line-item amount spread evenly across
          // the DEAL's own campaign months — the same spread the deal-level
          // row above uses for its GP, just applied to this item's own amount
          const amt = Math.round(parseFloat(li2.amount||0)*100);
          const iper = r.months.length ? amt/r.months.length : 0;
          const key2 = String(li2.name||'').split(':').pop().trim().toLowerCase();
          const mapped2 = MAP[key2];
          // only the media/budget line earns a margin — the buying fee is
          // already the dollar fee itself, passed through at 100%, not a
          // rate applied on top of something else
          const isProgBudget = mapped2 && mapped2[0]==='programmatic' && mapped2[1]==='budget';
          const isProgFee = mapped2 && mapped2[0]==='programmatic' && mapped2[1]==='fee';
          const rateTag = isProgBudget && progRate!=null
            ? ` <span class="pill" title="expected margin: the configured default${(progRate-PROG_MARGIN)>0.05?' plus this deal’s own buying fee':''}">${progRate.toFixed(1)}% margin</span>`
            : isProgFee ? ` <span class="pill" title="the buying fee is passed through in full — it isn't marked up on top of itself">100% billed</span>` : '';
          h+=`<tr class="drow dim li"><td class="cl" style="padding-left:38px;font-size:9.5px;color:var(--slate)">↳ ${esc(li2.name||'?')}${rateTag}</td>`+
            `<td></td><td></td>`+
            cols.map(c=>`<td class="n" style="font-size:9.5px;color:var(--slate)">${r.months.includes(c)&&iper?money(Math.round(iper)):'<span class=z>·</span>'}</td>`).join('')+
            `<td class="n" style="font-size:9.5px;color:var(--slate)">${amt?money(amt):''}</td><td></td></tr>`;
        });
      });
    });
    h+=`<tr class="grand"><td class="cl">Pipeline total — ${weighted?'weighted':'unweighted'}</td><td></td><td></td>`+
      cols.map(c=>`<td class="n">${money(Math.round(colTot[c]||0))}</td>`).join('')+
      `<td class="n tot">${money(Math.round(grand))}</td><td></td></tr></tbody></table>`;
    el.querySelector('#tbl').innerHTML = shown.length ? h :
      '<div class="empty">No forecastable deals in this pipeline above the threshold. Switch to “All deals” to see what is blocking them.</div>';

    el.querySelectorAll('tr.crow').forEach(tr => {
      const activate = () => {
        const cn = tr.dataset.client;
        openClients.has(cn) ? openClients.delete(cn) : openClients.add(cn);
        render();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.target!==tr) return; if (e.key==='Enter'||e.key===' ') { e.preventDefault(); activate(); } };
    });
    el.querySelectorAll('tr.drow.hasitems').forEach(tr => {
      const activate = () => {
        const id = tr.dataset.deal;
        openDeals.has(id) ? openDeals.delete(id) : openDeals.add(id);
        render();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.target!==tr) return; if (e.key==='Enter'||e.key===' ') { e.preventDefault(); activate(); } };
    });
  }

  /* --------------------------------------------------------------- wiring */
  el.querySelector('#pl').onchange = e => { pipeline = e.target.value; render(); };
  el.querySelector('#r-from').onchange = e => { rangeFrom = e.target.value; render(); };
  el.querySelector('#r-to').onchange = e => { rangeTo = e.target.value; render(); };
  el.querySelector('#chart-toggle').onclick = () => {
    chartOn = !chartOn; try { localStorage.setItem('sf-chart', chartOn?'1':'0'); } catch(e) {}
    render();
  };
  el.querySelectorAll('[data-span]').forEach(b => b.onclick = () => {
    rangeTo = shift(rangeFrom, +b.dataset.span - 1); render();
  });
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    weighted = b.dataset.w==='1';
    el.querySelectorAll('[data-w]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));}); render();
  });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    showAll = b.dataset.f==='1';
    el.querySelectorAll('[data-f]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));}); render();
  });
  renderSetup();
  render();
});
</script></body></html>
