<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Client Profitability</title><link rel="stylesheet" href="./assets/style.css?v=c84b45c"></head><body>
<script type="module">
import { boot, esc } from './assets/shell.js?v=c84b45c';

// Client-level evaluation — is this account healthy? For per-project detail
// (scoping, tracking how much work is going into a specific deal), see
// Project Hours instead; the two answer different questions and are kept as
// separate pages rather than one view drilling into the other.
//
// Every dollar column here blends two sources exactly the way Forecast
// itself does, per deal: for months already closed, the ACTUAL figure
// (forecast_page()'s own rev_proj/cogs_proj — invoices netted against
// contra, same numbers Forecast and Cashflow read); for months still ahead,
// the PLANNED/shaped figure (v_deal_month_forecast, via forecast_page()'s
// plan_deal — gp_all/gp_settled/bill_future). forecastGP = gp_all -
// gp_settled (the settled portion is already counted in the actual side);
// forecastCogs is derived the same way forecast.html derives a forecast
// month's COGS: billable minus GP. The Settings toggle drops the planned
// half entirely for a strict actuals-only read. Labor cost is hours-based
// (db/031_hours_page.sql) and is always actual — assignments has no entry
// mechanism yet (db/034/035), so there is no "planned labor cost" to add.
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();
const fmtDate = s => s ? new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';

// Stacks segments left-to-right, capped so the running total never exceeds
// 100% of the track — a real over-plan condition is reported as text (the
// exact overage), not an impossible >100%-wide bar. Same helper as Team
// Hours, applied here to hours logged vs. planned instead of vs. capacity.
function stackSegments(cap, parts) {
  if (cap <= 0) return { html: '', overBy: 0 };
  let used = 0, html = '';
  parts.forEach(([cls, hours]) => {
    const w = Math.min(Math.max(hours / cap * 100, 0), Math.max(100 - used, 0));
    if (w > 0.05) { used += w; html += `<div class="seg ${cls}" style="width:${w}%"></div>`; }
  });
  const total = parts.reduce((s, [, h]) => s + h, 0);
  return { html, overBy: total > cap ? total - cap : 0 };
}

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };

boot('clientprofit', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  let rangeFrom = shiftM(thisMonth, -2), rangeTo = thisMonth;
  let query = '';
  let historicalOnly = false;
  let allClientRows = []; // cached between load() (network) and render() (local re-filter/toggle)

  el.innerHTML = `<div class="range">
      <span class="rl">Range</span>
      <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0, 7)}">
      <span class="muted">→</span>
      <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0, 7)}">
      <label class="mono" style="display:flex;align-items:center;gap:6px;margin-left:auto">
        <input type="checkbox" id="cp-historical" style="height:auto"> historical only — exclude forecasted</label>
    </div>
    <div id="panel">loading…</div>`;

  document.getElementById('cp-historical').onchange = e => { historicalOnly = e.target.checked; render(); };

  async function load() {
    const [hp, fp, dl, cl] = await Promise.all([
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      supa.from('deals').select('id,name,client_id,qbo_project_id,flight_start,flight_end'),
      supa.from('clients').select('id,name')
    ]);
    for (const r of [hp, fp, dl, cl]) if (r.error) {
      el.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    const H = hp.data || {}, P = fp.data || {};
    const dealsById = {}; (dl.data || []).forEach(d => dealsById[d.id] = d);
    const clientsById = {}; (cl.data || []).forEach(c => clientsById[c.id] = c);
    const revProjByProj = {}; (P.rev_proj || []).forEach(r => revProjByProj[r.qbo_project_id] = +r.total);
    const cogsProjByProj = {}; (P.cogs_proj || []).forEach(r => cogsProjByProj[r.qbo_project_id] = +r.total);
    const planByDeal = {}; (P.plan_deal || []).forEach(r => planByDeal[r.deal_id] =
      { gpAll: +r.gp_all, gpSettled: +r.gp_settled, billFuture: +r.bill_future });
    const laborByDeal = {}; (H.deal_labor || []).forEach(r => laborByDeal[r.deal_id] = r);
    const plannedByDeal = {}; (H.deal_planned || []).forEach(r => plannedByDeal[r.deal_id] = +r.planned_hours);

    // one row per deal that has EITHER actual labor hours, a claimed QBO
    // project, or a plan entry — so a deal that's all-forecast (no hours
    // logged yet, nothing invoiced yet) still counts toward its client
    const dealRows = Object.keys(laborByDeal)
      .concat(Object.values(dealsById).filter(d => d.qbo_project_id).map(d => d.id))
      .concat(Object.keys(planByDeal))
      .filter((id, i, a) => a.indexOf(id) === i)
      .map(id => {
        const deal = dealsById[id]; if (!deal) return null;
        const labor = laborByDeal[id] || { hours: 0, cost: 0 };
        const plan = planByDeal[id] || { gpAll: 0, gpSettled: 0, billFuture: 0 };
        const actualRevenue = deal.qbo_project_id ? (revProjByProj[deal.qbo_project_id] || 0) : 0;
        const actualCogs = deal.qbo_project_id ? (cogsProjByProj[deal.qbo_project_id] || 0) : 0;
        // forecast* covers only the months in range still ahead of today —
        // gp_settled is the slice of gp_all that's already past, so the
        // remainder is what's still planned rather than measured
        const forecastGP = plan.gpAll - plan.gpSettled;
        const forecastRevenue = plan.billFuture;
        const forecastCogs = Math.max(0, forecastRevenue - forecastGP);
        return {
          dealId: id, clientId: deal.client_id, flightStart: deal.flight_start, flightEnd: deal.flight_end,
          actualHours: +labor.hours, laborCost: +labor.cost, plannedHours: plannedByDeal[id] || 0,
          actualRevenue, actualCogs, actualGP: actualRevenue - actualCogs,
          forecastRevenue, forecastCogs, forecastGP
        };
      }).filter(Boolean);

    const byClient = {};
    dealRows.forEach(r => (byClient[r.clientId] = byClient[r.clientId] || []).push(r));
    const sum = (deals, k) => deals.reduce((s, d) => s + d[k], 0);
    // hours_page/forecast_page are both queried scoped to [rangeFrom, rangeTo],
    // so any nonzero on booked revenue, logged hours, forecasted revenue, or
    // assigned hours already means it happened in a month within range. A
    // client with nothing on any of those four fronts has nothing to show
    // for this range and is dropped rather than rendered as a row of zeros.
    allClientRows = Object.entries(byClient).map(([cid, deals]) => {
      const starts = deals.map(d => d.flightStart).filter(Boolean).sort();
      const ends = deals.map(d => d.flightEnd).filter(Boolean).sort();
      return {
        clientId: cid, name: (clientsById[cid] || {}).name || '(unknown client)',
        flightStart: starts[0] || null, flightEnd: ends[ends.length - 1] || null,
        actualHours: sum(deals, 'actualHours'), plannedHours: sum(deals, 'plannedHours'), laborCost: sum(deals, 'laborCost'),
        actualRevenue: sum(deals, 'actualRevenue'), actualCogs: sum(deals, 'actualCogs'), actualGP: sum(deals, 'actualGP'),
        forecastRevenue: sum(deals, 'forecastRevenue'), forecastCogs: sum(deals, 'forecastCogs'), forecastGP: sum(deals, 'forecastGP')
      };
    }).filter(c => c.actualRevenue !== 0 || c.actualHours !== 0 || c.forecastRevenue !== 0 || c.plannedHours !== 0);

    render();
  }

  // blended figures for one client row, honoring the Historical-only toggle
  function blend(c) {
    const revenue = c.actualRevenue + (historicalOnly ? 0 : c.forecastRevenue);
    const cogs = c.actualCogs + (historicalOnly ? 0 : c.forecastCogs);
    const gp = c.actualGP + (historicalOnly ? 0 : c.forecastGP);
    const profitAfterLabor = gp - c.laborCost;
    const profitPerHour = c.actualHours > 0 ? profitAfterLabor / c.actualHours : null;
    // revenue per hour actually worked — a distinct question from profitPerHour
    // (which nets out labor cost): "what does an hour on this account bill
    // for," not "what does it net"
    const effectiveRate = c.actualHours > 0 ? revenue / c.actualHours : null;
    return { revenue, cogs, gp, profitAfterLabor, profitPerHour, effectiveRate };
  }

  // column definitions for the table: key drives both the sort comparator
  // (sortValue below) and the data-sort attribute; label is the header text.
  // The hours-vs-planned bar has no single scalar to sort by (it's already
  // just plannedHrs vs actualHrs, both sortable on their own), so it's the
  // one column with no key.
  const COLUMNS = [
    ['name', 'client'], ['start', 'start → end'], [null, 'hours vs planned'],
    ['plannedHours', 'planned hrs'], ['actualHours', 'actual hrs'],
    ['revenue', 'revenue'], ['cogs', 'cogs'], ['gp', 'gross profit'],
    ['laborCost', 'labor cost'], ['effectiveRate', 'effective rate'],
    ['profitAfterLabor', 'profit after labor'], ['profitPerHour', 'profit / hr'],
  ];
  let tableSort = { key: 'revenue', dir: -1 };
  function sortValue(c, key) {
    switch (key) {
      case 'name': return c.name.toLowerCase();
      case 'start': return c.flightStart || '';
      case 'plannedHours': return c.plannedHours;
      case 'actualHours': return c.actualHours;
      case 'laborCost': return c.laborCost;
      // ?? -Infinity so a client with no hours yet (null rate) sorts to the
      // bottom on a descending sort instead of floating to the top as "0"
      case 'revenue': case 'cogs': case 'gp': case 'profitAfterLabor':
        return c.b[key];
      case 'effectiveRate': case 'profitPerHour':
        return c.b[key] ?? -Infinity;
      default: return 0;
    }
  }

  function render() {
    const q = query.trim().toLowerCase();
    const clientRows = (!q ? allClientRows : allClientRows.filter(c => c.name.toLowerCase().includes(q)))
      .map(c => ({ ...c, b: blend(c) }))
      .sort((a, b) => {
        const x = sortValue(a, tableSort.key), y = sortValue(b, tableSort.key);
        return (x < y ? -1 : x > y ? 1 : 0) * tableSort.dir;
      });
    const allBlended = allClientRows.map(blend);

    const totalHours = allClientRows.reduce((s, c) => s + c.actualHours, 0);
    const totalPlanned = allClientRows.reduce((s, c) => s + c.plannedHours, 0);
    const totalLabor = allClientRows.reduce((s, c) => s + c.laborCost, 0);
    const totalRevenue = allBlended.reduce((s, b) => s + b.revenue, 0);
    const totalGP = allBlended.reduce((s, b) => s + b.gp, 0);
    const totalProfit = totalGP - totalLabor;
    const atRisk = allBlended.filter(b => b.profitAfterLabor < 0).length;

    document.getElementById('panel').innerHTML = `
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Revenue</div>
          <div class="summary-value">${fmt$0(totalRevenue)}</div>
          <div class="summary-note">${historicalOnly ? 'actuals only' : 'invoiced + planned'}</div></div>
        <div class="summary-cell"><div class="summary-label">Gross profit</div>
          <div class="summary-value ${totalGP < 0 ? 'neg' : 'pos'}">${fmt$0(totalGP)}</div></div>
        <div class="summary-cell"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalLabor)}</div></div>
        <div class="summary-cell"><div class="summary-label">Profit after labor</div>
          <div class="summary-value ${totalProfit < 0 ? 'neg' : 'pos'}">${fmt$0(totalProfit)}</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="delta-note flat">vs ${fmtHours(totalPlanned)}h planned — not assigned yet</div></div>
        <div class="summary-cell"><div class="summary-label">Clients at risk</div>
          <div class="summary-value ${atRisk > 0 ? 'neg' : 'pos'}">${atRisk} / ${allClientRows.length}</div>
          <div class="summary-note">losing money after labor</div></div>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px">
          <input id="q" placeholder="search client…" value="${esc(query)}" style="width:220px">
        </div>
        <div class="gridwrap" style="margin-top:0">
        <table class="ledger"><tr>
            ${COLUMNS.map(([key, label]) => {
              if (!key) return `<th class="textleft">${label}</th>`;
              const active = tableSort.key === key;
              const cls = key === 'name' || key === 'start' ? ' textleft' : '';
              return `<th class="${cls}" data-sort="${key}" tabindex="0" role="columnheader" aria-sort="${active ? (tableSort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${active ? `<span class="dir">${tableSort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
            }).join('')}
          </tr>
          ${!clientRows.length ? `<tr><td colspan="12" class="empty-note">No clients match the current search.</td></tr>` : clientRows.map(c => {
              const hasPlan = c.plannedHours > 0;
              const bar = hasPlan
                ? stackSegments(c.plannedHours, [[c.actualHours > c.plannedHours ? 'seg-over' : 'seg-good', c.actualHours]])
                : null;
              const b = c.b;
              return `<tr class="${b.profitAfterLabor < 0 ? 'risk-row' : ''}">
                  <td class="textleft">${esc(c.name)}</td>
                  <td class="textleft">${fmtDate(c.flightStart)} → ${fmtDate(c.flightEnd)}</td>
                  <td class="textleft">
                    ${hasPlan ? `<div class="mini-track wide">${bar.html}</div>
                      <div class="delta-note flat">${fmtHours(c.actualHours)}h / ${fmtHours(c.plannedHours)}h planned</div>
                      ${bar.overBy > 0.05 ? `<div class="delta-note neg">+${fmtHours(bar.overBy)}h over plan</div>` : ''}`
                      : `<div class="mini-track wide"></div><div class="delta-note flat">not assigned yet</div>`}
                  </td>
                  <td>${fmtHours(c.plannedHours)}</td>
                  <td>${fmtHours(c.actualHours)}</td>
                  <td>${fmt$0(b.revenue)}</td>
                  <td>${fmt$0(b.cogs)}</td>
                  <td class="${b.gp < 0 ? 'err' : 'ok'}">${fmt$0(b.gp)}</td>
                  <td>${fmt$0(c.laborCost)}</td>
                  <td class="${b.effectiveRate === null ? 'muted' : ''}">${b.effectiveRate === null ? '—' : fmt$0(b.effectiveRate) + '/h'}</td>
                  <td class="${b.profitAfterLabor < 0 ? 'err' : 'ok'}">${fmt$0(b.profitAfterLabor)}</td>
                  <td class="${b.profitPerHour === null ? 'muted' : b.profitPerHour < 0 ? 'err' : 'ok'}">${b.profitPerHour === null ? '—' : fmt$0(b.profitPerHour) + '/h'}</td>
                </tr>`;
            }).join('')}
        </table>
        </div>
      </div>`;

    document.getElementById('q').oninput = e => { query = e.target.value; render(); };
    document.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const key = th.dataset.sort;
        tableSort = { key, dir: tableSort.key === key ? -tableSort.dir : (key === 'name' ? 1 : -1) };
        render();
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
  }

  document.getElementById('r-from').onchange = e => { rangeFrom = monthOf(e.target.value); load(); };
  document.getElementById('r-to').onchange = e => { rangeTo = monthOf(e.target.value); load(); };

  await load();
});
</script></body></html>
