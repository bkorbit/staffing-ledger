<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Client Profitability</title><link rel="stylesheet" href="./assets/style.css?v=3890137"></head><body>
<script type="module">
import { boot, esc, wireSearch, fetchAll } from './assets/shell.js?v=3890137';
import { hoursByWeekChart, revGpChart, hoursStat, revStat, departmentOrder } from './assets/detail-charts.js?v=3890137';

// Client-level evaluation — is this account healthy? For per-project detail
// (scoping, tracking how much work is going into a specific deal), see
// Project Hours instead; the two answer different questions and are kept as
// separate pages rather than one view drilling into the other.
//
// A client row opens into the deals behind it, rendered as rows of THIS
// table rather than a nested one, so every figure sits under the header it
// belongs to and the client row above reads as the sum of the rows beneath
// it. The deal rows carry the two things a client row can't: which QBO
// project each deal claims (or a flag that it claims none), and how much of
// the revenue is measured vs. still forecast.
//
// Every dollar column here blends two sources exactly the way Forecast
// itself does, per deal: for months already closed, the ACTUAL figure
// (forecast_page()'s own rev_proj/cogs_proj — invoices netted against
// contra, same numbers Forecast and Cashflow read); for months still ahead,
// the PLANNED/shaped figure (v_deal_month_forecast, via forecast_page()'s
// plan_deal — gp_all/gp_settled/bill_future). forecastGP = gp_all -
// gp_settled (the settled portion is already counted in the actual side);
// forecastCogs is derived the same way forecast.html derives a forecast
// month's COGS: billable minus GP. The Settings toggle drops the planned
// half entirely for a strict actuals-only read. Labor cost is hours-based
// (db/031_hours_page.sql) and is always actual — assignments has no entry
// mechanism yet (db/034/035), so there is no "planned labor cost" to add.
//
// An open client closes with the two reports Project Hours shows per project
// — hours per week stacked by PROJECT here (a client's question is which
// project is eating the hours; Project Hours stacks its one project by
// department), revenue and gross profit actual vs plan per month — summed
// across the client's deals by client_detail() (db/089, weeks_by_deal 090) and
// drawn by assets/detail-charts.js, the one copy both pages use. Fetched
// lazily per opened client and cached for the visit. The unclaimed remainder
// is NOT in the charts, for the same reason it is not in the client total.
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();
const fmtDate = s => s ? new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';

// Stacks segments left-to-right, capped so the running total never exceeds
// 100% of the track — a real over-plan condition is reported as text (the
// exact overage), not an impossible >100%-wide bar. Same helper as Team
// Hours, applied here to hours logged vs. planned instead of vs. capacity.
function stackSegments(cap, parts) {
  if (cap <= 0) return { html: '', overBy: 0 };
  let used = 0, html = '';
  parts.forEach(([cls, hours]) => {
    const w = Math.min(Math.max(hours / cap * 100, 0), Math.max(100 - used, 0));
    if (w > 0.05) { used += w; html += `<div class="seg ${cls}" style="width:${w}%"></div>`; }
  });
  const total = parts.reduce((s, [, h]) => s + h, 0);
  return { html, overBy: total > cap ? total - cap : 0 };
}

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };

boot('clientprofit', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  let rangeFrom = shiftM(thisMonth, -2), rangeTo = thisMonth;
  let query = '';
  let historicalOnly = false;
  let allClientRows = []; // cached between load() (network) and render() (local re-filter/toggle)
  const openClients = new Set();  // client ids whose deal rows are showing
  // client_detail() results, per client, for the visit; an in-flight fetch is
  // stored as its promise so a second click can't start a second round trip
  const detailCache = new Map();
  let deptOrder = [];             // company-wide department list, the chart colour key
  // the hours chart's grouping — by project (default: which project is eating
  // the hours) or by department — remembered per browser
  let hoursBy = localStorage.getItem('cp_hours_by') === 'department' ? 'department' : 'deal';

  el.innerHTML = `<div class="range">
      <span class="rl">Range</span>
      <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0, 7)}">
      <span class="muted">→</span>
      <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0, 7)}">
      <label class="mono" style="display:flex;align-items:center;gap:6px;margin-left:auto">
        <input type="checkbox" id="cp-historical" style="height:auto"> measured only</label>
    </div>
    <div id="panel">loading…</div>`;

  document.getElementById('cp-historical').onchange = e => { historicalOnly = e.target.checked; render(); };

  async function load() {
    const [hp, fp, dl, cl] = await Promise.all([
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      fetchAll(() => supa.from('deals').select('id,name,client_id,qbo_project_id,flight_start,flight_end')),
      supa.from('clients').select('id,name,qbo_customer_id')
    ]);
    for (const r of [hp, fp, dl, cl]) if (r.error) {
      el.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    const H = hp.data || {}, P = fp.data || {};
    deptOrder = departmentOrder(H.staff || []);
    const dealsById = {}; (dl.data || []).forEach(d => dealsById[d.id] = d);
    const clientsById = {}; (cl.data || []).forEach(c => clientsById[c.id] = c);
    const revProjByProj = {}; (P.rev_proj || []).forEach(r => revProjByProj[r.qbo_project_id] = +r.total);
    const cogsProjByProj = {}; (P.cogs_proj || []).forEach(r => cogsProjByProj[r.qbo_project_id] = +r.total);
    const planByDeal = {}; (P.plan_deal || []).forEach(r => planByDeal[r.deal_id] =
      { gpAll: +r.gp_all, gpSettled: +r.gp_settled, billFuture: +r.bill_future });
    const laborByDeal = {}; (H.deal_labor || []).forEach(r => laborByDeal[r.deal_id] = r);
    const plannedByDeal = {}; (H.deal_planned || []).forEach(r => plannedByDeal[r.deal_id] = +r.planned_hours);

    // The QBO project tree, for naming the project a deal claims and for
    // finding a client's UNCLAIMED parent remainder — the same three
    // structures forecast.html's clientRow/projRows build. projects rides
    // along in forecast_page's payload, so this costs no extra round trip.
    const projectsById = {}; (P.projects || []).forEach(p => projectsById[p.id] = p);
    const projsUnder = {}; (P.projects || []).forEach(p => {
      const parent = p.parent_id || p.id;
      (projsUnder[parent] = projsUnder[parent] || []).push(p.id);
    });
    // Claims come from the FULL deal list (this page's `deals` select is
    // already unfiltered — no status/hidden/flight gate), for the reason
    // forecast.html spells out: a hidden or pre-2026-flight deal still
    // really owns its project, and computing claims from a scoped subset
    // made a correctly-matched deal look unclaimed.
    const projClaimedBy = {};
    (dl.data || []).forEach(d => { if (d.qbo_project_id) projClaimedBy[d.qbo_project_id] = d.client_id; });

    // A deal belongs on this page only if its flight overlaps the selected
    // range — the same activeInRange rule forecast.html's client table uses.
    // Without it the qbo_project_id branch below reaches EVERY deal that ever
    // claimed a project, from any year, and they arrive as rows of zeros
    // (their revenue and plan are both range-scoped already). A null bound is
    // open-ended, not a miss: an undated deal can't be judged by date, so it
    // stays and is decided on whether it has any figures at all.
    const rangeEndExcl = shiftM(rangeTo, 1);
    const activeInRange = d =>
      (!d.flight_start || d.flight_start < rangeEndExcl) &&
      (!d.flight_end || d.flight_end >= rangeFrom);

    // one row per deal that has EITHER actual labor hours, a claimed QBO
    // project, or a plan entry — so a deal that's all-forecast (no hours
    // logged yet, nothing invoiced yet) still counts toward its client
    const dealRows = Object.keys(laborByDeal)
      .concat(Object.values(dealsById).filter(d => d.qbo_project_id).map(d => d.id))
      .concat(Object.keys(planByDeal))
      .filter((id, i, a) => a.indexOf(id) === i)
      .map(id => {
        const deal = dealsById[id]; if (!deal) return null;
        if (!activeInRange(deal)) return null;
        const labor = laborByDeal[id] || { hours: 0, cost: 0 };
        const plan = planByDeal[id] || { gpAll: 0, gpSettled: 0, billFuture: 0 };
        const actualRevenue = deal.qbo_project_id ? (revProjByProj[deal.qbo_project_id] || 0) : 0;
        const actualCogs = deal.qbo_project_id ? (cogsProjByProj[deal.qbo_project_id] || 0) : 0;
        // forecast* covers only the months in range still ahead of today —
        // gp_settled is the slice of gp_all that's already past, so the
        // remainder is what's still planned rather than measured
        const forecastGP = plan.gpAll - plan.gpSettled;
        const forecastRevenue = plan.billFuture;
        const forecastCogs = Math.max(0, forecastRevenue - forecastGP);
        const proj = deal.qbo_project_id ? projectsById[deal.qbo_project_id] : null;
        return {
          dealId: id, name: deal.name || '(unnamed deal)', clientId: deal.client_id,
          flightStart: deal.flight_start, flightEnd: deal.flight_end,
          qboProjectId: deal.qbo_project_id || null, projName: proj ? proj.name : null,
          actualHours: +labor.hours, laborCost: +labor.cost, plannedHours: plannedByDeal[id] || 0,
          actualRevenue, actualCogs, actualGP: actualRevenue - actualCogs,
          forecastRevenue, forecastCogs, forecastGP
        };
      })
      // a deal inside the range but with nothing on any of the four fronts is
      // a row of zeros — the same emptiness test the client rows below apply
      .filter(r => r && (r.actualRevenue !== 0 || r.actualCogs !== 0 || r.actualHours !== 0 ||
                         r.forecastRevenue !== 0 || r.plannedHours !== 0));

    const byClient = {};
    dealRows.forEach(r => (byClient[r.clientId] = byClient[r.clientId] || []).push(r));
    const sum = (deals, k) => deals.reduce((s, d) => s + d[k], 0);
    // hours_page/forecast_page are both queried scoped to [rangeFrom, rangeTo],
    // so any nonzero on booked revenue, logged hours, forecasted revenue, or
    // assigned hours already means it happened in a month within range. A
    // client with nothing on any of those four fronts has nothing to show
    // for this range and is dropped rather than rendered as a row of zeros.
    allClientRows = Object.entries(byClient).map(([cid, deals]) => {
      const starts = deals.map(d => d.flightStart).filter(Boolean).sort();
      const ends = deals.map(d => d.flightEnd).filter(Boolean).sort();
      const client = clientsById[cid] || {};
      // Money on this client's own QBO parent that no deal claims. Listed in
      // the drill-down, deliberately NOT added into the client's totals:
      // every other figure in this table is per-deal (labor, plan, hours),
      // and a remainder has no deal to belong to. Forecast's client row DOES
      // fold it in (its clientRow unions fromParent with fromDeals) — that
      // discrepancy is real and pre-dates this view; showing the rows here
      // makes it visible instead of silently missing.
      const unclaimed = (client.qbo_customer_id ? (projsUnder[client.qbo_customer_id] || []) : [])
        .filter(pid => !projClaimedBy[pid])
        .map(pid => ({
          projectId: pid, name: (projectsById[pid] || {}).name || pid,
          revenue: revProjByProj[pid] || 0, cogs: cogsProjByProj[pid] || 0
        }))
        .filter(u => u.revenue !== 0 || u.cogs !== 0)
        .sort((a, b) => b.revenue - a.revenue);
      return {
        clientId: cid, name: client.name || '(unknown client)', deals, unclaimed,
        flightStart: starts[0] || null, flightEnd: ends[ends.length - 1] || null,
        actualHours: sum(deals, 'actualHours'), plannedHours: sum(deals, 'plannedHours'), laborCost: sum(deals, 'laborCost'),
        actualRevenue: sum(deals, 'actualRevenue'), actualCogs: sum(deals, 'actualCogs'), actualGP: sum(deals, 'actualGP'),
        forecastRevenue: sum(deals, 'forecastRevenue'), forecastCogs: sum(deals, 'forecastCogs'), forecastGP: sum(deals, 'forecastGP')
      };
    }).filter(c => c.actualRevenue !== 0 || c.actualHours !== 0 || c.forecastRevenue !== 0 || c.plannedHours !== 0);

    render();
  }

  // blended figures for one row — a client and a deal carry the same keys,
  // which is what lets both levels share every renderer below — honoring
  // the Historical-only toggle
  function blend(c) {
    const revenue = c.actualRevenue + (historicalOnly ? 0 : c.forecastRevenue);
    const cogs = c.actualCogs + (historicalOnly ? 0 : c.forecastCogs);
    const gp = c.actualGP + (historicalOnly ? 0 : c.forecastGP);
    const profitAfterLabor = gp - c.laborCost;
    const profitPerHour = c.actualHours > 0 ? profitAfterLabor / c.actualHours : null;
    // revenue per hour actually worked — a distinct question from profitPerHour
    // (which nets out labor cost): "what does an hour on this account bill
    // for," not "what does it net"
    const effectiveRate = c.actualHours > 0 ? revenue / c.actualHours : null;
    return { revenue, cogs, gp, profitAfterLabor, profitPerHour, effectiveRate };
  }

  // The hours bar cell — identical for a client row and a deal row, which is
  // the whole point of putting both in one table.
  function hoursCell(r) {
    const hasPlan = r.plannedHours > 0;
    const bar = hasPlan
      ? stackSegments(r.plannedHours, [[r.actualHours > r.plannedHours ? 'seg-over' : 'seg-good', r.actualHours]])
      : null;
    return `<td class="textleft">
      ${hasPlan ? `<div class="mini-track wide">${bar.html}</div>
        <div class="delta-note flat">${fmtHours(r.actualHours)}h / ${fmtHours(r.plannedHours)}h planned</div>
        ${bar.overBy > 0.05 ? `<div class="delta-note neg">+${fmtHours(bar.overBy)}h over plan</div>` : ''}`
        : `<div class="mini-track wide"></div><div class="delta-note flat">not assigned yet</div>`}
    </td>`;
  }

  // The nine hours/money cells shared by both levels. `split` puts the
  // measured-vs-forecast breakdown on the revenue cell's hover title — deal
  // rows only, and only when the row actually has both halves to split.
  function moneyCells(r, b, split) {
    // the measured · forecast split lives in the revenue cell's hover title,
    // not under the figure — a second line per deal row cluttered the block
    const splitTitle = split && !historicalOnly && r.forecastRevenue !== 0 && r.actualRevenue !== 0
      ? ` title="${esc(fmt$0(r.actualRevenue) + ' measured · ' + fmt$0(r.forecastRevenue) + ' forecast')}"` : '';
    return `
      <td>${fmtHours(r.plannedHours)}</td>
      <td>${fmtHours(r.actualHours)}</td>
      <td${splitTitle}>${fmt$0(b.revenue)}</td>
      <td>${fmt$0(b.cogs)}</td>
      <td class="${b.gp < 0 ? 'err' : 'ok'}">${fmt$0(b.gp)}</td>
      <td>${fmt$0(r.laborCost)}</td>
      <td class="${b.effectiveRate === null ? 'muted' : ''}">${b.effectiveRate === null ? '—' : fmt$0(b.effectiveRate) + '/h'}</td>
      <td class="${b.profitAfterLabor < 0 ? 'err' : 'ok'}">${fmt$0(b.profitAfterLabor)}</td>
      <td class="${b.profitPerHour === null ? 'muted' : b.profitPerHour < 0 ? 'err' : 'ok'}">${b.profitPerHour === null ? '—' : fmt$0(b.profitPerHour) + '/h'}</td>`;
  }

  // One deal, on the parent table's own columns.
  function dealRowHtml(d, isLast) {
    const b = blend(d);
    const cls = ['subrow', b.profitAfterLabor < 0 ? 'risk' : '', isLast ? 'last' : ''].filter(Boolean).join(' ');
    return `<tr class="${cls}">
      <td class="textleft" title="${esc(d.name)}${d.projName ? ' · ' + esc(d.projName) : ''}">
        <div class="sub-name" style="display:flex;align-items:center;gap:8px">${esc(d.name)}${d.qboProjectId ? '' : '<span class="pill warn">no QB project</span>'}</div>
      </td>
      <td class="textleft">${fmtDate(d.flightStart)} → ${fmtDate(d.flightEnd)}</td>
      ${hoursCell(d)}
      ${moneyCells(d, b, true)}
    </tr>`;
  }

  // A QBO project under this client's parent that no deal claims: money with
  // no deal attached, so only the three columns it can honestly fill are
  // filled, and it sits below the deals behind a dashed rule.
  function remainderRowHtml(u, isLast) {
    const gp = u.revenue - u.cogs;
    return `<tr class="subrow remainder${isLast ? ' last' : ''}">
      <td class="textleft">
        <div class="sub-name muted">${esc(u.name)}</div>
        <div class="sub-proj">unclaimed QB project — not in the client total above</div>
      </td>
      <td class="textleft muted">—</td>
      <td class="textleft muted">—</td>
      <td class="muted">—</td><td class="muted">—</td>
      <td>${fmt$0(u.revenue)}</td>
      <td>${fmt$0(u.cogs)}</td>
      <td class="${gp < 0 ? 'err' : 'ok'}">${fmt$0(gp)}</td>
      <td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td>
    </tr>`;
  }

  // What the open block holds, before you read a single figure.
  function contextRowHtml(c) {
    const matched = c.deals.filter(d => d.qboProjectId).length;
    const unmatched = c.deals.length - matched;
    return `<tr class="subnote"><td colspan="12">
      <div class="subnote-line">
        <span>${c.deals.length} project${c.deals.length === 1 ? '' : 's'} in range</span>
        ${matched ? `<span class="pill good">${matched} matched to QB</span>` : ''}
        ${unmatched ? `<span class="pill warn">${unmatched} no QB project</span>` : ''}
        ${c.unclaimed.length ? `<span class="pill">${c.unclaimed.length} unclaimed QB project${c.unclaimed.length === 1 ? '' : 's'}</span>` : ''}
      </div></td></tr>`;
  }

  // The block's last row: the client's two reports, side by side. Reads from
  // detailCache; a miss renders a loading state and starts the fetch, whose
  // resolution re-renders.
  function chartsRowHtml(c) {
    const d = detailCache.get(c.clientId);
    const ready = d && !(d instanceof Promise);
    const body = id => ready
      ? (d.error ? `<div class="empty-note err" style="padding:20px 14px">${esc(d.error)}</div>` : `<div id="${id}"></div>`)
      : `<div class="empty-note" style="padding:28px 14px">loading…</div>`;
    return `<tr class="expand-row"><td colspan="12">
      <div class="client-charts">
        <div class="sc-panel chartpanel">
          <div class="chart-head"><div class="sc-eyebrow">Hours logged — all projects</div>
            <div class="stat-inline">${ready && !d.error ? hoursStat(d, rangeFrom, rangeTo) : ''}</div></div>
          ${body(`hours-${c.clientId}`)}
        </div>
        <div class="sc-panel chartpanel">
          <div class="chart-head"><div class="sc-eyebrow">Revenue &amp; gross profit — actual vs plan, all projects</div>
            <div class="stat-inline">${ready && !d.error ? revStat(d) : ''}</div></div>
          ${body(`rev-${c.clientId}`)}
        </div>
      </div></td></tr>`;
  }
  function ensureDetail(clientId) {
    if (detailCache.has(clientId)) return;
    const p = supa.rpc('client_detail', { p_client_id: clientId }).then(res => {
      detailCache.set(clientId, res.error ? { error: res.error.message } : (res.data || {}));
      if (openClients.has(clientId)) render();
    });
    detailCache.set(clientId, p);
  }

  // column definitions for the table: key drives both the sort comparator
  // (sortValue below) and the data-sort attribute; label is the header text.
  // The hours-vs-planned bar has no single scalar to sort by (it's already
  // just plannedHrs vs actualHrs, both sortable on their own), so it's the
  // one column with no key.
  const COLUMNS = [
    ['name', 'client'], ['start', 'start → end'], [null, 'hours vs planned'],
    ['plannedHours', 'planned hrs'], ['actualHours', 'actual hrs'],
    ['revenue', 'revenue'], ['cogs', 'cogs'], ['gp', 'gross profit'],
    ['laborCost', 'labor cost'], ['effectiveRate', 'effective rate'],
    ['profitAfterLabor', 'profit after labor'], ['profitPerHour', 'profit / hr'],
  ];
  let tableSort = { key: 'revenue', dir: -1 };
  function sortValue(c, key) {
    switch (key) {
      case 'name': return c.name.toLowerCase();
      case 'start': return c.flightStart || '';
      case 'plannedHours': return c.plannedHours;
      case 'actualHours': return c.actualHours;
      case 'laborCost': return c.laborCost;
      // ?? -Infinity so a client with no hours yet (null rate) sorts to the
      // bottom on a descending sort instead of floating to the top as "0"
      case 'revenue': case 'cogs': case 'gp': case 'profitAfterLabor':
        return c.b[key];
      case 'effectiveRate': case 'profitPerHour':
        return c.b[key] ?? -Infinity;
      default: return 0;
    }
  }

  function render() {
    const q = query.trim().toLowerCase();
    // the search reaches deal names too, and a client matched only by one of
    // its deals opens itself — otherwise the hit is invisible behind a
    // collapsed row (the same rule forecast.html's client table uses)
    const nameHit = c => !!q && c.name.toLowerCase().includes(q);
    const dealHit = c => !!q && c.deals.some(d => d.name.toLowerCase().includes(q));
    const clientRows = allClientRows.filter(c => !q || nameHit(c) || dealHit(c))
      .map(c => ({ ...c, b: blend(c) }))
      .sort((a, b) => {
        const x = sortValue(a, tableSort.key), y = sortValue(b, tableSort.key);
        return (x < y ? -1 : x > y ? 1 : 0) * tableSort.dir;
      });
    const allBlended = allClientRows.map(blend);

    const totalHours = allClientRows.reduce((s, c) => s + c.actualHours, 0);
    const totalPlanned = allClientRows.reduce((s, c) => s + c.plannedHours, 0);
    const totalLabor = allClientRows.reduce((s, c) => s + c.laborCost, 0);
    const totalRevenue = allBlended.reduce((s, b) => s + b.revenue, 0);
    const totalGP = allBlended.reduce((s, b) => s + b.gp, 0);
    const totalProfit = totalGP - totalLabor;
    const atRisk = allBlended.filter(b => b.profitAfterLabor < 0).length;

    document.getElementById('panel').innerHTML = `
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Revenue</div>
          <div class="summary-value">${fmt$0(totalRevenue)}</div>
          <div class="summary-note">${historicalOnly ? 'measured only' : 'invoiced + forecasted'}</div></div>
        <div class="summary-cell"><div class="summary-label">Gross profit</div>
          <div class="summary-value ${totalGP < 0 ? 'neg' : 'pos'}">${fmt$0(totalGP)}</div></div>
        <div class="summary-cell"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalLabor)}</div></div>
        <div class="summary-cell"><div class="summary-label">Profit after labor</div>
          <div class="summary-value ${totalProfit < 0 ? 'neg' : 'pos'}">${fmt$0(totalProfit)}</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="delta-note flat">vs ${fmtHours(totalPlanned)}h planned — not assigned yet</div></div>
        <div class="summary-cell"><div class="summary-label">Clients at risk</div>
          <div class="summary-value ${atRisk > 0 ? 'neg' : 'pos'}">${atRisk} / ${allClientRows.length}</div>
          <div class="summary-note">losing money after labor</div></div>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px">
          <input id="q" placeholder="search client or deal…" value="${esc(query)}" style="width:220px">
          <span class="delta-note flat">click a client to see its projects</span>
        </div>
        <div class="gridwrap" style="margin-top:0">
        <table class="ledger"><tr>
            ${COLUMNS.map(([key, label]) => {
              if (!key) return `<th class="textleft">${label}</th>`;
              const active = tableSort.key === key;
              const cls = key === 'name' || key === 'start' ? ' textleft' : '';
              return `<th class="${cls}" data-sort="${key}" tabindex="0" role="columnheader" aria-sort="${active ? (tableSort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${active ? `<span class="dir">${tableSort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
            }).join('')}
          </tr>
          ${!clientRows.length ? `<tr><td colspan="12" class="empty-note">No clients match the current search.</td></tr>` : clientRows.map(c => {
              const b = c.b;
              // a deal-name-only search hit opens its client so the matching
              // row is actually on screen
              const open = openClients.has(c.clientId) || (dealHit(c) && !nameHit(c));
              // whole-row click target — role=button on the <tr> with
              // aria-expanded, DESIGN.md's accepted a11y tradeoff, same as
              // Sales, Forecast and Team Hours
              const head = `<tr class="${b.profitAfterLabor < 0 ? 'risk-row' : ''}" data-cid="${esc(c.clientId)}"
                  role="button" tabindex="0" aria-expanded="${open}" style="cursor:pointer">
                  <td class="textleft">
                    <div>${open ? '▾' : '▸'} ${esc(c.name)}</div>
                    <div class="summary-note">${c.deals.length} project${c.deals.length === 1 ? '' : 's'}</div>
                  </td>
                  <td class="textleft">${fmtDate(c.flightStart)} → ${fmtDate(c.flightEnd)}</td>
                  ${hoursCell(c)}
                  ${moneyCells(c, b, false)}
                </tr>`;
              if (!open) return head;
              const ds = [...c.deals].sort((x, y) => blend(y).revenue - blend(x).revenue);
              const kids = ds.map((d, i) =>
                dealRowHtml(d, i === ds.length - 1 && !c.unclaimed.length)).join('');
              const rest = c.unclaimed.map((u, i) =>
                remainderRowHtml(u, i === c.unclaimed.length - 1)).join('');
              return head + contextRowHtml(c) + kids + rest + chartsRowHtml(c);
            }).join('')}
        </table>
        </div>
      </div>`;

    // charts for every open block whose detail has arrived; misses start their
    // fetch (a search hit can open a client without a click, so this is the
    // one place that guarantees an open block always has its fetch going)
    clientRows.filter(c => openClients.has(c.clientId) || (dealHit(c) && !nameHit(c))).forEach(c => {
      const d = detailCache.get(c.clientId);
      if (!d) { ensureDetail(c.clientId); return; }
      if (d instanceof Promise || d.error) return;
      const h = document.querySelector(`[id="hours-${c.clientId}"]`), v = document.querySelector(`[id="rev-${c.clientId}"]`);
      if (h) hoursByWeekChart(h, d, rangeFrom, rangeTo, deptOrder, { height: 220, by: hoursBy,
        toggle: v => { hoursBy = v; try { localStorage.setItem('cp_hours_by', v); } catch {} render(); } });
      if (v) revGpChart(v, d, { height: 220 });
    });

    wireSearch(el, '#q', v => { query = v; render(); });
    document.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const key = th.dataset.sort;
        tableSort = { key, dir: tableSort.key === key ? -tableSort.dir : (key === 'name' ? 1 : -1) };
        render();
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
    document.querySelectorAll('tr[data-cid]').forEach(tr => {
      const activate = () => {
        const cid = tr.dataset.cid;
        if (openClients.has(cid)) openClients.delete(cid); else { openClients.add(cid); ensureDetail(cid); }
        render();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
  }

  document.getElementById('r-from').onchange = e => { rangeFrom = monthOf(e.target.value); load(); };
  document.getElementById('r-to').onchange = e => { rangeTo = monthOf(e.target.value); load(); };

  await load();
});
</script></body></html>
