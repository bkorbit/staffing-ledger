<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Cashflow</title><link rel="stylesheet" href="./assets/style.css?v=ee8b2b1"></head><body>
<script type="module">
import { boot, fmt$, bandChart, fetchAll } from './assets/shell.js?v=ee8b2b1';

boot('cashflow', async (supa, el) => {
  el.innerHTML = `<div class="range">
      <label class="rl" for="cf-weeks">Horizon</label>
      <select id="cf-weeks">
        <option value="6">3 months</option><option value="12">6 months</option>
        <option value="18">9 months</option><option value="24">12 months</option>
      </select>
      <span class="muted" style="font-size:10.5px;background:var(--paper-raised);border:1px solid var(--line);
      border-radius:4px;padding:5px 9px">half-month periods — H1 is the 1st–15th,
      H2 the 16th to month end. Programmatic pays its media in the spend half; the client
      pays on their curve, usually two to three halves later.</span>
    </div>
    <div class="summary-strip" id="kpis" aria-live="polite"></div>
    <div class="sc-panel chartpanel"><div id="chart"><div style="padding:16px 18px">loading…</div></div></div>
    <div class="sc-panel" style="overflow-x:auto">
      <div class="sc-eyebrow">Cash position by period</div>
      <table id="tbl" class="ledger"></table></div>
    <div class="sc-panel" style="overflow-x:auto">
      <div class="sc-eyebrow">AR aging — who owes EMG, by how late</div>
      <table id="ar-aging" class="ledger"></table></div>
    <div class="sc-panel" style="overflow-x:auto">
      <div class="sc-eyebrow">Expected payment date — open invoices by client, on their collection curve</div>
      <table id="pay-dates" class="ledger"></table></div>
    <div class="sc-panel" style="overflow-x:auto">
      <div class="sc-eyebrow">AP aging — what EMG owes, by how late</div>
      <table id="ap-aging" class="ledger"></table></div>
    <div class="sc-panel muted">Tail caution: beyond the reach of open invoices and shaped deals,
    the model has no revenue and both lines sink. That is missing data, not a prophecy.</div>`;

  const sel = document.getElementById('cf-weeks');

  // ---- everything below is independent of the horizon — loaded once
  const [ar, ap, pj, cl, dl, bk, pb] = await Promise.all([
    fetchAll(() => supa.from('invoices')
      .select('doc_number,qbo_customer_name,qbo_project_id,due_on,issued_on,balance').gt('balance', 0)),
    fetchAll(() => supa.from('bills')
      .select('vendor_name,due_on,issued_on,balance').gt('balance', 0)),
    fetchAll(() => supa.from('qbo_projects').select('id,name,parent_id')),
    supa.from('clients').select('id,name,qbo_customer_id'),
    supa.from('deals').select('client_id,qbo_project_id')
      .in('status',['won','active']).eq('hidden', false).not('qbo_project_id','is',null),
    supa.from('qbo_accounts').select('balance,is_operating,as_of').eq('account_type','Bank'),
    supa.from('payment_behaviour').select('scope,ref,median_lag,p90_lag')
  ]);
  for (const r of [ar, ap, pj, cl, dl, bk, pb]) if (r.error) throw r.error;

  // today's cash: the same "operating banks only, if any are flagged" rule
  // cashflow_forecast() uses server-side for its own opening balance
  const banksOperatingSet = (bk.data||[]).some(b => b.is_operating);
  const cashToday = (bk.data||[])
    .filter(b => !banksOperatingSet || b.is_operating)
    .reduce((s,b) => s + b.balance, 0);
  const cashAsOf = (bk.data||[])[0]?.as_of || '—';

  // roll AR up to the master client: a project claimed by a deal belongs to that
  // deal's client (claims attribution — lets two platform clients split one QBO
  // parent); otherwise invoice -> project -> QuickBooks parent -> the platform
  // client linked to that parent, else the parent's own name
  const parentOf = {}, projName = {};
  (pj.data||[]).forEach(p => { parentOf[p.id] = p.parent_id || p.id; projName[p.id] = p.name; });
  const clientNameById = {}, clientByParent = {};
  (cl.data||[]).forEach(c => {
    clientNameById[c.id] = c.name;
    if (c.qbo_customer_id) clientByParent[c.qbo_customer_id] = c.name;
  });
  const claimedClientOf = {};
  (dl.data||[]).forEach(d => { claimedClientOf[d.qbo_project_id] = clientNameById[d.client_id]; });
  (ar.data||[]).forEach(i => {
    const parent = parentOf[i.qbo_project_id] || i.qbo_project_id;
    i.master = claimedClientOf[i.qbo_project_id] || clientByParent[parent]
      || projName[parent] || i.qbo_customer_name || '(unnamed)';
    i.curveKey = parent;
    i.forWhat = projName[i.qbo_project_id] || i.qbo_customer_name || '—';
  });

  // ---- expected payment date per client: same curve cashflow_forecast() uses
  // server-side (v_open_invoice_expectations — issued_on + median/p90 lag off the
  // client's own curve, shrunk toward the global one, floored to the near future
  // since the money is conditionally still unpaid) — rolled up to the same
  // claims-attributed master client as the aging table above.
  const curveByKey = {}; let globalCurve = null;
  (pb.data||[]).forEach(r => { if (r.scope === 'global') globalCurve = r; else curveByKey[r.ref] = r; });
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const floorNow = new Date();
  const medianFloor = addDays(floorNow, 5).getTime();
  (ar.data||[]).forEach(i => {
    const cb = curveByKey[i.curveKey];
    const p50 = cb?.median_lag ?? globalCurve?.median_lag ?? 35;
    const p90 = cb?.p90_lag ?? globalCurve?.p90_lag ?? 80;
    const issued = new Date(i.issued_on);
    i.daysToPay = p50;                     // the curve's plain answer, unfloored
    i.rawMedian = addDays(issued, p50);    // what the curve implies for THIS invoice
    i.floored = i.rawMedian.getTime() < medianFloor;  // per-invoice, not blended
    i.expectMedian = new Date(Math.max(i.rawMedian, medianFloor));
    i.expectLate   = new Date(Math.max(addDays(issued, p90), addDays(floorNow, 14)));
  });

  // ---- aging: bucket every open balance by days past due; not-yet-due is Current
  const BUCKETS = ['Current','1–30','31–60','61–90','90+'];
  const today = new Date().toISOString().slice(0,10);
  const daysPast = due => Math.floor((new Date(today) - new Date(due)) / 86400000);
  const bucketOf = r => {
    const d = daysPast(r.due_on || r.issued_on);
    return d <= 0 ? 0 : d <= 30 ? 1 : d <= 60 ? 2 : d <= 90 ? 3 : 4;
  };
  function agingTable(elId, items, nameKey, limit = 15) {
    const rowLabel = nameKey === 'vendor_name' ? 'Vendor' : 'Client';
    const byName = {};
    items.forEach(r => {
      const n = r[nameKey] || '(unnamed)';
      const row = byName[n] = byName[n] || [0,0,0,0,0];
      row[bucketOf(r)] += r.balance;
    });
    const entries = Object.entries(byName)
      .map(([n,b]) => ({ n, b, total: b.reduce((s,v)=>s+v,0) }))
      .sort((a,z) => z.total - a.total);
    const top = entries.slice(0, limit), rest = entries.slice(limit);
    const restRow = rest.length
      ? { n: `everyone else (${rest.length})`,
          b: rest.reduce((acc,e)=>acc.map((v,i)=>v+e.b[i]), [0,0,0,0,0]),
          total: rest.reduce((s,e)=>s+e.total, 0) }
      : null;
    const totals = entries.reduce((acc,e)=>acc.map((v,i)=>v+e.b[i]), [0,0,0,0,0]);
    const grand = totals.reduce((s,v)=>s+v, 0);
    const overdue = grand - totals[0];
    const cell = v => v ? fmt$(v) : '';
    const line = e => `<tr><td style="text-align:left;white-space:nowrap">
        <span class="ellip" style="max-width:240px;display:inline-block;vertical-align:bottom">${e.n}</span></td>
      ${e.b.map((v,i)=>`<td class="${i>=3&&v?'err':''}">${cell(v)}</td>`).join('')}
      <td style="font-weight:600">${fmt$(e.total)}</td></tr>`;
    const overduePct = grand ? Math.round(100*overdue/grand) : 0;
    document.getElementById(elId).innerHTML =
      `<tr><th style="text-align:left"><span class="sr-only">${rowLabel}</span></th>${BUCKETS.map(b=>`<th>${b}</th>`).join('')}<th>total</th></tr>` +
      top.map(line).join('') + (restRow ? line(restRow) : '') +
      `<tr class="gp"><td style="text-align:left">total${grand ? ` — ${overduePct}% overdue` : ''}</td>
        ${totals.map(v=>`<td>${cell(v)}</td>`).join('')}
        <td style="font-weight:700">${fmt$(grand)}</td></tr>`;
    return { grand, overduePct };
  }
  const arSummary = agingTable('ar-aging', ar.data, 'master', Infinity);   // every master client, all of it
  const apSummary = agingTable('ap-aging', ap.data, 'vendor_name');

  // ---- expected payment date table, one row per open invoice, grouped under
  // each client — who pays, for what, and when, at the grain the balance
  // actually exists in (a client-level average landed on dates no invoice
  // was really predicting; this shows the real ones).
  function paymentDateTable(elId, items) {
    const today0 = new Date(); today0.setHours(0,0,0,0);
    const fmtDate = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric',
      year: d.getFullYear() !== today0.getFullYear() ? 'numeric' : undefined });
    const byMaster = {};
    items.forEach(i => (byMaster[i.master] = byMaster[i.master] || []).push(i));
    const clients = Object.entries(byMaster)
      .map(([n, invs]) => ({
        n, invs: invs.slice().sort((a, z) => a.expectMedian - z.expectMedian),
        balance: invs.reduce((s, i) => s + i.balance, 0),
        earliest: Math.min(...invs.map(i => i.expectMedian.getTime())),
      }))
      .sort((a, z) => a.earliest - z.earliest);
    const totalBalance = clients.reduce((s, c) => s + c.balance, 0);
    const flooredMark = floored => floored
      ? ` <span class="muted" title="already past this invoice's usual settlement window — the curve has no date to give, so this is floored to &quot;soon&quot;, not predicted">*</span>`
      : '';
    const invRow = i => {
      const inDays = Math.round((i.expectMedian - today0) / 86400000);
      return `<tr><td style="text-align:left;padding-left:20px" class="muted">
          <span class="ellip" style="max-width:220px;display:inline-block;vertical-align:bottom">${i.forWhat}</span></td>
        <td class="muted">${i.doc_number || '—'}</td>
        <td class="muted">${fmtDate(new Date(i.issued_on))}</td>
        <td>${fmt$(i.balance)}</td>
        <td class="muted">${i.daysToPay}d</td>
        <td>${fmtDate(i.expectMedian)}${flooredMark(i.floored)}</td>
        <td class="${inDays > 60 ? 'err' : ''}">${inDays <= 0 ? 'overdue' : inDays + 'd'}</td>
        <td class="muted">${fmtDate(i.expectLate)}</td></tr>`;
    };
    const clientBlock = c => `<tr class="gp"><td style="text-align:left">
          <span class="ellip" style="max-width:220px;display:inline-block;vertical-align:bottom">${c.n}</span></td>
        <td colspan="2" class="muted">${c.invs.length} invoice${c.invs.length === 1 ? '' : 's'}</td>
        <td>${fmt$(c.balance)}</td><td colspan="4"></td></tr>` +
      c.invs.map(invRow).join('');
    const flooredTotal = items.filter(i => i.floored).length;
    document.getElementById(elId).innerHTML =
      `<tr><th style="text-align:left">Client / for</th><th>Invoice #</th><th>Issued</th><th>Balance</th>
        <th>Days to pay</th><th>Expected</th><th>In</th><th>Worst case (p90)</th></tr>` +
      clients.map(clientBlock).join('') +
      `<tr class="gp"><td style="text-align:left">total${flooredTotal
          ? ` — * ${flooredTotal} invoice${flooredTotal === 1 ? '' : 's'} already past their usual window`
          : ''}</td><td colspan="2"></td><td>${fmt$(totalBalance)}</td>
        <td colspan="4"></td></tr>`;
  }
  paymentDateTable('pay-dates', ar.data);

  // ---- horizon-dependent: the only part that needs to re-run on a horizon change
  async function renderPeriods(periods) {
    const { data: rows, error } = await supa.rpc('cashflow_forecast', { periods });
    if (error) throw error;

    const months = periods / 2;
    const endExpected = rows[rows.length-1].position_expected;
    const trough = Math.min(...rows.map(r=>r.position_conservative));
    const runrate = Math.round((endExpected - cashToday) / months);
    document.getElementById('kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">In the bank</div>
        <div class="summary-value">${fmt$(cashToday)}</div>
        <div class="summary-note">as of ${cashAsOf}</div></div>
      <div class="summary-cell"><div class="summary-label">Monthly cash runrate</div>
        <div class="summary-value ${runrate<0?'neg':'pos'}">${runrate<0?'-':'+'}${fmt$(Math.abs(runrate))}</div>
        <div class="summary-note">avg net flow over the ${months}-month horizon</div></div>
      <div class="summary-cell"><div class="summary-label">Projected position, ${months} months</div>
        <div class="summary-value ${endExpected<0?'neg':'pos'}">${fmt$(endExpected)}</div>
        <div class="summary-note">${fmt$(trough)} conservative trough</div></div>
      <div class="summary-cell"><div class="summary-label">Open AR</div>
        <div class="summary-value">${fmt$(arSummary.grand)}</div>
        <div class="summary-note">${arSummary.overduePct}% overdue</div></div>
      <div class="summary-cell"><div class="summary-label">Open AP</div>
        <div class="summary-value">${fmt$(apSummary.grand)}</div>
        <div class="summary-note">${apSummary.overduePct}% overdue</div></div>`;

    bandChart(document.getElementById('chart'),
      rows.map(r=>r.period_label.replace(/ \d\d$/,'')),
      [{name:'optimistic (p25)', color:'#67706d', values: rows.map(r=>r.position_optimistic)},
       {name:'expected', color:'#19a789', values: rows.map(r=>r.position_expected)},
       {name:'conservative (p90)', color:'#d1453b', values: rows.map(r=>r.position_conservative)}]);

    document.getElementById('tbl').innerHTML =
      `<tr><th>period</th><th>AR in</th><th>contracted in</th><th>bills</th><th>payroll</th>
       <th>overhead</th><th>agency media</th><th>forecast COGS</th><th>expected</th><th>worst (p90)</th></tr>` +
      rows.map(r=>`<tr><td style="white-space:nowrap">${r.period_label}</td>
        <td>${fmt$(r.cash_in_expected)}</td><td>${fmt$(r.in_contracted_expected)}</td>
        <td>${fmt$(r.out_bills)}</td><td>${fmt$(r.out_payroll)}</td>
        <td>${fmt$(r.out_overhead)}</td>
        <td>${fmt$(r.out_agency_media)}</td>
        <td>${fmt$(r.out_contracted_cogs)}</td>
        <td class="${r.position_expected<0?'err':r.position_expected>0?'pos':''}">${fmt$(r.position_expected)}</td>
        <td class="${r.position_conservative<0?'err':r.position_conservative>0?'pos':''}">${fmt$(r.position_conservative)}</td></tr>`).join('');
  }

  const periods = +(localStorage.getItem('cf_periods') || 12);
  sel.value = String(periods);
  sel.onchange = () => {
    localStorage.setItem('cf_periods', sel.value);
    renderPeriods(+sel.value);
  };
  await renderPeriods(periods);
});
</script></body></html>
