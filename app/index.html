<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Home</title><link rel="stylesheet" href="./assets/style.css?v=f5b9ecb"></head><body>
<script type="module">
import { boot, fmt$, esc, bandChart } from './assets/shell.js?v=f5b9ecb';

boot('home', async (supa, el) => {
  el.innerHTML = `<div class="summary-strip" id="tiles"></div>
    <div class="sc-panel chartpanel"><div style="padding:16px 18px 0"><div class="muted" style="margin-bottom:8px">Cash position, 13 weeks</div></div><div id="chart"><div style="padding:0 18px 16px">loading…</div></div></div>
    <div class="sc-panel" id="queues"></div>`;

  const [banks, ar, review, unlinked, cf, syncs] = await Promise.all([
    supa.from('cash_accounts').select('balance,as_of'),
    supa.from('invoices').select('balance').gt('balance', 0),
    supa.from('deals').select('id', { count:'exact', head:true }).is('reviewed_at', null).in('status',['won','active']),
    supa.from('clients').select('id', { count:'exact', head:true }).is('qbo_customer_id', null).eq('active', true),
    supa.rpc('cashflow_forecast', { periods: 6 }),
    supa.from('sync_state').select('id,last_run_at,last_run_log')
  ]);

  const bank = (banks.data||[]).reduce((s,a)=>s+a.balance,0);
  const arTotal = (ar.data||[]).reduce((s,i)=>s+i.balance,0);
  const rows = cf.data||[];
  const trough = rows.length ? Math.min(...rows.map(r=>r.position_conservative)) : 0;

  document.getElementById('tiles').innerHTML = `
    <div class="summary-cell"><div class="summary-label">In the bank</div><div class="summary-value">${fmt$(bank)}</div>
      <div class="summary-note">as of ${(banks.data||[])[0]?.as_of||'—'}</div></div>
    <div class="summary-cell"><div class="summary-label">Open AR</div><div class="summary-value">${fmt$(arTotal)}</div>
      <div class="summary-note">${(ar.data||[]).length} open invoices</div></div>
    <div class="summary-cell"><div class="summary-label">Conservative trough, 13 wk</div>
      <div class="summary-value ${trough<0?'neg':'pos'}">${fmt$(trough)}</div>
      <div class="summary-note">worst week if every client pays at their p90</div></div>
    <div class="summary-cell"><div class="summary-label">Deals awaiting review</div><div class="summary-value">${review.count??'—'}</div>
      <div class="summary-note"><a href="./deals.html">shape them</a></div></div>
    <div class="summary-cell"><div class="summary-label">Clients needing a QuickBooks link</div><div class="summary-value">${unlinked.count??'—'}</div>
      <div class="summary-note"><a href="./clients.html">match them</a></div></div>`;

  if (rows.length) bandChart(document.getElementById('chart'),
    rows.map(r=>(r.period_label||r.week_start.slice(5)).replace(/ \d\d$/,'')),
    [{name:'expected', color:'#19a789', values: rows.map(r=>r.position_expected)},
     {name:'conservative (p90)', color:'#d1453b', values: rows.map(r=>r.position_conservative)}]);
  else document.getElementById('chart').innerHTML = '<div style="padding:0 18px 16px">no forecast data</div>';

  document.getElementById('queues').innerHTML = `<div class="muted" style="margin-bottom:8px">Syncs</div>
    <table><tr><th>source</th><th>last run</th><th>status</th></tr>
    ${(syncs.data||[]).map(s=>{
      const log=s.last_run_log||{};
      const ok=log.ok!==false;
      return `<tr><td>${esc(s.id)}</td><td>${s.last_run_at? new Date(s.last_run_at).toLocaleString():'never'}</td>
        <td>${ok?'<span class="pill good">ok</span>':`<span class="pill bad">failed: ${esc(log.stage||'')}</span>`}</td></tr>`;
    }).join('')}</table>`;
});
</script></body></html>
