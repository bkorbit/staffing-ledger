<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Home</title><link rel="stylesheet" href="./assets/style.css?v=a8269e0">
<style>
/* Sales Forecast panel — carried over from sales.html's own local overrides
   (its chart isn't drawn through the shared barChart/bandChart helpers, so
   its bespoke classes have to come along too). Margins/paddings trimmed
   slightly from the source page's since this sits inside a sub-panel, not
   a full page. */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;padding:0 18px}

  align-items:center;border:1px solid var(--line);

</style></head><body>
<script type="module">
import { boot, esc, fmt$, fetchAll, barChart, bandChart, donutChart } from './assets/shell.js?v=a8269e0';

// The Hour-tracking Dashboard, back on Home — bottom-up from actual hours
// (time_entries) x each staff member's own resolved comp rate, joined
// against forecast_page()'s own rev_proj for revenue attribution, same as
// Team Hours/Client Profitability/Project Hours. See db/031_hours_page.sql.
// "Planned" hours stay out of every chart/KPI here on purpose —
// assignments has no entry mechanism yet (db/034), so a plan-vs-actual
// comparison would be comparing actuals against a permanent zero. Capacity
// (comp_periods.weekly_capacity) is real and stands in for it.
//
// Below the four hours-tracking charts, Home also carries a full, live
// copy of Cashflow's, Forecast's, and Sales Forecast's own charts — same
// data, same controls, same interactivity as their source pages — so this
// is a real overview, not a set of tables. Each copy manages its own data
// and its own range independently of the popover above (a forward-looking
// pipeline forecast and a backward-looking hours report have no shared
// "range" that means the same thing to both).
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };
const mLabel = s => new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' });
const monthsBetween = (from, to) => { const out = []; let m = from, guard = 0;
  while (m <= to && guard < 60) { out.push(m); m = shiftM(m, 1); guard++; } return out; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const weekStart = s => { const d = new Date(s + 'T00:00:00Z'); const day = d.getUTCDay();
  d.setUTCDate(d.getUTCDate() + (day === 0 ? -6 : 1) - day); return iso(d); };
const wLabel = s => new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });

boot('home', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  let rangeFrom = shiftM(thisMonth, -2), rangeTo = thisMonth;

  el.innerHTML = `<div class="range"><div class="range-wrap" style="position:relative">
      <button class="ghost" id="range-trigger" style="min-width:170px"></button>
    </div></div>
    <div id="kpi-panel">loading…</div>
    <div class="chart-grid">
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Department hours — actual</div></div>
        <div id="chart-dept"></div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Revenue &amp; labor cost — trend</div></div>
        <div id="chart-trend"></div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Time allocation</div></div>
        <div class="pie-pair">
          <div class="pie-cell"><div class="sc-eyebrow">Of hours logged</div><div id="chart-split"></div></div>
          <div class="pie-cell"><div class="sc-eyebrow">Of total capacity</div><div id="chart-split-cap"></div></div>
        </div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Hours logged by week — by project</div></div>
        <div id="chart-weekly"></div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Cashflow</div></div>
        <div id="panel-cashflow">loading…</div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Forecast</div></div>
        <div id="panel-forecast">loading…</div>
      </div>
      <div class="sc-panel chartpanel">
        <div style="padding:14px 18px 0"><div class="sc-eyebrow" style="margin-bottom:0">Sales Forecast</div></div>
        <div id="panel-sales">loading…</div>
      </div>
    </div>`;

  // ---- range popover: click-to-open instead of two permanently-visible
  // date-input boxes sitting on the page — same pattern as Team's row-edit
  // popover (.editpop), not a new one invented for this page. Governs only
  // the four hours-tracking charts above; the three copied panels below
  // keep their own source pages' own range controls.
  const pop = document.createElement('div');
  pop.className = 'editpop';
  pop.hidden = true;
  pop.innerHTML = `
    <div class="editpop-body">
      <div class="editorbar" style="padding:0 14px;margin-top:14px">
        <button class="ghost rp-preset" data-n="0">This month</button>
        <button class="ghost rp-preset" data-n="-2">Last 3 months</button>
        <button class="ghost rp-preset" data-n="-5">Last 6 months</button>
        <button class="ghost rp-preset" data-n="-11">Last 12 months</button>
      </div>
      <div class="setrow"><span class="setlabel">From</span><input class="rp-from" type="month"></div>
      <div class="setrow"><span class="setlabel">To</span><input class="rp-to" type="month"></div>
    </div>
    <div class="editpop-foot"><button class="primary rp-done">Done</button></div>`;
  document.body.appendChild(pop);

  const trigger = document.getElementById('range-trigger');
  const onOutsideClick = e => { if (!pop.contains(e.target) && e.target !== trigger) closePop(); };
  const onKey = e => { if (e.key === 'Escape') closePop(); };
  function closePop() {
    pop.hidden = true;
    document.removeEventListener('mousedown', onOutsideClick, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('scroll', closePop, true);
  }
  function openPop() {
    pop.querySelector('.rp-from').value = rangeFrom.slice(0, 7);
    pop.querySelector('.rp-to').value = rangeTo.slice(0, 7);
    pop.hidden = false;
    const r = trigger.getBoundingClientRect();
    const top = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 8));
    const left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8));
    pop.style.top = top + 'px'; pop.style.left = left + 'px';
    document.addEventListener('mousedown', onOutsideClick, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('scroll', closePop, true);
  }
  const setTriggerLabel = () => { trigger.textContent = `${mLabel(rangeFrom)} – ${mLabel(rangeTo)} ▾`; };
  trigger.onclick = () => pop.hidden ? openPop() : closePop();
  pop.querySelector('.rp-from').onchange = e => { rangeFrom = monthOf(e.target.value); setTriggerLabel(); load(); };
  pop.querySelector('.rp-to').onchange = e => { rangeTo = monthOf(e.target.value); setTriggerLabel(); load(); };
  pop.querySelectorAll('.rp-preset').forEach(btn => btn.onclick = () => {
    rangeFrom = shiftM(thisMonth, +btn.dataset.n); rangeTo = thisMonth;
    pop.querySelector('.rp-from').value = rangeFrom.slice(0, 7);
    pop.querySelector('.rp-to').value = rangeTo.slice(0, 7);
    setTriggerLabel(); load();
  });
  pop.querySelector('.rp-done').onclick = closePop;
  setTriggerLabel();

  async function load() {
    const kpiPanel = document.getElementById('kpi-panel');
    const [hp, fp, dl, cl, te] = await Promise.all([
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      supa.from('deals').select('id,name,client_id,qbo_project_id'),
      supa.from('clients').select('id,name'),
      fetchAll(() => supa.from('time_entries').select('worked_on,deal_id,hours')
        .gte('worked_on', rangeFrom).lte('worked_on', endOfMonth(rangeTo)).not('deal_id', 'is', null))
    ]);
    for (const r of [hp, fp, dl, cl, te]) if (r.error) {
      kpiPanel.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    const H = hp.data || {}, P = fp.data || {};
    const dealsById = {}; (dl.data || []).forEach(d => dealsById[d.id] = d);
    const clientsById = {}; (cl.data || []).forEach(c => clientsById[c.id] = c);
    const revByProj = {}; (P.rev_proj || []).forEach(r => revByProj[r.qbo_project_id] = +r.total);
    const revByMonth = {}; (P.rev_month || []).forEach(r => revByMonth[r.month] = +r.total);
    const laborByDeal = {}; (H.deal_labor || []).forEach(r => laborByDeal[r.deal_id] = r);

    // ---- client / deal rows: one per deal with either actual labor hours or
    // a claimed QBO project, so a deal with revenue but zero logged hours
    // still counts toward its client instead of silently disappearing
    const dealRows = Object.keys(laborByDeal)
      .concat(Object.values(dealsById).filter(d => d.qbo_project_id).map(d => d.id))
      .filter((id, i, a) => a.indexOf(id) === i)
      .map(id => {
        const deal = dealsById[id]; if (!deal) return null;
        const labor = laborByDeal[id] || { hours: 0, cost: 0 };
        const revenue = deal.qbo_project_id ? (revByProj[deal.qbo_project_id] || 0) : 0;
        return { dealId: id, name: deal.name, clientId: deal.client_id,
          hours: +labor.hours, cost: +labor.cost, revenue, profit: revenue - (+labor.cost) };
      }).filter(Boolean);

    const byClient = {};
    dealRows.forEach(r => (byClient[r.clientId] = byClient[r.clientId] || []).push(r));
    const clientRows = Object.entries(byClient).map(([cid, deals]) => ({
      clientId: cid, name: (clientsById[cid] || {}).name || '(unknown client)',
      hours: deals.reduce((s, d) => s + d.hours, 0),
      cost: deals.reduce((s, d) => s + d.cost, 0),
      revenue: deals.reduce((s, d) => s + d.revenue, 0),
      profit: deals.reduce((s, d) => s + d.profit, 0)
    }));

    const totalHours = clientRows.reduce((s, c) => s + c.hours, 0);
    const totalCost = clientRows.reduce((s, c) => s + c.cost, 0);
    const totalRevenue = clientRows.reduce((s, c) => s + c.revenue, 0);
    const totalProfit = totalRevenue - totalCost;
    const clientsAtRisk = clientRows.filter(c => c.profit < 0).length;

    // ---- per-staff derived numbers: department rollup + time allocation +
    // revenue attribution, same technique Team Hours uses — a deal's revenue
    // splits across whoever logged hours on it, proportional to their hours
    const revPerHourByDeal = {};
    (H.deal_labor || []).forEach(r => {
      const deal = dealsById[r.deal_id];
      const rev = deal && deal.qbo_project_id ? (revByProj[deal.qbo_project_id] || 0) : 0;
      if (+r.hours > 0 && rev) revPerHourByDeal[r.deal_id] = rev / +r.hours;
    });
    const compByStaff = {}; (H.comp_current || []).forEach(c => compByStaff[c.staff_id] = c);
    const hoursByStaff = {};
    (H.staff_hours_month || []).forEach(r => {
      const s = hoursByStaff[r.staff_id] = hoursByStaff[r.staff_id] || { hours: 0, cost: 0 };
      s.hours += +r.hours; s.cost += +r.cost;
    });
    const dealHoursByStaff = {};
    (H.staff_hours_deal || []).forEach(r => (dealHoursByStaff[r.staff_id] = dealHoursByStaff[r.staff_id] || []).push(r));

    const daysInRange = (new Date(endOfMonth(rangeTo)) - new Date(rangeFrom)) / 86400000 + 1;
    const weeksInRange = daysInRange / 7;
    const ptoByStaff = {};
    (H.time_off || []).forEach(o => {
      const s0 = new Date(o.starts_on < rangeFrom ? rangeFrom : o.starts_on);
      const e0 = new Date(o.ends_on > endOfMonth(rangeTo) ? endOfMonth(rangeTo) : o.ends_on);
      const overlapDays = (e0 - s0) / 86400000 + 1;
      if (overlapDays <= 0) return;
      const totalDays = (new Date(o.ends_on) - new Date(o.starts_on)) / 86400000 + 1;
      ptoByStaff[o.staff_id] = (ptoByStaff[o.staff_id] || 0) + (+o.hours * (overlapDays / totalDays));
    });

    // stale roster entries (no logged hours since the current import cutoff)
    // stay out of capacity/department math the same way Team Hours hides them
    const activeStaff = (H.staff || []).filter(s => s.active && s.has_recent_hours);
    const staffRows = activeStaff.map(s => {
      const comp = compByStaff[s.id];
      const hc = hoursByStaff[s.id] || { hours: 0, cost: 0 };
      const cap = comp ? comp.weekly_capacity * weeksInRange : 0;
      const ptoHours = ptoByStaff[s.id] || 0;
      const deals = dealHoursByStaff[s.id] || [];
      const clientHours = deals.reduce((s2, d) => s2 + +d.hours, 0);
      const internalHours = Math.max(hc.hours - clientHours, 0);
      let attributed = 0;
      deals.forEach(d => { const rph = revPerHourByDeal[d.deal_id]; if (rph) attributed += +d.hours * rph; });
      return { dept: s.department || '(none)', cap, ptoHours, clientHours, internalHours,
        cost: hc.cost, attributed };
    });

    const byDept = {};
    staffRows.forEach(r => {
      const d = byDept[r.dept] = byDept[r.dept] ||
        { dept: r.dept, members: 0, capacity: 0, client: 0, internal: 0, off: 0, cost: 0, revenue: 0 };
      d.members++; d.capacity += r.cap; d.client += r.clientHours; d.internal += r.internalHours;
      d.off += r.ptoHours; d.cost += r.cost; d.revenue += r.attributed;
    });
    const allDeptRows = Object.values(byDept).map(d => ({ ...d, profit: d.revenue - d.cost,
      unused: Math.max(d.capacity - (d.client + d.internal + d.off), 0) }))
      .sort((a, b) => b.capacity - a.capacity);
    const totalCapacity = allDeptRows.reduce((s, d) => s + d.capacity, 0);

    const totClient = staffRows.reduce((s, r) => s + r.clientHours, 0);
    const totInternal = staffRows.reduce((s, r) => s + r.internalHours, 0);
    const totOff = staffRows.reduce((s, r) => s + r.ptoHours, 0);
    const totUnused = Math.max(totalCapacity - (totClient + totInternal + totOff), 0);

    // ---- trend: revenue (netted, forecast_page's own rev_month) & labor
    // cost, one point per month across the range
    const months = monthsBetween(rangeFrom, rangeTo);
    const costByMonth = {};
    (H.staff_hours_month || []).forEach(r => { costByMonth[r.month] = (costByMonth[r.month] || 0) + +r.cost; });

    // ---- weekly hours by project: top 4 deals by logged hours + everyone else
    const teRows = te.data || [];
    const hoursByWeekDeal = {}, weekTotalAll = {}, dealTotals = {};
    teRows.forEach(r => {
      const wk = weekStart(r.worked_on), key = wk + '|' + r.deal_id;
      hoursByWeekDeal[key] = (hoursByWeekDeal[key] || 0) + +r.hours;
      weekTotalAll[wk] = (weekTotalAll[wk] || 0) + +r.hours;
      dealTotals[r.deal_id] = (dealTotals[r.deal_id] || 0) + +r.hours;
    });
    const topDealIds = Object.entries(dealTotals).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([id]) => id);
    const weeks = []; { let w = weekStart(rangeFrom); const last = weekStart(endOfMonth(rangeTo)); let guard = 0;
      while (w <= last && guard < 60) { weeks.push(w); w = addDays(w, 7); guard++; } }
    const weekColors = ['var(--brand)', 'var(--brand-2)', '#19a789', '#3bc9ac'];
    const weekSeries = topDealIds.map((id, i) => ({
      name: (dealsById[id] || {}).name || '(untitled)', color: weekColors[i],
      values: weeks.map(wk => hoursByWeekDeal[wk + '|' + id] || 0)
    }));
    const restValues = weeks.map(wk => {
      const topSum = topDealIds.reduce((s, id) => s + (hoursByWeekDeal[wk + '|' + id] || 0), 0);
      return Math.max((weekTotalAll[wk] || 0) - topSum, 0);
    });
    if (restValues.some(v => v > 0)) weekSeries.push({ name: 'everyone else', color: 'var(--slate)', values: restValues });

    kpiPanel.innerHTML = `
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Revenue</div>
          <div class="summary-value">${fmt$0(totalRevenue)}</div></div>
        <div class="summary-cell"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalCost)}</div></div>
        <div class="summary-cell"><div class="summary-label">Profit (hours-based)</div>
          <div class="summary-value ${totalProfit < 0 ? 'neg' : 'pos'}">${fmt$0(totalProfit)}</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="summary-note">of ${fmtHours(totalCapacity)}h capacity</div></div>
        <div class="summary-cell"><div class="summary-label">Clients at risk</div>
          <div class="summary-value ${clientsAtRisk > 0 ? 'neg' : 'pos'}">${clientsAtRisk} / ${clientRows.length}</div>
          <div class="summary-note">losing money on hours-based cost</div></div>
      </div>`;

    if (allDeptRows.length) barChart(document.getElementById('chart-dept'), allDeptRows.map(d => d.dept), [
      { name: 'client hours', color: 'var(--brand-2)', values: allDeptRows.map(d => d.client) },
      { name: 'internal hours', color: 'var(--brand)', values: allDeptRows.map(d => d.internal) },
      { name: 'time off', color: 'var(--slate)', values: allDeptRows.map(d => d.off) },
      { name: 'unused capacity', color: 'var(--line)', values: allDeptRows.map(d => d.unused) }
    ]);
    else document.getElementById('chart-dept').innerHTML = '<div style="padding:16px 18px" class="muted">No staff with logged hours in this range.</div>';

    bandChart(document.getElementById('chart-trend'), months.map(mLabel), [
      { name: 'revenue', color: 'var(--brand)', values: months.map(m => revByMonth[m] || 0) },
      { name: 'labor cost', color: 'var(--slate)', values: months.map(m => costByMonth[m] || 0) }
    ]);

    donutChart(document.getElementById('chart-split'), [
      { name: 'Client', color: 'var(--brand-2)', value: totClient },
      { name: 'Internal', color: 'var(--brand)', value: totInternal },
      { name: 'Time off', color: 'var(--slate)', value: totOff }
    ]);
    donutChart(document.getElementById('chart-split-cap'), [
      { name: 'Client', color: 'var(--brand-2)', value: totClient },
      { name: 'Internal', color: 'var(--brand)', value: totInternal },
      { name: 'Time off', color: 'var(--slate)', value: totOff },
      { name: 'Unused', color: 'var(--line)', value: totUnused }
    ]);

    if (weeks.length && weekSeries.length) barChart(document.getElementById('chart-weekly'), weeks.map(wLabel), weekSeries);
    else document.getElementById('chart-weekly').innerHTML = '<div style="padding:16px 18px" class="muted">No hours logged against a project in this range.</div>';
  }

  load();
  mountCashflowPanel(supa, document.getElementById('panel-cashflow'));
  mountForecastPanel(supa, document.getElementById('panel-forecast'));
  mountSalesPanel(supa, document.getElementById('panel-sales'));
});

// ============================================================================
// Cashflow panel — a live copy of cashflow.html's own horizon selector, KPI
// ribbon, and band chart. The AR/AP aging tables stay on Cashflow itself
// (Home wants graphs, not more tables); the two totals they'd otherwise feed
// into the KPI ribbon are summed directly instead of building the per-client
// buckets the tables need.
// ============================================================================
async function mountCashflowPanel(supa, el) {
  el.innerHTML = `<div class="toolbar" style="margin-bottom:10px">
      <label class="mono" for="cf-weeks">Horizon</label>
      <select id="cf-weeks">
        <option value="6">3 months</option><option value="12">6 months</option>
        <option value="18">9 months</option><option value="24">12 months</option>
      </select>
    </div>
    <div class="summary-strip" id="cf-kpis" aria-live="polite"></div>
    <div id="cf-chart"><div style="padding:16px 18px">loading…</div></div>`;

  const sel = el.querySelector('#cf-weeks');

  const [ar, ap, bk] = await Promise.all([
    fetchAll(() => supa.from('invoices').select('due_on,issued_on,balance').gt('balance', 0)),
    fetchAll(() => supa.from('bills').select('due_on,issued_on,balance').gt('balance', 0)),
    supa.from('qbo_accounts').select('balance,is_operating,as_of').eq('account_type', 'Bank')
  ]);
  for (const r of [ar, ap, bk]) if (r.error) { el.innerHTML = `<div class="err" style="padding:16px 18px">${esc(r.error.message)}</div>`; return; }

  const banksOperatingSet = (bk.data || []).some(b => b.is_operating);
  const cashToday = (bk.data || []).filter(b => !banksOperatingSet || b.is_operating).reduce((s, b) => s + b.balance, 0);
  const cashAsOf = (bk.data || [])[0]?.as_of || '—';

  // same "Current vs. overdue" split agingTable() uses on Cashflow itself —
  // just the two totals the KPI ribbon needs, without building per-client buckets
  const today = new Date().toISOString().slice(0, 10);
  const daysPast = due => Math.floor((new Date(today) - new Date(due)) / 86400000);
  const sumAging = items => {
    const grand = items.reduce((s, r) => s + r.balance, 0);
    const overdue = items.reduce((s, r) => s + (daysPast(r.due_on || r.issued_on) > 0 ? r.balance : 0), 0);
    return { grand, overduePct: grand ? Math.round(100 * overdue / grand) : 0 };
  };
  const arSummary = sumAging(ar.data || []);
  const apSummary = sumAging(ap.data || []);

  async function renderPeriods(periods) {
    const { data: rows, error } = await supa.rpc('cashflow_forecast', { periods });
    if (error) throw error;
    const months = periods / 2;
    const endExpected = rows[rows.length - 1].position_expected;
    const trough = Math.min(...rows.map(r => r.position_conservative));
    const runrate = Math.round((endExpected - cashToday) / months);
    el.querySelector('#cf-kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">In the bank</div>
        <div class="summary-value">${fmt$(cashToday)}</div>
        <div class="summary-note">as of ${cashAsOf}</div></div>
      <div class="summary-cell"><div class="summary-label">Monthly cash runrate</div>
        <div class="summary-value ${runrate < 0 ? 'neg' : 'pos'}">${runrate < 0 ? '-' : '+'}${fmt$(Math.abs(runrate))}</div>
        <div class="summary-note">avg net flow over the ${months}-month horizon</div></div>
      <div class="summary-cell"><div class="summary-label">Projected position, ${months} months</div>
        <div class="summary-value ${endExpected < 0 ? 'neg' : 'pos'}">${fmt$(endExpected)}</div>
        <div class="summary-note">${fmt$(trough)} conservative trough</div></div>
      <div class="summary-cell"><div class="summary-label">Open AR</div>
        <div class="summary-value">${fmt$(arSummary.grand)}</div>
        <div class="summary-note">${arSummary.overduePct}% overdue</div></div>
      <div class="summary-cell"><div class="summary-label">Open AP</div>
        <div class="summary-value">${fmt$(apSummary.grand)}</div>
        <div class="summary-note">${apSummary.overduePct}% overdue</div></div>`;

    bandChart(el.querySelector('#cf-chart'),
      rows.map(r => r.period_label.replace(/ \d\d$/, '')),
      [{ name: 'optimistic (p25)', color: '#67706d', values: rows.map(r => r.position_optimistic) },
       { name: 'expected', color: '#19a789', values: rows.map(r => r.position_expected) },
       { name: 'conservative (p90)', color: '#d1453b', values: rows.map(r => r.position_conservative) }]);
  }

  const periods = +(localStorage.getItem('cf_periods') || 12);
  sel.value = String(periods);
  sel.onchange = () => { localStorage.setItem('cf_periods', sel.value); renderPeriods(+sel.value); };
  await renderPeriods(periods);
}

// ============================================================================
// Forecast panel — a live copy of forecast.html's own range control, KPI
// ribbon, and combo chart (rowFor/comboChart, copied verbatim). The
// per-client account table and deal editor stay on Forecast itself — this
// is the trend, not the place to edit a deal's shaping.
// ============================================================================
async function mountForecastPanel(supa, el) {
  const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const mLabel = d => MO[+d.slice(5, 7) - 1] + ' ' + d.slice(2, 4);
  const fmtM = c => (c < 0 ? '-$' : '$') + Math.abs(c / 100).toLocaleString(undefined, { maximumFractionDigits: 0 });
  const isoD = d => d.toISOString().slice(0, 10);
  const t0 = new Date(); t0.setUTCDate(1);
  const thisMonth = isoD(t0).slice(0, 8) + '01';
  const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
    return new Date(Date.UTC(y, mm - 1 + n, 1)).toISOString().slice(0, 10); };
  const monthsBetween = (a, b) => { const out = [];
    let d = new Date(a.slice(0, 7) + '-01T00:00:00Z');
    const end = new Date(b.slice(0, 7) + '-01T00:00:00Z');
    while (d <= end && out.length < 48) { out.push(d.toISOString().slice(0, 10));
      d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)); } return out; };
  const past = m => m < thisMonth;

  let rangeFrom = shiftM(thisMonth, -6), rangeTo = shiftM(thisMonth, 6);

  // ---- the chart system: combo — copied verbatim from forecast.html.
  // Six cost categories, five confirmed brand tokens (cogs and fixed share
  // Slate; they never touch in the stack, so position + hover disambiguate).
  function comboChart(elc, rows) {
    const SERIES = [
      ['revenue', 'var(--brand)', 'revenue'],
      ['cogs', 'var(--slate)', 'COGS'],
      ['labour', 'var(--brand-2)', 'labour'],
      ['other', 'var(--brand-4)', 'overhead'],
      ['misc', 'var(--accent)', 'other'],
      ['fixed', 'var(--slate)', 'fixed'],
      ['net', 'var(--gold)', 'net (line)'],
    ];
    const colorOf = Object.fromEntries(SERIES.map(([k, c]) => [k, c]));
    const hidden = new Set(JSON.parse(localStorage.getItem('fc_hidden') || '[]'));
    const on = k => !hidden.has(k);
    const INK = 'var(--ink)', GRID = 'var(--line)';
    const W = 960, H = 280, P = { l: 64, r: 12, t: 16, b: 26 };
    const fmtC = c => { const d = c / 100, a = Math.abs(d);
      return (d < 0 ? '-$' : '$') + (a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'k' : Math.round(a)); };
    const opexOf = r => (on('labour') ? r.labour : 0) + (on('other') ? r.other : 0)
      + (on('misc') ? r.misc : 0) + (on('fixed') ? r.fixed : 0);
    const maxBar = Math.max(1, ...rows.map(r => Math.max(
      on('revenue') ? r.revenue : 0, on('cogs') ? r.cogs : 0, opexOf(r))));
    const nets = on('net') ? rows.map(r => r.net) : [0];
    const SNAP = 25000000;
    const rawMin = Math.min(0, ...nets), rawMax = Math.max(maxBar, ...nets, 1);
    const min = Math.floor(rawMin / SNAP) * SNAP;
    const max = Math.max(Math.ceil(rawMax / SNAP) * SNAP, min + SNAP);
    const y = v => P.t + (H - P.t - P.b) * (1 - (v - min) / ((max - min) || 1));
    const gap = (W - P.l - P.r) / rows.length, bw = Math.min(13, gap * 0.2);
    let g = '';
    let step = 50000000;
    if ((max - min) / step > 13) step = 100000000;
    for (let v = Math.ceil(min / step) * step; v <= max; v += step) {
      g += `<line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="${GRID}"/>
        <text x="${P.l - 6}" y="${y(v) + 3.5}" fill="${INK}" font-size="9" font-family="IBM Plex Mono" text-anchor="end">${fmtC(v)}</text>`;
    }
    if (min < 0) g += `<line x1="${P.l}" y1="${y(0)}" x2="${W - P.r}" y2="${y(0)}" stroke="var(--rust)" stroke-dasharray="4 3"/>`;
    const y0 = y(Math.max(min, 0));
    const rowVals = r => ({ revenue: r.revenue, cogs: r.cogs, labour: r.labour, other: r.other, misc: r.misc, fixed: r.fixed, net: r.net });
    const rowParts = r => { const vals = rowVals(r);
      return SERIES.filter(([k]) => on(k) && (k === 'net' || vals[k] > 0)).map(([k, , lbl]) => `${lbl} ${fmtM(vals[k])}`); };
    rows.forEach((r, i) => {
      const cx = P.l + gap * i + gap / 2, op = r.measured ? 1 : 0.55;
      const x0 = cx - 1.5 * bw - 2;
      let colG = '';
      if (on('revenue') && r.revenue > 0) colG += `<rect x="${x0}" y="${y(r.revenue)}" width="${bw}" height="${y0 - y(r.revenue)}" fill="${colorOf.revenue}" opacity="${op}"><title>${mLabel(r.m)} revenue ${fmtM(r.revenue)}</title></rect>
        <text x="${x0 + bw / 2}" y="${y(r.revenue) - 4}" fill="${INK}" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">${fmtC(r.revenue)}</text>`;
      if (on('cogs') && r.cogs > 0) colG += `<rect x="${x0 + bw + 2}" y="${y(r.cogs)}" width="${bw}" height="${y0 - y(r.cogs)}" fill="${colorOf.cogs}" opacity="${op}"><title>${mLabel(r.m)} COGS ${fmtM(r.cogs)}</title></rect>`;
      let acc = 0; const xs = x0 + 2 * (bw + 2);
      [['labour'], ['other'], ['misc'], ['fixed']].forEach(([k]) => {
        if (!on(k)) return;
        const v = r[k]; if (!v) return;
        const y1 = y(acc + v), h = y(acc) - y(acc + v); acc += v;
        const nm = k === 'other' ? 'overhead' : k === 'misc' ? 'other accts' : k;
        colG += `<rect x="${xs}" y="${y1}" width="${bw}" height="${h}" fill="${colorOf[k]}" opacity="${op}"><title>${mLabel(r.m)} ${nm} ${fmtM(v)}</title></rect>`;
      });
      colG += `<text x="${cx}" y="${H - 8}" fill="${INK}" font-size="${rows.length > 14 ? 8 : 9.5}" font-family="IBM Plex Mono" text-anchor="middle">${mLabel(r.m)}</text>`;
      const parts = rowParts(r);
      const colSummary = `${mLabel(r.m)} (${r.measured ? 'measured' : 'forecast'}): ${parts.length ? parts.join(', ') : 'no data'}`;
      g += `<g tabindex="0" role="img" aria-label="${esc(colSummary)}" class="colgroup" data-idx="${i}">${colG}</g>`;
    });
    if (on('net')) {
      for (let i = 0; i < rows.length - 1; i++) {
        const segMeasured = rows[i].measured && rows[i + 1].measured;
        const x1 = P.l + gap * i + gap / 2, x2 = P.l + gap * (i + 1) + gap / 2;
        g += `<line x1="${x1}" y1="${y(rows[i].net)}" x2="${x2}" y2="${y(rows[i + 1].net)}"
          stroke="${colorOf.net}" stroke-width="2.5" opacity="${segMeasured ? 1 : 0.55}"
          ${segMeasured ? '' : 'stroke-dasharray="5 3"'}/>`;
      }
      rows.forEach((r, i) => { const cx = P.l + gap * i + gap / 2, cy = y(r.net);
        const tip = `${mLabel(r.m)} net ${fmtM(r.net)} — ${r.measured ? 'measured' : 'forecast: GP − labour − overhead − other − fixed'}`;
        g += `<circle cx="${cx}" cy="${cy}" r="4" fill="${colorOf.net}" stroke="var(--paper-raised)" stroke-width="2" opacity="${r.measured ? 1 : 0.55}"><title>${tip}</title></circle>
        <text x="${cx}" y="${cy + 17}" fill="${INK}" font-size="9.5" font-weight="600" font-family="IBM Plex Mono" text-anchor="middle">${fmtC(r.net)}</text>`; });
    }
    const legItems = SERIES.map(([k, c, label]) => {
      const off = hidden.has(k);
      return `<button class="lg-item toggle" data-k="${k}" aria-pressed="${!off}"
          aria-label="${off ? 'show' : 'hide'} ${label} series"${off ? ' style="opacity:.4"' : ''}>
        <i class="lg-dot" style="${off ? 'background:transparent;border:1.5px dashed var(--slate)' : `background:${c}`}"></i>
        <span${off ? ' style="text-decoration:line-through"' : ''}>${label}</span></button>`;
    }).join('');
    elc.style.position = 'relative';
    elc.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}"><g>${g}</g></svg><div class="chart-tip"></div>
      <div class="chart-legend">${legItems}</div>`;
    const toggleSeries = k => {
      hidden.has(k) ? hidden.delete(k) : hidden.add(k);
      localStorage.setItem('fc_hidden', JSON.stringify([...hidden]));
      comboChart(elc, rows);
    };
    elc.querySelectorAll('.lg-item.toggle').forEach(b => { b.onclick = () => toggleSeries(b.dataset.k); });
    const svgEl = elc.querySelector('svg.chart');
    const tip = elc.querySelector('.chart-tip');
    const tipHtmlFor = idx => {
      const r = rows[idx], vals = rowVals(r);
      const tipRows = SERIES.filter(([k]) => on(k) && (k === 'net' || vals[k] > 0))
        .map(([k, c, lbl]) => `<div class="tip-row"><span class="tip-dot" style="background:${c}"></span>${esc(lbl)} <b>${fmtM(vals[k])}</b></div>`);
      return `<div class="tip-label">${mLabel(r.m)} · ${r.measured ? 'measured' : 'forecast'}</div>` +
        (tipRows.length ? tipRows.join('') : '<div class="tip-row">no data</div>');
    };
    const positionNear = (clientX, clientY) => {
      const box = elc.getBoundingClientRect();
      tip.style.left = (clientX - box.left + 12) + 'px';
      tip.style.top = (clientY - box.top - 10) + 'px';
    };
    const showAt = (clientX, clientY) => {
      const svgBox = svgEl.getBoundingClientRect();
      const scale = W / svgBox.width;
      const vx = (clientX - svgBox.left) * scale;
      let idx = Math.floor((vx - P.l) / gap);
      idx = Math.max(0, Math.min(rows.length - 1, idx));
      tip.innerHTML = tipHtmlFor(idx);
      tip.style.opacity = '1';
      positionNear(clientX, clientY);
    };
    const hideTip = () => { tip.style.opacity = '0'; };
    svgEl.onmousemove = e => showAt(e.clientX, e.clientY);
    svgEl.onmouseleave = hideTip;
    svgEl.ontouchstart = svgEl.ontouchmove = e => { if (e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
    svgEl.ontouchend = hideTip;
    elc.querySelectorAll('.colgroup').forEach(colEl => {
      const idx = +colEl.dataset.idx;
      colEl.onfocus = () => {
        tip.innerHTML = tipHtmlFor(idx);
        tip.style.opacity = '1';
        const r = colEl.getBoundingClientRect();
        positionNear(r.left + r.width / 2, r.top);
      };
      colEl.onblur = hideTip;
    });
  }

  el.innerHTML = `
    <div class="range" style="margin-bottom:10px">
      <span class="rl">Range</span>
      <input type="month" id="fc-from" aria-label="Range from" value="${rangeFrom.slice(0, 7)}">
      <span class="muted">→</span>
      <input type="month" id="fc-to" aria-label="Range to" value="${rangeTo.slice(0, 7)}">
    </div>
    <div class="summary-strip" id="fc-kpis"></div>
    <div id="fc-chart"></div>`;

  async function loadAll() {
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    const months = monthsBetween(rangeFrom, rangeTo);
    const [pg, st] = await Promise.all([
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      supa.from('settings').select('key,value').in('key', ['forecast_fixed_costs'])
    ]);
    if (pg.error) { el.innerHTML = `<div class="err">${esc(pg.error.message)}</div>`; return; }
    const P = pg.data || {};
    const sv = k => (st.data || []).find(x => x.key === k)?.value;
    const fixedCosts = sv('forecast_fixed_costs') || [];
    const runrate = { payroll: P.runrates?.payroll || 0, overhead: P.runrates?.overhead || 0, misc: P.runrates?.other || 0 };
    const revByM = {}; (P.rev_month || []).forEach(r => revByM[r.month] = r.total);
    const costByCM = {}; (P.cost_month || []).forEach(r => { (costByCM[r.class] = costByCM[r.class] || {})[r.month] = r.total; });
    const planByM = {}, planBillByM = {};
    (P.plan_month || []).forEach(r => { planByM[r.month] = r.gp; planBillByM[r.month] = r.billable; });
    const fixedTotal = () => fixedCosts.reduce((s, f) => s + (f.amount || 0), 0);

    const rowFor = m => {
      const measured = past(m);
      const revenue = measured ? (revByM[m] || 0) : (planBillByM[m] || 0);
      const cogs = measured ? ((costByCM.cogs || {})[m] || 0) : Math.max(0, (planBillByM[m] || 0) - (planByM[m] || 0));
      const forecastGP = planByM[m] || 0;
      const actualGP = measured ? revenue - cogs : null;
      const labour = measured ? ((costByCM.payroll || {})[m] || 0) : runrate.payroll;
      const other = measured ? ((costByCM.overhead || {})[m] || 0) : runrate.overhead;
      const misc = measured ? ((costByCM.other || {})[m] || 0) : runrate.misc;
      const fixed = measured ? 0 : fixedTotal();
      const net = (measured ? actualGP : forecastGP) - labour - other - misc - fixed;
      return { m, measured, revenue, cogs, forecastGP, actualGP, labour, other, misc, fixed, net };
    };
    const plRows = months.map(rowFor);
    comboChart(el.querySelector('#fc-chart'), plRows);

    const netTotal = plRows.reduce((s, r) => s + r.net, 0);
    const revTotal = plRows.reduce((s, r) => s + r.revenue, 0);
    const gpTotal = plRows.reduce((s, r) => s + (r.measured ? r.actualGP : r.forecastGP), 0);
    const measuredCount = plRows.filter(r => r.measured).length;
    el.querySelector('#fc-kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">Net profit</div>
        <div class="summary-value ${netTotal < 0 ? 'neg' : 'pos'}">${fmtM(netTotal)}</div>
        <div class="summary-note">${plRows.length} months, ${mLabel(rangeFrom)}–${mLabel(rangeTo)}</div></div>
      <div class="summary-cell"><div class="summary-label">Revenue</div>
        <div class="summary-value">${fmtM(revTotal)}</div>
        <div class="summary-note">billed + planned, this range</div></div>
      <div class="summary-cell"><div class="summary-label">Gross profit</div>
        <div class="summary-value ${gpTotal < 0 ? 'neg' : 'pos'}">${fmtM(gpTotal)}</div>
        <div class="summary-note">actual + forecast, this range</div></div>
      <div class="summary-cell"><div class="summary-label">Measured</div>
        <div class="summary-value">${measuredCount} / ${plRows.length}</div>
        <div class="summary-note">months fully closed</div></div>`;
  }

  el.querySelector('#fc-from').onchange = e => { rangeFrom = e.target.value + '-01'; loadAll(); };
  el.querySelector('#fc-to').onchange = e => { rangeTo = e.target.value + '-01'; loadAll(); };
  await loadAll();
}

// ============================================================================
// Sales Forecast panel — a live copy of sales.html's own bar (pipeline
// select, weighted/total, forecastable/all, range span), KPI ribbon, and
// pipeline chart (dealGP/tierOf/build/renderChart, copied verbatim). The
// big per-client/deal ledger table stays on Sales Forecast itself.
// ============================================================================
async function mountSalesPanel(supa, el) {
  const [pd, st, fc, promoted] = await Promise.all([
    fetchAll(() => supa.from('pipeline_deals').select('*')),
    supa.from('settings').select('key,value').in('key', ['sales_probability_threshold', 'programmatic_margin_default']),
    fetchAll(() => supa.from('v_deal_month_forecast').select('month,gp')),
    fetchAll(() => supa.from('deals').select('hubspot_deal_id,reviewed_at').eq('origin', 'hubspot').in('status', ['won', 'active']))
  ]);
  for (const r of [pd, st, fc, promoted]) if (r.error) { el.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; return; }
  const setting = k => (st.data || []).find(s => s.key === k)?.value;
  const minProb = +(setting('sales_probability_threshold') ?? 10);
  const PROG_MARGIN = +(setting('programmatic_margin_default') ?? 35);

  const LEDGER = {};
  (fc.data || []).forEach(r => LEDGER[r.month.slice(0, 7)] = (LEDGER[r.month.slice(0, 7)] || 0) + r.gp);

  const money = c => (c < 0 ? '-' : '') + '$' + Math.round(Math.abs(c) / 100).toLocaleString();
  const mk = d => (d || '').slice(0, 7);
  const shift = (k, n) => { const [y, m] = k.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); };
  const label = k => { const [y, m] = k.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }) + " '" + String(y).slice(2); };
  const monthsRange = (a, b) => { const out = []; let c = a, g = 0; while (c <= b && g < 48) { out.push(c); c = shift(c, 1); g++; } return out; };
  const monthsBetween = (a, b) => { const out = []; let c = mk(a); const e = mk(b); let g = 0;
    while (c <= e && g < 60) { out.push(c); c = shift(c, 1); g++; } return out; };
  const TODAY = new Date().toISOString().slice(0, 10);

  const TIER_COLORS = ['#19a789', '#3bc9ac', '#e2f5ef', '#fabf4d', '#fdf3dc'];
  const tierOf = p => p >= 0.85 ? 0 : p >= 0.65 ? 1 : p >= 0.45 ? 2 : p >= 0.25 ? 3 : 4;
  const LEDGER_COLOR = 'var(--brand)';

  const MAP = { 'programmatic media': ['programmatic', 'budget'], 'programmatic buying fee': ['programmatic', 'fee'],
    'paid search media': ['search', 'budget'], 'paid search fee': ['search', 'fee'],
    'paid social media': ['social', 'budget'], 'paid social fee': ['social', 'fee'],
    'paid search hourly': ['hourly', 'flat'], 'paid social hourly': ['hourly', 'flat'],
    'creative retainer': ['retainer', 'flat'], 'creative services': ['retainer', 'flat'],
    'planning': ['retainer', 'flat'], 'dashboard': ['retainer', 'flat'] };

  function dealGP(items) {
    const g = {}, flags = [];
    (items || []).forEach(li => {
      const amt = Math.round(parseFloat(li.amount || 0) * 100);
      const key = String(li.name || '').split(':').pop().trim().toLowerCase();
      const m = MAP[key];
      if (!m) { flags.push('unmapped: ' + (li.name || '?')); return; }
      const [type, role] = m;
      (g[type] = g[type] || { budget: 0, fee: 0, flat: 0 })[role] += amt;
    });
    let gp = 0; const parts = [];
    Object.entries(g).forEach(([type, v]) => {
      if (type === 'search' || type === 'social') {
        if (v.budget > 0) { const pct = v.fee / v.budget * 100; gp += v.budget * pct / 100;
          parts.push(`${type} ${pct.toFixed(1)}% of ${money(v.budget)}`);
          if (v.fee <= 0) flags.push(type + ' media with no fee line'); }
        else if (v.fee > 0) { gp += v.fee; parts.push(`${type} fee ${money(v.fee)} (no media)`); }
        gp += v.flat;
      } else if (type === 'programmatic') {
        if (v.budget > 0) { const pct = v.fee > 0 ? v.fee / v.budget * 100 : 0; const rate = pct + PROG_MARGIN;
          gp += v.budget * rate / 100; parts.push(`programmatic ${rate.toFixed(1)}% of ${money(v.budget)}${v.fee > 0 ? '' : ' (margin only)'}`); }
        else if (v.fee > 0) { gp += v.fee; parts.push(`programmatic fee ${money(v.fee)} (no media)`);
          flags.push('programmatic fee with no media line'); }
        gp += v.flat;
      } else { gp += v.flat + v.fee + v.budget; parts.push(`${type} ${money(v.flat + v.fee + v.budget)}`); }
    });
    return { gp: Math.round(gp), parts, flags };
  }

  const CUTOFF = '2026-01-01';
  const touches2026 = d => !d.campaign_end || d.campaign_end >= CUTOFF;
  const open = (pd.data || []).filter(d => !d.is_won && (d.probability ?? 0) > 0 && touches2026(d));
  const promotedBy = {}; (promoted.data || []).forEach(x => promotedBy[x.hubspot_deal_id] = x);
  const wonRecent = (pd.data || []).filter(d => d.is_won && touches2026(d));
  const pipelines = [...new Set(open.map(d => d.pipeline).filter(Boolean))].sort();
  let pipeline = pipelines.includes('agency') ? 'agency' : (pipelines[0] || '__all__');
  let weighted = true, showAll = false;
  let rangeFrom = TODAY.slice(0, 7), rangeTo = shift(rangeFrom, 5);
  let coverageOpen = false;

  function build() {
    return open
      .filter(d => (pipeline === '__all__' || d.pipeline === pipeline)
        && Math.round((d.probability || 0) * 100) >= minProb)
      .map(d => {
        const { gp, flags } = dealGP(d.line_items);
        const f = [...flags];
        if (!d.line_items || !d.line_items.length) f.push('no line items');
        if (d.close_date && d.close_date < TODAY) f.push('close date passed');
        if (d.campaign_start && d.campaign_start < TODAY) f.push('start date passed');
        if (!d.campaign_start || !d.campaign_end) f.push('no campaign dates');
        if (d.campaign_start && d.campaign_end && d.campaign_end < d.campaign_start) f.push('campaign ends before it starts');
        const months = (d.campaign_start && d.campaign_end && d.campaign_end >= d.campaign_start)
          ? monthsBetween(d.campaign_start, d.campaign_end)
          : (d.close_date ? [mk(d.close_date)] : []);
        return { id: d.hubspot_deal_id, stage: d.stage, prob: d.probability || 0, tier: tierOf(d.probability || 0),
          gp, flags: f, months, forecastable: gp > 0 && months.length > 0 };
      });
  }

  el.innerHTML = `
    <div class="bar">
      <div class="toggroup">
        <div class="tog"><label for="sf-pl">Pipeline</label>
          <select id="sf-pl">${pipelines.map(p => `<option ${p === pipeline ? 'selected' : ''}>${esc(p)}</option>`).join('')}<option value="__all__">all</option></select></div>
        <div class="tog"><span id="sf-lbl-value">Value</span>
          <span role="group" aria-labelledby="sf-lbl-value" style="display:flex;gap:6px">
            <button class="seg on" data-w="1" aria-pressed="true">Weighted</button><button class="seg" data-w="0" aria-pressed="false">Total</button></span></div>
        <div class="tog"><span id="sf-lbl-show">Show</span>
          <span role="group" aria-labelledby="sf-lbl-show" style="display:flex;gap:6px">
            <button class="seg on" data-f="0" aria-pressed="true">Forecastable</button><button class="seg" data-f="1" aria-pressed="false">All deals</button></span></div>
        <span class="bardiv"></span>
        <div class="tog">
          <span class="rl" id="sf-lbl-range">Range</span>
          <input type="month" id="sf-r-from" aria-label="Range from">
          <span class="rd">to</span>
          <input type="month" id="sf-r-to" aria-label="Range to">
          <span class="rp" role="group" aria-labelledby="sf-lbl-range">
            <button class="seg" data-span="3" aria-pressed="false">3mo</button>
            <button class="seg on" data-span="6" aria-pressed="true">6mo</button>
            <button class="seg" data-span="12" aria-pressed="false">12mo</button>
            <button class="seg" data-span="18" aria-pressed="false">18mo</button></span></div>
      </div>
    </div>
    <div class="summary-strip" id="sf-kpis"></div>
    <div id="sf-chartwrap"></div>`;

  function renderChart(cols, shown, health) {
    const wrap = el.querySelector('#sf-chartwrap');
    const n = cols.length;
    const data = cols.map(c => {
      const byTier = [0, 0, 0, 0, 0];
      shown.forEach(r => {
        if (!r.months.includes(c) || !r.gp) return;
        byTier[r.tier] += r.gp * (weighted ? r.prob : 1) / r.months.length;
      });
      return { c, ledger: LEDGER[c] || 0, byTier, pipe: byTier.reduce((a, b) => a + b, 0) };
    });
    const totals = data.reduce((a, d) => ({ l: a.l + d.ledger, p: a.p + d.pipe }), { l: 0, p: 0 });
    const W = Math.max(960, Math.round(60 * n) + 90), H = 210, PL = 70, PR = 18, PT = 20, PB = 40, IW = W - PL - PR, IH = H - PT - PB;
    const dense = n > 10, verydense = n > 16;
    const max = Math.max(1, ...data.map(d => d.ledger + d.pipe));
    const stepC = max > 120000000 ? 40000000 : max > 60000000 ? 20000000 : max > 20000000 ? 10000000 : max > 6000000 ? 2000000 : 1000000;
    const top = Math.ceil(max / stepC) * stepC;
    const y = v => PT + IH - (v / top) * IH;
    const bw = Math.min(96, IW / n * 0.6), gap = IW / n;
    const plotBottom = PT + IH;
    const tiersPresent = [...new Set(shown.filter(r => r.gp && r.months.length).map(r => r.tier))].sort();
    const tierLabel = t => [...new Set(shown.filter(r => r.tier === t).map(r => r.stage))].join(' / ');
    const colParts = d => {
      const parts = [];
      if (d.ledger > 0) parts.push(`Committed GP ${money(d.ledger)}`);
      d.byTier.forEach((v, tIdx) => { if (v > 0) parts.push(`${tierLabel(tIdx)} ${money(Math.round(v))}`); });
      return parts;
    };
    let g = '';
    for (let v = 0; v <= top; v += stepC)
      g += `<line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="var(--line)"/>` +
        `<text x="${PL - 12}" y="${y(v) + 3.5}" text-anchor="end" class="ax">$${Math.round(v / 100000) / 10}k</text>`;
    data.forEach((d, i) => {
      const cx = PL + gap * i + gap / 2, x = cx - bw / 2; let acc = 0;
      let colG = '';
      if (d.ledger > 0) { const h = (d.ledger / top) * IH; acc += d.ledger;
        colG += `<rect x="${x}" y="${y(acc)}" width="${bw}" height="${h}" fill="${LEDGER_COLOR}" stroke="var(--line)" stroke-width="1"><title>${label(d.c)} committed ${money(d.ledger)}</title></rect>`; }
      d.byTier.forEach((v, tIdx) => {
        if (v <= 0) return;
        const h = (v / top) * IH; const yTop = y(acc + v); acc += v;
        colG += `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${TIER_COLORS[tIdx]}" stroke="var(--line)" stroke-width="1"><title>${label(d.c)} ${money(v)}</title></rect>`;
      });
      if (acc > 0 && !dense) colG += `<text x="${cx}" y="${y(acc) - 6}" text-anchor="middle" class="bt">${money(acc)}</text>`;
      if (!verydense || i % 2 === 0) colG += `<text x="${cx}" y="${plotBottom + 14}" text-anchor="middle" class="ax">${label(d.c)}</text>`;
      if (d.pipe > 0 && !dense) colG += `<text x="${cx}" y="${plotBottom + 28}" text-anchor="middle" class="pl">+${money(d.pipe)} pipeline</text>`;
      const parts = colParts(d);
      const colSummary = `${label(d.c)}: ${parts.length ? parts.join(', ') : 'nothing forecastable'}`;
      g += `<g tabindex="0" role="img" aria-label="${esc(colSummary)}" class="colgroup" data-idx="${i}">${colG}</g>`;
    });
    const chartSummary = `Committed GP plus pipeline by month, ${weighted ? 'weighted by stage' : 'total value'}, ` +
      `${n} months from ${label(cols[0])} to ${label(cols[n - 1])}: committed ${money(totals.l)}, ` +
      `pipeline ${money(Math.round(totals.p))}, total ${money(Math.round(totals.l + totals.p))}.`;
    const svgStyle = dense ? ` style="width:${W}px;max-width:none"` : '';
    const { covCls, pct, totalRows, coverageOpen: covOpen, nF, noLI, stale, wonRecent: wr, wonPromoted, wonReview, wonWaiting } = health;
    const healthColor = covCls === 'good' ? 'var(--brand-2)' : covCls === 'warn' ? 'var(--amber)' : 'var(--rust)';
    const showHealth = totalRows > 0 || wr.length > 0;
    const detailHtml = covOpen ? `<div class="chart-detail" id="sf-health-detail">` +
      (totalRows ? `<div>${nF} of ${totalRows} deals forecastable (${pct}%) — ${noLI} without line items,
        ${stale} past their close date. GP needs line items and campaign dates in HubSpot;
        fixing them there brings deals in on the next sync.</div>` : '') +
      (wr.length ? `<div>Closed won: ${wonPromoted.length} passed to the
        <a href="./forecast.html">Forecast</a> automatically${wonReview.length ? ` — ${wonReview.length} still awaiting review there` : ''}${wonWaiting ? `; ${wonWaiting} will pass on the next sync` : ''}.</div>` : '') +
      `</div>` : '';
    wrap.style.position = 'relative';
    wrap.innerHTML =
      `<div class="chead"><h3>Committed revenue plus pipeline — ${weighted ? 'weighted by stage' : 'total value at 100%'}</h3>
       <div class="csum">${n} months · committed ${money(totals.l)} · pipeline ${money(Math.round(totals.p))} · total ${money(Math.round(totals.l + totals.p))}</div></div>
       <div class="csvg${dense ? ' scroll' : ''}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="sfchart" role="img" aria-label="${esc(chartSummary)}"${svgStyle}><title>${esc(chartSummary)}</title>${g}</svg></div>
       <div class="chart-tip"></div>
       <div class="chart-legend">
         <span class="lg-item"><i class="lg-dot" style="background:${LEDGER_COLOR}"></i>Committed GP (shaped deals)</span>` +
      tiersPresent.map(t => `<span class="lg-item"><i class="lg-dot" style="background:${TIER_COLORS[t]}"></i>${esc(tierLabel(t))}</span>`).join('') +
      `<span style="flex:1"></span>` +
      (showHealth ? `<button class="lg-item toggle" id="sf-covtoggle" aria-expanded="${covOpen}" aria-controls="sf-health-detail">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:13px;height:13px;flex:none;color:${healthColor}">
             <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
           </svg>
           pipeline health${totalRows ? ` — ${pct}% forecastable` : ''}${covOpen ? ' ▾' : ' ▸'}</button>` : '') +
      `<span class="cfg">min probability ${minProb}% · programmatic margin ${PROG_MARGIN}%</span>
         <a class="iconbtn" href="./settings.html" title="Settings" aria-label="Settings">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
             <circle cx="12" cy="12" r="3"/>
             <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
           </svg>
         </a>` +
      `</div>${detailHtml}`;

    const svgEl = wrap.querySelector('svg.sfchart');
    const tip = wrap.querySelector('.chart-tip');
    const tipHtmlFor = idx => {
      const d = data[idx];
      const rows = [];
      if (d.ledger > 0) rows.push(`<div class="tip-row"><span class="tip-dot" style="background:${LEDGER_COLOR}"></span>Committed GP <b>${money(d.ledger)}</b></div>`);
      d.byTier.forEach((v, tIdx) => { if (v > 0) rows.push(
        `<div class="tip-row"><span class="tip-dot" style="background:${TIER_COLORS[tIdx]}"></span>${esc(tierLabel(tIdx))} <b>${money(Math.round(v))}</b></div>`); });
      return `<div class="tip-label">${label(d.c)}</div>` + (rows.length ? rows.join('') : '<div class="tip-row">nothing forecastable</div>');
    };
    const positionNear = (clientX, clientY) => {
      const wrapBox = wrap.getBoundingClientRect();
      tip.style.top = (clientY - wrapBox.top - 10) + 'px';
      const left = Math.min(wrapBox.width - tip.offsetWidth, Math.max(0, clientX - wrapBox.left + 12));
      tip.style.left = left + 'px';
    };
    const showAt = (clientX, clientY) => {
      const svgBox = svgEl.getBoundingClientRect();
      const scale = W / svgBox.width;
      const vx = (clientX - svgBox.left) * scale;
      let idx = Math.floor((vx - PL) / gap);
      idx = Math.max(0, Math.min(n - 1, idx));
      tip.innerHTML = tipHtmlFor(idx);
      tip.style.opacity = '1';
      positionNear(clientX, clientY);
    };
    const hideTip = () => { tip.style.opacity = '0'; };
    svgEl.onmousemove = e => showAt(e.clientX, e.clientY);
    svgEl.onmouseleave = hideTip;
    svgEl.ontouchstart = svgEl.ontouchmove = e => { if (e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
    svgEl.ontouchend = hideTip;
    wrap.querySelectorAll('.colgroup').forEach(colEl => {
      const idx = +colEl.dataset.idx;
      colEl.onfocus = () => {
        tip.innerHTML = tipHtmlFor(idx);
        tip.style.opacity = '1';
        const r = colEl.getBoundingClientRect();
        positionNear(r.left + r.width / 2, r.top);
      };
      colEl.onblur = hideTip;
    });
    const covBtn = wrap.querySelector('#sf-covtoggle');
    if (covBtn) covBtn.onclick = () => { coverageOpen = !coverageOpen; render(); };
    return totals;
  }

  function render() {
    const rows = build();
    const shown = rows.filter(r => showAll || r.forecastable);
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    const cols = monthsRange(rangeFrom, rangeTo);
    el.querySelector('#sf-r-from').value = rangeFrom;
    el.querySelector('#sf-r-to').value = rangeTo;
    el.querySelectorAll('[data-span]').forEach(b => {
      const on = +b.dataset.span === cols.length;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
    });

    const nF = rows.filter(r => r.forecastable).length;
    const noLI = rows.filter(r => r.flags.includes('no line items')).length;
    const stale = rows.filter(r => r.flags.includes('close date passed')).length;
    const pct = rows.length ? Math.round(nF / rows.length * 100) : 0;
    const wonPromoted = wonRecent.filter(d => promotedBy[d.hubspot_deal_id]);
    const wonReview = wonPromoted.filter(d => !promotedBy[d.hubspot_deal_id].reviewed_at);
    const wonWaiting = wonRecent.length - wonPromoted.length;
    const covCls = rows.length ? (pct >= 70 ? 'good' : pct >= 40 ? 'warn' : 'bad') : 'good';

    const chartTotals = renderChart(cols, shown,
      { covCls, pct, totalRows: rows.length, coverageOpen, nF, noLI, stale, wonRecent, wonPromoted, wonReview, wonWaiting });

    el.querySelector('#sf-kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">Committed GP</div>
        <div class="summary-value pos">${money(chartTotals.l)}</div>
        <div class="summary-note">shaped deals, this range</div></div>
      <div class="summary-cell"><div class="summary-label">${weighted ? 'Weighted' : 'Total'} pipeline</div>
        <div class="summary-value">${money(Math.round(chartTotals.p))}</div>
        <div class="summary-note">${label(cols[0])}–${label(cols[cols.length - 1])}</div></div>
      <div class="summary-cell"><div class="summary-label">Forecastable</div>
        <div class="summary-value">${pct}%</div>
        <div class="summary-note">${nF} of ${rows.length} deals</div></div>
      <div class="summary-cell"><div class="summary-label">Closed won</div>
        <div class="summary-value">${wonPromoted.length}</div>
        <div class="summary-note">${wonReview.length ? wonReview.length + ' awaiting review' : wonWaiting ? wonWaiting + ' pending next sync' : 'all reviewed'}</div></div>`;
  }

  el.querySelector('#sf-pl').onchange = e => { pipeline = e.target.value; render(); };
  el.querySelector('#sf-r-from').onchange = e => { rangeFrom = e.target.value; render(); };
  el.querySelector('#sf-r-to').onchange = e => { rangeTo = e.target.value; render(); };
  el.querySelectorAll('[data-span]').forEach(b => b.onclick = () => {
    rangeTo = shift(rangeFrom, +b.dataset.span - 1); render();
  });
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    weighted = b.dataset.w === '1';
    el.querySelectorAll('[data-w]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); }); render();
  });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    showAll = b.dataset.f === '1';
    el.querySelectorAll('[data-f]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); }); render();
  });
  render();
}
</script></body></html>
