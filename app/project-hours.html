<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Project Hours</title><link rel="stylesheet" href="./assets/style.css?v=d47ddd2">
<style>
/* Same whole-row-clickable focus ring forecast.html and team-hours.html give
   their role="button" rows. */
tr.namerow:focus-visible { outline:none; box-shadow:inset 0 0 0 2px var(--brand-2), inset 0 0 0 4px var(--mint); }
/* Range/ribbon stay crisp while a range change is in flight; only the data
   underneath dims (same as Team Hours). */
#panel.is-loading .sc-panel, #panel.is-loading .summary-strip { opacity:.55; pointer-events:none; transition:opacity .12s ease; }

/* The project table fits its container instead of scrolling it (DESIGN.md's
   Laptop Discipline Rule: names truncate, never wrap or force a horizontal
   scroll). table-layout:fixed with a width class on every header makes the
   header row the column grid; every cell is one line and ellipsizes. As the
   container narrows, whole columns leave in priority order rather than every
   figure getting clipped: the two derived per-hour rates first, then planned
   hours (its bar caption already says it), then the client. The wrapper is a
   size container so this follows the REAL width — the sidebar collapsing to
   52px widens the table without a viewport change. */
.fit { container-type:inline-size; overflow:hidden; }
table.ledger.ph { table-layout:fixed; }
table.ledger.ph td, table.ledger.ph td.textleft { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.ledger.ph .tname { display:flex; align-items:center; gap:8px; min-width:0; }
table.ledger.ph .tname > span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
table.ledger.ph .tname .pill { flex:none; }
.w-name { width:19%; } .w-client { width:11.5%; } .w-dates { width:12.5%; } .w-bar { width:13.5%; }
.w-planned { width:5.5%; } .w-actual { width:5.5%; } .w-labor { width:6.5%; } .w-revenue { width:7%; }
.w-rate { width:6%; } .w-profit { width:7%; } .w-pph { width:6%; }
@container (max-width: 1120px) { table.ledger.ph .c-rate, table.ledger.ph .c-pph, table.ledger.ph .c-planned { display:none; } }
@container (max-width: 900px)  { table.ledger.ph .c-client { display:none; } }
</style>
</head><body>
<script type="module">
import { boot, esc, wireSearch, fetchAll } from './assets/shell.js?v=d47ddd2';

// Per-project scoping and tracking — how much work is actually going into a
// specific deal, and who is doing it. For client-level health, see Client
// Profitability instead; the two answer different questions and are kept as
// separate pages rather than one view drilling into the other.
//
// The table is Client Profitability's table one level down: one row per deal
// (project) active in the range, the same blended money (measured months from
// forecast_page's rev_proj/cogs_proj, months still ahead from plan_deal, the
// "measured only" toggle dropping the planned half), and labor cost from
// hours_page — actual hours x each person's own resolved cost rate. Profit
// after labor is GP minus labor, as on Client Profitability, NOT revenue
// minus labor: a programmatic deal's revenue carries its media, and revenue
// minus labor would call the media profit.
//
// A project row opens into three panels (DESIGN.md's .expand-row shape — the
// detail is different content, not the same record on the same columns):
//   people   — everyone with hours on this deal in the range, assigned vs
//              logged. Both sides come from hours_page (staff_hours_deal /
//              staff_deal_planned), so Team Hours and this page can never
//              disagree about a person's hours. assignments has no entry
//              mechanism yet, so "assigned" reads "not assigned yet" until it
//              does — the shape of the comparison stays on the page.
//   hours    — hours logged per ISO week, stacked by department, over the
//              deal's WHOLE flight (the page's range is shaded), from
//              project_detail() (db/088).
//   revenue  — this project's revenue and gross profit, actual vs plan, per
//              month, over the flight. Actuals are forecast_page's own
//              rev_proj/cogs_proj arithmetic per month (088 asserts they
//              agree to the cent) and stop at the last fully-closed month;
//              plan is v_deal_month_forecast's billable/gp, which
//              freeze-on-close already holds at the as-opened value for
//              past months.
// The two charts are fetched lazily, one round trip per opened project, and
// cached for the visit — 26 weeks x N departments for every project would be
// most of the page's payload for rows nobody opens.
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();
// two-digit year: the start → end cell is one line in a fixed-width column
const fmtDate = s => s ? new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' }) : '—';
const fmtDayMon = s => new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' });
const fmtMonYY = s => new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' });
// condensed money for a y-axis with no room to spell the number out
const fmtK = c => { const d = c / 100, a = Math.abs(d), sign = d < 0 ? '-' : '';
  if (a >= 1e6) return `${sign}$${(a / 1e6).toFixed(1)}MM`;
  if (a >= 1e3) return `${sign}$${Math.round(a / 1e3)}k`;
  return `${sign}$${Math.round(a)}`; };

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };
const quarterStart = (m, n = 0) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  const qFirst = Math.floor((mm - 1) / 3) * 3;
  return iso(new Date(Date.UTC(y, qFirst + n * 3, 1))); };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
// Monday on or before s — the same bucket date_trunc('week') gives 088's weeks
const mondayOf = s => { const d = new Date(s + 'T00:00:00Z'); const dow = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dow); return iso(d); };

// Stacks segments left-to-right, capped so the running total never exceeds
// 100% of the track — real overage is reported as text (the exact hours),
// never as an impossible >100% bar. Same helper as Team Hours / Client
// Profitability.
function stackSegments(cap, parts) {
  if (cap <= 0) return { html: '', overBy: 0 };
  let used = 0, html = '';
  parts.forEach(([cls, hours]) => {
    const w = Math.min(Math.max(hours / cap * 100, 0), Math.max(100 - used, 0));
    if (w > 0.05) { used += w; html += `<div class="seg ${cls}" style="width:${w}%"></div>`; }
  });
  const total = parts.reduce((s, [, h]) => s + h, 0);
  return { html, overBy: total > cap ? total - cap : 0 };
}

// The hours-vs-planned cell: a project row and a person row draw the same
// bar. Planned = 0 is an explicit "not assigned yet" state, not a 0% bar; a
// project with revenue but no hours at all is its own flag — its labor was
// never logged against it. A person row already has its own logged column,
// so it passes showLogged=false and the caption is just the state. cls is
// the column's own class (the project table's c-bar), on the <td> itself.
function hoursCell(planned, logged, hasRevenue, showLogged = true, cls = '') {
  const td = `<td class="textleft${cls ? ' ' + cls : ''}">`;
  if (planned > 0) {
    const bar = stackSegments(planned, [[logged > planned ? 'seg-over' : 'seg-good', logged]]);
    const caption = `${fmtHours(logged)}h / ${fmtHours(planned)}h assigned`
      + (bar.overBy > 0.05 ? ` · <span class="delta-note neg" style="display:inline">+${fmtHours(bar.overBy)}h over</span>` : '');
    return `${td}<div class="barcell"><div class="mini-track wide">${bar.html}</div>
      <div class="delta-note flat">${caption}</div></div></td>`;
  }
  if (logged <= 0 && hasRevenue)
    return `${td}<div class="barcell"><div class="mini-track wide"></div>
      <div class="delta-note neg">revenue, no hours logged</div></div></td>`;
  return `${td}<div class="barcell"><div class="mini-track wide"></div>
    <div class="delta-note flat">${showLogged && logged > 0 ? fmtHours(logged) + 'h logged · ' : ''}not assigned yet</div></div></td>`;
}

// Department series colours: the chart categorical ramp (--cat-1..6 in
// style.css — six steps of the brand green from the extended kit, in the one
// dark/light alternation that keeps adjacent stacked segments apart; slot 1
// is Muted Ledger Green). Assigned by department NAME
// company-wide, never by a project's own ranking, so the same department is
// the same colour on every project: departments are ordered by headcount on
// hours_page's staff list (ties alphabetical), which puts the brand green on
// the largest team and only changes when the roster does. DEPT_SLOTS pins a
// department to a slot explicitly and wins over that order — fill it in once
// the department names are settled. An eighth department folds into grey
// "Other" rather than inventing a hue: the kit has no seventh legible step.
const DEPT_COLORS = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)', 'var(--cat-4)', 'var(--cat-5)', 'var(--cat-6)'];
const DEPT_SLOTS = {};            // e.g. { 'Paid Media': 0, 'Creative': 2 } — slot index into DEPT_COLORS
const OTHER_COLOR = 'var(--cat-other)';
const OTHER = 'Other';
// company-wide department order: pinned slots first, then by headcount desc,
// then name — the key every project's chart colours by
function departmentOrder(staff) {
  const count = {};
  staff.forEach(s => { if (s.department) count[s.department] = (count[s.department] || 0) + 1; });
  const free = Object.keys(count).filter(d => DEPT_SLOTS[d] === undefined)
    .sort((a, b) => count[b] - count[a] || a.localeCompare(b));
  const order = [];
  Object.entries(DEPT_SLOTS).forEach(([d, i]) => { if (count[d] !== undefined) order[i] = d; });
  free.forEach(d => { let i = 0; while (order[i] !== undefined) i++; order[i] = d; });
  return order.filter(Boolean);
}

// ---- (4) hours logged per ISO week, stacked by department ------------------
// Shares shell.js barChart's frame, grid and grey legend footer; drawn here
// rather than in shell.js because it needs three things no other bar chart
// has — a shaded band for the page's range, a "today" rule, and a per-week
// hover tooltip listing every department.
function hoursByWeekChart(el, detail, rangeFrom, rangeTo, deptOrder) {
  const W = 940, H = 190, P = { l: 48, r: 10, t: 14, b: 24 };
  const today = iso(new Date());
  const rows = detail.weeks || [];
  const deal = detail.deal || {};
  const dataWeeks = rows.map(r => r.week);
  const starts = [deal.flight_start ? mondayOf(deal.flight_start) : null, ...dataWeeks].filter(Boolean).sort();
  const ends = [deal.flight_end ? mondayOf(deal.flight_end) : null, ...dataWeeks].filter(Boolean).sort();
  if (!starts.length) {
    el.innerHTML = `<div class="empty-note" style="padding:28px 14px">No hours logged on this project yet.</div>`; return;
  }
  const weeks = []; for (let w = starts[0]; w <= ends[ends.length - 1]; w = addDays(w, 7)) weeks.push(w);
  const idx = {}; weeks.forEach((w, i) => idx[w] = i);
  // department -> color, by the company-wide order; the tail folds into Other
  const colorOf = d => { const i = deptOrder.indexOf(d); return i >= 0 && i < DEPT_COLORS.length ? DEPT_COLORS[i] : OTHER_COLOR; };
  const nameOf = d => { const i = deptOrder.indexOf(d); return i >= 0 && i < DEPT_COLORS.length ? d : OTHER; };
  const seriesByName = {};
  rows.forEach(r => {
    const name = nameOf(r.department);
    const s = seriesByName[name] = seriesByName[name] || { name, color: colorOf(r.department), values: weeks.map(() => 0), total: 0 };
    if (idx[r.week] !== undefined) { s.values[idx[r.week]] += +r.hours; s.total += +r.hours; }
  });
  // stack order = the fixed palette order, Other last — so the colors read
  // the same way top-to-bottom on every project
  const series = Object.values(seriesByName).sort((a, b) =>
    (a.name === OTHER ? 99 : deptOrder.indexOf(a.name)) - (b.name === OTHER ? 99 : deptOrder.indexOf(b.name)));
  const totals = weeks.map((_, i) => series.reduce((s, sr) => s + sr.values[i], 0));
  const max = Math.max(Math.ceil(Math.max(...totals, 1) / 10) * 10, 10);
  const step = max / 10 > 8 ? Math.ceil(max / 50) * 10 : 10;
  const bw = (W - P.l - P.r) / weeks.length;
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let grid = '';
  for (let v = 0; v <= max; v += step) grid += `<line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--line)"/>
    <text x="${P.l - 6}" y="${y(v) + 4}" fill="var(--slate)" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${v}h</text>`;
  // the page's own range, shaded — everything else on the chart is the flight
  const rFrom = mondayOf(rangeFrom), rTo = mondayOf(endOfMonth(rangeTo));
  const bi = weeks.findIndex(w => w >= rFrom), bj = weeks.findIndex(w => w > rTo);
  const b0 = bi < 0 ? weeks.length : bi, b1 = bj < 0 ? weeks.length : bj;
  const band = b1 > b0 ? `<rect x="${P.l + b0 * bw}" y="${P.t}" width="${(b1 - b0) * bw}" height="${H - P.t - P.b}" fill="var(--mint)" opacity=".7"/>` : '';
  const tw = mondayOf(today), ti = weeks.indexOf(tw);
  const todayLine = ti >= 0 ? `<line x1="${P.l + ti * bw}" y1="${P.t}" x2="${P.l + ti * bw}" y2="${H - P.b}" stroke="var(--slate)" stroke-dasharray="3 3"/>
    <text x="${P.l + ti * bw + 4}" y="${P.t + 10}" fill="var(--slate)" font-size="9" font-family="IBM Plex Mono">today</text>` : '';
  const bars = weeks.map((_, i) => { let acc = 0; return series.map(sr => {
    const v = sr.values[i]; if (!v) return '';
    const y1 = y(acc + v), h = Math.max(y(acc) - y1 - 1, 0); acc += v;   // 1px gap between stacked fills
    return `<rect x="${P.l + i * bw + bw * .15}" y="${y1}" width="${bw * .7}" height="${h}" fill="${sr.color}"/>`; }).join(''); }).join('');
  const every = Math.max(1, Math.ceil(weeks.length / 9));
  const xl = weeks.map((w, i) => i % every ? '' :
    `<text x="${P.l + i * bw + bw / 2}" y="${H - 8}" fill="var(--slate)" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">${fmtDayMon(w)}</text>`).join('');
  const cols = weeks.map((w, i) => `<rect class="hit" data-i="${i}" x="${P.l + i * bw}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="transparent" tabindex="0" role="img" aria-label="${esc(`week of ${fmtDayMon(w)}: ${fmtHours(totals[i])}h`)}"/>`).join('');
  const legend = series.map(sr => `<span class="lg-item"><i class="lg-dot" style="background:${sr.color}"></i>${esc(sr.name)}</span>`).join('')
    + `<span class="lg-item"><i class="lg-dot" style="background:var(--mint);border:1px solid var(--line)"></i>selected range</span>`;
  el.style.position = 'relative';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours logged per week by department">${band}${grid}${bars}${todayLine}<g class="hover"></g>${xl}${cols}</svg>
    <div class="chart-tip"></div><div class="chart-legend">${legend}</div>`;
  wireChartTip(el,
    i => `<div class="tip-label">wk of ${esc(fmtDayMon(weeks[i]))} · ${fmtHours(totals[i])}h</div>` +
      series.filter(sr => sr.values[i]).map(sr => `<div class="tip-row"><span class="tip-dot" style="background:${sr.color}"></span>${esc(sr.name)} <b>${fmtHours(sr.values[i])}h</b></div>`).join(''),
    i => { const x = P.l + i * bw + bw / 2; return `<line x1="${x}" y1="${P.t}" x2="${x}" y2="${H - P.b}" stroke="var(--slate)" stroke-dasharray="2 3"/>`; });
}

// ---- (5) revenue & gross profit, actual vs plan, by month ------------------
// Two hues carry the measure (revenue = --brand, GP = --brand-4); line style
// carries plan vs actual (plan dashed and lighter — DESIGN.md's measured-vs-
// forecast rule). The actual line ends at the last fully-closed month; the
// plan runs the whole flight. Its own y-axis snap: shell.js bandChart snaps
// to Forecast's $250k gridlines, which would flatten a $30k/month project to
// the floor.
function revGpChart(el, detail) {
  const W = 940, H = 190, P = { l: 48, r: 10, t: 14, b: 24 };
  const months = (detail.months || []).map(m => ({ ...m,
    rev_actual: m.rev_actual === null ? null : +m.rev_actual, gp_actual: m.gp_actual === null ? null : +m.gp_actual,
    rev_plan: +(m.rev_plan || 0), gp_plan: +(m.gp_plan || 0) }));
  const deal = detail.deal || {};
  if (!months.length) {
    el.innerHTML = `<div class="empty-note" style="padding:28px 14px">${deal.qbo_project_id ? 'No plan or invoices on this project yet.' : 'No QB project claimed and no plan — nothing to measure.'}</div>`; return;
  }
  const n = months.length;
  const SERIES = [
    { key: 'rev_plan',   name: 'revenue plan', color: 'var(--brand)',   plan: true },
    { key: 'rev_actual', name: 'revenue',      color: 'var(--brand)',   plan: false },
    { key: 'gp_plan',    name: 'GP plan',      color: 'var(--brand-4)', plan: true },
    { key: 'gp_actual',  name: 'gross profit', color: 'var(--brand-4)', plan: false },
  ];
  const all = SERIES.flatMap(s => months.map(m => m[s.key])).filter(v => v !== null && v !== undefined);
  const rawMax = Math.max(0, ...all), rawMin = Math.min(0, ...all);
  // gridline step: the smallest of these that keeps the axis under ~7 lines
  const STEPS = [100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000, 25000000, 50000000, 100000000];
  const step = STEPS.find(s => (rawMax - rawMin) / s <= 7) || STEPS[STEPS.length - 1];
  const max = Math.max(Math.ceil(rawMax / step) * step, step), min = Math.floor(rawMin / step) * step;
  const x = i => P.l + (W - P.l - P.r) * (n === 1 ? .5 : i / (n - 1));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  let grid = '';
  for (let v = min; v <= max; v += step) grid += `<line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--line)"/>
    <text x="${P.l - 6}" y="${y(v) + 4}" fill="var(--slate)" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${fmtK(v)}</text>`;
  const zero = (min < 0 && max > 0) ? `<line x1="${P.l}" y1="${y(0)}" x2="${W - P.r}" y2="${y(0)}" stroke="var(--rust)" stroke-dasharray="4 3"/>` : '';
  // a polyline over the non-null points of a series, in month order
  const path = key => { let d = '', pen = false;
    months.forEach((m, i) => { const v = m[key]; if (v === null || v === undefined) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${x(i)},${y(v)} `; pen = true; }); return d; };
  const lines = SERIES.map(s => s.plan
    ? `<path fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="5 4" opacity=".6" d="${path(s.key)}"/>`
    : `<path fill="none" stroke="${s.color}" stroke-width="2" d="${path(s.key)}"/>` +
      months.map((m, i) => m[s.key] === null ? '' : `<circle cx="${x(i)}" cy="${y(m[s.key])}" r="3.5" fill="${s.color}" stroke="var(--paper-raised)" stroke-width="2"/>`).join('')
  ).join('');
  // "today": between the last measured month and the first unmeasured one
  const lastMeasured = months.reduce((k, m, i) => m.rev_actual !== null ? i : k, -1);
  let todayLine = '';
  if (lastMeasured >= 0 && lastMeasured < n - 1) {
    const tx = x(lastMeasured) + (x(lastMeasured + 1) - x(lastMeasured)) * (new Date().getUTCDate() / 31);
    todayLine = `<line x1="${tx}" y1="${P.t}" x2="${tx}" y2="${H - P.b}" stroke="var(--slate)" stroke-dasharray="3 3"/>
      <text x="${tx + 4}" y="${P.t + 10}" fill="var(--slate)" font-size="9" font-family="IBM Plex Mono">today</text>`;
  }
  const every = Math.max(1, Math.ceil(n / 12));
  const xl = months.map((m, i) => i % every ? '' : `<text x="${x(i)}" y="${H - 8}" fill="var(--slate)" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">${fmtMonYY(m.month)}</text>`).join('');
  const stepX = n > 1 ? (W - P.l - P.r) / (n - 1) : (W - P.l - P.r);
  const cols = months.map((m, i) => { const l = Math.max(P.l, x(i) - stepX / 2), r = Math.min(W - P.r, x(i) + stepX / 2);
    return `<rect class="hit" data-i="${i}" x="${l}" y="${P.t}" width="${r - l}" height="${H - P.t - P.b}" fill="transparent" tabindex="0" role="img" aria-label="${esc(`${fmtMonYY(m.month)}: revenue ${m.rev_actual === null ? 'forecast' : fmt$0(m.rev_actual)} vs ${fmt$0(m.rev_plan)} plan`)}"/>`; }).join('');
  const legend = SERIES.map(s => s.plan
    ? `<span class="lg-item" style="color:var(--slate)"><i class="lg-dash" style="color:${s.color}"></i>${esc(s.name)}</span>`
    : `<span class="lg-item"><i class="lg-dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  el.style.position = 'relative';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and gross profit, actual vs plan, by month">${grid}${zero}${lines}${todayLine}<g class="hover"></g>${xl}${cols}</svg>
    <div class="chart-tip"></div><div class="chart-legend">${legend}</div>`;
  const delta = (a, p) => (a === null || !p) ? '' :
    `<span style="color:${a - p < 0 ? 'var(--rust)' : 'var(--brand-2)'};margin-left:6px">${a - p < 0 ? '−' : '+'}${Math.abs((a - p) / p * 100).toFixed(1)}%</span>`;
  wireChartTip(el,
    i => { const m = months[i];
      return `<div class="tip-label">${esc(fmtMonYY(m.month))}${m.rev_actual === null ? ' · forecast' : ''}</div>` +
        `<div class="tip-row"><span class="tip-dot" style="background:var(--brand)"></span>revenue <b>${m.rev_actual === null ? '—' : fmt$0(m.rev_actual)}</b> / ${fmt$0(m.rev_plan)} plan${delta(m.rev_actual, m.rev_plan)}</div>` +
        `<div class="tip-row"><span class="tip-dot" style="background:var(--brand-4)"></span>GP <b>${m.gp_actual === null ? '—' : fmt$0(m.gp_actual)}</b> / ${fmt$0(m.gp_plan)} plan${delta(m.gp_actual, m.gp_plan)}</div>`; },
    i => `<line x1="${x(i)}" y1="${P.t}" x2="${x(i)}" y2="${H - P.b}" stroke="var(--slate)" stroke-dasharray="2 3"/>`);
}

// Nearest-period crosshair + tooltip, mouse and keyboard (each .hit rect is
// its own focus stop) — the same pattern shell.js bandChart uses.
function wireChartTip(el, html, cross) {
  const tip = el.querySelector('.chart-tip'), hover = el.querySelector('.hover');
  const show = (i, cx, cy) => { hover.innerHTML = cross(i); tip.innerHTML = html(i); tip.style.opacity = '1';
    const box = el.getBoundingClientRect(); tip.style.top = (cy - box.top - 10) + 'px';
    tip.style.left = Math.min(box.width - tip.offsetWidth, Math.max(0, cx - box.left + 12)) + 'px'; };
  const hide = () => { tip.style.opacity = '0'; hover.innerHTML = ''; };
  el.querySelectorAll('.hit').forEach(r => {
    r.onmousemove = e => show(+r.dataset.i, e.clientX, e.clientY);
    r.onfocus = () => { const b = r.getBoundingClientRect(); show(+r.dataset.i, b.left + b.width / 2, b.top); };
    r.onblur = hide; });
  el.querySelector('svg').onmouseleave = hide;
}

// The one-line stat beside each chart's eyebrow: the number the chart is
// about, so a reader gets it without hovering.
function hoursStat(detail, rangeFrom, rangeTo) {
  const rFrom = mondayOf(rangeFrom), rTo = mondayOf(endOfMonth(rangeTo));
  const byWeek = {};
  (detail.weeks || []).forEach(r => byWeek[r.week] = (byWeek[r.week] || 0) + +r.hours);
  const inRange = Object.entries(byWeek).filter(([w]) => w >= rFrom && w <= rTo);
  if (!inRange.length) return '';
  const total = inRange.reduce((s, [, h]) => s + h, 0);
  const peak = inRange.slice().sort((a, b) => b[1] - a[1])[0];
  return `<span>avg <b>${fmtHours(total / inRange.length)}h</b> / wk in range</span><span>peak <b>${fmtHours(peak[1])}h</b> wk of ${esc(fmtDayMon(peak[0]))}</span>`;
}
function revStat(detail) {
  const measured = (detail.months || []).filter(m => m.rev_actual !== null && m.rev_actual !== undefined);
  if (!measured.length) return '';
  const sum = k => measured.reduce((s, m) => s + +(m[k] || 0), 0);
  const pct = (a, p) => p ? `<span class="delta-note ${a - p < 0 ? 'neg' : 'pos'}" style="display:inline">${a - p < 0 ? '−' : '+'}${Math.abs((a - p) / p * 100).toFixed(1)}%</span>` : '';
  const ra = sum('rev_actual'), rp = sum('rev_plan'), ga = sum('gp_actual'), gp = sum('gp_plan');
  return `<span>rev to date <b>${fmt$0(ra)}</b> vs <b>${fmt$0(rp)}</b> ${pct(ra, rp)}</span><span>GP to date <b>${fmt$0(ga)}</b> vs <b>${fmt$0(gp)}</b> ${pct(ga, gp)}</span>`;
}

// One comparable value per sortable column.
const SORT_ACCESSORS = {
  name: r => r.name.toLowerCase(),
  client: r => r.client.toLowerCase(),
  start: r => r.flightStart || '',
  plannedHours: r => r.plannedHours,
  actualHours: r => r.actualHours,
  laborCost: r => r.laborCost,
  revenue: r => r.b.revenue,
  effectiveRate: r => r.b.effectiveRate ?? -Infinity,
  profitAfterLabor: r => r.b.profitAfterLabor,
  profitPerHour: r => r.b.profitPerHour ?? -Infinity,
};

boot('projhours', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  const PRESETS = {
    'Last Month': [shiftM(thisMonth, -1), shiftM(thisMonth, -1)],
    'This Month': [thisMonth, thisMonth],
    'Last Quarter': [quarterStart(thisMonth, -1), shiftM(quarterStart(thisMonth, -1), 2)],
    'This Quarter': [quarterStart(thisMonth, 0), shiftM(quarterStart(thisMonth, 0), 2)],
  };
  let rangeFrom = shiftM(thisMonth, -2), rangeTo = thisMonth;
  let query = '', deptFilter = '', historicalOnly = false;
  let tableSort = { key: 'actualHours', dir: -1 };
  let allRows = [];          // one per deal active in range — load() fills, render() filters/sorts
  let deptOrder = [];        // company-wide department list, the chart color key
  const openDeals = new Set();
  // project_detail() results, per deal, for the visit; an in-flight fetch is
  // stored as its promise so a second click can't start a second round trip
  const detailCache = new Map();
  let loadSeq = 0;
  let deals = [], clients = [], staticLoaded = false;

  el.innerHTML = `<div id="panel">loading…</div>`;

  async function load() {
    const seq = ++loadSeq;
    const panel = el.querySelector('#panel');
    if (panel) panel.classList.add('is-loading');
    const calls = [
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
    ];
    if (!staticLoaded) calls.push(
      fetchAll(() => supa.from('deals').select('id,name,client_id,qbo_project_id,flight_start,flight_end')),
      supa.from('clients').select('id,name'));
    const results = await Promise.all(calls);
    if (seq !== loadSeq) return;
    const [hp, fp, dl, cl] = results;
    for (const r of results) if (r.error) {
      el.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    if (!staticLoaded) { deals = dl.data || []; clients = cl.data || []; staticLoaded = true; }
    const H = hp.data || {}, P = fp.data || {};
    const dealsById = {}; deals.forEach(d => dealsById[d.id] = d);
    const clientsById = {}; clients.forEach(c => clientsById[c.id] = c);
    const staffById = {}; (H.staff || []).forEach(s => staffById[s.id] = s);
    deptOrder = departmentOrder(H.staff || []);
    const revProjByProj = {}; (P.rev_proj || []).forEach(r => revProjByProj[r.qbo_project_id] = +r.total);
    const cogsProjByProj = {}; (P.cogs_proj || []).forEach(r => cogsProjByProj[r.qbo_project_id] = +r.total);
    const planByDeal = {}; (P.plan_deal || []).forEach(r => planByDeal[r.deal_id] =
      { gpAll: +r.gp_all, gpSettled: +r.gp_settled, billFuture: +r.bill_future });
    const projectsById = {}; (P.projects || []).forEach(p => projectsById[p.id] = p);
    const laborByDeal = {}; (H.deal_labor || []).forEach(r => laborByDeal[r.deal_id] = r);
    const plannedByDeal = {}; (H.deal_planned || []).forEach(r => plannedByDeal[r.deal_id] = +r.planned_hours);
    // the people behind each deal: logged from staff_hours_deal, assigned from
    // staff_deal_planned — a person with a plan but no hours still appears
    const peopleByDeal = {};
    const person = (dealId, staffId) => {
      const list = peopleByDeal[dealId] = peopleByDeal[dealId] || {};
      if (!list[staffId]) { const s = staffById[staffId] || {};
        list[staffId] = { staffId, name: s.name || '(unknown)', department: s.department || '', logged: 0, planned: 0 }; }
      return list[staffId];
    };
    (H.staff_hours_deal || []).forEach(r => { person(r.deal_id, r.staff_id).logged += +r.hours; });
    (H.staff_deal_planned || []).forEach(r => { person(r.deal_id, r.staff_id).planned += +r.planned_hours; });

    // a deal belongs on this page only if its flight overlaps the range — the
    // same activeInRange rule Client Profitability and Forecast use; an
    // undated deal stays and is judged on whether it has any figures at all
    const rangeEndExcl = shiftM(rangeTo, 1);
    const activeInRange = d => (!d.flight_start || d.flight_start < rangeEndExcl) && (!d.flight_end || d.flight_end >= rangeFrom);

    allRows = Object.keys(laborByDeal)
      .concat(deals.filter(d => d.qbo_project_id).map(d => d.id))
      .concat(Object.keys(planByDeal))
      .concat(Object.keys(plannedByDeal))
      .filter((id, i, a) => a.indexOf(id) === i)
      .map(id => {
        const deal = dealsById[id]; if (!deal || !activeInRange(deal)) return null;
        const labor = laborByDeal[id] || { hours: 0, cost: 0 };
        const plan = planByDeal[id] || { gpAll: 0, gpSettled: 0, billFuture: 0 };
        const actualRevenue = deal.qbo_project_id ? (revProjByProj[deal.qbo_project_id] || 0) : 0;
        const actualCogs = deal.qbo_project_id ? (cogsProjByProj[deal.qbo_project_id] || 0) : 0;
        const forecastGP = plan.gpAll - plan.gpSettled;
        const forecastRevenue = plan.billFuture;
        const forecastCogs = Math.max(0, forecastRevenue - forecastGP);
        const proj = deal.qbo_project_id ? projectsById[deal.qbo_project_id] : null;
        const people = Object.values(peopleByDeal[id] || {}).sort((a, b) => b.logged - a.logged || a.name.localeCompare(b.name));
        return {
          dealId: id, name: deal.name || '(unnamed deal)',
          client: (clientsById[deal.client_id] || {}).name || '(unknown client)',
          flightStart: deal.flight_start, flightEnd: deal.flight_end,
          qboProjectId: deal.qbo_project_id || null, projName: proj ? proj.name : null,
          actualHours: +labor.hours, laborCost: +labor.cost, plannedHours: plannedByDeal[id] || 0,
          actualRevenue, actualCogs, actualGP: actualRevenue - actualCogs,
          forecastRevenue, forecastCogs, forecastGP, people,
        };
      })
      .filter(r => r && (r.actualRevenue !== 0 || r.actualCogs !== 0 || r.actualHours !== 0 ||
                         r.forecastRevenue !== 0 || r.plannedHours !== 0));
    render();
  }

  // blended money for one deal, honoring the measured-only toggle — the same
  // blend Client Profitability applies to its deal rows
  function blend(r) {
    const revenue = r.actualRevenue + (historicalOnly ? 0 : r.forecastRevenue);
    const cogs = r.actualCogs + (historicalOnly ? 0 : r.forecastCogs);
    const gp = r.actualGP + (historicalOnly ? 0 : r.forecastGP);
    const profitAfterLabor = gp - r.laborCost;
    return { revenue, cogs, gp, profitAfterLabor,
      effectiveRate: r.actualHours > 0 ? revenue / r.actualHours : null,
      profitPerHour: r.actualHours > 0 ? profitAfterLabor / r.actualHours : null };
  }

  // [sort key, label, cell classes]. The w-* class sets the column's share of
  // the fixed-layout table; the c-* class is what the container queries hide.
  const COLUMNS = [
    ['name', 'project', 'textleft w-name c-name'], ['client', 'client', 'textleft w-client c-client'],
    ['start', 'start → end', 'textleft w-dates c-dates'], [null, 'hours vs planned', 'textleft w-bar c-bar'],
    ['plannedHours', 'planned hrs', 'w-planned c-planned'], ['actualHours', 'actual hrs', 'w-actual c-actual'],
    ['laborCost', 'labor cost', 'w-labor c-labor'], ['revenue', 'revenue', 'w-revenue c-revenue'],
    ['effectiveRate', 'effective rate', 'w-rate c-rate'], ['profitAfterLabor', 'profit after labor', 'w-profit c-profit'],
    ['profitPerHour', 'profit / hr', 'w-pph c-pph'],
  ];

  // The expanded block: people (2) | the two charts stacked (3). The charts
  // read from detailCache; a miss renders a loading state and starts the
  // fetch, whose resolution re-renders.
  function expandHtml(r) {
    const people = deptFilter ? r.people.filter(p => p.department === deptFilter) : r.people;
    const totalPlanned = people.reduce((s, p) => s + p.planned, 0);
    const totalLogged = people.reduce((s, p) => s + p.logged, 0);
    const peopleRows = !people.length
      ? `<tr><td colspan="4" class="empty-note">No hours logged against this project in the range.</td></tr>`
      : people.map(p => `<tr>
          <td class="textleft"><div class="sub-name">${esc(p.name)}</div><div class="sub-proj">${esc(p.department)}</div></td>
          ${hoursCell(p.planned, p.logged, false, false)}
          <td class="${p.planned > 0 ? '' : 'muted'}">${p.planned > 0 ? fmtHours(p.planned) : '—'}</td>
          <td>${fmtHours(p.logged)}</td></tr>`).join('');
    const d = detailCache.get(r.dealId);
    const ready = d && !(d instanceof Promise);
    const chartBody = id => ready
      ? (d.error ? `<div class="empty-note err" style="padding:20px 14px">${esc(d.error)}</div>` : `<div id="${id}"></div>`)
      : `<div class="empty-note" style="padding:28px 14px">loading…</div>`;
    return `<tr class="expand-row"><td colspan="${COLUMNS.length}">
      <div class="expand-split">
        <div class="people-panel">
          <div class="people-scroll">
            <table class="ledger people" style="table-layout:fixed">
              <colgroup><col style="width:34%"><col style="width:40%"><col style="width:13%"><col style="width:13%"></colgroup>
              <tr><th class="textleft">person</th><th class="textleft">assigned vs logged</th><th>assigned</th><th>logged</th></tr>
              ${peopleRows}
            </table>
          </div>
          <div class="people-total"><span>${people.length} ${people.length === 1 ? 'person' : 'people'}</span><span></span>
            <span>${totalPlanned > 0 ? fmtHours(totalPlanned) : '—'}</span><span>${fmtHours(totalLogged)}</span></div>
        </div>
        <div class="charts">
          <div class="sc-panel chartpanel">
            <div class="chart-head"><div class="sc-eyebrow">Hours logged by week</div>
              <div class="stat-inline">${ready && !d.error ? hoursStat(d, rangeFrom, rangeTo) : ''}</div></div>
            ${chartBody(`hours-${r.dealId}`)}
          </div>
          <div class="sc-panel chartpanel">
            <div class="chart-head"><div class="sc-eyebrow">Revenue &amp; gross profit — actual vs plan</div>
              <div class="stat-inline">${ready && !d.error ? revStat(d) : ''}</div></div>
            ${chartBody(`rev-${r.dealId}`)}
          </div>
        </div>
      </div></td></tr>`;
  }

  function ensureDetail(dealId) {
    if (detailCache.has(dealId)) return;
    const p = supa.rpc('project_detail', { p_deal_id: dealId }).then(res => {
      detailCache.set(dealId, res.error ? { error: res.error.message } : (res.data || {}));
      if (openDeals.has(dealId)) render();
    });
    detailCache.set(dealId, p);
  }

  function render() {
    const q = query.trim().toLowerCase();
    const rows = allRows
      .filter(r => !q || r.name.toLowerCase().includes(q) || r.client.toLowerCase().includes(q))
      .filter(r => !deptFilter || r.people.some(p => p.department === deptFilter))
      .map(r => ({ ...r, b: blend(r) }))
      .sort((a, b) => {
        const av = SORT_ACCESSORS[tableSort.key](a), bv = SORT_ACCESSORS[tableSort.key](b);
        if (av !== bv) return (av < bv ? -1 : 1) * tableSort.dir;
        return a.name.localeCompare(b.name);
      });
    // the ribbon sums every row in range, not just the filtered ones — the
    // search box narrows the table, not the headline numbers
    const allB = allRows.map(blend);
    const totalRevenue = allB.reduce((s, b) => s + b.revenue, 0);
    const totalLabor = allRows.reduce((s, r) => s + r.laborCost, 0);
    const totalProfit = allB.reduce((s, b) => s + b.profitAfterLabor, 0);
    const totalHours = allRows.reduce((s, r) => s + r.actualHours, 0);
    const totalPlanned = allRows.reduce((s, r) => s + r.plannedHours, 0);
    const working = allRows.filter(r => r.actualHours > 0).length;
    const atRisk = allRows.filter((r, i) => r.actualHours > 0 && allB[i].profitAfterLabor < 0).length;

    const sortTh = ([key, label, cls]) => {
      if (!key) return `<th class="${cls || ''}">${label}</th>`;
      const active = tableSort.key === key;
      return `<th class="${cls || ''}" data-sort="${key}" scope="col" tabindex="0" role="columnheader" aria-sort="${active ? (tableSort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${active ? `<span class="dir">${tableSort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
    };

    const panel = el.querySelector('#panel');
    panel.classList.remove('is-loading');
    panel.innerHTML = `
      <div class="range">
        <span class="rl">Range</span>
        <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0, 7)}">
        <span class="muted">→</span>
        <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0, 7)}">
        <span class="rp" role="group" aria-label="Quick range">
          ${Object.entries(PRESETS).map(([label, [f, t]]) => {
            const on = f === rangeFrom && t === rangeTo;
            return `<button type="button" class="seg${on ? ' on' : ''}" data-preset="${esc(label)}" aria-pressed="${on}">${label}</button>`;
          }).join('')}
        </span>
        <label class="mono" style="display:flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--slate)">
          <input type="checkbox" id="ph-historical" style="height:auto" ${historicalOnly ? 'checked' : ''}> measured only</label>
      </div>
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Revenue</div>
          <div class="summary-value">${fmt$0(totalRevenue)}</div>
          <div class="summary-note">${historicalOnly ? 'measured only' : 'invoiced + forecasted'}</div></div>
        <div class="summary-cell"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalLabor)}</div></div>
        <div class="summary-cell"><div class="summary-label">Profit after labor</div>
          <div class="summary-value ${totalProfit < 0 ? 'neg' : 'pos'}">${fmt$0(totalProfit)}</div>
          <div class="summary-note">gross profit minus hours-based labor</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="delta-note flat">${totalPlanned > 0 ? `vs ${fmtHours(totalPlanned)}h assigned` : 'not assigned yet'}</div></div>
        <div class="summary-cell"><div class="summary-label">Projects at risk</div>
          <div class="summary-value ${atRisk > 0 ? 'neg' : 'pos'}">${atRisk} / ${working}</div>
          <div class="summary-note">logging hours at a loss</div></div>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px">
          <input id="q" placeholder="search project or client…" value="${esc(query)}" aria-label="Search project or client" style="width:220px">
          <select id="dept-filter" aria-label="Filter by department">
            <option value="">All departments</option>
            ${deptOrder.map(d => `<option value="${esc(d)}" ${d === deptFilter ? 'selected' : ''}>${esc(d)}</option>`).join('')}
          </select>
          <span class="delta-note flat">click a project to see who worked it</span>
          <span class="muted" style="font-size:11px;margin-left:auto">${rows.length} of ${allRows.length} shown</span>
        </div>
        <div class="fit">
        <table class="ledger ph">
          <tr>${COLUMNS.map(sortTh).join('')}</tr>
          ${!rows.length ? `<tr><td colspan="${COLUMNS.length}" class="empty-note">No projects match the current filters.</td></tr>` : rows.map(r => {
            const b = r.b, open = openDeals.has(r.dealId);
            const risk = r.actualHours > 0 && b.profitAfterLabor < 0;
            const head = `<tr class="namerow${risk ? ' risk-row' : ''}" data-did="${esc(r.dealId)}" role="button" tabindex="0" aria-expanded="${open}" style="cursor:pointer">
              <td class="textleft c-name" title="${esc(r.name)}${r.projName ? ' · ' + esc(r.projName) : ''}"><div class="tname"><span>${open ? '▾' : '▸'} ${esc(r.name)}</span>${r.qboProjectId ? '' : '<span class="pill warn">no QB project</span>'}</div></td>
              <td class="textleft c-client" title="${esc(r.client)}">${esc(r.client)}</td>
              <td class="textleft c-dates">${fmtDate(r.flightStart)} → ${fmtDate(r.flightEnd)}</td>
              ${hoursCell(r.plannedHours, r.actualHours, b.revenue !== 0, true, 'c-bar')}
              <td class="c-planned ${r.plannedHours > 0 ? '' : 'muted'}">${r.plannedHours > 0 ? fmtHours(r.plannedHours) : '—'}</td>
              <td class="c-actual">${fmtHours(r.actualHours)}</td>
              <td class="c-labor">${fmt$0(r.laborCost)}</td>
              <td class="c-revenue" title="${!historicalOnly && r.forecastRevenue !== 0 && r.actualRevenue !== 0 ? esc(fmt$0(r.actualRevenue) + ' measured · ' + fmt$0(r.forecastRevenue) + ' forecast') : ''}">${fmt$0(b.revenue)}</td>
              <td class="c-rate ${b.effectiveRate === null ? 'muted' : ''}">${b.effectiveRate === null ? '—' : fmt$0(b.effectiveRate) + '/h'}</td>
              <td class="c-profit ${b.profitAfterLabor < 0 ? 'err' : 'ok'}">${fmt$0(b.profitAfterLabor)}</td>
              <td class="c-pph ${b.profitPerHour === null ? 'muted' : b.profitPerHour < 0 ? 'err' : 'ok'}">${b.profitPerHour === null ? '—' : fmt$0(b.profitPerHour) + '/h'}</td>
            </tr>`;
            return open ? head + expandHtml(r) : head;
          }).join('')}
        </table>
        </div>
      </div>`;

    // charts for every open row whose detail has arrived; misses start their fetch
    rows.filter(r => openDeals.has(r.dealId)).forEach(r => {
      const d = detailCache.get(r.dealId);
      if (!d) { ensureDetail(r.dealId); return; }
      if (d instanceof Promise || d.error) return;
      const h = panel.querySelector(`[id="hours-${r.dealId}"]`), v = panel.querySelector(`[id="rev-${r.dealId}"]`);
      if (h) hoursByWeekChart(h, d, rangeFrom, rangeTo, deptOrder);
      if (v) revGpChart(v, d);
    });

    // Ribbon controls update in place so a click lights up before the round
    // trip lands (same as Team Hours); render() recomputes the same state
    // from scratch once data arrives, so the two can never disagree.
    function syncRangeControls() {
      const fromEl = panel.querySelector('#r-from'), toEl = panel.querySelector('#r-to');
      if (fromEl) fromEl.value = rangeFrom.slice(0, 7);
      if (toEl) toEl.value = rangeTo.slice(0, 7);
      panel.querySelectorAll('[data-preset]').forEach(btn => {
        const [f, t] = PRESETS[btn.dataset.preset];
        const on = f === rangeFrom && t === rangeTo;
        btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on));
      });
    }
    panel.querySelector('#r-from').onchange = e => { rangeFrom = monthOf(e.target.value); syncRangeControls(); load(); };
    panel.querySelector('#r-to').onchange = e => { rangeTo = monthOf(e.target.value); syncRangeControls(); load(); };
    panel.querySelectorAll('[data-preset]').forEach(btn => btn.onclick = () => {
      [rangeFrom, rangeTo] = PRESETS[btn.dataset.preset]; syncRangeControls(); load(); });
    panel.querySelector('#ph-historical').onchange = e => { historicalOnly = e.target.checked; render(); };
    panel.querySelector('#dept-filter').onchange = e => { deptFilter = e.target.value; render(); };
    wireSearch(el, '#q', v => { query = v; render(); });
    panel.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const k = th.dataset.sort;
        tableSort = { key: k, dir: tableSort.key === k ? -tableSort.dir : (k === 'name' || k === 'client' || k === 'start' ? 1 : -1) };
        render();
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
    panel.querySelectorAll('tr.namerow').forEach(tr => {
      const toggle = () => {
        const id = tr.dataset.did;
        if (openDeals.has(id)) openDeals.delete(id); else { openDeals.add(id); ensureDetail(id); }
        render();
      };
      tr.onclick = toggle;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    });
  }

  await load();
});
</script></body></html>
