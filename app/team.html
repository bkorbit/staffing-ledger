<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Team</title><link rel="stylesheet" href="./assets/style.css?v=6806655"></head><body>
<script type="module">
import { boot, esc } from './assets/shell.js?v=6806655';

// Where salary, capacity, department, and employment dates are MANAGED —
// Team Hours (Delivery) is for reading that information back, not editing
// it; the capacity column there was getting cluttered by an inline editor
// that belongs here instead. Money is BIGINT cents in comp_periods; this is
// the one place a human types dollars, converted at the edges.
//
// Comp is FULL history, not just the current period — staff_hourly_cost()
// resolves a person's rate by date, so a past raise or rate change has to be
// enterable (and correctable) with its own real start date, not just "today
// replaces whatever was current." Every period, past or current, is directly
// editable; "+ add period" finds whichever existing period covers the new
// start date and closes it there, rather than always assuming "the currently
// open one" — that assumption breaks the moment you backfill or schedule a
// future change out of chronological order.
const toCents = dollars => Math.round((+dollars || 0) * 100);
const fromCents = cents => ((cents || 0) / 100).toFixed(2);
const iso = d => d.toISOString().slice(0, 10);
const dayBefore = dateStr => iso(new Date(new Date(dateStr + 'T00:00:00Z').getTime() - 86400000));

boot('team', async (supa, el) => {
  let query = '', deptFilter = '', showInactive = true;
  const openHistory = new Set();

  el.innerHTML = `<div class="sc-panel" id="panel">loading…</div>`;

  async function load() {
    const [st, cp] = await Promise.all([
      supa.from('staff').select('id,name,department,active,start_date,end_date').order('name'),
      supa.from('comp_periods').select('id,staff_id,starts_on,ends_on,kind,annual_cost,hourly_cost,weekly_capacity').order('starts_on')
    ]);
    if (st.error) { el.innerHTML = `<div class="sc-panel err">${esc(st.error.message)}</div>`; return; }
    render(st.data || [], cp.data || []);
  }

  function render(staff, comp) {
    const compAllByStaff = {};
    comp.forEach(c => (compAllByStaff[c.staff_id] = compAllByStaff[c.staff_id] || []).push(c));
    const compCurrentByStaff = {};
    comp.forEach(c => { if (c.ends_on === null) compCurrentByStaff[c.staff_id] = c; });

    const departments = [...new Set(staff.map(s => s.department).filter(Boolean))].sort();
    const q = query.trim().toLowerCase();
    const rows = staff
      .filter(s => showInactive || s.active)
      .filter(s => !deptFilter || s.department === deptFilter)
      .filter(s => !q || s.name.toLowerCase().includes(q))
      .sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name));

    el.querySelector('#panel').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <h1 style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--brand);margin:0;letter-spacing:-.01em">Team</h1>
        <button class="primary" id="add-staff-btn">+ Add person</button>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input id="q" placeholder="search name…" value="${esc(query)}" style="width:180px">
          <select id="dept-filter">
            <option value="">All departments</option>
            ${departments.map(d=>`<option value="${esc(d)}" ${d===deptFilter?'selected':''}>${esc(d)}</option>`).join('')}
          </select>
          <label class="mono" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate)">
            <input type="checkbox" id="show-inactive" ${showInactive?'checked':''}> show inactive
          </label>
        </div>
        <div class="gridwrap">
        <table>
          <thead><tr><th scope="col">name</th><th scope="col">department</th><th scope="col">comp</th><th scope="col">start date</th><th scope="col">end date</th><th scope="col">active</th></tr></thead>
          <tbody>
          ${!rows.length ? `<tr><td colspan="6" class="empty-note">No people match the current filters.</td></tr>` : rows.map(s => {
            const comp = compCurrentByStaff[s.id];
            const periods = (compAllByStaff[s.id] || []).slice().sort((a, b) => b.starts_on.localeCompare(a.starts_on));
            const open = openHistory.has(s.id);
            return `<tr class="${!s.active?'muted':''}">
                <td class="textleft"><input type="text" value="${esc(s.name)}" data-role="name" data-id="${s.id}" style="height:28px"></td>
                <td class="textleft"><input type="text" value="${esc(s.department||'')}" placeholder="department" aria-label="${esc(s.name)} — department" data-role="dept" data-id="${s.id}" style="height:28px;width:140px"></td>
                <td class="textleft">${comp
                  ? (comp.kind === 'hourly'
                      ? `$${(comp.hourly_cost/100).toLocaleString()}/hr · ${comp.weekly_capacity}h/wk`
                      : `$${(comp.annual_cost/100).toLocaleString()}/yr · ${comp.weekly_capacity}h/wk`)
                  : '<span class="muted">not set</span>'}
                  <button class="ghost history-toggle" data-sid="${s.id}" style="padding:3px 8px;font-size:11px;margin-left:6px">${open?'hide':'history'} (${periods.length})</button></td>
                <td><input type="date" value="${s.start_date||''}" data-role="start" data-id="${s.id}" aria-label="${esc(s.name)} — start date" style="height:28px"></td>
                <td><input type="date" value="${s.end_date||''}" data-role="end" data-id="${s.id}" aria-label="${esc(s.name)} — end date" style="height:28px"></td>
                <td><input type="checkbox" data-role="active" data-id="${s.id}" aria-label="${esc(s.name)} active" ${s.active?'checked':''}></td>
              </tr>
              ${open ? `<tr><td colspan="6" style="background:#f6f6f6;padding:8px 14px">
                <table style="width:auto;min-width:560px">
                  <thead><tr><th scope="col">start</th><th scope="col">end</th><th scope="col">kind</th><th scope="col">cost</th><th scope="col">hrs/wk</th><th scope="col"></th></tr></thead>
                  <tbody>
                  ${!periods.length ? `<tr><td colspan="6" class="muted" style="text-align:left">No comp periods yet.</td></tr>` : periods.map(p => `
                    <tr data-period="${p.id}">
                      <td><input type="date" class="cp-start" value="${p.starts_on}" style="height:26px;width:130px"></td>
                      <td><input type="date" class="cp-end" value="${p.ends_on||''}" style="height:26px;width:130px" title="Blank = current, ongoing period"></td>
                      <td><select class="cp-kind" style="height:26px">
                        <option value="salary" ${p.kind==='salary'?'selected':''}>salary/yr</option>
                        <option value="hourly" ${p.kind==='hourly'?'selected':''}>hourly</option>
                      </select></td>
                      <td><input type="text" class="cp-cost" value="${p.kind==='hourly'?fromCents(p.hourly_cost):fromCents(p.annual_cost)}" style="height:26px;width:80px"></td>
                      <td><input type="text" class="cp-cap" value="${p.weekly_capacity}" style="height:26px;width:56px"></td>
                      <td style="white-space:nowrap">
                        <button class="ghost cp-save" data-id="${p.id}" style="padding:3px 8px;font-size:11px">Save</button>
                        <button class="ghost cp-delete" data-id="${p.id}" style="padding:3px 8px;font-size:11px;color:var(--rust)" title="Delete this period" aria-label="Delete this comp period">×</button>
                      </td>
                    </tr>`).join('')}
                  </tbody>
                </table>
                <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
                  <span class="mono muted" style="font-size:11px">+ new period starting</span>
                  <input type="date" class="np-start" data-sid="${s.id}" value="${iso(new Date())}" style="height:26px">
                  <select class="np-kind" data-sid="${s.id}" style="height:26px">
                    <option value="salary">salary/yr</option>
                    <option value="hourly">hourly</option>
                  </select>
                  <input type="text" class="np-cost" data-sid="${s.id}" placeholder="$" style="height:26px;width:80px">
                  <input type="text" class="np-cap" data-sid="${s.id}" placeholder="hrs/wk" value="40" style="height:26px;width:56px">
                  <button class="primary np-add" data-sid="${s.id}" style="padding:2px 8px">Add period</button>
                  <span class="np-msg err" data-sid="${s.id}" style="font-size:11px"></span>
                </div>
              </td></tr>` : ''}`;
          }).join('')}
          </tbody>
        </table>
        </div>
      </div>`;

    el.querySelector('#q').oninput = e => { query = e.target.value; render(staff, comp); };
    el.querySelector('#dept-filter').onchange = e => { deptFilter = e.target.value; render(staff, comp); };
    el.querySelector('#show-inactive').onchange = e => { showInactive = e.target.checked; render(staff, comp); };
    el.querySelector('#add-staff-btn').onclick = async () => {
      const name = prompt('Name for the new person:');
      if (!name) return;
      const { error } = await supa.from('staff').insert({ name: name.trim(), active: true, set_by: window.__email });
      if (error) { alert(error.message); return; }
      load();
    };
    el.querySelectorAll('[data-role="name"]').forEach(inp => inp.onchange = async () => {
      await supa.from('staff').update({ name: inp.value.trim() }).eq('id', inp.dataset.id);
      load();
    });
    el.querySelectorAll('[data-role="dept"]').forEach(inp => inp.onchange = async () => {
      await supa.from('staff').update({ department: inp.value.trim() || null }).eq('id', inp.dataset.id);
      load();
    });
    el.querySelectorAll('[data-role="start"]').forEach(inp => inp.onchange = async () => {
      await supa.from('staff').update({ start_date: inp.value || null }).eq('id', inp.dataset.id);
      load();
    });
    el.querySelectorAll('[data-role="end"]').forEach(inp => inp.onchange = async () => {
      await supa.from('staff').update({ end_date: inp.value || null }).eq('id', inp.dataset.id);
      load();
    });
    el.querySelectorAll('[data-role="active"]').forEach(cb => cb.onchange = async () => {
      await supa.from('staff').update({ active: cb.checked }).eq('id', cb.dataset.id);
      load();
    });
    el.querySelectorAll('.history-toggle').forEach(btn => btn.onclick = () => {
      const sid = btn.dataset.sid;
      openHistory.has(sid) ? openHistory.delete(sid) : openHistory.add(sid);
      render(staff, comp);
    });
    el.querySelectorAll('.cp-save').forEach(btn => btn.onclick = async () => {
      const row = btn.closest('tr');
      const kind = row.querySelector('.cp-kind').value;
      const cost = toCents(row.querySelector('.cp-cost').value);
      const cap = +row.querySelector('.cp-cap').value || 40;
      const starts_on = row.querySelector('.cp-start').value;
      const ends_on = row.querySelector('.cp-end').value || null;
      if (ends_on && ends_on < starts_on) { alert('End date is before start date.'); return; }
      const { error } = await supa.from('comp_periods').update({
        starts_on, ends_on, kind,
        annual_cost: kind === 'salary' ? cost : 0,
        hourly_cost: kind === 'hourly' ? cost : 0,
        weekly_capacity: cap
      }).eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    el.querySelectorAll('.cp-delete').forEach(btn => btn.onclick = async () => {
      if (!confirm('Delete this comp period? This cannot be undone.')) return;
      const { error } = await supa.from('comp_periods').delete().eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    el.querySelectorAll('.np-add').forEach(btn => btn.onclick = async () => {
      const sid = btn.dataset.sid;
      const msg = el.querySelector(`.np-msg[data-sid="${sid}"]`);
      const newStart = el.querySelector(`.np-start[data-sid="${sid}"]`).value;
      if (!newStart) { msg.textContent = 'pick a start date'; return; }
      const kind = el.querySelector(`.np-kind[data-sid="${sid}"]`).value;
      const cost = toCents(el.querySelector(`.np-cost[data-sid="${sid}"]`).value);
      const cap = +el.querySelector(`.np-cap[data-sid="${sid}"]`).value || 40;
      const periods = compAllByStaff[sid] || [];
      const covering = periods.find(p => p.starts_on <= newStart && (!p.ends_on || p.ends_on >= newStart));
      if (covering) {
        const closeAt = dayBefore(newStart);
        if (closeAt < covering.starts_on) { msg.textContent = 'starts before an existing period even begins'; return; }
        const { error } = await supa.from('comp_periods').update({ ends_on: closeAt }).eq('id', covering.id);
        if (error) { msg.textContent = error.message; return; }
      }
      const { error } = await supa.from('comp_periods').insert({
        staff_id: sid, starts_on: newStart, kind,
        annual_cost: kind === 'salary' ? cost : 0,
        hourly_cost: kind === 'hourly' ? cost : 0,
        weekly_capacity: cap, set_by: window.__email
      });
      if (error) { msg.textContent = error.message; return; }
      load();
    });
  }

  await load();
});
</script></body></html>
