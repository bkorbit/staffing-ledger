<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Team</title><link rel="stylesheet" href="./assets/style.css?v=b02db8f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* .settings' shared auto-fit grid (minmax(260px,1fr)) starts a 3rd column
   once this modal is wide enough to fit one — fine on the deal editor's
   1180px modal, but here it orphans "End date" alone on its own row. A
   taller minmax basis keeps this modal's grid at the 2-per-row pairing it
   was designed around (Department+Hire date, Active+End date) at any width
   up to modal-sm's own cap. */
.modal-sm .settings { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
/* Cost is the one figure in this modal with no other cue that it's money —
   kind's own label (salary/yr, hourly) sits right next to it but a bare
   "65000.00" still reads as an anonymous number at a glance. A pinned "$"
   glyph plus room to breathe (cp-cost/np-cost both widened well past the
   other short fields) fixes both the "what is this" and the "I can't tell
   65000 from 650000" complaints in one move. */
.moneyfield { position:relative; display:inline-block; }
.moneyfield::before { content:"$"; position:absolute; left:9px; top:50%; transform:translateY(-50%);
  font-family:var(--font-mono); font-size:12px; color:var(--slate); pointer-events:none; }
.moneyfield input { padding-left:19px; }
</style>
</head><body>
<script type="module">
import { boot, esc, wireSearch } from './assets/shell.js?v=b02db8f';

// Where salary, capacity, department, and employment dates are MANAGED —
// Team Hours (Delivery) is for reading that information back, not editing
// it; the capacity column there was getting cluttered by an inline editor
// that belongs here instead. Money is BIGINT cents in comp_periods; this is
// the one place a human types dollars, converted at the edges.
//
// Comp is FULL history, not just the current period — staff_hourly_cost()
// resolves a person's rate by date, so a past raise or rate change has to be
// enterable (and correctable) with its own real start date, not just "today
// replaces whatever was current." Every period, past or current, is directly
// editable; "+ add period" finds whichever existing period covers the new
// start date and closes it there, rather than always assuming "the currently
// open one" — that assumption breaks the moment you backfill or schedule a
// future change out of chronological order.
//
// The roster row itself (name/department/dates/active) reads as plain
// ledger text, not a permanent row of input boxes — matching the table
// language cashflow.html established (table.ledger: no per-cell gridlines,
// a brand header rule, hover-tint rows). Editing opens the same centered
// focus-overlay modal forecast.html's deal editor uses (real focus trap,
// backdrop click, Escape, focus restored to the opener on close) — one
// place for name/department/dates/active AND compensation history together,
// rather than a small popover that hid the history behind a second toggle.
const toCents = dollars => Math.round((+String(dollars).replace(/,/g, '') || 0) * 100);
const fromCents = cents => ((cents || 0) / 100).toFixed(2);
// Cost inputs show comma-grouped thousands (fmtCostDisplay) so a figure like
// 65000 reads as "65,000.00" instead of a wall of undifferentiated digits;
// toCents above strips the commas back out, and focus/blur (wireMoneyInput)
// swap between the raw editable form and the grouped display form so typing
// mid-number never fights a comma landing where the cursor just was.
const fmtCostDisplay = dollars => (+dollars || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const wireMoneyInput = input => {
  input.addEventListener('focus', () => { input.value = input.value.replace(/,/g, ''); });
  input.addEventListener('blur', () => { if (input.value.trim()) input.value = fmtCostDisplay(input.value); });
};
const iso = d => d.toISOString().slice(0, 10);
const dayBefore = dateStr => iso(new Date(new Date(dateStr + 'T00:00:00Z').getTime() - 86400000));
const dayAfter = dateStr => iso(new Date(new Date(dateStr + 'T00:00:00Z').getTime() + 86400000));
const fmtDate = s => s ? new Date(s + 'T00:00:00Z')
  .toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' })
  : '<span class="muted">—</span>';

boot('team', async (supa, el) => {
  let query = '', deptFilter = '', showInactive = true;
  let tableSort = { key: 'active', dir: -1 };
  let editState = null; // { mode: 'edit'|'create', id }
  let modalOpener = null;
  let compAllByStaffLive = {}; // staff_id -> comp_periods[], refreshed every load()
  let bonusesByStaffLive = {}; // staff_id -> staff_bonuses[], refreshed every load()
  let tiersLive = []; // health_insurance_tiers[], refreshed every load()

  el.innerHTML = `<div id="panel">loading…</div>`;

  function closeModal() {
    document.querySelector('.modal-back')?.remove();
    document.onkeydown = null;
    editState = null;
    if (modalOpener && document.contains(modalOpener)) modalOpener.focus();
    modalOpener = null;
  }

  const EMP_TYPES = [['full_time', 'Full Time'], ['contractor', 'Contractor'], ['part_time', 'Part Time']];
  const EMP_LABELS = Object.fromEntries(EMP_TYPES);

  // Drives which workers_comp_rates row (042) prices a person's workers'
  // comp — real rates are set per state, so this has to be an exact state,
  // not a free-text field. Matches the CHECK constraint on staff.work_state.
  const US_STATES = [
    ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],
    ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],
    ['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],
    ['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],
    ['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],
    ['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],
    ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],
    ['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],
    ['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],
    ['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],
    ['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']
  ];

  // Three real states, not two. staff.active alone used to double as both
  // "currently employed" AND "never count this person" — setting an end
  // date required unchecking Active, which also excluded someone from every
  // historical rollup they actually worked. active now means only "count
  // this person at all"; end_date (when active is still true) is what marks
  // someone as ended without touching that. active=false is reserved for the
  // "don't count this ever" case (typos, test rows, someone to purge from
  // every view including their own history).
  const STATUS_OF = s => !s.active ? 'inactive' : (s.end_date ? 'ended' : 'active');
  const STATUS_PILL = { active: 'good', ended: 'warn', inactive: 'bad' };
  const STATUS_LABEL = { active: 'Active', ended: 'Ended', inactive: 'Inactive' };

  // Employment type is set PER comp period, not once for a person's whole
  // tenure (039) — someone can start as a contractor and go full time later,
  // or the reverse. Full time locks weekly_capacity at 40 for that period
  // regardless of what's stored, since a full-timer's capacity is never a
  // human decision; contractor/part time expose the real field. capForSave
  // takes the period's own employment_type (not the whole modal's), and
  // applyCapLock keeps the row's hrs/wk input in sync as that type changes.
  const capForSave = (employmentType, capInput) => employmentType === 'full_time'
    ? 40 : (+capInput.value || 40);
  const applyCapLock = (typeSelect, capInput) => {
    const lock = typeSelect.value === 'full_time';
    capInput.disabled = lock;
    if (lock) capInput.value = 40;
  };

  function periodsHtml(periods) {
    return !periods.length
      ? `<tr><td colspan="7" class="muted" style="text-align:left">No comp periods yet.</td></tr>`
      : periods.map(p => `
        <tr data-period="${p.id}">
          <td><input type="date" class="cp-start" value="${p.starts_on}" style="height:26px;width:130px"></td>
          <td><input type="date" class="cp-end" value="${p.ends_on||''}" style="height:26px;width:130px" title="Blank = current, ongoing period"></td>
          <td><select class="cp-type" style="height:26px">
            ${EMP_TYPES.map(([val, label]) => `<option value="${val}" ${p.employment_type===val?'selected':''}>${label}</option>`).join('')}
          </select></td>
          <td><select class="cp-kind" style="height:26px">
            <option value="salary" ${p.kind==='salary'?'selected':''}>salary/yr</option>
            <option value="hourly" ${p.kind==='hourly'?'selected':''}>hourly</option>
          </select></td>
          <td><span class="moneyfield"><input type="text" class="cp-cost" value="${fmtCostDisplay(p.kind==='hourly'?fromCents(p.hourly_cost):fromCents(p.annual_cost))}" style="height:26px;width:118px"></span></td>
          <td class="cap-col"><input type="text" class="cp-cap" value="${p.weekly_capacity}" style="height:26px;width:56px" ${p.employment_type==='full_time'?'disabled':''}></td>
          <td style="white-space:nowrap">
            <button class="ghost cp-save" data-id="${p.id}" style="padding:3px 8px;font-size:11px">Save</button>
            <button class="ghost cp-delete" data-id="${p.id}" style="padding:3px 8px;font-size:11px;color:var(--rust)" title="Delete this period" aria-label="Delete this comp period">×</button>
          </td>
        </tr>`).join('');
  }

  function bonusesHtml(bonuses) {
    return !bonuses.length
      ? `<tr><td colspan="4" class="muted" style="text-align:left">No bonuses scheduled.</td></tr>`
      : bonuses.map(b => `
        <tr data-bonus="${b.id}">
          <td><input type="date" class="bn-date" value="${b.pay_date}" style="height:26px;width:130px"></td>
          <td><span class="moneyfield"><input type="text" class="bn-amount" value="${fmtCostDisplay(fromCents(b.amount))}" style="height:26px;width:118px"></span></td>
          <td><input type="text" class="bn-note" value="${esc(b.note || '')}" placeholder="note" style="height:26px;width:160px"></td>
          <td style="white-space:nowrap">
            <button class="ghost bn-save" data-id="${b.id}" style="padding:3px 8px;font-size:11px">Save</button>
            <button class="ghost bn-delete" data-id="${b.id}" style="padding:3px 8px;font-size:11px;color:var(--rust)" title="Delete this bonus" aria-label="Delete this bonus">×</button>
          </td>
        </tr>`).join('');
  }

  function wireBonusHandlers(sid, box) {
    box.querySelectorAll('.bn-amount, .nb-amount').forEach(wireMoneyInput);
    box.querySelectorAll('.bn-save').forEach(btn => btn.onclick = async () => {
      const row = btn.closest('tr');
      const pay_date = row.querySelector('.bn-date').value;
      const amount = toCents(row.querySelector('.bn-amount').value);
      const note = row.querySelector('.bn-note').value.trim() || null;
      if (!pay_date) { alert('Pick a date.'); return; }
      const { error } = await supa.from('staff_bonuses')
        .update({ pay_date, amount, note }).eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    box.querySelectorAll('.bn-delete').forEach(btn => btn.onclick = async () => {
      if (!confirm('Delete this bonus? This cannot be undone.')) return;
      const { error } = await supa.from('staff_bonuses').delete().eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    const nbAdd = box.querySelector('.nb-add');
    if (nbAdd) {
      nbAdd.onclick = async () => {
        const msg = box.querySelector('.nb-msg');
        const pay_date = box.querySelector('.nb-date').value;
        if (!pay_date) { msg.textContent = 'pick a date'; return; }
        const amount = toCents(box.querySelector('.nb-amount').value);
        const note = box.querySelector('.nb-note').value.trim() || null;
        const { error } = await supa.from('staff_bonuses')
          .insert({ staff_id: sid, pay_date, amount, note, set_by: window.__email });
        if (error) { msg.textContent = error.message; return; }
        load();
      };
    }
  }

  function wirePeriodHandlers(sid, box) {
    box.querySelectorAll('.cp-cost, .np-cost').forEach(wireMoneyInput);
    box.querySelectorAll('.cp-type').forEach(sel => {
      sel.onchange = () => applyCapLock(sel, sel.closest('tr').querySelector('.cp-cap'));
    });
    box.querySelectorAll('.cp-save').forEach(btn => btn.onclick = async () => {
      const row = btn.closest('tr');
      const employment_type = row.querySelector('.cp-type').value;
      const kind = row.querySelector('.cp-kind').value;
      const cost = toCents(row.querySelector('.cp-cost').value);
      const cap = capForSave(employment_type, row.querySelector('.cp-cap'));
      const starts_on = row.querySelector('.cp-start').value;
      const ends_on = row.querySelector('.cp-end').value || null;
      if (ends_on && ends_on < starts_on) { alert('End date is before start date.'); return; }
      const { error } = await supa.from('comp_periods').update({
        starts_on, ends_on, kind, employment_type,
        annual_cost: kind === 'salary' ? cost : 0,
        hourly_cost: kind === 'hourly' ? cost : 0,
        weekly_capacity: cap
      }).eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    box.querySelectorAll('.cp-delete').forEach(btn => btn.onclick = async () => {
      if (!confirm('Delete this comp period? This cannot be undone.')) return;
      const { error } = await supa.from('comp_periods').delete().eq('id', btn.dataset.id);
      if (error) { alert(error.message); return; }
      load();
    });
    const npAdd = box.querySelector('.np-add');
    if (npAdd) {
      const npType = box.querySelector('.np-type');
      npType.onchange = () => applyCapLock(npType, box.querySelector('.np-cap'));
      npAdd.onclick = async () => {
        const msg = box.querySelector('.np-msg');
        const newStart = box.querySelector('.np-start').value;
        if (!newStart) { msg.textContent = 'pick a start date'; return; }
        const employment_type = npType.value;
        const kind = box.querySelector('.np-kind').value;
        const cost = toCents(box.querySelector('.np-cost').value);
        const cap = capForSave(employment_type, box.querySelector('.np-cap'));
        const periods = compAllByStaffLive[sid] || [];
        const covering = periods.find(p => p.starts_on <= newStart && (!p.ends_on || p.ends_on >= newStart));
        if (covering) {
          const closeAt = dayBefore(newStart);
          if (closeAt < covering.starts_on) { msg.textContent = 'starts before an existing period even begins'; return; }
          const { error } = await supa.from('comp_periods').update({ ends_on: closeAt }).eq('id', covering.id);
          if (error) { msg.textContent = error.message; return; }
        }
        const { error } = await supa.from('comp_periods').insert({
          staff_id: sid, starts_on: newStart, kind, employment_type,
          annual_cost: kind === 'salary' ? cost : 0,
          hourly_cost: kind === 'hourly' ? cost : 0,
          weekly_capacity: cap, set_by: window.__email
        });
        if (error) { msg.textContent = error.message; return; }
        load();
      };
    }
  }

  function openModal(anchorEl, mode, person) {
    const opener = document.activeElement !== document.body ? document.activeElement : null;
    closeModal();
    modalOpener = anchorEl || opener;
    editState = { mode, id: person ? person.id : null };

    const periods = mode === 'edit'
      ? (compAllByStaffLive[person.id] || []).slice().sort((a, b) => b.starts_on.localeCompare(a.starts_on))
      : [];
    const bonuses = mode === 'edit'
      ? (bonusesByStaffLive[person.id] || []).slice().sort((a, b) => b.pay_date.localeCompare(a.pay_date))
      : [];
    const initialStatus = mode === 'create' ? 'active' : STATUS_OF(person);

    // "New period starting" default: a known (already-ended) period wins —
    // the next period picks up the day after it ends. Otherwise fall back to
    // this person's hire date, and only then to today. Employment type
    // defaults to whatever the most recent period was, since a new period
    // usually keeps someone's current type — the dropdown is still there for
    // the moment they actually switch.
    const hasKnownPeriod = periods.length > 0 && !!periods[0].ends_on;
    const npStartDefault = hasKnownPeriod ? dayAfter(periods[0].ends_on)
      : (person && person.start_date) || iso(new Date());
    const npTypeDefault = periods.length ? periods[0].employment_type : 'full_time';

    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span class="modal-title" id="modal-title">${mode==='create'?'Add person':esc(person.name)}</span>
        <button class="mclose">Close ✕</button>
      </div>
      <div class="modal-body">
        <div class="settings">
          ${mode === 'create' ? `<div class="setrow wide"><span class="setlabel">Name</span><input class="ep-name" type="text"></div>` : ''}
          <div class="setrow"><span class="setlabel">Department</span><input class="ep-dept" type="text" placeholder="department" value="${mode==='edit'?esc(person.department||''):''}"></div>
          <div class="setrow"><span class="setlabel">Hire date</span><input class="ep-start" type="date" value="${mode==='edit'?(person.start_date||''):''}"></div>
          <div class="setrow"><span class="setlabel">Status</span>
            <select class="ep-status">
              <option value="active" ${initialStatus==='active'?'selected':''}>Active — still employed</option>
              <option value="ended" ${initialStatus==='ended'?'selected':''}>Ended — was active, no longer</option>
              <option value="inactive" ${initialStatus==='inactive'?'selected':''}>Inactive — never count</option>
            </select></div>
          <div class="setrow ep-enddate-row" ${initialStatus!=='ended'?'hidden':''}><span class="setlabel">End date</span><input class="ep-end" type="date" value="${mode==='edit'?(person.end_date||''):''}"></div>
          <div class="setrow"><span class="setlabel">Work state</span>
            <select class="ep-state" title="Drives which state's workers' comp rate applies">
              <option value="">— not set —</option>
              ${US_STATES.map(([code, stateName]) => `<option value="${code}" ${mode==='edit'&&person.work_state===code?'selected':''}>${stateName}</option>`).join('')}
            </select></div>
          <div class="setrow"><span class="setlabel">Execution team</span>
            <label class="mono" style="display:flex;align-items:center;gap:6px;height:32px;text-transform:none;letter-spacing:normal;font-size:12.5px;font-family:var(--font-body);color:var(--ink)">
              <input class="ep-capacity" type="checkbox" ${(mode==='create'||person.tracks_capacity)?'checked':''}> counts toward capacity/utilization
              <span class="muted" style="font-size:10.5px" title="Uncheck for sales/marketing/leadership/etc — people who cost money but were never tied to client-delivery capacity. They still get full cost tracking, just excluded from Team Hours and Home's capacity rollups.">(Team Hours/Home)</span></label></div>
          <div class="setrow wide"><span class="setlabel">Benefits</span>
            <div style="display:flex;gap:16px;height:32px;align-items:center">
              <label class="mono" style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12.5px;font-family:var(--font-body);color:var(--ink)">
                <input class="ep-401k" type="checkbox" ${mode==='edit'&&person.enrolled_401k?'checked':''}> 401k
                <span class="muted" style="font-size:10.5px" title="Match starts 6 months after hire, entry on the 1st of the month coinciding with or following">(match starts 6mo after hire)</span></label>
              <label class="mono" style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12.5px;font-family:var(--font-body);color:var(--ink)">
                <input class="ep-health" type="checkbox" ${mode==='edit'&&person.enrolled_health_insurance?'checked':''}> Health Insurance</label>
              <select class="ep-tier" title="Flat-rate tier, effective once the health insurance flat-rate cutover date arrives" style="height:26px">
                <option value="">— no tier assigned —</option>
                ${tiersLive.map(t => `<option value="${t.tier_key}" ${mode==='edit'&&person.health_insurance_tier===t.tier_key?'selected':''}>${esc(t.label)}</option>`).join('')}
              </select>
            </div></div>
        </div>
        ${mode === 'edit' ? `
          <div class="sc-eyebrow">Compensation history</div>
          <div class="gridwrap">
            <table class="ledger" id="modal-periods-tbl">
              <thead><tr><th scope="col">start</th><th scope="col">end</th><th scope="col">type</th><th scope="col">kind</th><th scope="col">cost</th><th scope="col" class="cap-col">hrs/wk</th><th scope="col"></th></tr></thead>
              <tbody>${periodsHtml(periods)}</tbody>
            </table>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
            <span class="mono muted" style="font-size:11px">+ new period starting</span>
            <input type="date" class="np-start" value="${npStartDefault}" style="height:26px">
            <select class="np-type" style="height:26px">
              ${EMP_TYPES.map(([val, label]) => `<option value="${val}" ${npTypeDefault===val?'selected':''}>${label}</option>`).join('')}
            </select>
            <select class="np-kind" style="height:26px">
              <option value="salary">salary/yr</option>
              <option value="hourly">hourly</option>
            </select>
            <span class="moneyfield"><input type="text" class="np-cost" placeholder="0.00" style="height:26px;width:130px"></span>
            <input type="text" class="np-cap" placeholder="hrs/wk" value="${npTypeDefault==='full_time'?40:''}" style="height:26px;width:56px" ${npTypeDefault==='full_time'?'disabled':''}>
            <button class="primary np-add" style="padding:2px 8px">Add period</button>
            <span class="np-msg err" style="font-size:11px"></span>
          </div>
          <div class="sc-eyebrow" style="margin-top:18px">Scheduled bonuses</div>
          <div class="gridwrap">
            <table class="ledger" id="modal-bonuses-tbl">
              <thead><tr><th scope="col">date</th><th scope="col">amount</th><th scope="col">note</th><th scope="col"></th></tr></thead>
              <tbody>${bonusesHtml(bonuses)}</tbody>
            </table>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
            <span class="mono muted" style="font-size:11px">+ new bonus on</span>
            <input type="date" class="nb-date" style="height:26px">
            <span class="moneyfield"><input type="text" class="nb-amount" placeholder="0.00" style="height:26px;width:118px"></span>
            <input type="text" class="nb-note" placeholder="note" style="height:26px;width:160px">
            <button class="primary nb-add" style="padding:2px 8px">Add bonus</button>
            <span class="nb-msg err" style="font-size:11px"></span>
          </div>` : `<p class="muted" style="font-size:12px">Save this person first to add compensation history.</p>`}
      </div>
      <div class="modal-foot">
        <span class="err ep-msg" style="flex:1;font-size:11px"></span>
        <button class="ghost ep-cancel">Cancel</button>
        <button class="primary ep-save">Save</button>
      </div>
    </div>`;
    document.body.appendChild(back);
    back.onclick = e => { if (e.target === back) closeModal(); };
    back.querySelector('.mclose').onclick = closeModal;
    back.querySelector('.ep-cancel').onclick = closeModal;
    const modal = back.querySelector('.modal');

    back.querySelector('.ep-status').onchange = e => {
      const row = back.querySelector('.ep-enddate-row');
      row.hidden = e.target.value !== 'ended';
      const endInput = row.querySelector('.ep-end');
      if (!row.hidden && !endInput.value) endInput.value = iso(new Date());
    };

    // Hire date <-> "new period starting" cross-fill — only while there's no
    // known (already-ended) period, since that case already picked its own
    // default above. Hire date only ever fills FROM a blank field (it starts
    // genuinely empty), so a value the person already typed is never
    // clobbered; "new period starting" always carries some default value, so
    // it tracks whether the person has actually touched it instead.
    if (mode === 'edit' && !hasKnownPeriod) {
      const epStart = back.querySelector('.ep-start');
      const npStart = back.querySelector('.np-start');
      let npStartTouched = false;
      npStart.addEventListener('input', () => { npStartTouched = true; });
      epStart.addEventListener('change', () => {
        if (epStart.value && !npStartTouched) npStart.value = epStart.value;
      });
      npStart.addEventListener('change', () => {
        if (npStart.value && !epStart.value) epStart.value = npStart.value;
      });
    }

    // a simple focus trap: Escape closes, Tab/Shift+Tab cycles within the
    // dialog instead of escaping to the page behind it — same pattern as
    // forecast.html's deal editor.
    document.onkeydown = e => {
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key !== 'Tab') return;
      const focusable = [...modal.querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )].filter(fe => fe.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    (back.querySelector('.ep-name') || back.querySelector('.ep-dept')).focus();

    back.querySelector('.ep-save').onclick = async () => {
      let name = person && person.name;
      if (mode === 'create') {
        name = back.querySelector('.ep-name').value.trim();
        if (!name) { back.querySelector('.ep-msg').textContent = 'name is required'; return; }
      }
      const status = back.querySelector('.ep-status').value;
      if (status === 'ended' && !back.querySelector('.ep-end').value) {
        back.querySelector('.ep-msg').textContent = 'end date is required for "Ended"'; return;
      }
      const payload = {
        name,
        department: back.querySelector('.ep-dept').value.trim() || null,
        start_date: back.querySelector('.ep-start').value || null,
        end_date: status === 'ended' ? back.querySelector('.ep-end').value : null,
        active: status !== 'inactive',
        work_state: back.querySelector('.ep-state').value || null,
        enrolled_401k: back.querySelector('.ep-401k').checked,
        enrolled_health_insurance: back.querySelector('.ep-health').checked,
        health_insurance_tier: back.querySelector('.ep-tier').value || null,
        tracks_capacity: back.querySelector('.ep-capacity').checked
      };
      const { error } = mode === 'create'
        ? await supa.from('staff').insert({ ...payload, set_by: window.__email })
        : await supa.from('staff').update(payload).eq('id', person.id);
      if (error) { back.querySelector('.ep-msg').textContent = error.message; return; }
      closeModal();
      load();
    };

    if (mode === 'edit') {
      wirePeriodHandlers(person.id, back.querySelector('.modal-body'));
      wireBonusHandlers(person.id, back.querySelector('.modal-body'));
    }
  }

  async function load() {
    const [st, cp, tc, bn, ti] = await Promise.all([
      supa.from('staff').select('id,name,department,active,start_date,end_date,enrolled_401k,enrolled_health_insurance,health_insurance_tier,work_state,tracks_capacity').order('name'),
      supa.from('comp_periods').select('id,staff_id,starts_on,ends_on,kind,annual_cost,hourly_cost,weekly_capacity,employment_type').order('starts_on'),
      supa.from('v_staff_total_cost').select('staff_id,total_annual_cost'),
      supa.from('staff_bonuses').select('id,staff_id,pay_date,amount,note').order('pay_date'),
      supa.from('health_insurance_tiers').select('tier_key,label,monthly_cost').order('monthly_cost')
    ]);
    if (st.error) { el.innerHTML = `<div class="sc-panel err">${esc(st.error.message)}</div>`; return; }
    tiersLive = ti.data || [];
    render(st.data || [], cp.data || [], tc.data || [], bn.data || []);
  }

  /* --------------------------------------------------- export/import (xlsx) */
  // Two sheets, one file. "Team" is staff-level fields only — name/
  // department/dates/status/work state/401k/health insurance. "Pay Periods"
  // is deliberately scoped to each person's CURRENT open period only
  // (ends_on is null), not their full history: comp_periods is an
  // append-only ledger (raises, backdated corrections, overlap-closing
  // logic when a new period starts) — reproducing that safely for
  // arbitrary past periods in a bulk import isn't worth the risk this round.
  // What this sheet DOES handle safely: filling in pay for someone who has
  // no comp period yet (a real insert, no overlap possible since there's
  // nothing to overlap with), and correcting anyone's current rate/hours/
  // type in bulk — the two things "fill the ledger with information"
  // actually needs. A genuine raise with real period history still goes
  // through "+ new period starting" in the person's own modal, same as today.
  const EXPORT_HEADERS = ['ID', 'Name', 'Department', 'Hire Date', 'Status', 'End Date', 'Work State', 'Tracks Capacity', '401k', 'Health Insurance'];
  const PAY_HEADERS = ['Period ID', 'Staff ID', 'Name', 'Employment Type', 'Pay Kind', 'Rate ($)', 'Hrs/Week', 'Start Date', 'End Date'];

  async function exportTeam(rows, compCurrentByStaff) {
    const btn = el.querySelector('#export-team-btn');
    if (!btn || btn.disabled) return;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Exporting…';
    try {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Team');
      ws.columns = EXPORT_HEADERS.map(h => ({ header: h, width: h === 'ID' ? 38 : h === 'Name' ? 24 : h === 'Health Insurance' ? 16 : 14 }));
      ws.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0A493C' } };
      });
      rows.forEach(s => {
        ws.addRow([
          s.id, s.name, s.department || '', s.start_date || '',
          STATUS_LABEL[STATUS_OF(s)], s.end_date || '', s.work_state || '',
          s.tracks_capacity ? 'Y' : 'N',
          s.enrolled_401k ? 'Y' : 'N', s.enrolled_health_insurance ? 'Y' : 'N'
        ]);
      });
      // ID stays in the file (import matches by it, not by name) but hidden —
      // it's a join key, not something a human should read or hand-edit.
      ws.getColumn(1).hidden = true;

      const ws2 = wb.addWorksheet('Pay Periods');
      ws2.columns = PAY_HEADERS.map(h => ({ header: h, width: h === 'Period ID' || h === 'Staff ID' ? 38 : h === 'Name' ? 24 : h === 'Employment Type' ? 16 : 13 }));
      ws2.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0A493C' } };
      });
      // Every visible person gets a row, even with no comp period yet —
      // blank Kind/Rate/Type/Start Date cells are exactly what "fill in the
      // ledger" means for someone with nothing entered so far.
      rows.forEach(s => {
        const cp = compCurrentByStaff[s.id];
        ws2.addRow([
          cp ? cp.id : '', s.id, s.name,
          cp ? (EMP_LABELS[cp.employment_type] || cp.employment_type) : '',
          cp ? (cp.kind === 'hourly' ? 'Hourly' : 'Salary') : '',
          cp ? +fromCents(cp.kind === 'hourly' ? cp.hourly_cost : cp.annual_cost) : '',
          cp ? cp.weekly_capacity : '',
          cp ? cp.starts_on : '',
          '' // always blank on export — this row IS the currently-open period
        ]);
      });
      ws2.getColumn(1).hidden = true;
      ws2.getColumn(2).hidden = true;

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `emg-team_${iso(new Date())}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Export failed: ' + (err.message || err));
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  // ExcelJS gives a JS Date for date-formatted cells, a plain string/number
  // for text cells, and one of several plain OBJECTS for anything else — a
  // formula ({formula,result}), a rich-text run ({richText:[...]}), a
  // hyperlink ({text,hyperlink}), or a cell error (#REF!/#N/A, {error:...}).
  // Unwrap each to the real value instead of falling through to a bare
  // String(v), which silently stringifies any of those objects to the
  // literal text "[object Object]" — exactly what corrupted Andrew Benci's
  // hire date on 2026-08-31: that string reached Postgres as a real date
  // value and only failed there, as a cryptic "invalid input syntax for
  // type date" with no indication of which cell or field was actually
  // wrong. An error cell or an unrecognized shape returns UNPARSEABLE so
  // the caller can reject the row with a clear reason instead.
  const UNPARSEABLE = Symbol('unparseable date cell');
  const cellDate = v => {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) return iso(v);
    if (typeof v === 'object') {
      if ('result' in v) return cellDate(v.result);
      if ('richText' in v) return cellDate(v.richText.map(r => r.text).join(''));
      if ('text' in v) return cellDate(v.text);
      return UNPARSEABLE;
    }
    const s = String(v).trim();
    return s || null;
  };
  const cellBool = v => /^(y|yes|true|1)$/i.test(String(v ?? '').trim());
  const cellNumber = v => { const n = +String(v ?? '').replace(/,/g, '').trim(); return Number.isFinite(n) && String(v ?? '').trim() !== '' ? n : null; };

  async function handleImportFile(file, staffById, compCurrentByStaff) {
    try {
      const buf = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(buf);
      const ws = wb.getWorksheet('Team');
      if (!ws) throw new Error('no "Team" sheet found in that file');

      // Match columns by header TEXT, not position — a reordered or
      // hand-edited copy of the export still parses correctly.
      const colByHeader = {};
      ws.getRow(1).eachCell((cell, colNumber) => {
        colByHeader[String(cell.value || '').trim().toLowerCase()] = colNumber;
      });
      const needed = ['id', 'name', 'department', 'hire date', 'status', 'end date', 'work state', 'tracks capacity', '401k', 'health insurance'];
      const missingCols = needed.filter(h => !colByHeader[h]);
      if (missingCols.length) throw new Error(`"Team" sheet missing column(s): ${missingCols.join(', ')}`);
      const get = (row, header) => row.getCell(colByHeader[header]).value;
      const stateCodes = new Set(US_STATES.map(([code]) => code));

      const changes = []; // { id, name, fields, diffLines }
      const rowErrors = []; // { row, reason }

      for (let r = 2; r <= ws.rowCount; r++) {
        const row = ws.getRow(r);
        if (row.cellCount === 0) continue;
        const id = String(get(row, 'id') || '').trim();
        if (!id) continue; // blank row — not a data row, not a "create new person" (import never inserts)
        const existing = staffById[id];
        if (!existing) { rowErrors.push({ row: r, reason: `no matching person for id ${id}` }); continue; }
        // Name is never written by this import (a name is a legal-identity fact,
        // not a bulk-editable field) — it's read-only here, used ONLY as a
        // sanity check that this row's hidden ID still lines up with the person
        // a human would recognize by the visible Name cell next to it. A
        // mismatch means the file's rows got shuffled relative to that hidden
        // column (a sort or paste that moved visible cells without it) — real
        // incident, not hypothetical: see the 2026-08-30 Team Hours name-swap.
        // The WHOLE row is rejected rather than just skipping the name write,
        // since a misaligned row's other fields (department, dates, status)
        // are equally suspect once the ID/Name pairing itself is broken.
        const sheetName = String(get(row, 'name') || '').trim();
        if (sheetName && sheetName !== existing.name) {
          rowErrors.push({ row: r, reason: `name mismatch: file says "${sheetName}" but id ${id} is "${existing.name}" on file — row skipped (rows may have been reordered before import)` });
          continue;
        }

        const statusRaw = String(get(row, 'status') || '').trim().toLowerCase();
        if (!STATUS_LABEL[statusRaw]) {
          rowErrors.push({ row: r, reason: `unrecognized status "${get(row, 'status')}" (must be Active/Ended/Inactive)` }); continue;
        }
        const end_date = cellDate(get(row, 'end date'));
        if (end_date === UNPARSEABLE) {
          rowErrors.push({ row: r, reason: 'End Date cell is not a plain date (a formula, link, or error cell?) — row skipped' }); continue;
        }
        if (statusRaw === 'ended' && !end_date) {
          rowErrors.push({ row: r, reason: 'Status is Ended but End Date is blank' }); continue;
        }
        const stateRaw = String(get(row, 'work state') || '').trim().toUpperCase();
        if (stateRaw && !stateCodes.has(stateRaw)) {
          rowErrors.push({ row: r, reason: `unrecognized work state "${stateRaw}"` }); continue;
        }
        const hire_date = cellDate(get(row, 'hire date'));
        if (hire_date === UNPARSEABLE) {
          rowErrors.push({ row: r, reason: 'Hire Date cell is not a plain date (a formula, link, or error cell?) — row skipped' }); continue;
        }

        const fields = {
          department: String(get(row, 'department') || '').trim() || null,
          start_date: hire_date,
          end_date: statusRaw === 'ended' ? end_date : null,
          active: statusRaw !== 'inactive',
          work_state: stateRaw || null,
          tracks_capacity: cellBool(get(row, 'tracks capacity')),
          enrolled_401k: cellBool(get(row, '401k')),
          enrolled_health_insurance: cellBool(get(row, 'health insurance'))
        };

        const diffLines = [
          ['Department', existing.department || '', fields.department || ''],
          ['Hire date', existing.start_date || '', fields.start_date || ''],
          ['Status', STATUS_LABEL[STATUS_OF(existing)], STATUS_LABEL[statusRaw]],
          ['End date', existing.end_date || '', fields.end_date || ''],
          ['Work state', existing.work_state || '', fields.work_state || ''],
          ['Tracks Capacity', existing.tracks_capacity ? 'Y' : 'N', fields.tracks_capacity ? 'Y' : 'N'],
          ['401k', existing.enrolled_401k ? 'Y' : 'N', fields.enrolled_401k ? 'Y' : 'N'],
          ['Health Insurance', existing.enrolled_health_insurance ? 'Y' : 'N', fields.enrolled_health_insurance ? 'Y' : 'N']
        ].filter(([, before, after]) => before !== after).map(([label, before, after]) => ({ label, before, after }));

        if (diffLines.length) changes.push({ id, name: existing.name, fields, diffLines });
      }

      // "Pay Periods" is optional on import — an old Team-only export (or a
      // hand-built sheet that only touches roster fields) still works fine
      // without it, rather than erroring for a sheet nobody meant to include.
      const periodChanges = []; // { action:'insert'|'update', periodId?, staffId, staffName, fields, diffLines? }
      const periodErrors = []; // { row, reason }
      const payWs = wb.getWorksheet('Pay Periods');
      if (payWs) {
        const pColByHeader = {};
        payWs.getRow(1).eachCell((cell, colNumber) => {
          pColByHeader[String(cell.value || '').trim().toLowerCase()] = colNumber;
        });
        const pNeeded = ['period id', 'staff id', 'name', 'employment type', 'pay kind', 'rate ($)', 'hrs/week', 'start date', 'end date'];
        const pMissing = pNeeded.filter(h => !pColByHeader[h]);
        if (pMissing.length) throw new Error(`"Pay Periods" sheet missing column(s): ${pMissing.join(', ')}`);
        const pGet = (row, header) => row.getCell(pColByHeader[header]).value;
        const EMP_TYPE_BY_LABEL = Object.fromEntries(EMP_TYPES.map(([val, lab]) => [lab.toLowerCase(), val]));

        const periodDiff = (before, employment_type, kindRaw, rate, cap, starts_on, ends_on) => [
          ['Employment Type', EMP_LABELS[before.employment_type] || before.employment_type, EMP_LABELS[employment_type] || employment_type],
          ['Pay Kind', before.kind === 'hourly' ? 'Hourly' : 'Salary', kindRaw === 'hourly' ? 'Hourly' : 'Salary'],
          ['Rate', fromCents(before.kind === 'hourly' ? before.hourly_cost : before.annual_cost), rate.toFixed(2)],
          ['Hrs/Week', String(before.weekly_capacity), String(cap)],
          ['Start date', before.starts_on, starts_on],
          ['End date', before.ends_on || '', ends_on || '']
        ].filter(([, b, a]) => String(b) !== String(a)).map(([label, before2, after]) => ({ label, before: before2, after }));

        for (let r = 2; r <= payWs.rowCount; r++) {
          const row = payWs.getRow(r);
          if (row.cellCount === 0) continue;
          const staffId = String(pGet(row, 'staff id') || '').trim();
          if (!staffId) continue; // blank row
          const existingStaff = staffById[staffId];
          if (!existingStaff) { periodErrors.push({ row: r, reason: `no matching person for staff id ${staffId}` }); continue; }
          // Same alignment sanity check as the Team sheet (see its own comment) —
          // Name here is never written, only compared against the hidden Staff
          // ID's real owner. A mismatch on THIS sheet is worse than on Team: it
          // would otherwise misapply pay/rate changes to the wrong person with
          // no name-based check at all.
          const sheetName = String(pGet(row, 'name') || '').trim();
          if (sheetName && sheetName !== existingStaff.name) {
            periodErrors.push({ row: r, reason: `name mismatch: file says "${sheetName}" but staff id ${staffId} is "${existingStaff.name}" on file — row skipped (rows may have been reordered before import)` });
            continue;
          }

          const typeLabel = String(pGet(row, 'employment type') || '').trim().toLowerCase();
          const employment_type = EMP_TYPE_BY_LABEL[typeLabel];
          if (!employment_type) { periodErrors.push({ row: r, reason: `unrecognized employment type "${pGet(row, 'employment type')}" (must be ${EMP_TYPES.map(t => t[1]).join('/')})` }); continue; }
          const kindRaw = String(pGet(row, 'pay kind') || '').trim().toLowerCase();
          if (!['salary', 'hourly'].includes(kindRaw)) { periodErrors.push({ row: r, reason: `unrecognized pay kind "${pGet(row, 'pay kind')}" (must be Salary/Hourly)` }); continue; }
          const rate = cellNumber(pGet(row, 'rate ($)'));
          if (rate == null || rate < 0) { periodErrors.push({ row: r, reason: 'Rate ($) must be a number, 0 or more' }); continue; }
          const cap = employment_type === 'full_time' ? 40 : (cellNumber(pGet(row, 'hrs/week')) || 40);
          const starts_on = cellDate(pGet(row, 'start date'));
          if (starts_on === UNPARSEABLE) {
            periodErrors.push({ row: r, reason: 'Start Date cell is not a plain date (a formula, link, or error cell?) — row skipped' }); continue;
          }
          if (!starts_on) { periodErrors.push({ row: r, reason: 'Start Date is required' }); continue; }
          const ends_on = cellDate(pGet(row, 'end date'));
          if (ends_on === UNPARSEABLE) {
            periodErrors.push({ row: r, reason: 'End Date cell is not a plain date (a formula, link, or error cell?) — row skipped' }); continue;
          }
          const costCents = toCents(rate);

          const fields = {
            starts_on, ends_on, kind: kindRaw, employment_type,
            annual_cost: kindRaw === 'salary' ? costCents : 0,
            hourly_cost: kindRaw === 'hourly' ? costCents : 0,
            weekly_capacity: cap
          };

          const periodIdRaw = String(pGet(row, 'period id') || '').trim();
          const current = compCurrentByStaff[staffId];
          if (periodIdRaw) {
            // Only the CURRENT open period is ever fetched client-side (this
            // sheet's own scope) — a period id that isn't that one isn't
            // something this import can safely locate or verify.
            if (!current || current.id !== periodIdRaw) {
              periodErrors.push({ row: r, reason: `period id ${periodIdRaw} isn't ${existingStaff.name}'s current open period` }); continue;
            }
            const diffLines = periodDiff(current, employment_type, kindRaw, rate, cap, starts_on, ends_on);
            if (diffLines.length) periodChanges.push({ action: 'update', periodId: current.id, staffId, staffName: existingStaff.name, fields, diffLines });
          } else if (current) {
            // No id given but an open period already exists — treated as an
            // update to THAT period (the same intent as looking its id up),
            // never a second period stacked open on top of it.
            const diffLines = periodDiff(current, employment_type, kindRaw, rate, cap, starts_on, ends_on);
            if (diffLines.length) periodChanges.push({ action: 'update', periodId: current.id, staffId, staffName: existingStaff.name, fields, diffLines });
          } else {
            // No period exists yet at all — safe to create fresh; there's
            // nothing for a brand first period to overlap with.
            periodChanges.push({ action: 'insert', staffId, staffName: existingStaff.name, fields });
          }
        }
      }

      if (!changes.length && !rowErrors.length && !periodChanges.length && !periodErrors.length) {
        alert('No changes detected — nothing to import.'); return;
      }
      showImportPreview(changes, rowErrors, periodChanges, periodErrors);
    } catch (err) {
      alert('Import failed: ' + (err.message || err));
    }
  }

  // A bulk write across many people at once is exactly the kind of action
  // worth a real preview, not a blind "file picked -> rows written" — every
  // detected change is listed field-by-field before anything touches the
  // database, and rows that couldn't be matched/validated are shown as
  // skipped rather than silently dropped.
  function showImportPreview(changes, rowErrors, periodChanges, periodErrors) {
    const totalChanges = changes.length + periodChanges.length;
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title" style="max-width:760px">
      <div class="modal-head">
        <span class="modal-title" id="import-title">Import preview</span>
        <button class="mclose">Close ✕</button>
      </div>
      <div class="modal-body">
        ${rowErrors.length || periodErrors.length ? `<div class="sc-eyebrow" style="color:var(--rust)">Skipped rows (${rowErrors.length + periodErrors.length})</div>
          <ul style="font-size:12px;color:var(--rust);margin:0 0 12px 18px">
            ${rowErrors.map(e => `<li>Team row ${e.row}: ${esc(e.reason)}</li>`).join('')}
            ${periodErrors.map(e => `<li>Pay Periods row ${e.row}: ${esc(e.reason)}</li>`).join('')}
          </ul>` : ''}
        ${changes.length ? `<div class="sc-eyebrow">Roster changes (${changes.length} ${changes.length===1?'person':'people'})</div>
          <div class="gridwrap" style="max-height:280px;overflow-y:auto;margin-bottom:14px">
          <table class="ledger"><thead><tr><th scope="col">name</th><th scope="col">field</th><th scope="col">was</th><th scope="col">now</th></tr></thead>
          <tbody>
            ${changes.map(c => c.diffLines.map((d, i) => `<tr>
                <td class="textleft">${i===0?esc(c.name):''}</td>
                <td class="textleft">${esc(d.label)}</td>
                <td class="muted">${esc(d.before||'—')}</td>
                <td>${esc(d.after||'—')}</td>
              </tr>`).join('')).join('')}
          </tbody></table>
          </div>` : ''}
        ${periodChanges.length ? `<div class="sc-eyebrow">Pay period changes (${periodChanges.length})</div>
          <div class="gridwrap" style="max-height:280px;overflow-y:auto">
          <table class="ledger"><thead><tr><th scope="col">name</th><th scope="col">action</th><th scope="col">field</th><th scope="col">was</th><th scope="col">now</th></tr></thead>
          <tbody>
            ${periodChanges.map(c => c.action === 'insert'
              ? `<tr><td class="textleft">${esc(c.staffName)}</td><td class="textleft">new period</td>
                   <td class="textleft" colspan="3">${esc(EMP_LABELS[c.fields.employment_type] || c.fields.employment_type)} · ${esc(c.fields.kind === 'hourly' ? 'Hourly' : 'Salary')} $${esc(fromCents(c.fields.kind === 'hourly' ? c.fields.hourly_cost : c.fields.annual_cost))} · ${esc(String(c.fields.weekly_capacity))}h/wk from ${esc(c.fields.starts_on)}</td></tr>`
              : c.diffLines.map((d, i) => `<tr>
                  <td class="textleft">${i===0?esc(c.staffName):''}</td>
                  <td class="textleft">${i===0?'update current':''}</td>
                  <td class="textleft">${esc(d.label)}</td>
                  <td class="muted">${esc(d.before||'—')}</td>
                  <td>${esc(d.after||'—')}</td>
                </tr>`).join('')
            ).join('')}
          </tbody></table>
          </div>` : ''}
        ${!changes.length && !periodChanges.length ? `<div class="muted" style="font-size:12px">No changes to apply.</div>` : ''}
      </div>
      <div class="modal-foot">
        <span class="err" id="import-apply-msg" style="flex:1;font-size:11px"></span>
        <button class="ghost import-cancel">Cancel</button>
        ${totalChanges ? `<button class="primary import-apply">Apply ${totalChanges} change${totalChanges===1?'':'s'}</button>` : ''}
      </div>
    </div>`;
    document.body.appendChild(back);
    const closeThis = () => back.remove();
    back.onclick = e => { if (e.target === back) closeThis(); };
    back.querySelector('.mclose').onclick = closeThis;
    back.querySelector('.import-cancel').onclick = closeThis;
    const applyBtn = back.querySelector('.import-apply');
    if (applyBtn) applyBtn.onclick = async () => {
      applyBtn.disabled = true; applyBtn.textContent = 'Applying…';
      let okCount = 0; const failMsgs = [];
      for (const c of changes) {
        const { error } = await supa.from('staff').update(c.fields).eq('id', c.id);
        if (error) failMsgs.push(`${c.name}: ${error.message}`); else okCount++;
      }
      for (const c of periodChanges) {
        const { error } = c.action === 'insert'
          ? await supa.from('comp_periods').insert({ ...c.fields, staff_id: c.staffId, set_by: window.__email })
          : await supa.from('comp_periods').update(c.fields).eq('id', c.periodId);
        if (error) failMsgs.push(`${c.staffName}: ${error.message}`); else okCount++;
      }
      if (failMsgs.length) {
        back.querySelector('#import-apply-msg').textContent = `${okCount} updated, ${failMsgs.length} failed: ${failMsgs.join('; ')}`;
        applyBtn.disabled = false; applyBtn.textContent = `Apply ${totalChanges} changes`;
      } else {
        closeThis();
        load();
      }
    };
  }

  // Deliberately not the same single confirm() the per-row comp/bonus
  // deletes use (line ~188/233) — this deletes EVERY comp_periods row and
  // EVERY staff_bonuses row for EVERY person on the roster, not one row for
  // one person, and comp_periods is an append-only ledger with no other
  // backup anywhere (see its own table comment, db/001) — once gone, a past
  // rate or raise cannot be reconstructed. A typed phrase is a much higher
  // bar than a click-through confirm, on purpose, for exactly that gap in
  // blast radius. Requested 2026-08-31 (Boris, after the Team import
  // name-swap incident) explicitly to start compensation over from scratch
  // — NOT scoped to the people that incident affected, and NOT touching
  // name/department/dates/work state/401k/health-insurance-enrolled, which
  // were the incident's actual damage and are already repaired separately;
  // this button only ever touches comp_periods/staff_bonuses.
  function showClearCompModal() {
    const PHRASE = 'CLEAR ALL COMP DATA';
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="clearcomp-title" style="max-width:520px">
      <div class="modal-head">
        <span class="modal-title" id="clearcomp-title">Clear all compensation data</span>
        <button class="mclose">Close ✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--rust);font-weight:600;margin:0 0 10px">This permanently deletes, for every person on the roster:</p>
        <ul style="font-size:12px;margin:0 0 14px 18px;line-height:1.6">
          <li>Every comp period — every rate, salary, hourly cost, and hours/week ever entered, for anyone, at any time</li>
          <li>Every scheduled bonus</li>
        </ul>
        <p style="font-size:12px;color:var(--slate);margin:0 0 14px">
          This is not limited to the people affected by the recent import incident — it clears everyone's pay history,
          including anyone never touched by that bug. Comp periods are an append-only ledger with no other backup:
          once deleted, a past rate or raise cannot be recovered. Names, departments, hire dates, and other roster
          fields are untouched by this — only pay and bonus data.
        </p>
        <label style="font-size:12px;display:block;margin-bottom:6px">Type <b>${PHRASE}</b> to confirm:</label>
        <input id="clearcomp-confirm-input" style="width:100%" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-foot">
        <span class="err" id="clearcomp-msg" style="flex:1;font-size:11px"></span>
        <button class="ghost clearcomp-cancel">Cancel</button>
        <button class="danger clearcomp-apply" disabled>Delete everything</button>
      </div>
    </div>`;
    document.body.appendChild(back);
    const closeThis = () => back.remove();
    back.onclick = e => { if (e.target === back) closeThis(); };
    back.querySelector('.mclose').onclick = closeThis;
    back.querySelector('.clearcomp-cancel').onclick = closeThis;
    const input = back.querySelector('#clearcomp-confirm-input');
    const applyBtn = back.querySelector('.clearcomp-apply');
    input.oninput = () => { applyBtn.disabled = input.value !== PHRASE; };
    applyBtn.onclick = async () => {
      applyBtn.disabled = true; applyBtn.textContent = 'Deleting…';
      const [cp, bn] = await Promise.all([
        supa.from('comp_periods').delete().not('id', 'is', null),
        supa.from('staff_bonuses').delete().not('id', 'is', null)
      ]);
      if (cp.error || bn.error) {
        back.querySelector('#clearcomp-msg').textContent =
          `Failed: ${[cp.error, bn.error].filter(Boolean).map(e => e.message).join('; ')}`;
        applyBtn.disabled = false; applyBtn.textContent = 'Delete everything';
        return;
      }
      closeThis();
      load();
    };
  }

  const STATUS_RANK = { active: 2, ended: 1, inactive: 0 };
  // comp/total_cost read values render() attaches to each staff row just
  // before sorting (_compAnnual/_totalCost) — both need per-render context
  // (compCurrentByStaff/totalCostByStaff) that these accessors don't close
  // over, so the value is computed once and hung on the row instead. Null
  // sorts as -1 (lowest), so "no comp entered yet"/"no current period"
  // rows settle at whichever end makes sense for the current sort direction
  // rather than breaking the comparison.
  const SORT_ACCESSORS = {
    name: s => s.name.toLowerCase(),
    department: s => (s.department || '').toLowerCase(),
    start_date: s => s.start_date || '',
    end_date: s => s.end_date || '',
    active: s => STATUS_RANK[STATUS_OF(s)],
    comp: s => s._compAnnual ?? -1,
    total_cost: s => s._totalCost ?? -1
  };
  const HCOLS = [
    ['name', 'Name'], ['department', 'Department'], ['comp', 'Comp'], ['total_cost', 'Total Cost'],
    ['start_date', 'Hire date'], ['end_date', 'End date'], ['active', 'Status'], [null, '']
  ];

  function render(staff, comp, totalCost, bonuses) {
    compAllByStaffLive = {};
    comp.forEach(c => (compAllByStaffLive[c.staff_id] = compAllByStaffLive[c.staff_id] || []).push(c));
    bonusesByStaffLive = {};
    (bonuses || []).forEach(b => (bonusesByStaffLive[b.staff_id] = bonusesByStaffLive[b.staff_id] || []).push(b));
    const compCurrentByStaff = {};
    comp.forEach(c => { if (c.ends_on === null) compCurrentByStaff[c.staff_id] = c; });
    // Distinct from compCurrentByStaff (the OPEN period, used by the xlsx
    // export/import round-trip on purpose — see that section's own comment):
    // this is the period that actually COVERS today, which is not the same
    // thing once a raise has been entered ahead of its start date. An open
    // period with a future starts_on is real and correct to have on file,
    // but showing it as today's pay (Comp column, sort, v_staff_total_cost
    // cross-checks) reads as a bug the moment someone compares it against
    // Total Cost, which already resolves by date correctly server-side.
    const today = iso(new Date());
    const compEffectiveByStaff = {};
    comp.forEach(c => {
      if (c.starts_on <= today && (c.ends_on === null || c.ends_on >= today)) {
        compEffectiveByStaff[c.staff_id] = c;
      }
    });
    // v_staff_total_cost (041) — one live row per staff member, fully loaded
    // annual cost (base pay + employer FICA/FUTA/workers-comp + 401k match +
    // health insurance, each gated by its own real-world condition even when
    // the person's own checkbox is on). Null when there's no current comp
    // period to derive a rate from — same "real gap, not a guess" stance
    // staff_hourly_cost has always taken.
    const totalCostByStaff = {};
    totalCost.forEach(t => { totalCostByStaff[t.staff_id] = t.total_annual_cost; });
    // Sortable Comp/Total Cost need this same per-render lookup context, so
    // the value's computed once here and attached directly to each row.
    staff.forEach(s => {
      const c = compEffectiveByStaff[s.id];
      s._compAnnual = c ? (c.kind === 'hourly' ? c.hourly_cost * c.weekly_capacity * 52 : c.annual_cost) : null;
      s._totalCost = totalCostByStaff[s.id] ?? null;
    });

    const departments = [...new Set(staff.map(s => s.department).filter(Boolean))].sort();
    const q = query.trim().toLowerCase();
    const staffById = {}; staff.forEach(s => staffById[s.id] = s);
    const visible = staff
      .filter(s => showInactive || s.active)
      .filter(s => !deptFilter || s.department === deptFilter)
      .filter(s => !q || s.name.toLowerCase().includes(q));
    const rows = visible.slice().sort((a, b) => {
      const av = SORT_ACCESSORS[tableSort.key](a), bv = SORT_ACCESSORS[tableSort.key](b);
      if (av !== bv) return (av < bv ? -1 : 1) * tableSort.dir;
      return a.name.localeCompare(b.name);
    });

    el.querySelector('#panel').innerHTML = `
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:14px">
        <span class="muted" style="font-size:11px" title="Two sheets: roster fields (name/department/dates/status/work state/401k/health insurance), and each person's CURRENT pay period only — full compensation history isn't part of this round trip, and import only updates people already on the roster, never adds new ones">Export/Import: roster + current pay, no new hires</span>
        <button class="ghost" id="export-team-btn">Export</button>
        <button class="ghost" id="import-team-btn">Import</button>
        <input type="file" id="import-file-input" accept=".xlsx" hidden>
        <button class="danger" id="clear-comp-btn" title="Permanently delete every comp period and bonus, for everyone">Clear All Comp Data</button>
        <button class="primary" id="add-staff-btn">+ Add person</button>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input id="q" placeholder="search name…" value="${esc(query)}" style="width:180px">
          <select id="dept-filter">
            <option value="">All departments</option>
            ${departments.map(d=>`<option value="${esc(d)}" ${d===deptFilter?'selected':''}>${esc(d)}</option>`).join('')}
          </select>
          <label class="mono" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate)">
            <input type="checkbox" id="show-inactive" ${showInactive?'checked':''}> show inactive
          </label>
          <span class="muted" id="count" style="font-size:11px">${rows.length} of ${staff.length} shown</span>
        </div>
        <div class="gridwrap">
        <table class="ledger">
          <thead><tr>${HCOLS.map(([k, label]) => k
            ? `<th data-sort="${k}" scope="col" tabindex="0" role="columnheader" aria-sort="${tableSort.key===k?(tableSort.dir<0?'descending':'ascending'):'none'}">${label}${tableSort.key===k?`<span class="dir">${tableSort.dir<0?'▼':'▲'}</span>`:''}</th>`
            : `<th scope="col"${label?'':' style="cursor:default"'}>${label}</th>`
          ).join('')}</tr></thead>
          <tbody>
          ${!rows.length ? `<tr><td colspan="8" class="empty-note">No people match the current filters.</td></tr>` : rows.map(s => {
            const comp = compEffectiveByStaff[s.id];
            const periodCount = (compAllByStaffLive[s.id] || []).length;
            const stat = STATUS_OF(s);
            const totalAnnual = totalCostByStaff[s.id];
            return `<tr class="${stat!=='active'?'muted':''}" data-id="${s.id}" style="cursor:pointer">
                <td>${esc(s.name)}</td>
                <td>${s.department ? esc(s.department) : '<span class="muted">—</span>'}${s.tracks_capacity === false ? ` <span class="muted" style="font-size:10.5px" title="Not counted toward capacity/utilization on Team Hours or Home">(non-capacity)</span>` : ''}</td>
                <td>${comp
                  ? (comp.kind === 'hourly'
                      ? `$${(comp.hourly_cost/100).toLocaleString()}/hr · ${comp.weekly_capacity}h/wk`
                      : `$${(comp.annual_cost/100).toLocaleString()}/yr · ${comp.weekly_capacity}h/wk`)
                  : '<span class="muted">not set</span>'}
                  ${comp && comp.employment_type !== 'full_time' ? `<span class="muted" style="font-size:10.5px"> · ${esc(EMP_LABELS[comp.employment_type] || comp.employment_type)}</span>` : ''}
                  ${periodCount ? `<span class="muted" style="font-size:10.5px"> (${periodCount} period${periodCount===1?'':'s'})</span>` : ''}</td>
                <td title="Base pay + employer FICA/FUTA/workers' comp + 401k match + health insurance, each as applicable">${totalAnnual != null ? `$${Math.round(totalAnnual/100).toLocaleString()}/yr` : '<span class="muted">—</span>'}</td>
                <td>${fmtDate(s.start_date)}</td>
                <td>${fmtDate(s.end_date)}</td>
                <td><span class="pill ${STATUS_PILL[stat]}">${stat}</span></td>
                <td style="white-space:nowrap">
                  <button class="ghost edit-btn" data-id="${s.id}">Edit</button>
                  <button class="ghost toggle-active-btn" data-id="${s.id}">${s.active?'Deactivate':'Reactivate'}</button>
                </td>
              </tr>`;
          }).join('')}
          </tbody>
        </table>
        </div>
      </div>`;

    wireSearch(el, '#q', v => { query = v; render(staff, comp, totalCost); });
    el.querySelector('#dept-filter').onchange = e => { deptFilter = e.target.value; render(staff, comp, totalCost); };
    el.querySelector('#show-inactive').onchange = e => { showInactive = e.target.checked; render(staff, comp, totalCost); };
    el.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const k = th.dataset.sort;
        tableSort = { key: k, dir: tableSort.key === k ? -tableSort.dir : (['active','comp','total_cost'].includes(k) ? -1 : 1) };
        render(staff, comp, totalCost);
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
    el.querySelector('#add-staff-btn').onclick = () => {
      openModal(el.querySelector('#add-staff-btn'), 'create', null);
    };
    el.querySelector('#export-team-btn').onclick = () => exportTeam(rows, compCurrentByStaff);
    el.querySelector('#import-team-btn').onclick = () => el.querySelector('#import-file-input').click();
    el.querySelector('#clear-comp-btn').onclick = showClearCompModal;
    el.querySelector('#import-file-input').onchange = e => {
      const file = e.target.files[0];
      e.target.value = ''; // lets the same file be re-picked next time
      if (file) handleImportFile(file, staffById, compCurrentByStaff);
    };
    el.querySelectorAll('.edit-btn').forEach(btn => btn.onclick = e => {
      e.stopPropagation();
      openModal(btn, 'edit', staffById[btn.dataset.id]);
    });
    el.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.onclick = () => {
      openModal(tr, 'edit', staffById[tr.dataset.id]);
    });
    el.querySelectorAll('.toggle-active-btn').forEach(btn => btn.onclick = async e => {
      e.stopPropagation();
      const s = staffById[btn.dataset.id];
      if (s.active && !confirm(`Deactivate "${s.name}"?`)) return;
      // Reactivating clears any lingering end_date — otherwise they'd land
      // back on "ended" instead of "active" despite the explicit reactivate.
      const payload = s.active ? { active: false } : { active: true, end_date: null };
      const { error } = await supa.from('staff').update(payload).eq('id', s.id);
      if (error) { alert(error.message); return; }
      load();
    });

    // if a person's edit modal is open across this (re)render — e.g. after
    // saving a comp period from inside it — refresh just its history table
    // with the freshly loaded periods rather than closing the modal
    if (editState && editState.mode === 'edit') {
      const back = document.querySelector('.modal-back');
      const tbody = back && back.querySelector('#modal-periods-tbl tbody');
      if (tbody) {
        const periods = (compAllByStaffLive[editState.id] || []).slice().sort((a, b) => b.starts_on.localeCompare(a.starts_on));
        tbody.innerHTML = periodsHtml(periods);
        wirePeriodHandlers(editState.id, back.querySelector('.modal-body'));
      }
      const bonusTbody = back && back.querySelector('#modal-bonuses-tbl tbody');
      if (bonusTbody) {
        const bonuses = (bonusesByStaffLive[editState.id] || []).slice().sort((a, b) => b.pay_date.localeCompare(a.pay_date));
        bonusTbody.innerHTML = bonusesHtml(bonuses);
        wireBonusHandlers(editState.id, back.querySelector('.modal-body'));
      }
    }
  }

  await load();
});
</script></body></html>
