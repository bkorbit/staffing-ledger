<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Scoping</title><link rel="stylesheet" href="./assets/style.css?v=760727b">
<style>
/* page-local: the editor's sections and grids. Cards reuse forecast's .linecard system.
   ONE gutter system: full-width panels (.sc-panel padding 16px 18px) and the summary
   strip; bare control rows are .toolbar (inset 18px) so their controls sit on the
   panels' inner edge. Nothing else carries a horizontal margin. */
.sc-bar > button, .sc-bar > select, .sc-bar > input, .sc-bar .rp .seg { height:30px; }
.sc-bar .rp .seg { padding:0 9px; }
.sc-bar .rp.rp-sm .seg { height:28px; }
.sc-bar .pill { align-self:center; }
.sc-bar input.dname { flex:1 1 220px; min-width:160px; font-family:var(--font-body); font-size:14px; font-weight:600; }
.sc-deal { border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); padding:12px 18px 14px; margin-bottom:14px; }
.sc-dealtop { display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:26px; margin-bottom:10px; }
.sc-dealform { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.sc-dealform label.name { grid-column:span 2; }
.sc-form input.dname { font-family:var(--font-body); font-size:14px; font-weight:600; }
@media (max-width:640px) { .sc-dealform label.name { grid-column:1 / -1; } }
.sc-deal .linecards { margin-top:12px; }
.sc-addline { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.sc-addline button { padding:4px 10px; font-size:11px; }
table.bands { width:auto; margin-top:4px; }
table.bands th, table.bands td { padding:2px 4px; border:none; text-align:left; }
table.bands input { width:96px; height:30px; text-align:right; font-family:var(--font-mono); font-size:11.5px; }
table.bands button { padding:1px 7px; font-size:11px; }
/* the hour grids (demand, supply, drivers) share one column system: a fixed label
   column and equal month columns, so a month lands at the same x in every table */
.sc-grid { width:auto; }
.sc-grid th, .sc-grid td { padding:4px 6px; white-space:nowrap; }
.sc-grid th:first-child, .sc-grid td:first-child { min-width:150px; max-width:200px; text-align:left; overflow:hidden; text-overflow:ellipsis; }
.sc-grid th:not(:first-child), .sc-grid td:not(:first-child) { padding:3px 4px; }   /* sized by content: twelve months fit without a scroll */
.sc-grid input.hcell { width:54px; height:30px; text-align:right; font-family:var(--font-mono); font-size:11.5px; padding:0 4px; }   /* 30px: the page's one control height */
.sc-grid th.per, .sc-grid td.per { border-right:2px solid var(--line); background:var(--wash-row); }
.sc-grid input.hcell.per { font-weight:600; }
.sc-grid tr.dept td { background:var(--wash-col); font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); text-align:left; max-width:none; }
.sc-grid tr.ph td:first-child { color:var(--slate); font-style:italic; }
.sc-grid tr.auto input.hcell { color:var(--slate); font-style:italic; }
.sc-grid tr.gap td { color:var(--slate); font-style:italic; }
.sc-grid tr.gap td.bad { color:var(--rust); font-style:normal; font-weight:600; }
.sc-grid td.addrow { max-width:none; width:auto; white-space:normal; }
.sc-grid .cap { font-size:9px; padding:0 5px; margin-left:3px; vertical-align:middle; }
.sc-hint { font-family:var(--font-mono); font-size:9.5px; color:var(--slate); margin-top:2px; }
.sc-cands { font-size:10.5px; color:var(--slate); margin:4px 0 8px; }
.sc-cands b { color:var(--ink); font-weight:600; }
.sc-vstrip { display:flex; gap:6px; flex-wrap:wrap; padding:6px 14px 12px; }
.sc-callout { background:var(--gold-bg); padding:8px 12px; font-size:12px; margin:6px 14px 12px; border-radius:6px; }
.sc-callout.bad { background:var(--rust-bg); }
.sc-note { font-size:11px; color:var(--slate); }
/* deal terms + quick check: one form grid, labels in the mono caption voice */
.sc-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 24px; align-items:end; }
.sc-form label { display:flex; flex-direction:column; gap:4px; font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); min-width:0; }
.sc-form label.wide { grid-column:1 / -1; }
.sc-form input, .sc-form select { height:30px; font-size:12px; width:100%; min-width:0; }
.sc-form .row { display:flex; gap:6px; align-items:center; }
.sc-form .row input, .sc-form .row select { flex:1; }
.sc-form .row .unit { font-family:var(--font-mono); font-size:11px; color:var(--slate); flex:none; }
.gold-chip { display:inline-block; background:var(--gold-bg); color:var(--ink); padding:1px 6px; border-radius:4px; }
tr.namerow[data-open] { cursor:pointer; }
/* structure: the section titles ARE headings — same eyebrow voice, real <h2> */
h2.sc-eyebrow { margin:0 0 10px; font-weight:500; line-height:1.4; }
h2.sc-eyebrow.tight { margin:0; }
h2.sc-eyebrow.inset { padding:12px 18px 0; margin:0; }
h2.sc-eyebrow.inset14 { padding:12px 14px 0; margin:0; }
/* helpers that replace the inline styles the page kept repeating */
.sc-panel.flush { padding:0; }
.gridwrap.tight { margin-top:0; }
.gridwrap.gap6, .sc-note.gap6 { margin-top:6px; }
.sc-note.lead { margin-bottom:8px; }
.chart-head.flush { padding:0 0 6px; }
.sc-btn-sm { padding:3px 9px; font-size:11px; }
.sc-x { padding:0; width:24px; height:24px; min-width:24px; line-height:22px; font-size:12px; text-align:center; }   /* a real hit area for × */
.nowrap { white-space:nowrap; }
.sc-back { font-size:12px; }
.summary-value .muted { font-size:12px; }
.sc-linkbtn { border:none; background:none; padding:0; height:auto; color:var(--brand-2); text-decoration:underline; text-underline-offset:2px; font:inherit; cursor:pointer; }
.sc-linkbtn:hover { color:var(--brand); }
.sc-bar input.vlabel { flex:0 1 190px; min-width:120px; font-size:11px; font-family:var(--font-mono); }
#sc-msg { font-size:12px; }
#sc-msg.err { background:var(--rust-bg); padding:2px 8px; border-radius:4px; }
/* seven cells, even columns; a wrapped cell keeps its width instead of stretching */
#sc-strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
.sc-vstrip .pill .why { font-weight:600; opacity:.9; }
@media (prefers-reduced-motion: reduce) { .chart-tip { transition:none; } }
@media (max-width:640px) { .sc-dealhead input.dname { flex-basis:100%; } .sc-grid th:first-child, .sc-grid td:first-child { min-width:120px; max-width:140px; } }
</style></style></head><body>
<script type="module">
import { boot, esc, fmt$, wireSearch, fetchAll } from './assets/shell.js?v=760727b';
import { lineFee, lineRebate, progSuggestMargin, progDealMargin, progParams, lineMonth, scopeMonths, monthsBetween, shiftM, spreadTotal, fitModel } from './assets/scope-math.js?v=760727b';
import { loadStatus, statusPill, fmtH, mLabel, thisMonth } from './assets/capacity.js?v=760727b';
import { scopeChart, verdictStrip, scopeStat, STATUS_LABEL, STATUS_PILL } from './assets/scope-chart.js?v=760727b';
import { parseFile, mergeMonths, PLATFORMS, DRIVER_LABELS } from './assets/parsers/index.js?v=760727b';

// Is this deal viable? A scope is the commercial plan (channels, fee
// structures, rebates, programmatic model) for one or several future deals,
// the hours it will take per department per month, who will do them, and the
// verdict: GP − rebate − labor per month and overall, profit per hour against
// the company target, capacity of the named people, and the client's
// roll-up. Decided with Boris 13 Sep 2026; db/096 + 097.
//
// One RPC opens a scope (scope_page): the editable state plus econ, labor as
// ONE number (never per person — salary privacy), staffing suggestions, the
// verdict, versions and scenario siblings. Money totals are recomputed live
// in the browser with scope-math.js — the JS twin of scope_months / line_fee —
// while labor, capacity and the client roll-up come only from the server and
// refresh on Save. Save = save_scope (atomic, appends a version); Propose /
// Approve / Un-approve are their own RPCs; approve reserves the named hours
// in assignments (Hour Planning shows them). Promote lands in 100.
boot('scoping', async (supa, el) => {
  const KINDS = ['retainer', 'creative', 'search', 'social', 'programmatic', 'hourly'];
  const MEDIA = k => k === 'search' || k === 'social' || k === 'programmatic';
  const isHourlyL = l => l.kind === 'hourly' || (l.kind === 'creative' && String(l.label || '').startsWith('creative:hourly'));
  const isFlatL = l => l.kind === 'retainer' || l.kind === 'custom' || (l.kind === 'creative' && !isHourlyL(l));
  const kindLabel = l => l.kind === 'creative' ? `creative · ${isHourlyL(l) ? 'hourly' : 'retainer'}`
    : (l.kind === 'hourly' && l.label) ? `hourly · ${l.label}` : l.kind;
  const $ = c => (c / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const dollars = c => (c === null || c === undefined || c === '' || isNaN(c)) ? '' : String(Math.round(+c) / 100);
  const cents = v => { const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return Number.isFinite(n) ? Math.round(n * 100) : 0; };
  const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
  const uuidRe = /^[0-9a-f-]{36}$/;
  const me = () => (window.__email || '').toLowerCase();

  let S = null;   // the editable scope (scope_state shape)
  let PRE = null; // 106: a page handed over by the action that produced it (no second trip)
  let X = null;   // the rest of scope_page
  let L = null;   // list payload
  let dirty = false;
  let route = { view: 'list' };
  const panel = () => el.querySelector('#panel');
  el.innerHTML = `<div id="panel">loading…</div>`;

  // ---- routing ------------------------------------------------------------
  function parseHash() {
    const h = (location.hash || '#list').replace(/^#/, '');
    let m;
    if ((m = h.match(/^s\/([0-9a-f-]{36})$/))) return { view: 'scope', id: m[1] };
    if ((m = h.match(/^c\/([0-9a-f-]{36})$/))) return { view: 'list', client: m[1] };
    if ((m = h.match(/^bench(?:\/([0-9a-f-]{36}))?$/))) return { view: 'bench', deal: m[1] || null };
    if ((m = h.match(/^new(?:\?(\w+)=([^&]+))?$/))) return { view: 'new', kind: m[1] || 'new', ref: m[2] ? decodeURIComponent(m[2]) : null };
    return { view: 'list' };
  }
  async function go() {
    const r = parseHash();
    if (dirty && route.view === 'scope' && !(r.view === 'scope' && r.id === route.id)) {
      if (!confirm('Unsaved changes on this scope. Leave anyway?')) { location.hash = '#s/' + route.id; return; }
      dirty = false;
    }
    route = r;
    if (r.view === 'list') await loadList();
    else if (r.view === 'new') await createFrom(r.kind, r.ref);
    else if (r.view === 'bench') await loadBench(r.deal);
    else await loadScope(r.id);
  }
  window.addEventListener('hashchange', go);
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---- list --------------------------------------------------------------
  const nameKey = v => String(v || '').trim().replace(/\s+/g, ' ').toLowerCase();
  async function loadList() {
    panel().innerHTML = 'loading…';
    // 106: ONE round trip — scoping_list bundles what used to be eight requests
    const { data, error } = await supa.rpc('scoping_list');
    if (error) {
      const missing = /scoping_list|scopes|scope_deals/.test(error.message) && /not exist|schema cache/i.test(error.message);
      panel().innerHTML = `<div class="sc-panel err">${esc(error.message)}${missing ? '\n\nThis page needs db/096…106 applied in the Supabase SQL editor.' : ''}</div>`;
      return;
    }
    const D = data || {};
    const scopes = { data: D.scopes }, pipe = { data: D.pipeline }, deals = { data: D.deals }, clients = { data: D.clients }, scoped = { data: D.scoped },
          promos = { data: (D.promotions || []).map(id => ({ hubspot_deal_id: id })) },
          dismissed = { data: (D.dismissals || []).map(id => ({ hubspot_deal_id: id })) };
    const K = D.settings || {};
    // The Pipeline tab is Sales Forecast's population: promotable pipelines only,
    // not dismissed, not promoted — and, here, not already attached to a scope
    // (that deal shows under Scopes). Open deals with a probability, or won
    // deals waiting at the promotion door; campaigns that ended before 2026 are gone.
    const promoted = new Set((promos.data || []).map(p => p.hubspot_deal_id));
    const dismissedIds = new Set((dismissed.data || []).map(r => r.hubspot_deal_id));
    const scopedBy = {}; (scoped.data || []).forEach(r => scopedBy[r.hubspot_deal_id] = r.scope_id);
    const allowed = new Set((K.hubspot_promote_pipelines || []).map(nameKey));
    const touches = d => !d.campaign_end || d.campaign_end >= '2026-01-01';
    // the same probability floor Sales Forecast forecasts with (sales_probability_threshold, %)
    const minProb = +(K.sales_probability_threshold ?? 10);
    const pipeline = (pipe.data || []).filter(p => !promoted.has(p.hubspot_deal_id) && !dismissedIds.has(p.hubspot_deal_id) && !scopedBy[p.hubspot_deal_id]
      && (!allowed.size || allowed.has(nameKey(p.pipeline))) && (p.is_won || Math.round((p.probability ?? 0) * 100) >= minProb) && touches(p));
    L = { scopes: scopes.data || [], pipeline, deals: deals.data || [], clients: clients.data || [], knobs: K,
          approvers: (K.scope_approver_emails || []).map(e => String(e).toLowerCase().trim()),
          q: '', tab: localStorage.getItem('sc_list_tab') || 'scopes', approvals: null,
          departments: (D.departments || []).slice().sort() };
    renderList();
  }

  async function loadApprovals() {
    const { data, error } = await supa.rpc('approvals_queue');
    L.approvals = error ? { error: error.message } : (data || []);
    renderList();
  }

  // 106: who may delete — draft / proposed: anyone; approved: an approver;
  // promoted: nobody (the Forecast's deals point back at it). The server
  // enforces the same rule in delete_scope.
  const canDelete = (s, approvers) => s.status !== 'promoted'
    && (s.status !== 'approved' || (approvers || (L && L.approvers) || (X && X.settings && X.settings.approvers) || []).map(e => String(e).toLowerCase().trim()).includes(me()));
  async function deleteScopeId(id, label, after) {
    if (!confirm(`Delete ${label}?\n\nEvery version goes with it; reserved hours leave Hour Planning. This cannot be undone.`)) return false;
    const { data, error } = await supa.rpc('scope_act', { p_action: 'delete', p_scope_id: id, p_by: window.__email, p_args: {} });
    if (error || !data || !data.ok) { alert(error ? error.message : (data && data.reason) || 'could not delete'); return false; }
    if (after) await after();
    return true;
  }
  function renderList() {
    const clientName = Object.fromEntries(L.clients.map(c => [c.id, c.name]));
    const q = L.q.trim().toLowerCase();
    const onClient = route.client || null;
    const scopes = L.scopes.filter(s => (!onClient || s.client_id === onClient) && (!q || (s.name + ' ' + (clientName[s.client_id] || '') + ' ' + s.scenario).toLowerCase().includes(q)));
    const pipeline = L.pipeline.filter(p => !q || ((p.company || '') + ' ' + p.name).toLowerCase().includes(q))
      .sort((a, b) => nameKey(a.company).localeCompare(nameKey(b.company)) || (b.amount || 0) - (a.amount || 0));
    const deals = L.deals.filter(d => (!onClient || d.client_id === onClient) && (!q || ((clientName[d.client_id] || '') + ' ' + d.name).toLowerCase().includes(q)))
      .sort((a, b) => ((clientName[a.client_id] || '') + a.name).localeCompare((clientName[b.client_id] || '') + b.name));
    const statusPillCls = { draft: '', proposed: 'st-pending', approved: 'good', promoted: 'st-live' };
    const tab = L.tab;
    const waiting = L.scopes.filter(s => s.status === 'proposed').length;
    const TABS = [['scopes', 'Scopes'], ['approvals', `Approvals${waiting ? ' · ' + waiting : ''}`], ['pipeline', 'Pipeline'], ['deals', 'Live deals'], ['clients', 'Clients'], ['quick', 'Quick check']];
    panel().innerHTML = `
      <h1 class="sr-only">Scoping</h1>
      <div class="toolbar sc-bar">
        <div class="rp" role="tablist">
          ${TABS.map(([k, lab]) => `<button class="seg ${tab === k ? 'on' : ''}" data-tab="${k}" role="tab" aria-selected="${tab === k}">${lab}</button>`).join('')}
        </div>
        ${tab === 'quick' || tab === 'approvals' ? '' : `<input id="sc-q" type="text" placeholder="search…" value="${esc(L.q)}" style="max-width:240px" aria-label="Search">`}
        ${onClient ? `<span class="pill">client: ${esc(clientName[onClient] || '?')}</span><a class="muted" href="#list" style="font-size:11px">all</a>` : ''}
        <span style="flex:1"></span>
        <button class="ghost" data-go="#bench" title="Enrol live campaigns and upload their platform exports: the hours model is fitted on them">Benchmarks</button>
        ${onClient ? `<button class="ghost" data-go="#new?client=${onClient}">+ Scope for this client</button>` : ''}
        <button class="primary" data-go="#new">+ Blank scope</button>
      </div>
      ${tab === 'scopes' ? `<div class="sc-panel flush"><div class="gridwrap tight"><table class="ledger">
        <thead><tr><th>Scope</th><th>Client</th><th>Scenario</th><th>Status</th><th>v</th><th>Last saved</th><th></th></tr></thead>
        <tbody>${scopes.length ? scopes.map(s => `<tr class="namerow" data-open="s/${s.id}" tabindex="0" role="button">
            <td class="textleft"><b>${esc(s.name)}</b></td>
            <td class="textleft">${esc(clientName[s.client_id] || '—')}</td>
            <td class="textleft">${esc(s.scenario)}</td>
            <td><span class="pill ${statusPillCls[s.status] || ''}">${esc(s.status)}</span></td>
            <td>${s.version}</td>
            <td class="muted nowrap">${new Date(s.set_at).toLocaleDateString()} · ${esc((s.set_by || '').split('@')[0])}</td>
            <td>${canDelete(s) ? `<button class="ghost sc-btn-sm" data-del="${s.id}" data-delname="${esc(s.name)} (${esc(s.scenario)})" title="Delete this scope and every version of it">Delete</button>` : ''}</td>
          </tr>`).join('') : `<tr><td colspan="7" class="empty-note">No scopes yet. Start from the pipeline, a live deal, a client, or blank.</td></tr>`}</tbody></table></div></div>` : ''}
      ${tab === 'approvals' ? approvalsHtml(clientName) : ''}
      ${tab === 'pipeline' ? `<div class="sc-panel flush"><div class="gridwrap tight"><table class="ledger">
        <thead><tr><th>Company</th><th>Deal</th><th>Stage</th><th>Close</th><th>Amount</th><th>Campaign</th><th></th></tr></thead>
        <tbody>${pipeline.length ? pipeline.map(p => `<tr>
            <td class="textleft"><b>${esc(p.company || '—')}</b></td>
            <td class="textleft">${esc(p.name)}${p.url ? ` <a href="${esc(p.url)}" target="_blank" rel="noopener" class="muted" style="font-size:10px">HubSpot ↗</a>` : ''}</td>
            <td class="textleft">${p.is_won ? '<span class="pill st-pending">won · not promoted</span>' : `${esc(p.stage || '')}${p.probability != null ? ` <span class="muted">${Math.round(p.probability * 100)}%</span>` : ''}`}</td>
            <td class="muted nowrap">${esc(p.close_date || '—')}</td>
            <td>${p.amount != null ? fmt$(p.amount) : '—'}</td>
            <td class="muted nowrap">${esc(p.campaign_start || '?')} → ${esc(p.campaign_end || '?')}</td>
            <td><button class="ghost sc-btn-sm" data-go="#new?hs=${encodeURIComponent(p.hubspot_deal_id)}">Scope</button></td>
          </tr>`).join('') : `<tr><td colspan="7" class="empty-note">Nothing left to scope: every promotable deal is promoted, dismissed, or already has a scope.</td></tr>`}</tbody></table></div></div>` : ''}
      ${tab === 'deals' ? `<div class="sc-panel flush"><div class="gridwrap tight"><table class="ledger">
        <thead><tr><th>Live deal</th><th>Client</th><th>Flight</th><th></th></tr></thead>
        <tbody>${deals.length ? deals.map(d => `<tr>
            <td class="textleft"><b>${esc(d.name)}</b></td>
            <td class="textleft">${esc(clientName[d.client_id] || '—')}</td>
            <td class="muted nowrap">${esc(d.flight_start || '')} → ${esc(d.flight_end || '')}</td>
            <td><button class="ghost sc-btn-sm" data-go="#new?deal=${d.id}">Re-scope</button></td>
          </tr>`).join('') : `<tr><td colspan="4" class="empty-note">No live deals.</td></tr>`}</tbody></table></div></div>` : ''}
      ${tab === 'clients' ? `<div class="sc-panel flush"><div class="gridwrap tight"><table class="ledger">
        <thead><tr><th>Client</th><th>Live deals</th><th>Scopes</th><th></th></tr></thead>
        <tbody>${L.clients.filter(c => !q || c.name.toLowerCase().includes(q)).map(c => `<tr>
            <td class="textleft"><a href="#c/${c.id}"><b>${esc(c.name)}</b></a></td>
            <td>${L.deals.filter(d => d.client_id === c.id).length}</td>
            <td>${L.scopes.filter(s => s.client_id === c.id).length}</td>
            <td><button class="ghost sc-btn-sm" data-go="#new?client=${c.id}">+ Scope</button></td>
          </tr>`).join('')}</tbody></table></div></div>` : ''}
      ${tab === 'quick' ? quickHtml() : ''}`;
    panel().querySelectorAll('.rp .seg').forEach(b => b.onclick = () => { L.tab = b.dataset.tab; localStorage.setItem('sc_list_tab', L.tab); renderList(); });
    panel().querySelectorAll('button[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
    panel().querySelectorAll('button[data-del]').forEach(b => b.onclick = () => deleteScopeId(b.dataset.del, b.dataset.delname, loadList));
    if (panel().querySelector('#sc-q')) wireSearch(panel(), '#sc-q', v => { L.q = v; renderList(); });
    panel().querySelectorAll('tr.namerow[data-open]').forEach(tr => {
      const open = () => { location.hash = '#' + tr.dataset.open; };
      tr.onclick = e => { if (e.target.closest('a,button')) return; open(); };
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    });
    if (tab === 'approvals') {
      if (!L.approvals) loadApprovals();
      panel().querySelectorAll('button[data-approve]').forEach(b => b.onclick = () => queueAction(b.dataset.approve, 'approve'));
      panel().querySelectorAll('button[data-sendback]').forEach(b => b.onclick = () => queueAction(b.dataset.sendback, 'sendback'));
    }
    if (tab === 'quick') wireQuick();
  }

  // The approvals queue: every proposed scope, its verdict and who is waiting.
  // Approvers act from here; everyone can see where a scope sits.
  function approvalsHtml(clientName) {
    const isApp = L.approvers.includes(me());
    if (!L.approvals) return `<div class="sc-panel"><div class="empty-note">loading…</div></div>`;
    if (L.approvals.error) return `<div class="sc-panel err">${esc(L.approvals.error)}</div>`;
    const rows = L.approvals;
    return `<div class="sc-panel flush"><div class="gridwrap tight"><table class="ledger">
      <thead><tr><th>Scope</th><th>Client</th><th>Proposed</th><th>Verdict</th><th>After labor</th><th>$ / h</th><th>Hours</th><th>Deals</th><th></th></tr></thead>
      <tbody>${rows.length ? rows.map(r => { const k = r.kpis || {}; return `<tr class="namerow" data-open="s/${r.id}" tabindex="0" role="button">
          <td class="textleft"><b>${esc(r.name)}</b> <span class="muted">${esc(r.scenario)} · v${r.version}</span></td>
          <td class="textleft">${esc(r.client_name || clientName[r.client_id] || '—')}</td>
          <td class="textleft muted nowrap">${r.proposed_at ? new Date(r.proposed_at).toLocaleDateString() : '—'} · ${esc((r.proposed_by || '').split('@')[0])}</td>
          <td><span class="pill ${STATUS_PILL[k.status] || ''}">${esc(STATUS_LABEL[k.status] || '—')}</span></td>
          <td class="${(k.pal || 0) < 0 ? 'neg' : ''}">${fmt$(k.pal || 0)}</td>
          <td>${k.per_hour_c != null ? fmt$(k.per_hour_c) : '—'}</td>
          <td>${fmtH(k.hours)}</td>
          <td class="textleft muted" style="font-size:10.5px">${(r.deals || []).map(d => `${esc(d.name)} (${esc(d.flight_start || '?')} → ${esc(d.flight_end || '?')})`).join('<br>')}</td>
          <td class="nowrap">${isApp ? `<button class="primary sc-btn-sm" data-approve="${r.id}">Approve</button> <button class="ghost sc-btn-sm" data-sendback="${r.id}">Send back</button>` : '<span class="muted" style="font-size:10.5px">waiting for an approver</span>'}</td>
        </tr>`; }).join('') : `<tr><td colspan="9" class="empty-note">Nothing waiting. A scope lands here when someone presses Propose.</td></tr>`}</tbody></table></div></div>`;
  }
  async function queueAction(id, what) {
    if (what === 'approve' && !confirm('Approve this scope? Its named hours are reserved in Hour Planning.')) return;
    if (what === 'sendback' && !confirm('Send this scope back to draft?')) return;
    const { data, error } = what === 'approve'
      ? await supa.rpc('approve_scope', { p_scope_id: id, p_by: window.__email })
      : await supa.rpc('set_scope_status', { p_scope_id: id, p_status: 'draft', p_by: window.__email });
    if (error || !data.ok) { alert(error ? error.message : data.reason); return; }
    L.approvals = null; await loadList();
  }

  // Quick check: one channel, a few numbers, an answer — its own tab.
  function quickHtml() {
    return `<div class="sc-panel">
      <div class="sc-note" style="margin-bottom:10px">One channel, a monthly budget and a fee: GP, labor at department averages (or the benchmark estimate when hours are left blank), profit after labor and per hour against the target. Open it as a scope when it is worth shaping.</div>
      <div class="sc-form">
        <label>channel<select id="qc-kind">${['search', 'social', 'programmatic', 'retainer', 'hourly'].map(k => `<option>${k}</option>`).join('')}</select></label>
        <label>media $ / month<input id="qc-budget" type="number" step="any" inputmode="decimal" placeholder="100000"></label>
        <label>fee %<input id="qc-fee" type="number" step="any" inputmode="decimal" placeholder="10"></label>
        <label>backend margin % (programmatic)<input id="qc-margin" type="number" step="any" inputmode="decimal" placeholder="default"></label>
        <label>$ / month (retainer / hourly)<input id="qc-amount" type="number" step="any" inputmode="decimal" placeholder="10000"></label>
        <label>months<input id="qc-months" type="number" min="1" value="6"></label>
        <label>department<select id="qc-dept">${(L.departments || []).map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
        <label>hours / month (blank = benchmarks)<input id="qc-hours" type="number" step="any" inputmode="decimal" placeholder="estimate"></label>
        <label>&nbsp;<button class="primary" id="qc-run" style="height:30px">Check</button></label>
      </div>
      <div id="qc-out" class="sc-note" style="margin-top:12px;font-size:12px"></div>
    </div>`;
  }
  function wireQuick() {
    if (!L.departments) {
      supa.from('staff').select('department').eq('active', true).eq('tracks_capacity', true).then(r => {
        L.departments = [...new Set((r.data || []).map(s => s.department).filter(Boolean))].sort();
        const sel = panel().querySelector('#qc-dept');
        if (sel) sel.innerHTML = L.departments.map(d => `<option>${esc(d)}</option>`).join('');
      });
    }
    const qc = panel().querySelector('#qc-run');
    if (qc) qc.onclick = async () => {
      const kind = panel().querySelector('#qc-kind').value;
      const hours = num(panel().querySelector('#qc-hours').value) || 0;
      const dept = panel().querySelector('#qc-dept').value;
      const out = panel().querySelector('#qc-out');
      out.textContent = 'checking…';
      const { data, error } = await supa.rpc('quick_check', {
        p_kind: kind, p_budget_c: cents(panel().querySelector('#qc-budget').value), p_fee_pct: num(panel().querySelector('#qc-fee').value) || 0,
        p_months: +panel().querySelector('#qc-months').value || 1, p_hours: dept && hours > 0 ? { [dept]: hours } : {},
        p_amount_c: cents(panel().querySelector('#qc-amount').value), p_margin_pct: num(panel().querySelector('#qc-margin').value) });
      if (error) { out.innerHTML = `<span class="err">${esc(error.message)}</span>`; return; }
      const hoursNote = data.hours_method && data.hours_method !== 'typed'
        ? `${fmtH(data.hours_month)} estimated from the benchmarks: ${Object.entries(data.hours_by_dept || {}).map(([d, h]) => `${esc(d)} ${fmtH(h)}`).join(', ')}`
        : `${fmtH(data.hours_month)} at the ${esc(dept)} average`;
      out.innerHTML = `<span class="pill ${STATUS_PILL[data.status] || ''}">${esc(STATUS_LABEL[data.status] || data.status)}</span>
        &nbsp; GP <b>${fmt$(data.gp_month)}</b>/mo · labor <b>${fmt$(data.labor_month)}</b>/mo (${hoursNote}) ·
        after labor <b>${fmt$(data.pal_month)}</b>/mo${data.per_hour_c != null ? ` · <b>${fmt$(data.per_hour_c)}/h</b> vs ${fmt$(data.target_c)} target` : ''}
        · over ${data.months} months: GP ${fmt$(data.gp)}, labor ${fmt$(data.labor)}`;
    };
  }

  // ---- create from an entry point ------------------------------------------
  async function createFrom(kind, ref) {
    panel().innerHTML = 'creating…';
    const map = { hs: 'hubspot', deal: 'deal', client: 'client', new: 'new' };
    // 106: scope_act creates AND returns the page — the hashchange below opens it without a second trip
    const { data, error } = await supa.rpc('scope_act', { p_action: 'create', p_scope_id: null, p_by: window.__email,
      p_args: { origin_kind: map[kind] || 'new', ref, name: null, scenario: null } });
    if (error || !data || !data.ok) { panel().innerHTML = `<div class="sc-panel err">${esc(error ? error.message : (data && data.reason) || 'could not create')}</div>`; return; }
    PRE = { id: data.scope_id, page: data.page };
    location.hash = '#s/' + data.scope_id;   // hashchange → loadScope
  }

  // ---- open a scope ------------------------------------------------------
  async function loadScope(id) {
    // 106: the action that just produced this page (create, new scenario) handed it over
    if (PRE && PRE.id === id) { const page = PRE.page; PRE = null; if (page && page.id) { await applyPage(page); return; } }
    panel().innerHTML = 'loading…';
    const { data, error } = await supa.rpc('scope_page', { p_scope_id: id });
    if (error) { panel().innerHTML = `<div class="sc-panel err">${esc(error.message)}</div>`; return; }
    if (!data || !data.id) { panel().innerHTML = `<div class="sc-panel err">Scope not found.</div>`; return; }
    await applyPage(data);
  }
  // paint one scope_page payload — from scope_page itself or riding on a scope_act result
  async function applyPage(data) {
    const { econ, labor, staffing, verdict, versions, siblings, staff, departments, clients, settings, sources, existing_deals, ...state } = data;
    S = state; X = { econ, labor, staffing, verdict, versions, siblings, staff, departments, clients, settings, sources, existing_deals, qbo: null };
    // an approved scope is about to promote: the QuickBooks projects its deals
    // will claim are picked here (101) — loaded only when that is possible
    if (S.status === 'approved' && (settings.approvers || []).map(e => String(e).toLowerCase().trim()).includes(me())) {
      const [pr, claimed] = await Promise.all([
        fetchAll(() => supa.from('qbo_projects').select('id,name,parent_id').eq('hidden', false).order('name')),
        fetchAll(() => supa.from('deals').select('qbo_project_id').not('qbo_project_id', 'is', null))
      ]);
      const taken = new Set((claimed.data || []).map(d => d.qbo_project_id));
      X.qbo = (pr.data || []).filter(p => !taken.has(p.id));
    }
    S.deals = (S.deals || []).map(d => ({ ...d, lines: (d.lines || []).map(l => ({ ...l, structure: l.structure || {}, months: l.months || {} })) }));
    S.dept_months = S.dept_months || []; S.staff_months = S.staff_months || [];
    dirty = false;
    renderEditor();
  }

  const readOnly = () => S && (S.status === 'approved' || S.status === 'promoted');
  const isApprover = () => (X.settings.approvers || []).map(e => String(e).toLowerCase().trim()).includes(me());
  // the programmatic backend margin is a DEAL output (104): one margin over the
  // scope's fee+margin lines that lands the target GP on revenue — the twin of
  // scope_prog_margin; a line's own margin_pct (CPM, legacy) still prices it
  const progMargin = () => progDealMargin(S.deals.flatMap(d => { const months = monthsBetween(d.flight_start, d.flight_end); return (d.lines || []).map(line => ({ line, months })); }), X.settings.prog_target_gp_pct);
  const ctx = () => ({ marginDefault: progMargin() ?? X.settings.margin_default, cpmShareDefault: X.settings.cpm_platform_share_pct });
  // the teams a scope's lines bring to the hours grid, plus the always-on ones (104 settings)
  const autoDepartments = () => { const map = X.settings.kind_departments || {}; const out = new Set(X.settings.always_departments || []);
    S.deals.forEach(d => (d.lines || []).forEach(l => (map[l.kind] || []).forEach(x => out.add(x)))); return [...out]; };
  const flightOf = d => ({ start: d.flight_start, end: d.flight_end });
  const allMonths = () => { const s = new Set(); S.deals.forEach(d => monthsBetween(d.flight_start, d.flight_end).forEach(m => s.add(m))); return [...s].sort(); };
  const staffById = () => Object.fromEntries((X.staff || []).map(s => [s.id, s]));
  const departments = () => [...new Set([...(X.departments || []), ...autoDepartments(), ...S.dept_months.map(r => r.department), ...S.staff_months.map(r => r.department)])].filter(Boolean).sort();

  // ---- editor ------------------------------------------------------------
  // Reading order (Boris): the answer first — verdict strip and chart — then
  // the deal terms, the lines, what the client already runs in these months,
  // the hours, the people, the scenarios. Every section is a full-width panel
  // on one gutter; the bar is a .toolbar so its controls sit on the same edge.
  function renderEditor() {
    const months = allMonths();
    const ro = readOnly();
    const V = X.verdict || {}, T = V.total || {};
    const target = +(X.settings.per_hour || 150) * 100;
    const stPill = { draft: '', proposed: 'st-pending', approved: 'good', promoted: 'st-live' }[S.status] || '';
    const sibs = (X.siblings || []);
    const clientName = Object.fromEntries((X.clients || []).map(c => [c.id, c.name]));
    const presets = X.settings.min_margin_presets || [];
    const preset = S.min_margin_preset || (presets.find(p => p.name === 'Slight margin') || presets[0] || {}).name || '';

    panel().innerHTML = `
      <h1 class="sr-only">Scope: ${esc(S.name)} (${esc(S.scenario)})</h1>
      <div class="toolbar sc-bar">
        <a href="#list" class="muted sc-back">← scopes</a>
        <input class="dname" id="sc-name" value="${esc(S.name)}" ${ro ? 'disabled' : ''} aria-label="Scope name">
        <span class="pill ${stPill}">${esc(S.status)}</span>
        <span class="pill">v${S.version}</span>
        <div class="rp rp-sm" id="sc-scen" title="Scenarios of this target">
          ${sibs.map(s => `<button class="seg ${s.id === S.id ? 'on' : ''}" data-scope="${s.id}" title="${esc(s.name)} · ${esc(STATUS_LABEL[s.kpis && s.kpis.status] || '')}">${esc(s.scenario)}</button>`).join('')}
          <button class="seg" id="sc-newscen" title="Copy this scope as a new scenario" aria-label="New scenario">+</button>
        </div>
        <select id="sc-version" title="Versions" aria-label="Versions" style="font-size:11px">
          <option value="">v${S.version} (current)</option>
          ${(X.versions || []).filter(v => v.version !== S.version).map(v => `<option value="${v.id}">v${v.version} · ${esc(v.reason)}${v.label ? ' · ' + esc(v.label) : ''} · ${new Date(v.saved_at).toLocaleDateString()}</option>`).join('')}
        </select>
        <button class="ghost" id="sc-terms" title="The commercial terms this scope implies, as plain sentences (templates on Settings › Scoping)">Terms</button>
        ${canDelete(S, X.settings.approvers) ? `<button class="ghost muted" id="sc-delete" title="Delete this scope and every version of it${S.status === 'approved' ? ' — its reserved hours leave Hour Planning' : ''}">Delete</button>` : ''}
        <span style="flex:1"></span>
        <span id="sc-msg" class="ok" role="status" aria-live="polite"></span>
        ${ro ? '' : `<input class="vlabel" id="sc-label" type="text" placeholder="label this version (optional)" aria-label="Label for this saved version"><button class="primary" id="sc-save">Save</button>`}
        ${S.status === 'draft' ? `<button class="ghost" id="sc-propose" title="Puts the scope in the Approvals queue">Propose</button>` : ''}
        ${S.status === 'proposed' ? `<button class="ghost" id="sc-draft">Back to draft</button>` : ''}
        ${S.status === 'proposed' && isApprover() ? `<button class="primary" id="sc-approve">Approve</button>` : ''}
        ${S.status === 'approved' && isApprover() ? `<button class="ghost" id="sc-unapprove">Un-approve</button>` : ''}
        ${S.status === 'approved' && isApprover() ? `<button class="primary" id="sc-promote" title="Create the deals in the Forecast: HubSpot deals through the approval door, new deals as manual deals, re-scopes by extending the source deal">Promote</button>` : ''}
      </div>
      ${S.status === 'proposed' ? `<div class="sc-note" style="margin:-14px 18px 12px">proposed ${S.proposed_at ? new Date(S.proposed_at).toLocaleDateString() : ''} by ${esc(S.proposed_by || '—')} — waiting in <a href="#list" data-tab-link="approvals">Approvals</a></div>` : ''}

      <div class="summary-strip" id="sc-strip">${stripCells()}</div>
      <div id="sc-dirty" class="sc-note" style="margin:-8px 18px 14px;display:none">unsaved changes — everything below follows your edits (labor and the verdict a moment behind); Save keeps a version</div>

      <div class="sc-panel chartpanel" id="sc-verdictpanel">${verdictPanelInner()}</div>

      <div class="sc-panel">
        <h2 class="sc-eyebrow">Deal terms</h2>
        <div class="sc-form">
          <label>client<select id="sc-client" ${ro ? 'disabled' : ''}><option value="">— none yet —</option>
            ${(X.clients || []).map(c => `<option value="${c.id}" ${c.id === S.client_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
          <label>payment terms<span class="row"><input id="sc-net" type="number" min="0" value="${S.payment_net_days ?? 30}" ${ro ? 'disabled' : ''}><span class="unit">days</span></span></label>
          <label title="Paid back to the client, booked COGS Other — applies to every line of the deal">rebate<span class="row"><input id="sc-rebate-pct" type="number" step="any" min="0" max="100" inputmode="decimal" placeholder="none" value="${S.rebate_pct ?? ''}" ${ro ? 'disabled' : ''}><span class="unit">% of</span>
            <select id="sc-rebate-basis" ${ro ? 'disabled' : ''}><option value="media" ${S.rebate_basis !== 'fee' ? 'selected' : ''}>media spend</option><option value="fee" ${S.rebate_basis === 'fee' ? 'selected' : ''}>all fees</option></select></span></label>
          <label title="The minimum monthly fee is computed: the month's labor (unassigned hours at department average included) ÷ (1 − this margin)">minimum fee margin<select id="sc-minpreset" ${ro ? 'disabled' : ''}>
            ${presets.map(p => `<option value="${esc(p.name)}" ${p.name === preset ? 'selected' : ''}>${esc(p.name)} · ${p.pct}%</option>`).join('')}</select></label>
          <label title="An output, not an input: the one backend margin the programmatic team should run across this deal's fee + margin lines to land the target GP on revenue (Settings › Scoping). CPM lines are priced by their platform share instead.">programmatic backend margin<span class="row" style="height:30px;align-items:center;font-family:var(--font-body);font-size:13px;letter-spacing:0;text-transform:none" data-out="progmargin">—</span></label>
          <label class="wide">notes<input id="sc-notes" value="${esc(S.notes || '')}" ${ro ? 'disabled' : ''} placeholder="anything the terms or the approver should know"></label>
        </div>
      </div>

      ${X.qbo ? `<datalist id="sc-qbo-list">${X.qbo.map(p => `<option value="${esc(p.name)}"></option>`).join('')}</datalist>` : ''}
      <div id="sc-deals">${S.deals.map((d, di) => dealHtml(d, di, ro)).join('')}</div>
      ${ro ? '' : `<div class="sc-note" style="margin:-8px 18px 14px"><button class="sc-linkbtn" id="sc-adddeal" title="Scope a second future deal alongside this one (rare)">+ another deal in this scope</button></div>`}

      ${existingDealsHtml(T, clientName, ro)}

      <div class="sc-panel">
        <div class="chart-head flush"><h2 class="sc-eyebrow tight">Hours needed, per department per month</h2>
          ${ro ? '' : `<button class="ghost" id="sc-estimate" title="Fill from the benchmark library (each media line's drivers × hours per driver from comparable campaigns, client's own first) and the catalog products' default hours. Rows you typed are kept.">Estimate from benchmarks</button>`}</div>
        <div class="sc-note lead">Demand. Type it, or fill each media line's <b>drivers</b> (on its card) and estimate — rows marked benchmark / catalog were filled that way; typing over one makes it yours.</div>
        <div class="gridwrap tight"><table class="sc-grid">
          <thead><tr><th>department</th><th class="per" title="Type once here to fill every flight month of the row">every month</th>${months.map(m => `<th>${mLabel(m)}</th>`).join('')}<th>total</th></tr></thead>
          <tbody>${demandRows(months, ro)}</tbody></table></div>
        ${ro ? '' : `<div class="hp-addrow"><select id="sc-adddept" aria-label="Add a department"><option value="">+ department…</option>${departments().filter(d => !S.dept_months.some(r => r.department === d)).map(d => `<option>${esc(d)}</option>`).join('')}</select></div>`}
      </div>

      <div class="sc-panel">
        <div class="chart-head flush"><h2 class="sc-eyebrow tight">Who does the work</h2>
          ${ro ? '' : `<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost" id="sc-autostaff" title="Fill the uncovered hours with the best-ranked free people, fewest people first">Auto-staff</button><button class="ghost" id="sc-clearauto" title="Remove the auto-staffed rows">Clear auto</button></span>`}
        </div>
        <div class="sc-note lead">Named people are priced at their own cost, placeholders at their band's average, uncovered hours at the department average — shown only as one labor total. Ranking: worked this client → worked this kind → free hours → cost.</div>
        <div class="gridwrap tight"><table class="sc-grid">
          <thead><tr><th>person / placeholder</th>${months.map(m => `<th>${mLabel(m)}</th>`).join('')}<th>total</th><th></th></tr></thead>
          <tbody>${supplyRows(months, ro)}</tbody></table></div>
      </div>

      ${sibs.length > 1 ? `<div class="sc-panel flush"><h2 class="sc-eyebrow inset">Scenarios</h2>
        <div class="gridwrap gap6"><table class="ledger">
          <thead><tr><th>Scenario</th><th>Status</th><th>Revenue</th><th>GP</th><th>Labor</th><th>After labor</th><th>$/h</th><th>Hours</th><th>Verdict</th></tr></thead>
          <tbody>${sibs.map(s => { const k = s.kpis || {}; return `<tr class="namerow" data-open="s/${s.id}" tabindex="0" role="button" ${s.id === S.id ? 'style="font-weight:600"' : ''}>
            <td class="textleft">${esc(s.scenario)} <span class="muted">v${s.version}</span></td><td><span class="pill">${esc(s.status)}</span></td>
            <td>${fmt$(k.billable || 0)}</td><td>${fmt$(k.gp || 0)}</td><td>${fmt$(k.labor || 0)}</td><td>${fmt$(k.pal || 0)}</td>
            <td>${k.per_hour_c != null ? fmt$(k.per_hour_c) : '—'}</td><td>${fmtH(k.hours)}</td>
            <td><span class="pill ${STATUS_PILL[k.status] || ''}">${esc(STATUS_LABEL[k.status] || '—')}</span></td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
      <div style="height:24px"></div>`;

    wire(ro);
    recompute();   // draws the Monthly verdict too (live money, saved labor)
  }

  // The client's live deals whose flights overlap the scope's months, and
  // what this scope does to the client total. Auto-included by the dates
  // (Boris) — nothing to pick. A second deal inside the scope is the rare case
  // and lives behind a small link here rather than a primary button.
  function existingDealsHtml(T, clientName, ro) {
    const rows = X.existing_deals || [];
    const sum = k => rows.reduce((s, r) => s + (+r[k] || 0), 0);
    const exGp = sum('gp_measured') + sum('gp_plan'), exLab = sum('labor_measured') + sum('labor_plan'), exH = sum('hours_measured') + sum('hours_plan');
    const scGp = (T.gp || 0) - (T.rebate || 0), scLab = T.labor || 0, scH = +T.hours || 0;
    const ph = (pal, h) => h > 0 ? fmt$(Math.round(pal / h)) + '/h' : '—';
    const client = clientName[S.client_id];
    // nothing overlapping (or no client yet) → no panel at all (Boris); the
    // rare "second deal in this scope" entry lives under the deals instead
    if (!S.client_id || !rows.length) return '';
    return `<div class="sc-panel flush">
      <div class="chart-head"><h2 class="sc-eyebrow">${client ? `Already running for ${esc(client)} in these months` : 'Already running in these months'}</h2></div>
      <div class="gridwrap tight"><table class="ledger">
        <thead><tr><th>Deal</th><th>Flight</th><th>GP</th><th>Labor</th><th>Hours</th><th>After labor</th><th>$ / h</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="textleft"><a href="./forecast.html?open=${r.id}">${esc(r.name)}</a></td>
            <td class="muted nowrap">${esc(r.flight_start || '')} → ${esc(r.flight_end || '')}</td>
            <td>${fmt$(r.gp_measured + r.gp_plan)}<div class="sc-hint">${fmt$(r.gp_measured)} measured · ${fmt$(r.gp_plan)} planned</div></td>
            <td>${fmt$(r.labor_measured + r.labor_plan)}<div class="sc-hint">${fmt$(r.labor_measured)} logged · ${fmt$(r.labor_plan)} planned</div></td>
            <td>${fmtH(+r.hours_measured + +r.hours_plan)}</td>
            <td class="${r.pal < 0 ? 'neg' : ''}"><b>${fmt$(r.pal)}</b></td>
            <td>${ph(r.pal, +r.hours_measured + +r.hours_plan)}</td></tr>`).join('')}
          <tr class="subrow"><td class="textleft"><b>this scope</b></td><td class="muted">${esc((S.deals[0] || {}).flight_start || '')} → ${esc((S.deals[0] || {}).flight_end || '')}</td>
            <td>${fmt$(scGp)}</td><td>${fmt$(scLab)}</td><td>${fmtH(scH)}</td><td class="${(T.pal || 0) < 0 ? 'neg' : ''}"><b>${fmt$(T.pal || 0)}</b></td><td>${ph(T.pal || 0, scH)}</td></tr>
          <tr class="gp"><td class="textleft"><b>client with this scope</b></td><td></td>
            <td><b>${fmt$(exGp + scGp)}</b></td><td><b>${fmt$(exLab + scLab)}</b></td><td><b>${fmtH(exH + scH)}</b></td>
            <td class="${(exGp + scGp - exLab - scLab) < 0 ? 'neg' : ''}"><b>${fmt$(exGp + scGp - exLab - scLab)}</b><div class="sc-hint">was ${fmt$(exGp - exLab)} without it</div></td>
            <td><b>${ph(exGp + scGp - exLab - scLab, exH + scH)}</b>${exH > 0 ? `<div class="sc-hint">was ${ph(exGp - exLab, exH)}</div>` : ''}</td></tr>
        </tbody></table></div>
    </div>`;
  }

  function verdictNotes(V) {
    const c = V.checks || {}, bits = [];
    if (c.staff_unclear) bits.push('staff plan unclear');
    if (c.capacity_ok === false) bits.push('someone is over capacity');
    if (c.client_ok === false) bits.push('client roll-up goes negative');
    if (c.monthly_positive === false && c.overall_positive !== false) bits.push('a month loses money');
    if (c.unpriced) bits.push('hours nobody can price');
    return bits.join(' · ') || (V.status === 'go' ? 'clears every check' : '');
  }

  function hireHtml(V) {
    const h = V.hire || {};
    if (!h.recommend) return '';
    const parts = (X.staffing && X.staffing.hire || []).filter(x => x.recommend).map(x =>
      `<b>${esc(x.department)}</b> ${fmtH(x.hours)}${x.cost_hire != null ? ` · hire ≈ ${fmt$(x.cost_hire)}` : ' · no hire cost in Settings'}${x.cost_contractor != null ? ` · contractor ≈ ${fmt$(x.cost_contractor)}` : ''}`);
    const alt = V.status === 'go_with_hire' ? `Viable with a hire: after labor ${fmt$(h.pal_hire)}.` : V.status === 'go_with_contractor' ? `Viable with a contractor: after labor ${fmt$(h.pal_contractor)}.` : '';
    return `<div class="sc-callout ${V.status === 'no_go' ? 'bad' : ''}" style="margin:6px 14px 12px">Not enough free capacity: ${parts.join('; ')}. ${alt}</div>`;
  }

  // The ribbon: the verdict and the numbers behind it. Repainted on its own
  // (with the verdict panel) when a preview lands while a field is focused.
  function stripCells() {
    const V = X.verdict || {}, T = V.total || {};
    const target = +(X.settings.per_hour || 150) * 100;
    const presets = X.settings.min_margin_presets || [];
    const preset = S.min_margin_preset || (presets.find(p => p.name === 'Slight margin') || presets[0] || {}).name || '';
    const nMonths = (V.months || []).length || allMonths().length || 1;
    const short = +(T.fee_shortfall || 0);
    const under = T.per_hour_c != null && T.per_hour_c < target;
    return `
        <div class="summary-cell"><div class="summary-label">Verdict</div><div class="summary-value"><span class="pill ${STATUS_PILL[V.status] || ''}" style="font-size:12px">${esc(STATUS_LABEL[V.status] || '—')}</span></div>
          <div class="summary-note">${verdictNotes(V)}</div></div>
        <div class="summary-cell" title="Profit after labor ÷ planned hours, against the company target (Settings › Scoping)"><div class="summary-label">Profit per hour</div>
          <div class="summary-value ${under || (T.pal || 0) < 0 ? 'neg' : ''}">${T.per_hour_c != null ? fmt$(T.per_hour_c) + '<span class="muted">/h</span>' : '—'}</div>
          <div class="summary-note">${T.per_hour_c != null ? `${under ? `<b style="color:var(--rust)">under</b> the` : 'clears the'} ${fmt$(target)}/h target` : 'no hours planned yet'}</div></div>
        <div class="summary-cell"><div class="summary-label">Profit after labor</div><div class="summary-value ${(T.pal || 0) < 0 ? 'neg' : ''}"><span class="gold-chip">${fmt$(T.pal || 0)}</span></div>
          <div class="summary-note">${T.hours ? `${fmtH(T.hours)} over ${nMonths} month${nMonths === 1 ? '' : 's'}` : 'no hours planned'}</div></div>
        <div class="summary-cell"><div class="summary-label">Revenue</div><div class="summary-value" data-out="rev">${fmt$(T.billable || 0)}</div><div class="summary-note" data-out="pass"></div></div>
        <div class="summary-cell"><div class="summary-label">Gross profit</div><div class="summary-value" data-out="gp">${fmt$(T.gp || 0)}</div><div class="summary-note" data-out="rebate">${+T.rebate ? `rebate −${fmt$(T.rebate)}` : ''}</div></div>
        <div class="summary-cell" title="Named people at their burdened cost, placeholders and uncovered demand at department averages — one number, never per person"><div class="summary-label">Labor</div><div class="summary-value">${fmt$(T.labor || 0)}</div><div class="summary-note">${fmtH(T.hours)}${+T.open_hours ? ` · ${fmtH(T.open_hours)} not yet named` : ''}${T.labor_lo != null && T.labor_lo !== T.labor_hi ? ` · range ${fmt$(T.labor_lo)}–${fmt$(T.labor_hi)}` : ''}</div></div>
        <div class="summary-cell" title="The fee that covers each month's labor at the chosen margin — the highest month sets the contractual minimum"><div class="summary-label">Minimum fee</div>
          <div class="summary-value ${short > 0 ? 'neg' : ''}">${T.min_fee_max != null ? fmt$(T.min_fee_max) + '<span class="muted">/mo</span>' : '—'}</div>
          <div class="summary-note">${esc(preset || '—')}${T.fee != null ? ` · planned fee ${fmt$(Math.round(T.fee / nMonths))}/mo avg` : ''}${short > 0 ? ` · <b style="color:var(--rust)">short ${fmt$(short)}</b> over the flight` : ''}</div></div>`;
  }
  function verdictPanelInner() {
    const V = X.verdict || {}, T = V.total || {};
    const target = +(X.settings.per_hour || 150) * 100;
    return `
        <div class="chart-head"><h2 class="sc-eyebrow">Monthly verdict</h2><div class="stat-inline muted" style="font-size:11px;display:flex;gap:14px;flex-wrap:wrap">${scopeStat(T, target)}</div></div>
        <div class="chart-body"><div id="sc-chart"></div></div>
        <div class="sc-vstrip" id="sc-vstrip"></div>
        ${hireHtml(V)}`;
  }

  // ---- deal + line cards ---------------------------------------------------
  function dealHtml(d, di, ro) {
    const modes = d.origin_kind === 'hubspot' ? [['hubspot', 'promote through HubSpot approval']]
      : d.origin_kind === 'deal' ? [['extend', 'extend the existing deal'], ['new', 'new deal']] : [['new', 'new deal']];
    const src = d.origin_kind === 'hubspot' ? (X.sources.pipeline || []).find(p => p.hubspot_deal_id === d.hubspot_deal_id)
      : d.origin_kind === 'deal' ? (X.sources.deals || []).find(x => x.id === d.source_deal_id) : null;
    const months = monthsBetween(d.flight_start, d.flight_end);
    return `<div class="sc-deal" data-di="${di}">
      <div class="sc-dealtop">
        <span class="kbadge">${esc(d.origin_kind === 'hubspot' ? 'HubSpot' : d.origin_kind === 'deal' ? 're-scope' : 'new deal')}</span>
        ${src ? `<span class="sc-note">${d.origin_kind === 'hubspot' ? `HubSpot: ${esc(src.company || '')} · ${src.amount != null ? fmt$(src.amount) : ''}${src.url ? ` · <a href="${esc(src.url)}" target="_blank" rel="noopener">open</a>` : ''}` : `source deal: ${esc(src.name)} (${esc(src.flight_start || '')} → ${esc(src.flight_end || '')})`}</span>` : ''}
        ${d.promoted_deal_id ? `<span class="pill st-live">promoted</span><a class="sc-note" href="./forecast.html?open=${d.promoted_deal_id}">open in Forecast →</a>` : ''}
        <span style="flex:1"></span>
        <span class="lgp" data-out="dealgp:${di}"></span>
        ${ro || S.deals.length < 2 ? '' : `<button class="danger" data-act="rmdeal:${di}" title="remove this deal from the scope" aria-label="Remove deal ${esc(d.name)}">✕</button>`}
      </div>
      <div class="sc-form sc-dealform">
        <label class="name">deal name<input class="dname" data-f="deal:${di}:name" value="${esc(d.name)}" ${ro ? 'disabled' : ''}></label>
        <label>flight start<input type="date" data-f="deal:${di}:flight_start" value="${esc(d.flight_start || '')}" ${ro ? 'disabled' : ''}></label>
        <label>flight end<input type="date" data-f="deal:${di}:flight_end" value="${esc(d.flight_end || '')}" ${ro ? 'disabled' : ''}></label>
        <label>on promote<select data-f="deal:${di}:promote_mode" ${ro ? 'disabled' : ''}>
          ${modes.map(([v, lab]) => `<option value="${v}" ${d.promote_mode === v ? 'selected' : ''}>${lab}</option>`).join('')}</select></label>
        ${!d.promoted_deal_id && X.qbo && d.promote_mode !== 'extend' ? `<label>QuickBooks project${d.promote_mode === 'hubspot' ? ' (required)' : ''}
          <input list="sc-qbo-list" data-qbo="${di}" placeholder="type to search…" value="${esc(((X.qbo || []).find(p => p.id === d.qbo_project_id) || {}).name || '')}"></label>` : ''}
      </div>
      ${!months.length ? `<div class="sc-note" style="margin-top:10px">Set the flight dates to see months.</div>` : ''}
      <div class="linecards">${(d.lines || []).map((l, li) => lineCard(d, di, l, li, months, ro)).join('')}</div>
      ${ro ? '' : `<div class="sc-addline">${KINDS.map(k => `<button class="ghost" data-act="addline:${di}:${k}">+ ${k}</button>`).join('')}</div>`}
    </div>`;
  }

  const pf = (label, inner, cls = '') => `<label class="pf ${cls}"><span class="pfl">${label}</span>${inner}</label>`;
  const inp = (di, li, p, val, extra = '') => `<input class="p" type="number" step="any" inputmode="decimal" data-f="line:${di}:${li}:${p}" value="${val ?? ''}" ${extra}>`;

  function lineCard(d, di, l, li, months, ro) {
    const st = l.structure = l.structure || {};
    const dis = ro ? 'disabled' : '';
    const bits = [];
    if (l.kind === 'creative') bits.push(pf('structure', `<select data-f="line:${di}:${li}:cmode" ${dis}><option value="retainer" ${!isHourlyL(l) ? 'selected' : ''}>retainer $/mo</option><option value="hourly" ${isHourlyL(l) ? 'selected' : ''}>hourly</option></select>`, 'shape'));
    if (l.kind === 'search' || l.kind === 'social') bits.push(pf('media funding', `<select data-f="line:${di}:${li}:media_funding" ${dis}><option value="client" ${l.media_funding !== 'agency' ? 'selected' : ''}>client pays</option><option value="agency" ${l.media_funding === 'agency' ? 'selected' : ''}>EMG pays &amp; rebills</option></select>`, 'shape'));
    if (l.kind === 'hourly') bits.push(pf('work', `<input type="text" data-f="line:${di}:${li}:label" value="${esc(l.label || '')}" placeholder="e.g. SEO audit" maxlength="80" ${dis}>`, 'work'));
    if (isFlatL(l)) bits.push(pf('$ / flight month', inp(di, li, 'amount', dollars(l.amount), dis)));
    if (l.kind === 'retainer') {
      bits.push(pf('hours included / mo', inp(di, li, 'hours_included', l.hours_included ?? '', dis + ' title="terms only: printed as “up to N hours/month”"')));
      bits.push(pf('overage $ / hr', inp(di, li, 'overage_rate', dollars(l.overage_rate), dis + ' title="terms only"')));
    }
    if (isHourlyL(l)) { bits.push(pf('rate $ / hr', inp(di, li, 'rate', dollars(l.rate), dis))); bits.push(pf('hrs / month', inp(di, li, 'hours_per_month', l.hours_per_month ?? '', dis))); }
    let structureHtml = '';
    if (l.kind === 'search' || l.kind === 'social') {
      const mode = (st.fee && st.fee.mode) || 'flat';
      bits.push(pf('fee structure', `<select data-f="line:${di}:${li}:fee_mode" ${dis}><option value="flat" ${mode === 'flat' ? 'selected' : ''}>flat %</option><option value="marginal" ${mode === 'marginal' ? 'selected' : ''}>marginal bands</option><option value="whole" ${mode === 'whole' ? 'selected' : ''}>whole-spend band</option></select>`, 'shape'));
      if (mode === 'flat') bits.push(pf('fee %', inp(di, li, 'fee_pct', l.fee_pct ?? '', dis)));
      else structureHtml += bandsTable(di, li, st, dis);
      bits.push(pf('min fee $ / mo', inp(di, li, 'fee_min', dollars(st.fee_min), dis)));
      bits.push(pf('fee cap $ / mo', inp(di, li, 'fee_cap', dollars(st.fee_cap), dis)));
    }
    if (l.kind === 'programmatic') {
      const model = (st.prog && st.prog.model) || 'fee_margin';
      bits.push(pf('model', `<select data-f="line:${di}:${li}:prog_model" ${dis}><option value="fee_margin" ${model === 'fee_margin' ? 'selected' : ''}>fee % + backend margin</option><option value="cpm" ${model === 'cpm' ? 'selected' : ''}>CPM billing (margin only)</option></select>`, 'shape'));
      if (model === 'cpm') bits.push(pf('platform share %', inp(di, li, 'platform_share_pct', st.prog && st.prog.platform_share_pct != null ? st.prog.platform_share_pct : '', dis + ` placeholder="${X.settings.cpm_platform_share_pct}"`)));
      else bits.push(pf('fee %', inp(di, li, 'fee_pct', l.fee_pct ?? '', dis)));   // the backend margin is a deal output (Deal terms), not typed here
    }
    // the rebate is a DEAL term (Deal terms panel, 103); a line-level rebate
    // saved before that still prices but is not offered here
    const cellKey = MEDIA(l.kind) ? 'budget' : isHourlyL(l) ? 'hours' : 'amount';
    const total = months.reduce((s, m) => s + (+((l.months[m] || {})[cellKey]) || 0), 0);
    const totalBox = (MEDIA(l.kind) || isHourlyL(l))
      ? pf(MEDIA(l.kind) ? (l.kind === 'programmatic' ? 'Total budget $' : 'Campaign budget $') : 'total hours (spread)',
          `<input class="totalbudget" type="number" step="any" inputmode="decimal" data-f="line:${di}:${li}:total" value="${MEDIA(l.kind) ? (total ? total / 100 : '') : (total || '')}" placeholder="${MEDIA(l.kind) ? 'spread by days in market' : 'spread evenly'}" ${dis}>`, 'tb')
      : '';
    const cells = months.map(m => { const v = (l.months[m] || {})[cellKey];
      return `<label class="pmcell"><span>${mLabel(m)}</span><input class="cell" type="number" step="any" inputmode="decimal" data-cell="${di}:${li}:${m}:${cellKey}" value="${v == null ? '' : (cellKey === 'hours' ? v : v / 100)}" ${dis}></label>`; }).join('');
    const suggest = '';
    // drivers (099): what this line will look like in market each month — the
    // inputs the benchmark estimate multiplies by hours-per-driver. spend is
    // taken from the budget cell at save time, never typed.
    const DRV = l.kind === 'programmatic' ? ['changes', 'active_campaigns', 'ad_groups', 'ads_live', 'markets']
      : MEDIA(l.kind) ? ['changes', 'active_campaigns', l.kind === 'social' ? 'ad_sets' : 'ad_groups', 'ads_live', 'creatives_refreshed', 'markets']
      : ['meetings', 'reports', 'creatives_delivered'];
    const anyDrv = months.some(m => l.months[m] && l.months[m].drivers && Object.keys(l.months[m].drivers).some(k => k !== 'spend'));
    const drivers = months.length ? `<details class="permonth" ${anyDrv ? 'open' : ''}><summary>drivers for the hours estimate${anyDrv ? ' ✓' : ''}</summary>
        <div class="gridwrap gap6"><table class="sc-grid"><thead><tr><th>per month</th>${months.map(m => `<th>${mLabel(m)}</th>`).join('')}</tr></thead><tbody>
        ${DRV.map(k => `<tr><td class="textleft">${esc(DRIVER_LABELS[k] || k)}</td>${months.map(m => `<td><input class="hcell" type="number" min="0" step="1" inputmode="numeric" data-drv="${di}:${li}:${m}:${k}" aria-label="${esc(DRIVER_LABELS[k] || k)}, ${mLabel(m)}" value="${((l.months[m] || {}).drivers || {})[k] ?? ''}" ${dis}></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        ${dis ? '' : `<div class="cardnote"><button class="ghost" data-act="drvfill:${di}:${li}">copy the first month to every month</button> — counts of what will be live and how often it changes; the estimate uses the client's own campaigns first, then everyone's</div>`}
      </details>` : '';
    return `<div class="linecard" data-li="${li}">
      <div class="cardhead"><span class="chleft"><span class="kbadge" data-out="kbadge:${di}:${li}">${esc(kindLabel(l))}</span>${l.kind === 'programmatic' ? `<span class="pill margintag" data-out="margintag:${di}:${li}"></span>` : ''}</span>
        <span class="chright"><span class="lgp" data-out="lgp:${di}:${li}"></span>${ro ? '' : `<button class="danger" data-act="rmline:${di}:${li}" title="remove line" aria-label="Remove ${esc(kindLabel(l))} line">✕</button>`}</span></div>
      <div class="cardbody">
        <div class="lparams">${bits.join('')}${totalBox}</div>
        ${structureHtml}
        <div class="gpcallout muted" data-out="callout:${di}:${li}"></div>
        ${suggest}
        ${months.length ? `<details class="permonth"><summary>per-month ${cellKey === 'hours' ? 'hours' : cellKey === 'budget' ? 'budget' : 'amount'}</summary><div class="pmrow">${cells}</div></details>` : ''}
        ${drivers}
      </div></div>`;
  }

  function bandsTable(di, li, st, dis) {
    const bands = (st.fee && st.fee.bands) || [];
    return `<table class="bands"><thead><tr><th class="pfl">spend up to $ / mo</th><th class="pfl">fee %</th><th></th></tr></thead><tbody>
      ${bands.map((b, bi) => `<tr>
        <td><input type="number" step="any" inputmode="decimal" data-band="${di}:${li}:${bi}:upto" aria-label="Band ${bi + 1}, spend up to $ per month" value="${b.upto == null ? '' : b.upto / 100}" placeholder="${bi === bands.length - 1 ? 'and above' : ''}" ${dis}></td>
        <td><input type="number" step="any" inputmode="decimal" data-band="${di}:${li}:${bi}:pct" aria-label="Band ${bi + 1}, fee %" value="${b.pct ?? ''}" ${dis}></td>
        <td>${dis ? '' : `<button class="ghost sc-x" data-act="rmband:${di}:${li}:${bi}" aria-label="Remove band ${bi + 1}">×</button>`}</td></tr>`).join('')}
      ${dis ? '' : `<tr><td colspan="3"><button class="ghost" data-act="addband:${di}:${li}">+ band</button> <span class="sc-note">last band: leave "up to" blank for "and above"</span></td></tr>`}
    </tbody></table>`;
  }

  // ---- demand & supply grids ------------------------------------------------
  function demandRows(months, ro) {
    // the lines bring their teams (search → Paid Media + AdOps …) and the
    // always-on teams (account management / planning) are there whatever the
    // lines — rows appear as soon as a line exists, hours still to be filled
    const auto = new Set(autoDepartments());
    const depts = [...new Set([...S.dept_months.map(r => r.department), ...auto])].sort();
    if (!depts.length) return `<tr><td colspan="${months.length + 3}" class="empty-note">Add a line above — its teams appear here.</td></tr>`;
    return depts.map(dep => {
      const vals = months.map(m => { const r = S.dept_months.find(x => x.department === dep && x.month === m); return r ? +r.hours : null; });
      const tot = vals.reduce((s, v) => s + (v || 0), 0);
      // the "every month" box shows the common value when the row is flat, else blank
      const flat = months.length && vals.every(v => v != null && v === vals[0]) ? vals[0] : '';
      return `<tr><td class="textleft"><b>${esc(dep)}</b>${ro || auto.has(dep) ? '' : ` <button class="ghost sc-x" data-act="rmdept:${esc(dep)}" aria-label="Remove ${esc(dep)} from the hours">×</button>`}</td>
        <td class="per"><input class="hcell per" type="number" min="0" step="0.5" inputmode="decimal" data-dmall="${esc(dep)}" value="${flat}" placeholder="all" title="hours per month, every month of the flight" aria-label="${esc(dep)}, every month, hours" ${ro ? 'disabled' : ''}></td>
        ${months.map(m => { const r = S.dept_months.find(x => x.department === dep && x.month === m);
          return `<td><input class="hcell${r && r.source !== 'manual' ? ' ghost' : ''}" type="number" min="0" step="0.5" inputmode="decimal" data-dm="${esc(dep)}|${m}" value="${r ? +r.hours : ''}" aria-label="${esc(dep)}, ${mLabel(m)}, hours" title="${r && r.source !== 'manual' ? 'from the ' + esc(r.source) + ' estimate — type to make it yours' : ''}" ${ro ? 'disabled' : ''}></td>`; }).join('')}
        <td><b data-dtot="${esc(dep)}">${fmtH(tot)}</b></td></tr>`;
    }).join('');
  }

  function supplyRows(months, ro) {
    const sb = staffById();
    const auto = new Set(autoDepartments());
    const depts = departments().filter(dep => auto.has(dep) || S.dept_months.some(r => r.department === dep) || S.staff_months.some(r => r.department === dep));
    if (!depts.length) return `<tr><td colspan="${months.length + 3}" class="empty-note">Add a line above — its teams appear here.</td></tr>`;
    const capBy = {}; ((X.verdict || {}).capacity || []).forEach(c => capBy[`${c.staff_id}|${c.month}`] = c);
    const cands = (X.staffing && X.staffing.candidates) || [];
    return depts.map(dep => {
      const rows = S.staff_months.filter(r => r.department === dep);
      const people = [...new Map(rows.filter(r => r.staff_id).map(r => [r.staff_id + '|' + (r.source || 'manual'), { staff_id: r.staff_id, source: r.source || 'manual' }])).values()]
        .sort((a, b) => ((sb[a.staff_id] || {}).name || '').localeCompare((sb[b.staff_id] || {}).name || '') || a.source.localeCompare(b.source));
      const phs = [...new Set(rows.filter(r => !r.staff_id).map(r => r.band || ''))];
      const demand = m => (S.dept_months.find(r => r.department === dep && r.month === m) || {}).hours || 0;
      const supplied = m => rows.filter(r => r.month === m).reduce((s, r) => s + (+r.hours || 0), 0);
      const topCands = cands.filter(c => c.department === dep && !people.some(p => p.staff_id === c.staff_id)).slice(0, 3);
      const used = new Set(people.map(p => p.staff_id));
      return `<tr class="dept"><td colspan="${months.length + 3}">${esc(dep)}</td></tr>
        ${people.map(p => { const s = sb[p.staff_id] || { name: '(inactive)' };
          return `<tr class="${p.source === 'auto' ? 'auto' : ''}"><td class="textleft">${esc(s.name)}${p.source === 'auto' ? ' <span class="pill" title="auto-staffed — edit to make it yours">auto</span>' : ''}</td>
            ${months.map(m => { const r = rows.find(x => x.staff_id === p.staff_id && x.month === m && (x.source || 'manual') === p.source);

  function recompute() {
    if (!S) return;
    const c = ctx();
    let rev = 0, gp = 0, reb = 0, pass = 0;
    const byM = {};   // live money per flight month — the Monthly verdict redraws from it
    S.deals.forEach((d, di) => {
      const months = monthsBetween(d.flight_start, d.flight_end);
      let dgp = 0;
      (d.lines || []).forEach((l, li) => {
        let lgp = 0, lrev = 0, lfee = 0, lreb = 0;
        // a line's own rebate wins (legacy data); otherwise the scope's applies —
        // basis media only to media lines, basis fee to every line (scope_months, 103)
        const ownReb = !!(l.structure && l.structure.rebate && +l.structure.rebate.pct);
        const media = MEDIA(l.kind);
        const scopeReb = (r, m) => {
          if (ownReb) return r.rebate;
          const pct = +S.rebate_pct || 0; if (!pct) return 0;
          const basis = S.rebate_basis === 'fee' ? 'fee' : 'media';
          if (basis === 'media' && !media) return 0;
          const feeRaw = media ? lineFee(r.budget, l.kind === 'programmatic' ? progParams(l, c).feePct : (l.fee_pct || 0), l.structure) : r.gp;
          return Math.round(lineRebate(r.budget, feeRaw, pct, basis));
        };
        months.forEach(m => { const r = lineMonth(l, m, c); const rb = scopeReb(r, m); lgp += r.gp; lrev += r.billable; lfee += r.fee; lreb += rb; pass += r.pass;
          const t = byM[m] || (byM[m] = { billable: 0, gp: 0, rebate: 0 }); t.billable += r.billable; t.gp += r.gp; t.rebate += rb; });
        dgp += lgp; gp += lgp; rev += lrev; reb += lreb;
        const n = months.length || 1;
        paint(`lgp:${di}:${li}`, `${fmt$(lgp - lreb)} GP`);
        paint(`callout:${di}:${li}`, months.length ? `${MEDIA(l.kind) ? `fee ${fmt$(lfee / n)}` : `${fmt$(lgp / n)}`}${lreb ? ` · rebate −${fmt$(lreb / n)}` : ''} · GP ${fmt$((lgp - lreb) / n)} / mo avg · ${fmt$(lrev)} revenue over ${n} month${n === 1 ? '' : 's'}` : '');
        paint(`kbadge:${di}:${li}`, esc(kindLabel(l)));

    drawVerdict(byM);
  }

      <div style="height:24px"></div>`;

    const p = panel();
    p.querySelector('#bn-deal').onchange = e => { B.dealId = e.target.value || null; B.platforms = {}; B.signals = {}; location.hash = B.dealId ? '#bench/' + B.dealId : '#bench'; renderBench(); };
    const auto = p.querySelector('#bn-auto'); if (auto) auto.onchange = () => { B.excludeAuto = auto.checked; reparseAll(); };
    p.querySelectorAll('input[data-bnpl]').forEach(cb => cb.onchange = () => { B.platforms[cb.dataset.bnpl] = { ...(B.platforms[cb.dataset.bnpl] || {}), on: cb.checked, team: (B.platforms[cb.dataset.bnpl] || {}).team || defaults[cb.dataset.bnpl] || depts[0] }; renderBench(); });
    p.querySelectorAll('select[data-bnteam]').forEach(s => s.onchange = () => { B.platforms[s.dataset.bnteam].team = s.value; });
    p.querySelectorAll('input[data-bnfile]').forEach(inp => inp.onchange = async () => {
      const pl = inp.dataset.bnfile; const P = B.platforms[pl];
      P.files = [...(P.files || []), ...inp.files];
      P.parsed = [];
      for (const f of P.files) P.parsed.push(await parseFile(f, pl, { excludeAutomated: B.excludeAuto }));
      renderBench();
    });
    const st = p.querySelector('#bn-sigteam'); if (st) st.onchange = () => { B.signalsTeam = st.value; };
    p.querySelectorAll('input[data-bnsig]').forEach(i => i.onchange = () => { const [m, k] = i.dataset.bnsig.split(':'); B.signals[m] = { ...(B.signals[m] || {}) }; if (i.value === '') delete B.signals[m][k]; else B.signals[m][k] = Math.max(0, +i.value || 0); if (!Object.keys(B.signals[m]).length) delete B.signals[m]; });
    const sub = p.querySelector('#bn-submit'); if (sub) sub.onclick = submitBench;
    p.querySelector('#bn-fit').onclick = fitAndSave;
    async function reparseAll() { for (const P of Object.values(B.platforms)) { if (!P.files) continue; P.parsed = []; for (const f of P.files) P.parsed.push(await parseFile(f, null, { excludeAutomated: B.excludeAuto })); } renderBench(); }
  }

  async function submitBench() {
    const deal = B.dealId; if (!deal) return;
    const defaults = (B.data.settings && B.data.settings.platform_team_defaults) || {};
    const m = t => { const n = panel().querySelector('#bn-msg'); if (n) { n.textContent = t; } };
    B.busy = true; m('recording…');
    let written = 0;
    for (const [pl, P] of Object.entries(B.platforms)) {
      if (!P.on) continue;
      const good = (P.parsed || []).filter(r => !r.error); if (!good.length) continue;
      const merged = mergeMonths(good);
      const rows = Object.entries(merged).map(([month, drivers]) => ({ month, drivers }));
      const { data, error } = await supa.rpc('record_benchmark_observations', {
        p_upload: { deal_id: deal, platform: pl, department: P.team || defaults[pl], filename: good.map(r => r.filename).join(', '),
                    parser: [...new Set(good.map(r => r.parser))].join(', '), row_count: good.reduce((s, r) => s + (r.rows || 0), 0),
                    summary: { files: good.length, warnings: good.flatMap(r => r.warnings || []) } },
        p_rows: rows, p_by: window.__email });
      if (error || !data.ok) { B.busy = false; m((error ? error.message : data.reason)); renderBench(); return; }
      written += data.months_written;
    }
    if (Object.keys(B.signals).length) {
      const team = B.signalsTeam || defaults.reporting || defaults.calendar || (B.data.departments || [])[0];
      const rows = Object.entries(B.signals).map(([month, drivers]) => ({ month, drivers }));
      const { data, error } = await supa.rpc('record_benchmark_observations', {
        p_upload: { deal_id: deal, platform: 'reporting', department: team, filename: 'typed', parser: 'signals@1', row_count: rows.length, summary: {} },
        p_rows: rows, p_by: window.__email });
      if (error || !data.ok) { B.busy = false; m((error ? error.message : data.reason)); renderBench(); return; }
      written += data.months_written;
    }
    B.busy = false; B.platforms = {}; B.signals = {};
    await loadBench(deal);
    const n = panel().querySelector('#bn-msg'); if (n) n.textContent = `recorded ${written} platform-months`;
  }

  async function fitAndSave() {
    const dept = panel().querySelector('#bn-fitdept').value;
    const out = panel().querySelector('#bn-fitmsg');
    if (!dept) { out.textContent = 'pick a team'; return; }
    const rows = (B.data.observations || []).filter(o => o.department === dept).map(o => ({ drivers: o.drivers || {}, hours: +o.hours, kinds: o.deal_kinds || [] }));
    const minN = +B.data.settings.model_min_observations || 12;
    if (rows.length < minN) { out.textContent = `${rows.length} observations for ${dept}; ${minN} needed before a model is worth fitting — the ratio estimator is used until then`; return; }
    // drivers present in at least 60% of the rows, never spend twice (it is a proxy of budget)
    const counts = {}; rows.forEach(r => Object.keys(r.drivers).forEach(k => { if (k !== 'platforms') counts[k] = (counts[k] || 0) + 1; }));
    const keys = Object.entries(counts).filter(([, c]) => c >= rows.length * 0.6).map(([k]) => k);
    const fit = fitModel(rows, keys);
    if (!fit) { out.textContent = 'not enough rows for these drivers'; return; }
    const kinds = [...new Set(rows.flatMap(r => r.kinds))].sort();
    const { data, error } = await supa.rpc('save_benchmark_model', { p_department: dept, p_kinds: kinds, p_coefficients: fit.coefficients, p_n: fit.n, p_r2: fit.r2, p_by: window.__email });
    if (error || !data.ok) { out.textContent = error ? error.message : data.reason; return; }
    await loadBench(B.dealId);
    const n2 = panel().querySelector('#bn-fitmsg'); if (n2) n2.innerHTML = `fitted <b>${esc(dept)}</b> on ${fit.n} rows, r² ${fit.r2.toFixed(2)}: ${Object.entries(fit.coefficients).map(([k, v]) => `${esc(DRIVER_LABELS[k] || k)} ${(+v).toFixed(k === 'spend' ? 6 : 3)}`).join(', ')}`;
  }

  go();
});
</script>
</body></html>
