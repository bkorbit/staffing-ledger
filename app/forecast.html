</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script type="module">
import { boot, esc, fmt$, barChart, fetchAll } from './assets/shell.js?v=5528fd3';
/*
  The Forecast, remodelled on the v1 ledger's Forecast view, recovered from git:
  months as ROWS in a P&L ledger — Revenue billed, COGS, Forecast GP, Actual GP,
  Variance, Expenses, Net profit, Basis — dark means confirmed actual, light means
  forecasted, measured from QuickBooks once a month is over and projected before
  that. The combo chart carries revenue and the cost stack as bars with net profit
  as the line. Fixed costs are a manual panel subtracted from projected months only.
  Deals stay editable beneath, rolled up into their clients.
*/
boot('forecast', async (supa, el) => {
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mLabel = iso => MO[+iso.slice(5,7)-1] + ' ' + iso.slice(2,4);
  const fmtN = c => (c/100).toLocaleString(undefined,{maximumFractionDigits:0});
  const fmtM = c => (c<0?'-$':'$') + Math.abs(c/100).toLocaleString(undefined,{maximumFractionDigits:0});
  const fmtMoney = fmtM;
  const iso = d => d.toISOString().slice(0,10);
  const t0 = new Date(); t0.setUTCDate(1);
  const thisMonth = iso(t0).slice(0,8)+'01';
  const shiftM = (m,n)=>{const[y,mm]=m.slice(0,7).split('-').map(Number);
    return new Date(Date.UTC(y,mm-1+n,1)).toISOString().slice(0,10);};
  const monthsBetween = (a,b) => { const out=[];
    // flights carry exact dates; the covered months run first-of-start-month
    // through first-of-end-month
    let d=new Date(a.slice(0,7)+'-01T00:00:00Z');
    const end=new Date(b.slice(0,7)+'-01T00:00:00Z');
    while (d<=end && out.length<48) { out.push(d.toISOString().slice(0,10));
      d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)); } return out; };
  const past = m => m < thisMonth;

  // the range: six back, six forward, editable
  let rangeFrom = shiftM(thisMonth,-6), rangeTo = shiftM(thisMonth,6);

  /* ------------------------------------------------- shaping configuration */
  // cells: what per-month grid a line shows — null (flat), 'budget', or 'hours'.
  // flightable: whether a single total can be spread across the open flight months.
  // structured: creative carries a sub-structure (retainer-like or hourly-like).
  const KIND = {
    retainer:     { cells:null,     flat:true,  defaults:[['amount','$ / flight month']] },
    creative:     { cells:'creative', flat:true, defaults:[] },   // structure chosen per line
    search:       { cells:'budget', defaults:[['fee_pct','fee %']] },
    social:       { cells:'budget', defaults:[['fee_pct','fee %']] },
    programmatic: { cells:'budget', defaults:[['fee_pct','fee %'],['margin_pct','margin %']] },
    hourly:       { cells:'hours',  label:true, defaults:[['rate','rate $/hr'],['hours_per_month','hrs/mo default']] },
    custom:       { cells:null,     flat:true,  defaults:[['amount','$ / flight month']], legacy:true },
  };
  const OFFERED = ['retainer','creative','search','social','programmatic','hourly'];
  const CELL_HINT = { budget:'budget $', hours:'hrs' };
  const BILLING_BY_KIND = { retainer:'first', custom:'first', creative:'first',
                            search:'last', social:'last', programmatic:'last', hourly:'last' };
  // how a line's revenue is structured, for creative's two modes
  const creativeMode = l => (l.label||'').startsWith('creative:hourly') ? 'hourly' : 'retainer';
  // billable revenue per month — media lines bill budget+fee (or fee only when the
  // client funds search/social directly); service lines bill what they earn
  function revMonth(l, m, mediaFunding, flight) {
    const fee = l.params.fee_pct || 0;
    const b = l.cells[m] !== undefined ? l.cells[m]*100 : 0;
    switch (l.kind) {
      case 'programmatic': return Math.round(b * (1 + fee/100));
      case 'search': case 'social':
        return mediaFunding === 'agency' ? Math.round(b * (1 + fee/100))
                                         : Math.round(b * fee/100);
      default: return gpMonth(l, m, flight);   // retainer / creative / hourly bill what they earn
    }
  }
  let marginDefault = 35;
  // covered-day fraction of month m within the flight — 1 for fully covered
  function dayFrac(m, flight) {
    if (!flight) return 1;
    const y = +m.slice(0,4), mo = +m.slice(5,7);
    const dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    const monthStart = m, monthEnd = m.slice(0,8) + String(dim).padStart(2,'0');
    const s = flight.start > monthStart ? flight.start : monthStart;
    const e = flight.end   < monthEnd   ? flight.end   : monthEnd;
    const covered = Math.round((new Date(e+'T00:00:00Z') - new Date(s+'T00:00:00Z'))/864e5) + 1;
    return covered >= dim ? 1 : covered / dim;
  }
  function gpMonth(l, m, flight) {
    const cfg = KIND[l.kind];
    const fee = l.params.fee_pct || 0;
    const margin = l.params.margin_pct ?? marginDefault;
    // flat kinds bill full months regardless of covered days — day-weighting is
    // a media concept, carried in the budget cells the spread writes
    const flat = amt => l.cells[m] !== undefined
      ? Math.round(l.cells[m]*100)
      : Math.round(amt*100);
    switch (l.kind) {
      case 'retainer': case 'custom':
        return flat(l.params.amount||0);
      case 'creative':
        return creativeMode(l) === 'hourly'
          ? Math.round((l.params.rate||0)*100*(l.cells[m] ?? l.params.hours_per_month ?? 0))
          : flat(l.params.amount||0);
      case 'hourly': {
        const hrs = l.cells[m] !== undefined ? l.cells[m] : (l.params.hours_per_month||0);
        return Math.round((l.params.rate||0)*100*hrs);
      }
      case 'search': case 'social': {
        const b = l.cells[m] !== undefined ? l.cells[m]*100 : 0;
        return Math.round(b*fee/100);
      }
      case 'programmatic': {
        const b = l.cells[m] !== undefined ? l.cells[m]*100 : 0;
        return Math.round(b*margin/100 + b*fee/100);
      }
    }
    return 0;
  }

  /* --------------------------------------------------- the chart system: combo --
     Third pass, after a full color audit against source: no invented hues at
     all. Six cost categories, five confirmed brand tokens (Deep Ledger Green,
     Slate, Muted Ledger Green, Ledger Teal, Logo Teal) — cogs and fixed share
     Slate since only five real colors exist for six categories; they never
     touch in the stack (cogs is its own bar, fixed sits at the top of the
     opex stack), so position plus the hover title disambiguate them. No hero
     figure (revisit as a KPI ribbon separately); sharp square bars; direct
     value labels on every bar and every net point. */
  function comboChart(elc, rows) {
    const SERIES = [
      ['revenue',  'var(--brand)',   'revenue'],
      ['cogs',     'var(--slate)',   'COGS'],
      ['labour',   'var(--brand-2)', 'labour'],
      ['other',    'var(--brand-4)', 'overhead'],
      ['misc',     'var(--accent)',  'other'],
      ['fixed',    'var(--slate)',   'fixed'],
      ['net',      'var(--gold)',    'net (line)'],
    ];
    const colorOf = Object.fromEntries(SERIES.map(([k,c])=>[k,c]));
    const hidden = new Set(JSON.parse(localStorage.getItem('fc_hidden')||'[]'));
    const on = k => !hidden.has(k);
    const INK = 'var(--ink)', GRID = 'var(--line)';
    const W=960,H=280,P={l:64,r:12,t:16,b:26};
    const fmtC = c => { const d=c/100, a=Math.abs(d);
      return (d<0?'-$':'$') + (a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?Math.round(a/1e3)+'k':Math.round(a)); };
    const opexOf = r => (on('labour')?r.labour:0) + (on('other')?r.other:0)
                      + (on('misc')?r.misc:0) + (on('fixed')?r.fixed:0);
    // scale adapts to what is visible
    const maxBar = Math.max(1, ...rows.map(r=>Math.max(
      on('revenue')?r.revenue:0, on('cogs')?r.cogs:0, opexOf(r))));
    const nets = on('net') ? rows.map(r=>r.net) : [0];
    const SNAP = 25000000;
    const rawMin = Math.min(0, ...nets), rawMax = Math.max(maxBar, ...nets, 1);
    const min = Math.floor(rawMin/SNAP)*SNAP;
    const max = Math.max(Math.ceil(rawMax/SNAP)*SNAP, min + SNAP);
    const y = v => P.t + (H-P.t-P.b) * (1 - (v-min)/((max-min)||1));
    const gap = (W-P.l-P.r)/rows.length, bw = Math.min(13, gap*0.2);
    let g='';
    let step = 50000000;
    if ((max-min)/step > 13) step = 100000000;
    for (let v = Math.ceil(min/step)*step; v <= max; v += step) {
      g+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="${GRID}"/>
        <text x="${P.l-6}" y="${y(v)+3.5}" fill="${INK}" font-size="9" font-family="IBM Plex Mono" text-anchor="end">${fmtC(v)}</text>`;
    }
    if(min<0) g+=`<line x1="${P.l}" y1="${y(0)}" x2="${W-P.r}" y2="${y(0)}" stroke="var(--rust)" stroke-dasharray="4 3"/>`;
    const y0=y(Math.max(min,0));
    // one plain-text line per month, shared by the keyboard focus label and
    // the mouse/touch tooltip below — same pattern as sales.html's chart
    const rowVals = r => ({ revenue:r.revenue, cogs:r.cogs, labour:r.labour, other:r.other, misc:r.misc, fixed:r.fixed, net:r.net });
    const rowParts = r => { const vals=rowVals(r);
      return SERIES.filter(([k])=>on(k) && (k==='net' || vals[k]>0)).map(([k,,lbl])=>`${lbl} ${fmtM(vals[k])}`); };
    rows.forEach((r,i)=>{
      const cx=P.l+gap*i+gap/2, op=r.measured?1:0.55;
      const x0=cx-1.5*bw-2;
      let colG='';
      // called out directly on the chart: revenue and net only. Everything
      // else (COGS, the opex stack) carries its value in the hover tip, not
      // a permanent label — that was the clutter.
      if(on('revenue') && r.revenue>0) colG+=`<rect x="${x0}" y="${y(r.revenue)}" width="${bw}" height="${y0-y(r.revenue)}" fill="${colorOf.revenue}" opacity="${op}"><title>${mLabel(r.m)} revenue ${fmtM(r.revenue)}</title></rect>
        <text x="${x0+bw/2}" y="${y(r.revenue)-4}" fill="${INK}" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">${fmtC(r.revenue)}</text>`;
      if(on('cogs') && r.cogs>0) colG+=`<rect x="${x0+bw+2}" y="${y(r.cogs)}" width="${bw}" height="${y0-y(r.cogs)}" fill="${colorOf.cogs}" opacity="${op}"><title>${mLabel(r.m)} COGS ${fmtM(r.cogs)}</title></rect>`;
      let acc=0; const xs=x0+2*(bw+2);
      [['labour'],['other'],['misc'],['fixed']].forEach(([k])=>{
        if(!on(k)) return;
        const v=r[k]; if(!v) return;
        const y1=y(acc+v), h=y(acc)-y(acc+v); acc+=v;
        const nm = k==='other'?'overhead':k==='misc'?'other accts':k;
        colG+=`<rect x="${xs}" y="${y1}" width="${bw}" height="${h}" fill="${colorOf[k]}" opacity="${op}"><title>${mLabel(r.m)} ${nm} ${fmtM(v)}</title></rect>`;
      });
      colG+=`<text x="${cx}" y="${H-8}" fill="${INK}" font-size="${rows.length>14?8:9.5}" font-family="IBM Plex Mono" text-anchor="middle">${mLabel(r.m)}</text>`;
      // the whole column (bars + month label) is one keyboard focus stop —
      // Tab reaches every month in order, focus shows the same aggregate
      // tooltip a mouse hover does, so the breakdown isn't mouse/touch-only
      const parts = rowParts(r);
      const colSummary = `${mLabel(r.m)} (${r.measured?'measured':'forecast'}): ${parts.length?parts.join(', '):'no data'}`;
      g+=`<g tabindex="0" role="img" aria-label="${esc(colSummary)}" class="colgroup" data-idx="${i}">${colG}</g>`;
    });
    if (on('net')) {
      // the net line honors the same measured/forecast weighting as the bars —
      // each segment dims and dashes when either end is still a projection
      for (let i = 0; i < rows.length - 1; i++) {
        const segMeasured = rows[i].measured && rows[i+1].measured;
        const x1 = P.l+gap*i+gap/2, x2 = P.l+gap*(i+1)+gap/2;
        g+=`<line x1="${x1}" y1="${y(rows[i].net)}" x2="${x2}" y2="${y(rows[i+1].net)}"
          stroke="${colorOf.net}" stroke-width="2.5" opacity="${segMeasured?1:0.55}"
          ${segMeasured?'':'stroke-dasharray="5 3"'}/>`;
      }
      rows.forEach((r,i)=>{const cx=P.l+gap*i+gap/2, cy=y(r.net);
        const tip = `${mLabel(r.m)} net ${fmtM(r.net)} — ${r.measured?'measured':'forecast: GP − labour − overhead − other − fixed'}`;
        g+=`<circle cx="${cx}" cy="${cy}" r="4" fill="${colorOf.net}" stroke="var(--paper-raised)" stroke-width="2" opacity="${r.measured?1:0.55}"><title>${tip}</title></circle>
        <text x="${cx}" y="${cy+17}" fill="${INK}" font-size="9.5" font-weight="600" font-family="IBM Plex Mono" text-anchor="middle">${fmtC(r.net)}</text>`;});
    }
    // the legend lives in the chart's grey footer bar (the app-wide standard —
    // see sales.html) and toggles series on click; real <button>s get Enter/Space
    // activation for free, no manual keydown handling needed
    const legItems = SERIES.map(([k,c,label])=>{
      const off = hidden.has(k);
      return `<button class="lg-item toggle" data-k="${k}" aria-pressed="${!off}"
          aria-label="${off?'show':'hide'} ${label} series"${off?' style="opacity:.4"':''}>
        <i class="lg-dot" style="${off?'background:transparent;border:1.5px dashed var(--slate)':`background:${c}`}"></i>
        <span${off?' style="text-decoration:line-through"':''}>${label}</span></button>`;
    }).join('');
    elc.style.position='relative';
    elc.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}"><g>${g}</g></svg><div class="chart-tip"></div>
      <div class="chart-legend">${legItems}</div>`;
    const toggleSeries = k => {
      hidden.has(k) ? hidden.delete(k) : hidden.add(k);
      localStorage.setItem('fc_hidden', JSON.stringify([...hidden]));
      comboChart(elc, rows);
    };
    elc.querySelectorAll('.lg-item.toggle').forEach(b => { b.onclick = () => toggleSeries(b.dataset.k); });
    // real hover tooltip, same pattern as sales.html: aggregates every
    // visible series for the whole month, not just the one segment under
    // the cursor. The per-rect <title> stays as a no-JS/a11y floor.
    // Shared by mouse/touch (showAt, from cursor position) AND keyboard
    // (each column's own tabindex="0" focus, wired below).
    const svgEl = elc.querySelector('svg.chart');
    const tip = elc.querySelector('.chart-tip');
    const tipHtmlFor = idx => {
      const r = rows[idx], vals = rowVals(r);
      const tipRows = SERIES.filter(([k])=>on(k) && (k==='net' || vals[k]>0))
        .map(([k,c,lbl])=>`<div class="tip-row"><span class="tip-dot" style="background:${c}"></span>${esc(lbl)} <b>${fmtM(vals[k])}</b></div>`);
      return `<div class="tip-label">${mLabel(r.m)} · ${r.measured?'measured':'forecast'}</div>` +
        (tipRows.length ? tipRows.join('') : '<div class="tip-row">no data</div>');
    };
    const positionNear = (clientX, clientY) => {
      const box = elc.getBoundingClientRect();
      tip.style.left = (clientX - box.left + 12) + 'px';
      tip.style.top = (clientY - box.top - 10) + 'px';
    };
    const showAt = (clientX, clientY) => {
      const svgBox = svgEl.getBoundingClientRect();
      const scale = W / svgBox.width;
      const vx = (clientX - svgBox.left) * scale;
      let idx = Math.floor((vx - P.l) / gap);
      idx = Math.max(0, Math.min(rows.length - 1, idx));
      tip.innerHTML = tipHtmlFor(idx);
      tip.style.opacity = '1';
      positionNear(clientX, clientY);
    };
    const hideTip = () => { tip.style.opacity = '0'; };
    svgEl.onmousemove = e => showAt(e.clientX, e.clientY);
    svgEl.onmouseleave = hideTip;
    svgEl.ontouchstart = svgEl.ontouchmove = e => { if (e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
    svgEl.ontouchend = hideTip;
    elc.querySelectorAll('.colgroup').forEach(colEl => {
      const idx = +colEl.dataset.idx;
      colEl.onfocus = () => {
        tip.innerHTML = tipHtmlFor(idx);
        tip.style.opacity = '1';
        const r = colEl.getBoundingClientRect();
        positionNear(r.left + r.width / 2, r.top);
      };
      colEl.onblur = hideTip;
    });
  }

  /* -------------------------------------------------------------- the data */
  // Supabase caps every response at 1000 rows SERVER-side — .limit() cannot exceed
  // it. Anything that can outgrow a thousand rows must page.
  async function fetchAll(build) {
    const page = 1000;
    const one = async i => build().range(i * page, (i + 1) * page - 1);
    const first = await one(0);
    if (first.error) return first;
    const out = [...(first.data || [])];
    if (out.length < page) return { data: out, error: null };
    // pages arrive in parallel waves that double: 4, then 8, then 16 …
    for (let start = 1, wave = 4; ; start += wave, wave *= 2) {
      const results = await Promise.all(
        Array.from({ length: wave }, (_, k) => one(start + k)));
      let done = false;
      for (const r of results) {
        if (r.error) return { data: out, error: r.error };
        out.push(...(r.data || []));
        if ((r.data || []).length < page) { done = true; break; }
      }
      if (done) return { data: out, error: null };
    }
  }

  // A small combobox — type to filter, click/arrow+Enter to pick — replacing
  // a bare <select> wherever the option list can run into the hundreds (the
  // QB-project link and the deal-link picker both hit this: "many X to match"
  // in one flat, unfiltered dropdown is what "confusing, unusable" describes).
  // root must already contain .qpsearch (visible text input), .qp (hidden
  // value input), .qpmenu (floating results div). spec(query) returns
  // { groups: [{label, items}], hint: string|null }; getLabel/getBadges format
  // one item; onPick fires after every pick or clear.
  function mountCombobox(root, { spec, getLabel, getBadges, initialId, initialLabel, onPick }) {
    const search = root.querySelector('.qpsearch'), hidden = root.querySelector('.qp'),
          menu = root.querySelector('.qpmenu');
    let flat = [], active = -1;
    let confirmedLabel = initialId ? (initialLabel || String(initialId)) : '';
    hidden.value = initialId || '';
    search.value = confirmedLabel;

    const paint = () => [...menu.querySelectorAll('.qp-row')]
      .forEach((el, i) => el.classList.toggle('active', i === active));
    const scrollActive = () => { const el = menu.querySelectorAll('.qp-row')[active]; if (el) el.scrollIntoView({ block:'nearest' }); };

    function render(q) {
      const { groups, hint } = spec(q);
      flat = groups.flatMap(g => g.items);
      active = flat.length ? 0 : -1;
      menu.innerHTML = groups.map(g => `<div class="qp-group">${esc(g.label)}</div>` +
          g.items.map(it => `<div class="qp-row" data-flat="${flat.indexOf(it)}">
            <span class="qp-name">${esc(getLabel(it))}</span>
            <span class="qp-badges">${(getBadges(it)||[]).map(b=>`<span class="pill warn">${esc(b)}</span>`).join('')}</span>
          </div>`).join('')).join('')
        + (!groups.length ? `<div class="qp-empty">No matches${q?` for "${esc(q)}"`:''}.</div>` : '')
        + (hint ? `<div class="qp-hint">${esc(hint)}</div>` : '');
      paint();
      menu.hidden = false;
    }
    const close = () => { menu.hidden = true; active = -1; };
    function pick(it) {
      hidden.value = it ? String(it.id) : '';
      confirmedLabel = it ? getLabel(it) : '';
      search.value = confirmedLabel;
      close();
      onPick(it);
    }
    search.addEventListener('focus', () => { search.select(); render(''); });
    search.addEventListener('input', () => render(search.value));
    search.addEventListener('keydown', e => {
      if (menu.hidden) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active+1, flat.length-1); paint(); scrollActive(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active-1, 0); paint(); scrollActive(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (flat[active]) pick(flat[active]); }
      else if (e.key === 'Escape') { close(); search.value = confirmedLabel; }
    });
    menu.addEventListener('mousedown', e => {
      const row = e.target.closest('.qp-row'); if (!row) return;
      e.preventDefault(); pick(flat[+row.dataset.flat]);
    });
    search.addEventListener('blur', () => { close(); search.value = confirmedLabel; });
    return { clear: () => pick(null), refresh: () => { if (!menu.hidden) render(search.value); } };
  }

  let months, clientsById, dealsByClient, planByM, planBillByM, revByM, costByCM, openEditor = null;
  let projects = [], projTakenBy = {}, fixedCosts = [], runrate = { payroll:0, overhead:0, misc:0 };
  let acctTotals = [], fullProjects = null;
  let revByProj = {}, cogsByProj = {}, openClients = new Set();
  let tableSort = { key:'value', dir:-1 }, tableQuery = '';
  let unattributedOpen = false;
  let plRowsCache = [];

  async function loadAll() {
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    months = monthsBetween(rangeFrom, rangeTo);
    const [pg, dl, cl, st] = await Promise.all([
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      supa.from('deals')
        .select('id,name,client_id,reviewed_at,flight_start,flight_end,qbo_project_id,promotions(as_sold:source_payload->>amount)')
        .in('status',['won','active'])
        .eq('hidden', false)
        .gte('flight_end','2026-01-01'),   // the platform starts at 2026
      supa.from('clients').select('id,name,active,qbo_customer_id').eq('active', true),
      supa.from('settings').select('key,value')
        .in('key',['programmatic_margin_default','forecast_fixed_costs'])
    ]);
    for (const r of [pg,dl,cl,st]) if (r.error) throw r.error;
    const P = pg.data || {};
    const sv = k => (st.data||[]).find(x=>x.key===k)?.value;
    marginDefault = +(sv('programmatic_margin_default') ?? 35);
    fixedCosts = sv('forecast_fixed_costs') || [];
    runrate = { payroll: P.runrates?.payroll||0, overhead: P.runrates?.overhead||0,
                misc: P.runrates?.other||0 };
    projects = P.projects || [];

    revByM = {}; (P.rev_month||[]).forEach(r => revByM[r.month] = r.total);
    revByProj = {}; (P.rev_proj||[]).forEach(r => revByProj[r.qbo_project_id] = { total: r.total });
    costByCM = {}; (P.cost_month||[]).forEach(r => {
      (costByCM[r.class] = costByCM[r.class]||{})[r.month] = r.total; });
    cogsByProj = {}; (P.cogs_proj||[]).forEach(r => cogsByProj[r.qbo_project_id] = r.total);
    acctTotals = P.accounts || [];
    planByM = {}; planBillByM = {};
    (P.plan_month||[]).forEach(r => { planByM[r.month] = r.gp; planBillByM[r.month] = r.billable; });
    const planByDeal = {};
    (P.plan_deal||[]).forEach(r => planByDeal[r.deal_id] =
      { gpAll: r.gp_all, gpSettled: r.gp_settled, billFuture: r.bill_future });

    // the maps the rest of the page reads — rebuilt here because everything they
    // need (clients, the matched deals) has just loaded
    clientsById = {}; (cl.data||[]).forEach(c => clientsById[c.id] = c);

    dealsByClient = {};
    (dl.data||[]).forEach(d => { if (clientsById[d.client_id]) {
      d._agg = planByDeal[d.id] || { gpAll:0, gpSettled:0, billFuture:0 };
      (dealsByClient[d.client_id] = dealsByClient[d.client_id]||[]).push(d); }});

    // which deal owns which project — for the picker's "linked to:" labels
    projTakenBy = {};
    (dl.data||[]).forEach(d => { if (d.qbo_project_id) projTakenBy[d.qbo_project_id] = d.name; });

    render();
  }

  /* ---------------------------------------------------------- export (xlsx) */
  // rows = client/deal/channel, columns = months from now onward — a fill-in
  // template, not a report: blank cells mean "no forecast data past here" so
  // gaps are visible at a glance. Revenue only (GP is derived, not entered).
  const FEE_KINDS = ['search','social','programmatic'];
  const MONEY_FMT = '"$"#,##0;-"$"#,##0';
  const GREY_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFDCDCDC' } };
  async function exportForecast() {
    const btn = el.querySelector('#export-fc');
    if (!btn || btn.disabled) return;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Exporting…';
    try {
      // a deal that ended last month still needs a row — its client is active
      // and has nothing forecast going forward, which is exactly the gap this
      // export is for. Anything older than that is a stale deal, not a gap.
      const cutoff = shiftM(thisMonth, -1);
      const clientIds = Object.keys(dealsByClient)
        .filter(cid => dealsByClient[cid].some(d => d.flight_end >= cutoff));
      if (!clientIds.length) { alert('No deals have a forecast from last month onward.'); return; }

      const dealIds = clientIds.flatMap(cid =>
        dealsByClient[cid].filter(d => d.flight_end >= cutoff).map(d => d.id));
      const chunks = [];
      for (let i = 0; i < dealIds.length; i += 200) chunks.push(dealIds.slice(i, i + 200));
      const pages = await Promise.all(chunks.map(chunk => fetchAll(() =>
        supa.from('deal_lines').select('*, deal_line_months(*)').in('deal_id', chunk).order('set_at'))));
      for (const p of pages) if (p.error) throw p.error;
      const linesByDeal = {};
      pages.forEach(p => (p.data||[]).forEach(l =>
        (linesByDeal[l.deal_id] = linesByDeal[l.deal_id]||[]).push(l)));

      let maxEnd = thisMonth;
      clientIds.forEach(cid => dealsByClient[cid].forEach(d => {
        if (d.flight_end >= cutoff && d.flight_end > maxEnd) maxEnd = d.flight_end;
      }));
      const cols = monthsBetween(thisMonth, maxEnd);
      const FIRST_MONTH_COL = 7; // Client, Deal, Start, End, Channel, Fee % — then months

      const kindLabelOf = l => l.kind === 'creative'
        ? `creative · ${(l.label||'').startsWith('creative:hourly') ? 'hourly' : 'retainer'}`
        : l.kind;

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Revenue Forecast');
      ws.columns = [
        { header:'Client', width:24 }, { header:'Deal', width:28 },
        { header:'Start Date', width:12 }, { header:'End Date', width:12 },
        { header:'Channel', width:16 }, { header:'Fee %', width:9 },
        ...cols.map(m => ({ header: mLabel(m), width:11 })),
      ];
      ws.getRow(1).eachCell(cell => {
        cell.font = { bold:true, color:{ argb:'FFFFFFFF' } };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0A493C' } };
      });

      // a month cell greys out when it falls outside this row's flight — that's
      // "nothing to fill here", distinct from a plain blank (in-flight, just
      // not entered yet, e.g. every month of an ADD CHANNELS row)
      function addRow(c, d, flight, start, channel, feePct, valueOf) {
        const row = ws.addRow([c.name, d.name, flight.start, flight.end, channel, feePct,
          ...cols.map(valueOf)]);
        if (typeof feePct === 'number') row.getCell(6).numFmt = '0.0"%"';
        cols.forEach((m, i) => {
          const cell = row.getCell(FIRST_MONTH_COL + i);
          if (m < start || m > flight.end) cell.fill = GREY_FILL;
          else if (typeof cell.value === 'number') cell.numFmt = MONEY_FMT;
        });
      }

      clientIds.map(cid => clientsById[cid]).filter(Boolean)
        .sort((a,b) => a.name.localeCompare(b.name))
        .forEach(c => {
          dealsByClient[c.id].filter(d => d.flight_end >= cutoff)
            .sort((a,b) => a.name.localeCompare(b.name))
            .forEach(d => {
              const flight = { start: d.flight_start, end: d.flight_end };
              const startMonth = flight.start.slice(0,8) + '01';
              const start = startMonth > thisMonth ? startMonth : thisMonth;
              const lines = linesByDeal[d.id] || [];
              if (!lines.length) {
                addRow(c, d, flight, start, 'ADD CHANNELS', '', () => null);
                return;
              }
              lines.forEach(l => {
                const cfg = KIND[l.kind] || KIND.custom;
                const isHourly = l.kind==='hourly'
                  || (l.kind==='creative' && (l.label||'').startsWith('creative:hourly'));
                const cellCol = cfg.cells==='budget' ? 'budget'
                  : (cfg.cells==='hours' || isHourly) ? 'hours' : 'amount';
                const cellsMap = {};
                (l.deal_line_months||[]).forEach(o => {
                  const v = cellCol==='hours' ? o.hours : o[cellCol];
                  if (v!=null) cellsMap[o.month] = cellCol==='hours' ? +v : v/100;
                });
                const model = { kind:l.kind, label:l.label,
                  params: { amount:l.amount?l.amount/100:0, fee_pct:l.fee_pct||0,
                            margin_pct:l.margin_pct, rate:l.rate?l.rate/100:0,
                            hours_per_month:+l.hours_per_month||0 },
                  cells: cellsMap };
                const mediaFunding = l.media_funding || 'client';
                const feePct = FEE_KINDS.includes(l.kind) ? (+l.fee_pct || 0) : '';
                addRow(c, d, flight, start, kindLabelOf(l), feePct, m =>
                  m < start || m > flight.end ? null : revMonth(model, m, mediaFunding, flight)/100);
              });
            });
        });

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `emg-forecast_${thisMonth.slice(0,7)}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Export failed: ' + (err.message || err));
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  /* ---------------------------------------------------------------- render */
  function render() {
    el.innerHTML = `
      <div class="range">
        <span class="rl">Range</span>
        <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0,7)}">
        <span class="rd">to</span>
        <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0,7)}">
        <span style="flex:1"></span>
        <button id="export-fc">Export forecast</button>
        <button id="costs-how" aria-expanded="false" aria-controls="how-panel">How costs are counted ▸</button>
      </div>
      <div id="how-panel" class="sc-panel" style="display:none">
        <div class="sc-eyebrow">How every number is counted</div>
        <div style="font-size:11.5px;line-height:1.7;max-width:900px">
          <b>Revenue billed</b> = QuickBooks invoice totals by issue date (already net of
          contra-revenue lines on the invoice). <b>COGS</b> = expense lines on accounts
          QuickBooks types as Cost of Goods Sold. <b>Labour</b> = Expense accounts whose
          name or subtype says payroll/salaries/wages. <b>Overhead</b> = every other
          Expense account. <b>Other</b> = lines on accounts with no recognisable type.
          <b>Excluded</b> = balance-sheet lines (credit-card payments, transfers, AP/AR,
          equity) — they move money without being a cost, so they never enter the chart.
          Settled months are measured; forward months use six-month trailing averages.
          If July looks wrong, the table below is where to find why — and
          <code>update qbo_accounts set override_class='cogs', override_reason='…' where id='…'</code>
          reclassifies an account everywhere at once.</div>
        <div id="how-table" style="margin-top:10px;max-height:340px;overflow-y:auto"></div>
      </div>
      <div class="summary-strip" id="kpis"></div>
      <div class="sc-panel chartpanel"><div id="chart"></div></div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools">
          <span class="sc-eyebrow" style="margin:0">Clients over the range</span>
          <input type="search" id="tq" placeholder="search clients & deals…" value="${esc(tableQuery)}">
          <span id="missing-note" class="muted" style="font-size:11px"></span>
        </div>
        <div style="overflow-x:auto"><table class="acct" id="sum"></table></div></div>`;

    el.querySelector('#r-from').onchange = e => { rangeFrom = e.target.value+'-01'; loadAll(); };
    el.querySelector('#r-to').onchange   = e => { rangeTo   = e.target.value+'-01'; loadAll(); };
    el.querySelector('#export-fc').onclick = exportForecast;

    // ---- fixed costs still feed the projected net line; edited on Settings ----
    const fixedTotal = () => fixedCosts.reduce((s,f)=>s+(f.amount||0),0);
    const costsHowBtn = el.querySelector('#costs-how');
    costsHowBtn.onclick = () => {
      const p = el.querySelector('#how-panel');
      const opening = p.style.display==='none';
      p.style.display = opening ? '' : 'none';
      costsHowBtn.setAttribute('aria-expanded', String(opening));
      costsHowBtn.textContent = `How costs are counted ${opening?'▾':'▸'}`;
      if (opening) {
        const rows = acctTotals.map(r => ({ cls:r.class, acct:r.account, v:r.total }))
          .sort((a,b)=> a.cls===b.cls ? b.v-a.v : a.cls.localeCompare(b.cls));
        const inChart = { cogs:'in chart', payroll:'in chart (labour)', overhead:'in chart',
                          other:'in chart', income:'nets against revenue (contra)',
                          excluded:'EXCLUDED from chart' };
        el.querySelector('#how-table').innerHTML =
          `<table class="acct"><tr><th style="text-align:left">class</th>
             <th style="text-align:left">account</th><th>total in range</th>
             <th style="text-align:left">counted?</th></tr>` +
          rows.map(r=>`<tr><td>${esc(r.cls)}</td>
            <td style="text-align:left"><span class="ellip" style="max-width:320px">${esc(r.acct)}</span></td>
            <td>${fmtM(r.v)}</td>
            <td style="text-align:left" class="${r.cls==='excluded'?'warn':'muted'}">${inChart[r.cls]||''}</td></tr>`).join('') +
          `</table>`;
      }
    };
    // fixed-costs panel retired from the header; values live on Settings

    // ---- per-month rows still feed the chart; the table is per client now ----
    const cur = thisMonth;
    const rowFor = m => {
      const settled = past(m), current = m === cur;
      // a month is actual only once it is fully over — the in-progress month runs
      // entirely on forecast, so August never shows a half-month's fake net
      const measured = settled;
      const revenue = measured ? (revByM[m]||0) : (planBillByM[m]||0);
      const cogs = measured ? ((costByCM.cogs||{})[m]||0)
                            : Math.max(0,(planBillByM[m]||0)-(planByM[m]||0));
      const forecastGP = planByM[m]||0;
      const actualGP = measured ? revenue - cogs : null;
      const labour = measured ? ((costByCM.payroll||{})[m]||0) : runrate.payroll;
      const other  = measured ? ((costByCM.overhead||{})[m]||0) : runrate.overhead;
      const misc   = measured ? ((costByCM.other||{})[m]||0) : runrate.misc;
      const fixed  = measured ? 0 : fixedTotal();
      const net = (measured ? actualGP : forecastGP) - labour - other - misc - fixed;
      return { m, settled, current, measured, revenue, cogs, forecastGP, actualGP,
               labour, other, misc, fixed, net };
    };
    const plRows = months.map(rowFor);
    comboChart(el.querySelector('#chart'), plRows);
    plRowsCache = plRows;

    // headline numbers for the range, sourced from the exact same plRows
    // the chart draws from — so the ribbon and the chart can never disagree
    const netTotal = plRows.reduce((s,r)=>s+r.net,0);
    const revTotal = plRows.reduce((s,r)=>s+r.revenue,0);
    const gpTotal = plRows.reduce((s,r)=>s+(r.measured?r.actualGP:r.forecastGP),0);
    const measuredCount = plRows.filter(r=>r.measured).length;
    el.querySelector('#kpis').innerHTML = `
      <div class="summary-cell"><div class="summary-label">Net profit</div>
        <div class="summary-value ${netTotal<0?'neg':'pos'}">${fmtM(netTotal)}</div>
        <div class="summary-note">${plRows.length} months, ${mLabel(rangeFrom)}–${mLabel(rangeTo)}</div></div>
      <div class="summary-cell"><div class="summary-label">Revenue</div>
        <div class="summary-value">${fmtM(revTotal)}</div>
        <div class="summary-note">billed + planned, this range</div></div>
      <div class="summary-cell"><div class="summary-label">Gross profit</div>
        <div class="summary-value ${gpTotal<0?'neg':'pos'}">${fmtM(gpTotal)}</div>
        <div class="summary-note">actual + forecast, this range</div></div>
      <div class="summary-cell"><div class="summary-label">Measured</div>
        <div class="summary-value">${measuredCount} / ${plRows.length}</div>
        <div class="summary-note">months fully closed</div></div>`;

    renderTable();
  }

  // the table re-renders alone on search / sort / expand — the shell and chart
  // are rebuilt only when the data reloads, which is what makes clicks instant
  function renderTable() {
    const plRows = plRowsCache;
    // ---- ONE table: clients over the range, deals under a collapsible arrow ----
    const parentOf = {}; projects.forEach(p => parentOf[p.id] = p.parent_id || p.id);
    const projsUnder = {}; projects.forEach(p => (projsUnder[parentOf[p.id]] = projsUnder[parentOf[p.id]]||[]).push(p.id));
    // a project matched to a deal belongs to THAT deal's client — this is what lets
    // two platform clients split one QuickBooks parent (On Location WC vs Events)
    const projClaimedBy = {};
    Object.values(dealsByClient).flat().forEach(d => {
      if (d.qbo_project_id) projClaimedBy[d.qbo_project_id] = d.client_id;
    });

    const dealRow = d => {
      const p = d._agg || { gpAll:0, gpSettled:0, billFuture:0 };
      const matched = !!d.qbo_project_id;
      const revA = matched ? ((revByProj[d.qbo_project_id]||{}).total||0) : 0;
      const cogsA = matched ? (cogsByProj[d.qbo_project_id]||0) : 0;
      const value = revA + p.billFuture;              // billed to date + forecast billable
      const gpBilled = matched ? revA - cogsA : null;  // gross profit earned so far
      const gpFc = p.gpAll - p.gpSettled;              // plan GP still ahead (current + future)
      // variance: what the PAST months' forecast promised vs what actually landed
      const variance = matched && p.gpSettled && gpBilled !== null
        ? Math.round((gpBilled/p.gpSettled - 1)*100) : null;
      const ended = d.flight_end < thisMonth;
      const basis = ended ? (matched ? 'ended (actual)' : 'ended · no QB link')
        : (matched ? 'actual (QuickBooks) + ' : (revA||cogsA ? '' : 'no QB link · ')) + (ended ? '' : 'forecast');
      return { value, gpBilled, gpFc, variance, basis, matched, ended };
    };
    const clientRow = c => {
      const ds = dealsByClient[c.id]||[];
      const fromParent = (c.qbo_customer_id ? (projsUnder[c.qbo_customer_id]||[]) : [])
        .filter(pid => !projClaimedBy[pid] || projClaimedBy[pid] === c.id);
      const fromDeals = ds.map(d=>d.qbo_project_id).filter(Boolean);
      const myProjects = [...new Set([...fromParent, ...fromDeals])];
      const revA = myProjects.reduce((s,pid)=>s+((revByProj[pid]||{}).total||0),0);
      const cogsA = myProjects.reduce((s,pid)=>s+(cogsByProj[pid]||0),0);
      const billFuture = ds.reduce((s,d)=>s+((d._agg||{}).billFuture||0),0);
      const gpAll = ds.reduce((s,d)=>s+((d._agg||{}).gpAll||0),0);
      const gpSettled = ds.reduce((s,d)=>s+((d._agg||{}).gpSettled||0),0);
      const value = revA + billFuture;
      const gpBilled = (revA||cogsA) ? revA - cogsA : null;
      const gpFc = gpAll - gpSettled;
      const variance = gpSettled && gpBilled !== null
        ? Math.round((gpBilled/gpSettled - 1)*100) : null;
      const basis = (revA||cogsA ? 'actual (QuickBooks) + ' : '') + (gpAll ? 'forecast' : '—');
      return { value, gpBilled, gpFc, variance, basis };
    };

    const num = v => v ? fmtM(v) : '';
    const varCell = v => v===null||v===undefined ? '' :
      `<span class="${Math.abs(v)>15?'err':'ok'}">${v>=0?'+':''}${v}%</span>`;

    const q = tableQuery.trim().toLowerCase();
    // active in the period = the flight overlaps the range window. A deal spanning
    // the whole window counts; one that ended before it or starts after it does not.
    const rangeEndExcl = shiftM(rangeTo, 1);
    const activeInRange = d => d.flight_start < rangeEndExcl && d.flight_end >= rangeFrom;
    const visibleDeals = c => (dealsByClient[c.id]||[]).filter(activeInRange);
    const clients = Object.values(clientsById).filter(c => {
      const ds = visibleDeals(c);
      const cr = clientRow(c);
      const hasData = ds.length || cr.value || cr.gpBilled !== null;
      if (!hasData) return false;
      if (!q) return true;
      return c.name.toLowerCase().includes(q) ||
             ds.some(d => d.name.toLowerCase().includes(q));
    }).map(c => ({ c, agg: clientRow(c),
                   missing: visibleDeals(c).filter(d => !(d._agg||{}).gpAll && d.flight_end >= thisMonth).length,
                   noProj: visibleDeals(c).filter(d => !d.qbo_project_id).length }));

    const dir = tableSort.dir, key = tableSort.key;
    const sv = a => key==='name' ? a.c.name.toLowerCase()
      : key==='variance' ? (a.agg.variance ?? -1e15*dir)
      : key==='value' ? (a.agg.value||0)
      : key==='gpBilled' ? (a.agg.gpBilled ?? -1e15*dir)
      : key==='gpFc' ? (a.agg.gpFc||0)
      : (a.agg[key] ?? 0);
    clients.sort((a,b)=>{ const x=sv(a), y=sv(b);
      return (x<y?-1:x>y?1:0) * (key==='name'?-dir:dir) * -1; });

    const totalMissing = Object.values(clientsById).map(visibleDeals).flat()
      .filter(d=>!(d._agg||{}).gpAll && d.flight_end >= thisMonth).length;

    let totals = { value:0, gpBilled:0, gpFc:0 };
    const bodyRows = clients.map(({c, agg, missing, noProj}) => {
      totals.value+=agg.value; totals.gpBilled+=agg.gpBilled||0; totals.gpFc+=agg.gpFc;
      const ds = visibleDeals(c)
        .filter(d => !q || d.name.toLowerCase().includes(q) || c.name.toLowerCase().includes(q))
        .sort((a,b)=>(b.flight_end||'').localeCompare(a.flight_end||''));
      const isOpen = openClients.has(c.id) || (q && ds.length);
      // clickable rows are also real keyboard targets: tabbable, role=button,
      // and (for the expandable client row) aria-expanded reflects open state
      const head = `<tr class="clientrow" data-cid="${c.id}" tabindex="0" role="button" aria-expanded="${isOpen}">
        <td class="namecell"><span class="muted">${ds.length?(isOpen?'▾':'▸'):'·'}</span>
          <span class="namewrap">${esc(c.name)}</span>
          ${missing?`<span class="pill warn" style="margin-left:6px" title="${missing} deal(s) with no forecast">${missing} missing forecast</span>`:''}
          ${noProj?`<span class="pill bad" style="margin-left:6px" title="${noProj} deal(s) with no QuickBooks project — no actuals until linked">${noProj} no QB project</span>`:''}</td>
        <td>${num(agg.value)}</td>
        <td>${agg.gpBilled!==null?`<span class="${agg.gpBilled<0?'neg':''}">${fmtM(agg.gpBilled)}</span>`:'<span class="muted">—</span>'}</td>
        <td style="color:var(--brand)">${agg.gpFc?fmtM(agg.gpFc):''}</td>
        <td>${varCell(agg.variance)}</td>
        <td style="text-align:left" class="muted">${agg.basis}</td></tr>`;
      const takenProjects = new Set(ds.map(d=>d.qbo_project_id).filter(Boolean));
      const projRows = !isOpen ? '' : (c.qbo_customer_id ? (projsUnder[c.qbo_customer_id]||[]) : [])
        .filter(pid => !takenProjects.has(pid) && !projClaimedBy[pid] &&
          (((revByProj[pid]||{}).total||0) || (cogsByProj[pid]||0)))
        .map(pid => {
          const rv = ((revByProj[pid]||{}).total||0);
          const cg = cogsByProj[pid]||0;
          const pj = projects.find(p=>p.id===pid)||{};
          return `<tr class="dealsub projrow" data-pid="${pid}" data-cid="${c.id}" title="click to link this project to one of ${esc(c.name)}'s deals" tabindex="0" role="button">
            <td class="namecell" style="padding-left:28px;color:var(--slate)">◦
              <span class="namewrap">${esc(pj.name||pid)}</span></td>
            <td>${rv?fmtM(rv):''}</td>
            <td>${(rv||cg)?fmtM(rv-cg):''}</td><td></td><td></td>
            <td style="text-align:left" class="muted linkcell">QB project — <u>link to a deal…</u></td></tr>`;
        }).join('');
      const kids = (!isOpen ? '' : ds.map(d => {
        const r = dealRow(d);
        return `<tr class="dealsub deallist" data-id="${d.id}" title="click to shape" tabindex="0" role="button">
          <td class="namecell" style="padding-left:28px">▸
            <span class="namewrap">${esc(d.name)}</span>
            ${d.reviewed_at?'':'<span class="warn" title="awaiting review">•</span>'}${
              !(d._agg||{}).gpAll && d.flight_end >= thisMonth
                ? ' <span class="pill warn" title="flight runs into the future but no forecast is shaped — open the deal and give it lines">!</span>' : ''
            }${r.matched?'':' <span class="pill bad" title="no QuickBooks project linked — open the deal and pick one">no QB project</span>'}</td>
          <td>${num(r.value)}</td>
          <td>${r.gpBilled!==null?`<span class="${r.gpBilled<0?'neg':''}">${fmtM(r.gpBilled)}</span>`:'<span class="muted">—</span>'}</td>
          <td style="color:var(--brand)">${r.gpFc?fmtM(r.gpFc):''}</td>
          <td>${varCell(r.variance)}</td>
          <td style="text-align:left" class="muted">${r.basis}</td></tr>`;
      }).join('')) + projRows;
      return head + kids;
    }).join('');

    // every project attributed to ANY client — computed over every client,
    // not just the ones the search box currently shows, so unattributed
    // revenue never balloons just because someone typed in the filter
    const attributedProjects = new Set();
    Object.values(clientsById).forEach(c => {
      (c.qbo_customer_id ? (projsUnder[c.qbo_customer_id]||[]) : [])
        .filter(pid => !projClaimedBy[pid] || projClaimedBy[pid] === c.id)
        .forEach(pid => attributedProjects.add(pid));
      (dealsByClient[c.id]||[]).forEach(d => { if (d.qbo_project_id) attributedProjects.add(d.qbo_project_id); });
    });
    const unattributedProjects = Object.keys(revByProj)
      .filter(pid => !attributedProjects.has(pid) && ((revByProj[pid]||{}).total || cogsByProj[pid]))
      .map(pid => ({ pid, name: (projects.find(p=>p.id===pid)||{}).name || pid,
                      revenue: (revByProj[pid]||{}).total||0, cogs: cogsByProj[pid]||0 }))
      .sort((a,b) => Math.abs(b.revenue) - Math.abs(a.revenue));
    const unattributedRev = plRows.reduce((s,r)=>s+r.revenue,0) - totals.value;
    // rev_proj (unlike rev_month) only sums lines that already carry a
    // QuickBooks project — a line with none at all can't show up in the list
    // above, so name the gap instead of silently dropping it
    const untraced = unattributedRev - unattributedProjects.reduce((s,p)=>s+p.revenue,0);
    const HCOLS = [['name','Client / deal'],
      ['value','Value','Billed + forecasted, across the range'],
      ['gpBilled','GP Billed'],
      ['gpFc','GP Forecast'],
      ['variance','Variance'],[null,'Basis']];

    el.querySelector('#sum').innerHTML =
      `<tr>${HCOLS.map(([k,label,hint]) => k
        ? `<th data-sort="${k}"${hint?` title="${hint}"`:''} tabindex="0" role="columnheader" aria-sort="${tableSort.key===k?(tableSort.dir<0?'descending':'ascending'):'none'}">${label}${tableSort.key===k?`<span class="dir">${tableSort.dir<0?'▼':'▲'}</span>`:''}</th>`
        : `<th style="cursor:default;text-align:left">${label}</th>`).join('')}</tr>` +
      bodyRows +
      (Math.abs(unattributedRev) > 100 ? `<tr class="dealsub unattrow" tabindex="0" role="button" aria-expanded="${unattributedOpen}">
        <td class="namecell"><span class="muted">${unattributedProjects.length?(unattributedOpen?'▾':'▸'):'·'}</span> unattributed (no client link)</td>
        <td class="muted">${fmtM(unattributedRev)}</td>
        <td colspan="3"></td><td style="text-align:left" class="muted">${unattributedProjects.length?'click to see which QuickBooks projects':'link clients on the Clients tab'}</td></tr>` +
        (unattributedOpen ? unattributedProjects.map(p => `<tr class="dealsub">
            <td class="namecell" style="padding-left:28px;color:var(--slate)">◦ <span class="namewrap">${esc(p.name)}</span></td>
            <td>${p.revenue?fmtM(p.revenue):''}</td>
            <td>${(p.revenue||p.cogs)?fmtM(p.revenue-p.cogs):''}</td><td></td><td></td>
            <td style="text-align:left" class="muted">its QuickBooks parent isn't linked to any client — link it on the Clients tab</td></tr>`).join('')
          + (Math.abs(untraced) > 100 ? `<tr class="dealsub">
              <td class="namecell" style="padding-left:28px;color:var(--slate)">◦ no QuickBooks project at all</td>
              <td class="muted">${fmtM(untraced)}</td><td colspan="3"></td>
              <td style="text-align:left" class="muted">invoices or cost lines with no project code in QuickBooks</td></tr>` : '')
          : '') : '') +
      `<tr class="totalrow"><td>company — ${months.length} months</td>
        <td>${fmtM(plRows.reduce((s,r)=>s+r.revenue,0))}</td>
        <td>${fmtM(plRows.filter(r=>r.measured).reduce((s,r)=>s+(r.actualGP||0),0))}</td>
        <td>${fmtM(plRows.filter(r=>!r.measured).reduce((s,r)=>s+r.forecastGP,0))}</td>
        <td></td>
        <td style="text-align:left;font-size:9px;font-weight:400">labour &amp; overhead live in the chart — 6-month trailing average forward</td></tr>`;

    el.querySelector('#missing-note').innerHTML = totalMissing
      ? `<span class="warn">${totalMissing} deal${totalMissing>1?'s':''} missing a forecast</span>` : '';

    const tq = el.querySelector('#tq');
    tq.oninput = () => { tableQuery = tq.value; renderTable(); };
    el.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const k = th.dataset.sort;
        tableSort = { key:k, dir: tableSort.key===k ? -tableSort.dir : -1 };
        renderTable();
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });

    el.querySelectorAll('tr.projrow').forEach(tr => {
      const activate = e => {
        e.stopPropagation();
        const pid = tr.dataset.pid, cid = tr.dataset.cid;
        const ds = dealsByClient[cid]||[];
        // every other client's deals too — with On Location split in two, a
        // project under one entity may belong to the other's deal, and the claims
        // rule routes the money by the deal's client once linked
        const others = Object.entries(dealsByClient)
          .filter(([k]) => k !== cid)
          .flatMap(([k, arr]) => arr.map(x => ({ ...x, _cn: (clientsById[k]||{}).name||'' })))
          .sort((a,b)=>a._cn.localeCompare(b._cn) || a.name.localeCompare(b.name));
        const cell = tr.querySelector('.linkcell');
        if (cell.querySelector('.qbpicker')) return;   // already open
        cell.innerHTML = `<div class="qbpicker">
            <input class="qpsearch" placeholder="search deals to link…" autocomplete="off"
              style="height:26px;width:220px" title="Deals always come from HubSpot — pick an existing one.">
            <input type="hidden" class="qp">
            <div class="qpmenu" hidden></div>
          </div>
          <button class="dolink primary" style="padding:2px 10px">Link</button>
          <button class="dohide danger" style="padding:2px 10px" title="remove this project from every list — its money still rolls up to the client">Hide project</button>`;
        cell.onclick = ev => ev.stopPropagation();
        mountCombobox(cell.querySelector('.qbpicker'), {
          getLabel: x => x._cn ? `${x.name} — ${x._cn}` : x.name,
          getBadges: x => x.qbo_project_id ? ['already linked'] : [],
          onPick: () => {},
          spec: q => {
            const needle = q.trim().toLowerCase();
            const match = x => !needle || x.name.toLowerCase().includes(needle) ||
              (x._cn && x._cn.toLowerCase().includes(needle));
            const mine = ds.filter(match), rest = others.filter(match);
            const CAP = 40, shown = rest.slice(0, CAP);
            const groups = [];
            if (mine.length) groups.push({ label: "this client's deals", items: mine });
            if ((needle || !mine.length) && shown.length) groups.push({ label: "other clients' deals", items: shown });
            const hint = !needle ? 'Type to search all deals'
              : (rest.length > CAP ? `+${rest.length-CAP} more — narrow the search` : null);
            return { groups, hint };
          }
        });
        cell.querySelector('.dohide').onclick = async () => {
          const pj = projects.find(p=>p.id===pid)||{};
          if (!confirm(`Hide "${pj.name||pid}" from every list and picker?\n\nIts invoices and costs still count toward the client. Survives syncs; unhide any time from SQL.`)) return;
          const { error } = await supa.from('qbo_projects')
            .update({ hidden: true, hidden_by: window.__email, hidden_at: new Date().toISOString() })
            .eq('id', pid);
          if (error) { alert(error.message); return; }
          loadAll();
        };
        cell.querySelector('.dolink').onclick = async () => {
          const val = cell.querySelector('.qp').value;
          if (!val) return;
          // deals only ever come from HubSpot — no manual creation path here.
          // If no deal fits, the deal itself is missing or not-yet-promotable
          // in HubSpot (check its campaign dates) rather than something to
          // paper over in the platform.
          const deal = ds.find(x=>x.id===val)
            || Object.values(dealsByClient).flat().find(x=>x.id===val);
          if (deal.qbo_project_id &&
              !confirm(`"${deal.name}" is already linked to another project. Replace that link with this project?`)) return;
          const { error } = await supa.from('deals')
            .update({ qbo_project_id: pid, set_by: window.__email, set_at: new Date().toISOString() })
            .eq('id', val);
          if (error) { alert(error.message); return; }
          loadAll();
        };
      };
      tr.onclick = activate;
      // ignore bubbled keydowns from focusable children (the select/buttons the
      // activation itself renders) — only the row's own focus should re-trigger it
      tr.onkeydown = e => {
        if (e.target !== tr) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(e); }
      };
    });
    el.querySelectorAll('tr.clientrow').forEach(tr => {
      const activate = () => {
        const id = tr.dataset.cid;
        openClients.has(id) ? openClients.delete(id) : openClients.add(id);
        renderTable();
      };
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });

    el.querySelectorAll('tr.deallist').forEach(tr => {
      const activate = () => toggleEditor(tr.dataset.id);
      tr.onclick = activate;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });

    const unattrow = el.querySelector('tr.unattrow');
    if (unattrow) {
      const activate = () => { unattributedOpen = !unattributedOpen; renderTable(); };
      unattrow.onclick = activate;
      unattrow.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    }
  }

  /* -------------------------------------------- the editor, focus overlay -- */
  let modalOpener = null;   // the element to return focus to once the modal closes
  function closeModal() {
    document.querySelector('.modal-back')?.remove();
    document.onkeydown = null;
    openEditor = null;
    if (modalOpener && document.contains(modalOpener)) modalOpener.focus();
    modalOpener = null;
  }
  async function toggleEditor(dealId) {
    const opener = document.activeElement !== document.body ? document.activeElement : null;
    closeModal();
    modalOpener = opener;
    openEditor = dealId;
    const d = Object.values(dealsByClient).flat().find(x => x.id === dealId);
    if (!d) return;
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span class="modal-title" id="modal-title">${esc((clientsById[d.client_id]||{}).name||'')} — ${esc(d.name)}</span>
        <button class="mclose">Close ✕</button>
      </div>
      <div class="modal-body edbox"><span class="muted" style="font-size:12px">loading…</span></div>
    </div>`;
    document.body.appendChild(back);
    back.onclick = e => { if (e.target === back) closeModal(); };
    back.querySelector('.mclose').onclick = closeModal;
    const modal = back.querySelector('.modal');
    // a simple focus trap: Escape closes, Tab/Shift+Tab cycles within the dialog
    // instead of escaping to the page behind it
    document.onkeydown = e => {
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key !== 'Tab') return;
      const focusable = [...modal.querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )].filter(fe => fe.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    back.querySelector('.mclose').focus();
    const box = back.querySelector('.edbox');

    // one parallel wave: lines WITH their months embedded, the margin hint, and
    // the project's actuals — the editor opens in a single round trip's time
    const [lr, marginHint, ai, ac] = await Promise.all([
      supa.from('deal_lines').select('*, deal_line_months(*)')
        .eq('deal_id', d.id).order('set_at'),
      supa.from('v_client_achieved_margin')
        .select('achieved_margin_pct,revenue').eq('client_id', d.client_id).maybeSingle(),
      d.qbo_project_id
        ? supa.from('invoices').select('issued_on,total').eq('qbo_project_id', d.qbo_project_id)
        : Promise.resolve({ data: [] }),
      d.qbo_project_id
        ? supa.from('v_cost_lines_classified').select('month,amount')
            .eq('qbo_project_id', d.qbo_project_id).in('class',['cogs','income'])
        : Promise.resolve({ data: [] })
    ]);
    if (lr.error) { box.innerHTML = `<span class="err">${lr.error.message}</span>`; return; }
    const achieved = marginHint.data?.achieved_margin_pct ?? null;
    const actualByM = {};
    (ai.data||[]).forEach(i => { const m = i.issued_on.slice(0,8)+'01';
      actualByM[m] = (actualByM[m]||0) + i.total; });
    // cogs subtracts as cost; income-class subtracts as contra-revenue — the
    // project's actual GP is what QuickBooks would recognize for it
    (ac.data||[]).forEach(c => { actualByM[c.month] = (actualByM[c.month]||0) - c.amount; });
    const mr = { data: (lr.data||[]).flatMap(l =>
      (l.deal_line_months||[]).map(o => ({ ...o, deal_line_id: l.id }))) };
    const model = (lr.data||[]).map(l => {
      const cfg = KIND[l.kind] || KIND.custom;
      // which per-month column this kind stores: creative-hourly & hourly use hours,
      // budget kinds use budget, flat kinds use amount (for manual overrides)
      const isHourly = l.kind==='hourly'
        || (l.kind==='creative' && (l.label||'').startsWith('creative:hourly'));
      const cellCol = cfg.cells==='budget' ? 'budget'
        : (cfg.cells==='hours' || isHourly) ? 'hours' : 'amount';
      const cells = {};
      const mine = (mr.data||[]).filter(o=>o.deal_line_id===l.id);
      mine.forEach(o => {
        const v = cellCol==='hours' ? o.hours : o[cellCol];
        if (v!=null) cells[o.month] = cellCol==='hours' ? +v : v/100;
      });
      // a flat line with explicit month rows was put in manual mode by a human
      const flat = !cfg.cells || (l.kind==='creative' && !isHourly);
      const manual = flat && mine.length > 0;
      return { id:l.id, kind:l.kind, label:l.label,
        media_funding: l.media_funding || 'client',
        params:{ amount:l.amount?l.amount/100:0, fee_pct:l.fee_pct||0,
                 margin_pct:l.margin_pct, rate:l.rate?l.rate/100:0,
                 hours_per_month:+l.hours_per_month||0 },
        cells, manual,
        orig: { amount:l.amount||0, hours:+l.hours_per_month||0 },
        hadDlm: new Set(mine.map(o=>o.month)) };
    });
    let flight = { start: d.flight_start, end: d.flight_end };
    const closed = m => m < thisMonth;

    function draw() {
      const fm = monthsBetween(flight.start, flight.end);
      const openM = fm.filter(m=>!closed(m));
      const closedM = fm.filter(m=>closed(m));
      const asSold = d.promotions?.[0]?.as_sold;
      const field = (li, p, label, val, ph='0') =>
        `<label class="pf"><span class="pfl">${label}</span>
           <input class="p" type="number" step="any" inputmode="decimal" data-li="${li}" data-p="${p}" value="${val}" placeholder="${ph}"></label>`;

      // month columns: one collapsed closed column (if any), then each open month
      const cols = (closedM.length ? [{ closed:true, label:`${closedM.length} closed`, months:closedM }] : [])
        .concat(openM.map(m => ({ closed:false, label:mLabel(m), months:[m] })));
      const colHead = cols.map(c =>
        `<th class="monthcol${c.closed?' closedcol':''}">${c.label}${c.closed?' ✓':''}</th>`).join('');

      const kindLabelOf = l => l.kind === 'creative' ? `creative · ${creativeMode(l)}` : l.kind;
      const isHourlyL = l => l.kind==='hourly' || (l.kind==='creative' && creativeMode(l)==='hourly');
      const isBudgetL = l => KIND[l.kind].cells==='budget';

      // ---- the overview TABLE: one display row per line, then the totals ----
      const lineRows = model.map((l, li) => `<tr class="linerow">
          <td class="rowlabelcol"><span class="kbadge sm">${kindLabelOf(l)}</span></td>
          ${cols.map((c,ci)=>`<td class="muted" data-lrc="${li}:${ci}"></td>`).join('')}
          <td class="linegpcol muted" data-lrt="${li}"></td>
        </tr>`).join('');

      // ---- the CARDS: one entry box per channel, below the table ----
      const cards = model.map((l, li) => {
        const cfg = KIND[l.kind];
        const mode = l.kind === 'creative' ? creativeMode(l) : null;
        const structSel = l.kind === 'creative'
          ? `<select class="cmode" data-li="${li}">
               <option value="retainer" ${mode==='retainer'?'selected':''}>retainer $/mo</option>
               <option value="hourly" ${mode==='hourly'?'selected':''}>hourly</option>
             </select>` : '';
        // media funding is per LINE — a deal can mix a client-funded social line
        // with an agency-funded search line. Only search/social ever read it;
        // programmatic is always agency-funded regardless, everything else never.
        const fundSel = (l.kind === 'search' || l.kind === 'social')
          ? `<select class="mf" data-li="${li}" title="who pays for this line's media">
               <option value="client" ${l.media_funding!=='agency'?'selected':''}>client pays</option>
               <option value="agency" ${l.media_funding==='agency'?'selected':''}>EMG pays &amp; rebills</option>
             </select>` : '';
        const bits = [];
        if (l.kind==='retainer'||l.kind==='custom'||(l.kind==='creative'&&mode==='retainer'))
          bits.push(field(li,'amount','$ / flight month', l.params.amount||''));
        if (isHourlyL(l)) {
          bits.push(field(li,'rate','rate $/hr', l.params.rate||''));
          bits.push(field(li,'hours_per_month','hrs / mo', l.params.hours_per_month||''));
        }
        (cfg.defaults||[]).forEach(([p,label]) => {
          if (p==='amount'||p==='rate'||p==='hours_per_month') return;
          bits.push(field(li,p,label, p==='margin_pct'?(l.params[p]??''):(l.params[p]||''),
            p==='margin_pct'?String(marginDefault):'0'));
        });
        // programmatic margin context lives ON the card, always
        const marginNote = l.kind==='programmatic'
          ? `<div class="cardnote">margin blank = default ${marginDefault}%${achieved!==null
              ? ` · client achieved <b>${achieved}%</b> <button class="use-achieved-one" data-li="${li}">use</button>` : ''}</div>`
          : '';
        // a tag right on the card, not just buried in the callout sentence —
        // updated live in preview() as margin%/fee% change
        const marginTag = l.kind==='programmatic'
          ? `<span class="pill margintag" data-li="${li}" title="expected margin: margin % (default when blank) plus this line's fee %"></span>` : '';
        // the total box (budget kinds & hourly get a spreadable total)
        const useTotal = isBudgetL(l) || isHourlyL(l);
        const curTotal = openM.reduce((s,m)=>s+(+l.cells[m]||0),0);
        const totalBox = useTotal
          ? `<label class="pf tb"><span class="pfl">${isBudgetL(l)?'Total budget $':'Total hours'}</span>
               <input class="totalbudget" type="number" step="any" inputmode="decimal" data-li="${li}" value="${curTotal||''}" placeholder="spread evenly"></label>`
          : '';
        // per-month override, tucked away
        const pmCells = openM.map(m=>`<label class="pmcell"><span>${mLabel(m)}</span>
            <input class="cell" type="number" step="any" inputmode="decimal" data-li="${li}" data-m="${m}" value="${l.cells[m] ?? ''}"></label>`).join('');
        return `<div class="linecard" data-li="${li}">
          <div class="cardhead">
            <span class="kbadge">${kindLabelOf(l)}</span>${structSel}${fundSel}${marginTag}
            <span style="flex:1"></span>
            <span class="lgp" data-li="${li}"></span>
            <button class="danger delline" data-li="${li}" title="remove line">✕</button>
          </div>
          <div class="cardbody">
            <div class="lparams">${bits.join('')}${totalBox}</div>
            <div class="gpcallout muted" data-li="${li}"></div>
            ${marginNote}
            <details class="permonth"><summary>per-month override</summary>
              <div class="pmrow">${pmCells}</div>
              <div class="cardnote">typing here overrides the even spread for that month</div>
            </details>
          </div>
        </div>`;
      }).join('');

      box.innerHTML = `
        <div class="settings">
          <div class="setrow wide"><span class="setlabel">Deal name</span>
            <input class="dname" value="${esc(d.name)}"></div>
          <div class="setrow"><span class="setlabel">Client</span>
            <select class="cl">
              ${Object.values(clientsById).sort((a,b)=>a.name.localeCompare(b.name))
                .map(c=>`<option value="${c.id}" ${c.id===d.client_id?'selected':''}>${esc(c.name)}</option>`).join('')}
              <option value="__new__">+ new client…</option>
            </select></div>
          <div class="setrow"><span class="setlabel">Flight</span>
            <input type="date" class="month fstart" value="${flight.start.slice(0,10)}">
            <span class="muted">→</span>
            <input type="date" class="month fend" value="${flight.end.slice(0,10)}"></div>
          <div class="setrow wide"><span class="setlabel">QB Project</span>
            <div class="qbpicker">
              <input class="qpsearch" placeholder="search projects…" autocomplete="off">
              <input type="hidden" class="qp">
              <button type="button" class="ghost qpclear" hidden>Clear</button>
              <div class="qpmenu" hidden></div>
            </div></div>
        </div>
        <div class="editorbar"><span class="totals"></span></div>
        <div class="gridwrap">
          <table class="totalsgrid">
            <tr class="colheadrow"><th class="rowlabelcol">Line / month</th>${colHead}<th class="linegpcol">line GP</th></tr>
            ${lineRows}
            <tr><td class="rowlabelcol">Revenue forecast (billed)</td>
              ${cols.map((c,ci)=>`<td data-revcol="${ci}"></td>`).join('')}<td data-revtotal class="linegpcol"></td></tr>
            <tr class="gp"><td class="rowlabelcol">GP forecast</td>
              ${cols.map((c,ci)=>`<td data-gpcol="${ci}"></td>`).join('')}<td data-gptotal class="linegpcol"></td></tr>
            <tr><td class="rowlabelcol muted">GP actual (QuickBooks)${d.qbo_project_id?'':' — no project'}</td>
              ${cols.map(c=>`<td class="muted">${
                c.months.some(m=>closed(m)&&actualByM[m]!==undefined)
                  ? fmtMoney(c.months.reduce((s,m)=>s+(closed(m)?(actualByM[m]||0):0),0)) : ''
              }</td>`).join('')}
              <td class="muted linegpcol">${fmtMoney(fm.reduce((s,m)=>s+(closed(m)?(actualByM[m]||0):0),0))||''}</td></tr>
            <tr><td class="rowlabelcol muted">Δ actual vs forecast</td>
              ${cols.map((c,ci)=>`<td data-diffcol="${ci}"></td>`).join('')}<td class="linegpcol"></td></tr>
          </table>
        </div>
        <div class="muted lockednote">✓ months are locked: their actuals come from QuickBooks
        and their forecast froze when the month closed — accuracy is measured, never rewritten.</div>
        <div class="linecards">${cards}</div>
        <div class="editorbar">
          <select class="newkind"><option value="">+ add a line…</option>
            ${OFFERED.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
          <span style="flex:1"></span>
          <button class="saveall primary">Save</button>
          <button class="reviewed" ${d.reviewed_at?'disabled':''}>Mark reviewed</button>
          <button class="hidedeal danger" title="remove this deal from the forecast — reversible from SQL">Hide deal</button>
        </div>
        <div class="msg"></div>`;

      box.querySelector('.fstart').onchange = e => { flight.start = e.target.value; clamp(); };
      box.querySelector('.fend').onchange   = e => { flight.end   = e.target.value; clamp(); };
      function clamp() {
        if (flight.end < flight.start) flight.end = flight.start;
        const keep = new Set(monthsBetween(flight.start, flight.end));
        model.forEach(l => Object.keys(l.cells).forEach(m => { if (!keep.has(m)) delete l.cells[m]; }));
        draw();
      }

      box.querySelectorAll('select.mf').forEach(sel => sel.onchange = () => {
        model[+sel.dataset.li].media_funding = sel.value;   // revenue depends on funding
        preview();
      });
      box.querySelectorAll('input.p').forEach(inp => inp.oninput = () => {
        const l = model[+inp.dataset.li];
        const n = +inp.value;
        l.params[inp.dataset.p] = inp.value==='' || !Number.isFinite(n)
          ? (inp.dataset.p==='margin_pct'?null:0) : n;
        preview();
      });
      box.querySelectorAll('select.cmode').forEach(sel => sel.onchange = () => {
        const l = model[+sel.dataset.li];
        l.label = 'creative:' + sel.value;
        l.cells = {};
        draw();
      });
      // Total box: spread evenly across the open months, remainder on the last
      box.querySelectorAll('input.totalbudget').forEach(inp => inp.oninput = () => {
        const l = model[+inp.dataset.li];
        const n = +inp.value;
        const total = Number.isFinite(n) ? n : 0;
        l.cells = {};
        if (total > 0 && openM.length) {
          // media budgets spread by covered days — dollars follow days in market.
          // hours (and anything non-media) spread evenly: a month is a month.
          const weighted = KIND[l.kind].cells === 'budget';
          const w = openM.map(m => weighted
            ? dayFrac(m, flight) * new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate()
            : 1);
          const wSum = w.reduce((a,b)=>a+b,0);
          let acc = 0;
          openM.forEach((m,i) => {
            const v = i===openM.length-1
              ? Math.round((total - acc)*100)/100
              : Math.round(total * w[i]/wSum * 100)/100;
            l.cells[m] = v; acc += v;
          });
        }
        box.querySelectorAll(`.linecard[data-li="${inp.dataset.li}"] input.cell`).forEach(ci => {
          ci.value = l.cells[ci.dataset.m] ?? '';
        });
        preview();
      });
      // per-month override cells inside the card
      box.querySelectorAll('input.cell').forEach(inp => inp.oninput = () => {
        const l = model[+inp.dataset.li];
        const n = +inp.value;
        if (inp.value==='' || !Number.isFinite(n)) delete l.cells[inp.dataset.m];
        else l.cells[inp.dataset.m] = n;
        if (!KIND[l.kind].cells && !isHourlyL(l)) l.manual = Object.keys(l.cells).length > 0;
        const tb = box.querySelector(`input.totalbudget[data-li="${inp.dataset.li}"]`);
        if (tb) { const t = openM.reduce((s,m)=>s+(+l.cells[m]||0),0); tb.value = t || ''; }
        preview();
      });
      box.querySelectorAll('.delline').forEach(btn => btn.onclick = async e => {
        e.stopPropagation();
        const li = +btn.dataset.li;
        if (model[li].id) {
          if (!confirm('Delete this line and its months?')) return;
          await supa.from('deal_lines').delete().eq('id', model[li].id);
        }
        model.splice(li,1); draw();
      });
      box.querySelector('.newkind').onchange = e => {
        if (!e.target.value) return;
        const kind = e.target.value;
        model.push({ kind,
          label: kind==='creative' ? 'creative:retainer' : null,
          media_funding: 'client',
          params:{ amount:0, fee_pct:0, margin_pct:null, rate:0, hours_per_month:0 },
          cells:{}, manual:false, orig:{ amount:0, hours:0 }, hadDlm:new Set() });
        draw();
      };
      box.querySelectorAll('.use-achieved-one').forEach(b => b.onclick = () => {
        const l = model[+b.dataset.li];
        l.params.margin_pct = achieved;
        draw();
      });
      box.querySelector('.hidedeal').onclick = async () => {
        if (!confirm(`Hide "${d.name}" from the forecast?\n\nIts plan leaves the chart and table. Any matched project's actuals fall back to the client. Survives syncs; unhide from SQL.`)) return;
        const { error } = await supa.from('deals')
          .update({ hidden:true, hidden_by:window.__email, hidden_at:new Date().toISOString() })
          .eq('id', d.id);
        if (error) { alert(error.message); return; }
        closeModal(); loadAll();
      };
      box.querySelector('.saveall').onclick = save;
      box.querySelector('.reviewed').onclick = async () => {
        const { error } = await supa.from('deals').update({
          reviewed_at:new Date().toISOString(), set_by:window.__email, set_at:new Date().toISOString()
        }).eq('id', d.id);
        if (!error) loadAll();
      };

      // the project picker: page-relevant projects immediately, full list lazily.
      // Includes hidden projects (unlike the old .eq('hidden', false) fetch) —
      // a hidden project must never be silently invisible here; it's badged
      // instead, since a deal already linked to a hidden project needs its
      // real name shown, not a blank field pretending nothing is linked.
      const qpRoot = box.querySelector('.qbpicker');
      if (!fullProjects) {
        fetchAll(() => supa.from('qbo_projects').select('id,name,parent_id,jobcode,hidden').order('name'))
          .then(r => { if (!r.error) { fullProjects = r.data; qpCombo.refresh(); } });
      }
      const linkedProject = d.qbo_project_id && (fullProjects||projects).find(p=>p.id===d.qbo_project_id);
      const qpCombo = mountCombobox(qpRoot, {
        initialId: d.qbo_project_id,
        initialLabel: d.qbo_project_id ? (linkedProject ? linkedProject.name : `(project ${d.qbo_project_id})`) : '',
        getLabel: p => p.name,
        getBadges: p => [p.hidden ? 'hidden' : null,
          (projTakenBy[p.id] && p.id !== d.qbo_project_id) ? `linked: ${projTakenBy[p.id]}` : null].filter(Boolean),
        onPick: () => { box.querySelector('.qpclear').hidden = !box.querySelector('.qp').value; },
        spec: q => {
          const pool = fullProjects || projects;
          const needle = q.trim().toLowerCase();
          const client = clientsById[d.client_id] || {};
          const match = p => !needle || p.name.toLowerCase().includes(needle);
          const mine = pool.filter(p => client.qbo_customer_id &&
            (p.parent_id === client.qbo_customer_id || p.id === client.qbo_customer_id) && match(p));
          const mineIds = new Set(mine.map(p=>p.id));
          const rest = pool.filter(p => !mineIds.has(p.id) && match(p));
          const CAP = 40, shown = rest.slice(0, CAP);
          const groups = [];
          if (mine.length) groups.push({ label: "this client's projects", items: mine });
          if ((needle || !mine.length) && shown.length)
            groups.push({ label: mine.length ? 'other projects' : 'matching projects', items: shown });
          const hint = !needle
            ? (fullProjects ? 'Type to search all projects' : 'Type to search — full list loading…')
            : (rest.length > CAP ? `+${rest.length-CAP} more — narrow the search` : null);
          return { groups, hint };
        }
      });
      box.querySelector('.qpclear').hidden = !d.qbo_project_id;
      box.querySelector('.qpclear').onclick = () => qpCombo.clear();
      preview();

      function preview() {
        let total = 0, revTotal = 0; const mgp = {}, mrev = {};
        model.forEach((l, li) => {
          let lt = 0;
          fm.forEach(m => { const g = gpMonth(l, m, flight);
            if (g) { mgp[m]=(mgp[m]||0)+g; lt += g; } });
          // card title GP + the greyed callout under the entry box
          const lg = box.querySelector(`.lgp[data-li="${li}"]`);
          if (lg) lg.textContent = lt ? `line GP $${fmtN(lt)}` : '';
          const mt = box.querySelector(`.margintag[data-li="${li}"]`);
          if (mt) {
            const mgn = l.params.margin_pct ?? marginDefault;
            mt.textContent = `${(mgn + (l.params.fee_pct||0)).toFixed(1)}% margin`;
          }
          const co = box.querySelector(`.gpcallout[data-li="${li}"]`);
          if (co) {
            const lrev = fm.reduce((s,m)=>s+revMonth(l,m,l.media_funding,flight),0);
            if (l.kind==='programmatic') {
              const mgn = l.params.margin_pct ?? marginDefault;
              co.textContent = lt ? `Revenue ${fmtMoney(lrev)} · GP ${fmtMoney(lt)} — margin ${mgn}% + fee ${l.params.fee_pct||0}%` : '';
            } else if (isBudgetL(l)) {
              co.textContent = lt ? `Revenue ${fmtMoney(lrev)} · GP ${fmtMoney(lt)} — fee ${l.params.fee_pct||0}%${l.media_funding==='agency'?' (EMG bills media + fee)':' (client pays media direct)'}` : '';
            } else {
              co.textContent = lt ? `Revenue = GP ${fmtMoney(lt)} across ${openM.length} open month(s)` : '';
            }
          }
          // the overview table's line row: GP with revenue beneath when they differ
          cols.forEach((c, ci) => {
            const td = box.querySelector(`td[data-lrc="${li}:${ci}"]`);
            if (td) {
              const g = c.months.reduce((s,m)=>s+gpMonth(l,m,flight),0);
              const rv = c.months.reduce((s,m)=>s+revMonth(l,m,l.media_funding),0);
              td.innerHTML = g||rv
                ? `<div>${fmtMoney(g)}</div>${rv!==g?`<div class="subrev">rev ${fmtMoney(rv)}</div>`:''}`
                : '';
            }
          });
