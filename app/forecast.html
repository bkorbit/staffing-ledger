<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Forecast</title><link rel="stylesheet" href="./assets/style.css">
<style>
.range{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.rl{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate)}
.rd{font-family:var(--font-mono);font-size:10px;color:var(--slate)}
table.sum td .pct{display:block;font-size:9px;color:var(--slate);margin-top:1px}
table.sum td .pct.bad{color:var(--rust)} table.sum td .pct.good{color:var(--brand-2)}
tr.deallist td{cursor:pointer}
</style></head><body>
<script type="module">
import { boot, esc, fmt$, barChart } from './assets/shell.js';
/*
  The Forecast, remodelled on the v1 ledger's Forecast view, recovered from git:
  months as ROWS in a P&L ledger — Revenue billed, COGS, Forecast GP, Actual GP,
  Variance, Expenses, Net profit, Basis — dark means confirmed actual, light means
  forecasted, measured from QuickBooks once a month is over and projected before
  that. The combo chart carries revenue and the cost stack as bars with net profit
  as the line. Fixed costs are a manual panel subtracted from projected months only.
  Deals stay editable beneath, rolled up into their clients.
*/
boot('forecast', async (supa, el) => {
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mLabel = iso => MO[+iso.slice(5,7)-1] + ' ' + iso.slice(2,4);
  const fmtN = c => (c/100).toLocaleString(undefined,{maximumFractionDigits:0});
  const iso = d => d.toISOString().slice(0,10);
  const t0 = new Date(); t0.setUTCDate(1);
  const thisMonth = iso(t0).slice(0,8)+'01';
  const shiftM = (m,n)=>{const[y,mm]=m.slice(0,7).split('-').map(Number);
    return new Date(Date.UTC(y,mm-1+n,1)).toISOString().slice(0,10);};
  const monthsBetween = (a,b) => { const out=[]; let d=new Date(a+'T00:00:00Z');
    const end=new Date(b+'T00:00:00Z');
    while (d<=end && out.length<48) { out.push(d.toISOString().slice(0,10));
      d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)); } return out; };
  const past = m => m < thisMonth;

  // the range: six back, six forward, editable
  let rangeFrom = shiftM(thisMonth,-6), rangeTo = shiftM(thisMonth,6);

  /* ------------------------------------------------- shaping configuration */
  const KIND = {
    retainer:     { cells:null,     defaults:[['amount','$ / flight month']] },
    custom:       { cells:null,     defaults:[['amount','$ / flight month']] },
    search:       { cells:'budget', defaults:[['fee_pct','fee %']] },
    social:       { cells:'budget', defaults:[['fee_pct','fee %']] },
    programmatic: { cells:'budget', defaults:[['fee_pct','fee %'],['margin_pct','margin %']] },
    hourly:       { cells:'hours',  defaults:[['rate','rate $/hr'],['hours_per_month','hrs/mo default']] },
  };
  const CELL_HINT = { budget:'budget $', hours:'hrs' };
  const BILLING_BY_KIND = { retainer:'first', custom:'first', search:'last',
                            social:'last', programmatic:'last', hourly:'last' };
  let marginDefault = 35;
  function gpMonth(l, m) {
    const cfg = KIND[l.kind];
    const cellRaw = cfg.cells ? l.cells[m] : undefined;
    const fee = l.params.fee_pct || 0;
    const margin = l.params.margin_pct ?? marginDefault;
    switch (l.kind) {
      case 'retainer': case 'custom': return Math.round((l.params.amount||0)*100);
      case 'hourly': {
        const hrs = cellRaw !== undefined ? cellRaw : (l.params.hours_per_month||0);
        return Math.round((l.params.rate||0)*100*hrs);
      }
      case 'search': case 'social': {
        const b = cellRaw !== undefined ? cellRaw*100 : 0;
        return Math.round(b*fee/100);
      }
      case 'programmatic': {
        const b = cellRaw !== undefined ? cellRaw*100 : 0;
        return Math.round(b*margin/100 + b*fee/100);
      }
    }
    return 0;
  }

  /* ------------------------------------------------- the v1 combo chart --- */
  // Revenue and the cost stack as side-by-side bars per month, net profit as the
  // line. Settled months full-strength; projected months lighter — the v1 rule.
  function comboChart(elc, rows) {
    const W=960,H=270,P={l:64,r:12,t:16,b:26};
    const maxBar=Math.max(1,...rows.map(r=>Math.max(r.revenue,r.cogs+r.labour+r.other+r.fixed)));
    const nets=rows.map(r=>r.net);
    const min=Math.min(0,...nets), max=Math.max(maxBar,...nets,1);
    const y=v=>P.t+(H-P.t-P.b)*(1-(v-min)/((max-min)||1));
    const gap=(W-P.l-P.r)/rows.length, bw=Math.min(18,gap*0.28);
    let g='';
    for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;
      g+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#e2e2e2"/>
        <text x="${P.l-6}" y="${y(v)+3.5}" fill="#67706d" font-size="9.5" font-family="DM Mono" text-anchor="end">$${fmtN(v)}</text>`;}
    if(min<0) g+=`<line x1="${P.l}" y1="${y(0)}" x2="${W-P.r}" y2="${y(0)}" stroke="#d1453b" stroke-dasharray="4 3"/>`;
    rows.forEach((r,i)=>{
      const cx=P.l+gap*i+gap/2, op=r.measured?1:0.55;
      // revenue bar
      if(r.revenue>0) g+=`<rect x="${cx-bw-1.5}" y="${y(r.revenue)}" width="${bw}" height="${y(Math.max(min,0))-y(r.revenue)}" fill="#0a493c" opacity="${op}"><title>${mLabel(r.m)} revenue ${fmtN(r.revenue)}</title></rect>`;
      // cost stack
      let acc=0;
      [['cogs','#67706d'],['labour','#fabf4d'],['other','#d1453b'],['fixed','#b0b0b0']].forEach(([k,c])=>{
        const v=r[k]; if(!v) return;
        const y1=y(acc+v), h=y(acc)-y(acc+v); acc+=v;
        g+=`<rect x="${cx+1.5}" y="${y1}" width="${bw}" height="${h}" fill="${c}" opacity="${op}"><title>${mLabel(r.m)} ${k} ${fmtN(v)}</title></rect>`;
      });
      if(i%2===0) g+=`<text x="${cx}" y="${H-8}" fill="#67706d" font-size="9.5" font-family="DM Mono" text-anchor="middle">${mLabel(r.m)}</text>`;
    });
    g+=`<polyline fill="none" stroke="#19a789" stroke-width="2"
      points="${rows.map((r,i)=>(P.l+gap*i+gap/2)+','+y(r.net)).join(' ')}"/>`;
    rows.forEach((r,i)=>{const cx=P.l+gap*i+gap/2;
      g+=`<circle cx="${cx}" cy="${y(r.net)}" r="2.6" fill="#19a789"><title>${mLabel(r.m)} net ${fmtN(r.net)}</title></circle>`;});
    const leg=[['#0a493c','revenue'],['#67706d','COGS'],['#fabf4d','labour'],['#d1453b','other'],['#b0b0b0','fixed'],['#19a789','net profit (line)']]
      .map(([c,n],i)=>`<rect x="${P.l+i*130}" y="0" width="9" height="9" fill="${c}"/><text x="${P.l+i*130+13}" y="8" fill="#67706d" font-size="10" font-family="DM Mono">${n}</text>`).join('');
    elc.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H+14}"><g transform="translate(0,12)">${g}</g>${leg}</svg>`;
  }

  /* -------------------------------------------------------------- the data */
  let months, clientsById, dealsByClient, planByM, planBillByM, revByM, costByCM, openEditor = null;
  let projects = [], projTakenBy = {}, fixedCosts = [], runrate = { payroll:0, overhead:0 };
  let revByProj = {}, cogsByProj = {}, openClients = new Set();

  async function loadAll() {
    if (rangeTo < rangeFrom) rangeTo = rangeFrom;
    months = monthsBetween(rangeFrom, rangeTo);
    const [fc, dl, cl, inv, cog, st, qp, rrPay, rrOver] = await Promise.all([
      supa.from('v_deal_month_forecast').select('deal_id,month,gp,billable')
        .gte('month', rangeFrom).lte('month', rangeTo),
      supa.from('deals')
        .select('id,name,client_id,reviewed_at,flight_start,flight_end,media_funding,qbo_project_id,promotions(source_payload)')
        .in('status',['won','active'])
        .gte('flight_end','2026-01-01'),   // the platform starts at 2026
      supa.from('clients').select('id,name,active,qbo_customer_id').eq('active', true),
      supa.from('invoices').select('issued_on,total,qbo_project_id')
        .gte('issued_on', rangeFrom).lte('issued_on', shiftM(rangeTo,1)),
      supa.from('v_cost_lines_classified').select('month,amount,class,qbo_project_id')
        .in('class',['cogs','payroll','overhead'])
        .gte('month', rangeFrom).lte('month', rangeTo),
      supa.from('settings').select('key,value')
        .in('key',['programmatic_margin_default','forecast_fixed_costs']),
      supa.from('qbo_projects').select('id,name,parent_id,jobcode'),
      supa.rpc('cost_runrate_monthly', { p_class:'payroll', months:6 }),
      supa.rpc('cost_runrate_monthly', { p_class:'overhead', months:6 })
    ]);
    for (const r of [fc,dl,cl,inv,cog,st]) if (r.error) throw r.error;
    const sv = k => (st.data||[]).find(x=>x.key===k)?.value;
    marginDefault = +(sv('programmatic_margin_default') ?? 35);
    fixedCosts = sv('forecast_fixed_costs') || [];
    runrate = { payroll: rrPay.data||0, overhead: rrOver.data||0 };

    revByM = {}; revByProj = {};
    (inv.data||[]).forEach(i => {
      const m = i.issued_on.slice(0,8)+'01';
      if (m < rangeFrom || m > rangeTo) return;
      revByM[m] = (revByM[m]||0) + i.total;
      (revByProj[i.qbo_project_id] = revByProj[i.qbo_project_id]||{total:0,_:0})[
        m <= thisMonth ? 'total' : '_'] += i.total;
    });
    costByCM = {}; cogsByProj = {};
    (cog.data||[]).forEach(c => {
      (costByCM[c.class] = costByCM[c.class]||{})[c.month] = ((costByCM[c.class]||{})[c.month]||0) + c.amount;
      if (c.class === 'cogs' && c.month <= thisMonth)
        cogsByProj[c.qbo_project_id] = (cogsByProj[c.qbo_project_id]||0) + c.amount;
    });
    planByM = {}; planBillByM = {}; const planByDeal = {};
    (fc.data||[]).forEach(r => {
      planByM[r.month] = (planByM[r.month]||0) + r.gp;
      planBillByM[r.month] = (planBillByM[r.month]||0) + (r.billable||0);
      const p = planByDeal[r.deal_id] = planByDeal[r.deal_id] ||
        { gpAll:0, gpSettled:0, billFuture:0 };
      p.gpAll += r.gp;
      if (r.month < thisMonth) p.gpSettled += r.gp;
      else p.billFuture += (r.billable||0);
    });
    projects = (qp.data||[]);
    projTakenBy = {};
    (dl.data||[]).forEach(d => { if (d.qbo_project_id) projTakenBy[d.qbo_project_id] = d.name; });
    clientsById = {}; (cl.data||[]).forEach(c => clientsById[c.id] = c);
    dealsByClient = {};
    (dl.data||[]).forEach(d => { if (clientsById[d.client_id]) {
      d._agg = planByDeal[d.id] || { gpAll:0, gpSettled:0, billFuture:0 };
      (dealsByClient[d.client_id] = dealsByClient[d.client_id]||[]).push(d); }});
    render();
  }

  /* ---------------------------------------------------------------- render */
  function render() {
    el.innerHTML = `
      <div class="range">
        <span class="rl">Range</span>
        <input type="month" id="r-from" value="${rangeFrom.slice(0,7)}">
        <span class="rd">to</span>
        <input type="month" id="r-to" value="${rangeTo.slice(0,7)}">
        <span class="muted" style="font-size:11px;margin-left:6px">six back, six forward by default</span>
        <span style="flex:1"></span>
        <span class="muted" style="font-size:11px">dark = confirmed actual · light = forecasted —
        measured from QuickBooks once a month is over, projected before that</span>
        <button id="fixed-toggle">Fixed costs ▸</button>
      </div>
      <div id="fixed-panel" class="sc-panel" style="display:none">
        <div class="muted" style="font-size:10.5px;margin-bottom:8px">Monthly fixed costs —
        non-tracked labour, rent-like items. Subtracted from the projected net-profit line
        only; settled months stay as QuickBooks measured them.</div>
        <div id="fixed-list"></div>
        <div class="dhead" style="margin-top:8px">
          <button id="fixed-add">+ add fixed cost</button>
          <span style="flex:1"></span>
          <span id="fixed-total" class="muted" style="font-size:11px"></span>
          <button id="fixed-save" class="primary">Save</button>
          <span id="fixed-msg" class="ok" style="font-size:11px"></span>
        </div>
      </div>
      <div class="sc-panel"><div id="chart"></div></div>
      <div class="sc-panel" style="padding:0;overflow-x:auto">
        <div class="sc-eyebrow" style="padding:10px 14px 0">Clients over the range — arrow opens the deals; click a deal to shape it</div>
        <table class="sum" id="sum"></table></div>`;

    el.querySelector('#r-from').onchange = e => { rangeFrom = e.target.value+'-01'; loadAll(); };
    el.querySelector('#r-to').onchange   = e => { rangeTo   = e.target.value+'-01'; loadAll(); };

    // ---- fixed costs panel ----
    const fixedTotal = () => fixedCosts.reduce((s,f)=>s+(f.amount||0),0);
    function drawFixed() {
      el.querySelector('#fixed-list').innerHTML = fixedCosts.map((f,i)=>`
        <div class="dhead" style="margin:4px 0">
          <input data-fl="${i}" value="${esc(f.label||'')}" placeholder="label" style="width:220px">
          <input data-fa="${i}" value="${f.amount?f.amount/100:''}" placeholder="$/month" style="width:110px;text-align:right">
          <button class="danger" data-fx="${i}" style="padding:2px 8px">✕</button>
        </div>`).join('') || '<div class="muted" style="font-size:11px">none yet</div>';
      el.querySelector('#fixed-total').textContent = fixedCosts.length
        ? `total $${fmtN(fixedTotal())}/month, projected months only` : '';
      el.querySelectorAll('[data-fl]').forEach(inp=>inp.oninput=()=>{fixedCosts[+inp.dataset.fl].label=inp.value;});
      el.querySelectorAll('[data-fa]').forEach(inp=>inp.oninput=()=>{
        fixedCosts[+inp.dataset.fa].amount=Math.round((+inp.value||0)*100);
        el.querySelector('#fixed-total').textContent=`total $${fmtN(fixedTotal())}/month, projected months only`;});
      el.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{fixedCosts.splice(+b.dataset.fx,1);drawFixed();});
    }
    el.querySelector('#fixed-toggle').onclick = () => {
      const p = el.querySelector('#fixed-panel');
      p.style.display = p.style.display==='none' ? '' : 'none';
    };
    el.querySelector('#fixed-add').onclick = () => { fixedCosts.push({label:'',amount:0}); drawFixed(); };
    el.querySelector('#fixed-save').onclick = async () => {
      const { error } = await supa.from('settings').upsert(
        [{ key:'forecast_fixed_costs', value:fixedCosts,
           set_by:window.__email, set_at:new Date().toISOString() }], { onConflict:'key' });
      el.querySelector('#fixed-msg').textContent = error ? error.message : 'saved';
      if (!error) render();
    };
    drawFixed();

    // ---- per-month rows still feed the chart; the table is per client now ----
    const cur = thisMonth;
    const rowFor = m => {
      const settled = past(m), current = m === cur;
      const measured = settled || current;
      const revenue = measured ? (revByM[m]||0) : (planBillByM[m]||0);
      const cogs = measured ? ((costByCM.cogs||{})[m]||0)
                            : Math.max(0,(planBillByM[m]||0)-(planByM[m]||0));
      const forecastGP = planByM[m]||0;
      const actualGP = measured ? revenue - cogs : null;
      const labour = measured ? ((costByCM.payroll||{})[m]||0) : runrate.payroll;
      const other  = measured ? ((costByCM.overhead||{})[m]||0) : runrate.overhead;
      const fixed  = measured ? 0 : fixedTotal();
      const net = (measured ? actualGP : forecastGP) - labour - other - fixed;
      return { m, settled, current, measured, revenue, cogs, forecastGP, actualGP,
               labour, other, fixed, net };
    };
    const plRows = months.map(rowFor);
    comboChart(el.querySelector('#chart'), plRows);

    // ---- ONE table: clients over the range, deals under a collapsible arrow ----
    const parentOf = {}; projects.forEach(p => parentOf[p.id] = p.parent_id || p.id);
    const projsUnder = {}; projects.forEach(p => (projsUnder[parentOf[p.id]] = projsUnder[parentOf[p.id]]||[]).push(p.id));
    const nSettled = months.filter(m=>past(m)).length;
    const nFuture  = months.length - nSettled - (months.includes(cur)?1:0);

    const dealRow = d => {
      const p = d._agg || { gpAll:0, gpSettled:0, billFuture:0 };
      const matched = !!d.qbo_project_id;
      const revA = matched ? ((revByProj[d.qbo_project_id]||{}).total||0) : 0;
      const cogsA = matched ? (cogsByProj[d.qbo_project_id]||0) : 0;
      const revenue = revA + p.billFuture;
      const actualGP = matched ? revA - cogsA : null;
      const variance = matched && p.gpSettled && actualGP !== null
        ? Math.round((actualGP/p.gpSettled - 1)*100) : null;
      const basis = (matched ? 'actual + ' : (revA||cogsA ? '' : 'no QB link · ')) + 'forecast';
      return { revenue, cogs:cogsA, forecastGP:p.gpAll, actualGP, variance, basis, matched };
    };
    const clientRow = c => {
      const ds = dealsByClient[c.id]||[];
      const myProjects = c.qbo_customer_id ? (projsUnder[c.qbo_customer_id]||[]) : [];
      const revA = myProjects.reduce((s,pid)=>s+((revByProj[pid]||{}).total||0),0);
      const cogsA = myProjects.reduce((s,pid)=>s+(cogsByProj[pid]||0),0);
      const billFuture = ds.reduce((s,d)=>s+((d._agg||{}).billFuture||0),0);
      const gpAll = ds.reduce((s,d)=>s+((d._agg||{}).gpAll||0),0);
      const gpSettled = ds.reduce((s,d)=>s+((d._agg||{}).gpSettled||0),0);
      const actualGP = (revA||cogsA) ? revA - cogsA : null;
      const variance = gpSettled && actualGP !== null
        ? Math.round((actualGP/gpSettled - 1)*100) : null;
      const basis = (revA||cogsA ? 'actual (QuickBooks) + ' : '') + (gpAll ? 'forecast' : '—');
      return { revenue:revA+billFuture, cogs:cogsA, forecastGP:gpAll, actualGP, variance, basis };
    };

    const num = v => v ? fmtN(v) : '';
    const varCell = v => v===null||v===undefined ? '' :
      `<span class="${Math.abs(v)>15?'err':'ok'}">${v>=0?'+':''}${v}%</span>`;

    const clients = Object.values(clientsById).filter(c => {
      const ds = dealsByClient[c.id]||[];
      const cr = clientRow(c);
      return ds.length || cr.revenue || cr.cogs;
    }).map(c => ({ c, agg: clientRow(c) }))
      .sort((a,b)=>(b.agg.revenue+b.agg.forecastGP)-(a.agg.revenue+a.agg.forecastGP));

    let totals = { revenue:0, cogs:0, forecastGP:0, actualGP:0 };
    const bodyRows = clients.map(({c, agg}) => {
      totals.revenue+=agg.revenue; totals.cogs+=agg.cogs;
      totals.forecastGP+=agg.forecastGP; totals.actualGP+=agg.actualGP||0;
      const ds = (dealsByClient[c.id]||[]).sort((a,b)=>(b.flight_end||'').localeCompare(a.flight_end||''));
      const isOpen = openClients.has(c.id);
      const head = `<tr class="clientrow" data-cid="${c.id}" style="cursor:pointer">
        <td class="textleft" style="font-weight:600">
          <span class="muted">${ds.length?(isOpen?'▾':'▸'):'·'}</span>
          <span class="ellip" title="${esc(c.name)}">${esc(c.name)}</span>
          ${ds.length?`<span class="muted" style="font-size:9.5px"> ${ds.length}</span>`:''}</td>
        <td>${num(agg.revenue)}</td><td>${num(agg.cogs)}</td>
        <td style="color:var(--brand)">${num(agg.forecastGP)}</td>
        <td>${agg.actualGP!==null?fmtN(agg.actualGP):'<span class="muted">—</span>'}</td>
        <td>${varCell(agg.variance)}</td>
        <td class="muted">·</td><td class="muted">·</td><td class="muted">·</td>
        <td class="textleft muted" style="font-size:10px">${agg.basis}</td></tr>`;
      const kids = !isOpen ? '' : ds.map(d => {
        const r = dealRow(d);
        return `<tr class="deallist" data-id="${d.id}" title="click to shape">
          <td class="textleft" style="padding-left:26px">▸
            <span class="ellip" style="max-width:190px" title="${esc(d.name)}">${esc(d.name)}</span>
            ${d.reviewed_at?'':'<span class="warn">•</span>'}${r.matched?'':' <span class="muted" title="no QuickBooks project linked — pick one in the editor">?</span>'}</td>
          <td>${num(r.revenue)}</td><td>${num(r.cogs)}</td>
          <td style="color:var(--brand)">${num(r.forecastGP)}</td>
          <td>${r.actualGP!==null?fmtN(r.actualGP):'<span class="muted">—</span>'}</td>
          <td>${varCell(r.variance)}</td>
          <td class="muted">·</td><td class="muted">·</td><td class="muted">·</td>
          <td class="textleft muted" style="font-size:10px">${r.basis}</td></tr>
        <tr class="editor" data-for="${d.id}" hidden><td colspan="10" class="textleft"><div class="edbox"></div></td></tr>`;
      }).join('');
      return head + kids;
    }).join('');

    // the company row carries what clients honestly cannot yet: labour, overhead, net
    const labourT = plRows.reduce((s,r)=>s+r.labour,0);
    const otherT  = plRows.reduce((s,r)=>s+r.other,0);
    const fixedT  = plRows.reduce((s,r)=>s+r.fixed,0);
    const netT    = plRows.reduce((s,r)=>s+r.net,0);
    const unattributedRev = plRows.filter(r=>r.measured).reduce((s,r)=>s+r.revenue,0)
      + plRows.filter(r=>!r.measured).reduce((s,r)=>s+r.revenue,0) - totals.revenue;

    el.querySelector('#sum').innerHTML =
      `<tr><th style="text-align:left;min-width:230px">Client / deal</th>
        <th>Revenue billed</th><th>COGS</th><th>Forecast GP</th><th>Actual GP</th>
        <th>Variance</th><th>Labour</th><th>Other exp.</th><th>Net profit</th>
        <th style="text-align:left">Basis</th></tr>` +
      bodyRows +
      (Math.abs(unattributedRev) > 100 ? `<tr>
        <td class="textleft muted">unattributed (no client link)</td>
        <td class="muted">${fmtN(unattributedRev)}</td>
        <td colspan="7"></td><td class="textleft muted" style="font-size:10px">link clients on the Clients tab</td></tr>` : '') +
      `<tr class="gp"><td class="textleft">company — ${months.length} months</td>
        <td>${fmtN(plRows.reduce((s,r)=>s+r.revenue,0))}</td>
        <td>${fmtN(plRows.reduce((s,r)=>s+r.cogs,0))}</td>
        <td>${fmtN(plRows.reduce((s,r)=>s+r.forecastGP,0))}</td>
        <td>${fmtN(plRows.filter(r=>r.measured).reduce((s,r)=>s+(r.actualGP||0),0))}</td>
        <td></td>
        <td>${fmtN(labourT)}</td><td>${fmtN(otherT+fixedT)}</td>
        <td style="font-weight:700" class="${netT<0?'err':''}">${fmtN(netT)}</td>
        <td class="textleft muted" style="font-size:10px">labour &amp; overhead are company-level
          until hour tracking lands — net by client follows then</td></tr>`;

    el.querySelectorAll('tr.clientrow').forEach(tr => {
      tr.onclick = () => {
        const id = tr.dataset.cid;
        openClients.has(id) ? openClients.delete(id) : openClients.add(id);
        render();
      };
    });

    el.querySelectorAll('tr.deallist').forEach(tr => {
      tr.onclick = () => toggleEditor(tr.dataset.id);
    });
    if (openEditor) toggleEditor(openEditor, true);
  }

  /* --------------------------------------------------- the inline editor -- */
  async function toggleEditor(dealId, forceOpen = false) {
    const row = el.querySelector(`tr.editor[data-for="${dealId}"]`);
    if (!row) { openEditor = null; return; }
    const isOpen = !row.hidden;
    el.querySelectorAll('tr.editor').forEach(r => r.hidden = true);
    if (isOpen && !forceOpen) { openEditor = null; return; }
    openEditor = dealId; row.hidden = false;
    const d = Object.values(dealsByClient).flat().find(x => x.id === dealId);
    const box = row.querySelector('.edbox');
    box.innerHTML = '<span class="muted" style="font-size:12px">loading…</span>';

    const lr = await supa.from('deal_lines').select('*').eq('deal_id', d.id).order('set_at');
    if (lr.error) { box.innerHTML = `<span class="err">${lr.error.message}</span>`; return; }
    const ids = (lr.data||[]).map(l=>l.id);
    const mr = ids.length
      ? await supa.from('deal_line_months').select('*').in('deal_line_id', ids)
      : { data: [] };
    const model = (lr.data||[]).map(l => {
      const cfg = KIND[l.kind] || KIND.custom;
      const cells = {};
      (mr.data||[]).filter(o=>o.deal_line_id===l.id).forEach(o => {
        const v = cfg.cells==='hours' ? o.hours : o[cfg.cells];
        if (v!=null) cells[o.month] = cfg.cells==='hours' ? +v : v/100;
      });
      return { id:l.id, kind:l.kind,
        params:{ amount:l.amount?l.amount/100:0, fee_pct:l.fee_pct||0,
                 margin_pct:l.margin_pct, rate:l.rate?l.rate/100:0,
                 hours_per_month:+l.hours_per_month||0 }, cells };
    });
    let flight = { start: d.flight_start, end: d.flight_end };
    const closed = m => m < thisMonth;

    function draw() {
      const fm = monthsBetween(flight.start, flight.end);
      const asSold = d.promotions?.[0]?.source_payload?.amount;
      const head = fm.map(m=>`<th title="${closed(m)?'closed month':''}">${mLabel(m)}${closed(m)?' ✓':''}</th>`).join('');
      const lineRows = model.map((l, li) => {
        const cfg = KIND[l.kind];
        const params = cfg.defaults.map(([p,label]) => `
          <label class="mono" style="display:inline-flex;flex-direction:column;gap:2px;margin-right:10px">${label}
            <input class="p" data-li="${li}" data-p="${p}"
              value="${p==='margin_pct' ? (l.params[p] ?? '') : (l.params[p]||'')}"
              placeholder="${p==='margin_pct' ? marginDefault : '0'}"></label>`).join('');
        const cells = cfg.cells
          ? fm.map(m=>`<td><input class="cell" data-li="${li}" data-m="${m}"
              value="${l.cells[m] ?? ''}" placeholder="${closed(m)?'':CELL_HINT[cfg.cells]}"
              ${closed(m)?'disabled':''}></td>`).join('')
          : `<td colspan="${fm.length}" class="muted" style="text-align:left;font-family:var(--font-body)">
               spread over the flight — ${fm.filter(m=>!closed(m)).length} open month(s)</td>`;
        return `<tr><td class="linehead">
            <span class="kbadge">${l.kind}</span>
            <span class="params" style="margin-left:10px">${params}</span>
            <button class="danger delline" data-li="${li}" style="margin-left:6px;padding:2px 8px">✕</button>
          </td>${cells}<td class="muted gp-line" data-li="${li}"></td></tr>`;
      }).join('');

      box.innerHTML = `
        <div class="dhead">
          <label class="mono" style="display:flex;align-items:center;gap:6px">flight
            <input type="month" class="month fstart" value="${flight.start.slice(0,7)}">
            <span class="muted">→</span>
            <input type="month" class="month fend" value="${flight.end.slice(0,7)}"></label>
          <label class="mono" style="display:flex;align-items:center;gap:6px">client
            <select class="cl" style="height:30px;max-width:220px">
              ${Object.values(clientsById).sort((a,b)=>a.name.localeCompare(b.name))
                .map(c=>`<option value="${c.id}" ${c.id===d.client_id?'selected':''}>${esc(c.name)}</option>`).join('')}
              <option value="__new__">+ new client…</option>
            </select></label>
          <label class="mono" style="display:flex;align-items:center;gap:6px">QB project
            <select class="qp" style="height:30px;max-width:250px">
              <option value="">— none —</option>
              ${(() => {
                const client = clientsById[d.client_id] || {};
                const free = p => !projTakenBy[p.id] || p.id === d.qbo_project_id;
                const mine = projects.filter(p => client.qbo_customer_id &&
                  (p.parent_id === client.qbo_customer_id || p.id === client.qbo_customer_id) && free(p));
                const rest = projects.filter(p => !mine.includes(p) && free(p));
                const opt = p => `<option value="${p.id}" ${p.id===d.qbo_project_id?'selected':''}>${esc(p.name)}</option>`;
                return (mine.length?`<optgroup label="this client's projects">${mine.map(opt).join('')}</optgroup>`:'') +
                       `<optgroup label="all unlinked projects">${rest.map(opt).join('')}</optgroup>`;
              })()}
            </select></label>
          <label class="mono" style="display:flex;align-items:center;gap:6px">media funding
            <select class="mf" style="height:30px">
              <option value="client" ${d.media_funding!=='agency'?'selected':''}>client pays</option>
              <option value="agency" ${d.media_funding==='agency'?'selected':''}>EMG pays &amp; rebills</option>
            </select></label>
          <span style="flex:1"></span><span class="totals"></span>
        </div>
        <div class="gridwrap"><table class="grid">
          <tr><th style="text-align:left">line</th>${head}<th>line GP</th></tr>
          ${lineRows || `<tr><td class="linehead muted" colspan="${fm.length+2}">no lines yet — add one below</td></tr>`}
          <tr class="gp"><td class="linehead">GP</td>
            ${fm.map(m=>`<td data-gpm="${m}"></td>`).join('')}<td data-gptotal></td></tr>
        </table></div>
        <div class="dhead" style="margin-top:8px">
          <select class="newkind" style="height:32px"><option value="">+ add a line…</option>
            ${Object.keys(KIND).map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
          <span style="flex:1"></span>
          <button class="saveall primary">Save</button>
          <button class="reviewed" ${d.reviewed_at?'disabled':''}>Mark reviewed</button>
        </div>
        <div class="msg" style="margin-top:6px;font-size:12px"></div>`;

      box.querySelector('.fstart').onchange = e => { flight.start = e.target.value+'-01'; clamp(); };
      box.querySelector('.fend').onchange   = e => { flight.end   = e.target.value+'-01'; clamp(); };
      function clamp() {
        if (flight.end < flight.start) flight.end = flight.start;
        const keep = new Set(monthsBetween(flight.start, flight.end));
        model.forEach(l => Object.keys(l.cells).forEach(m => { if (!keep.has(m)) delete l.cells[m]; }));
        draw();
      }
      box.querySelectorAll('input.p').forEach(inp => inp.oninput = () => {
        const l = model[+inp.dataset.li];
        l.params[inp.dataset.p] = inp.value==='' ? (inp.dataset.p==='margin_pct'?null:0) : +inp.value;
        preview();
      });
      box.querySelectorAll('input.cell').forEach(inp => inp.oninput = () => {
        const l = model[+inp.dataset.li];
        if (inp.value==='') delete l.cells[inp.dataset.m];
        else l.cells[inp.dataset.m] = +inp.value;
        preview();
      });
      box.querySelectorAll('.delline').forEach(btn => btn.onclick = async e => {
        e.stopPropagation();
        const li = +btn.dataset.li;
        if (model[li].id) {
          if (!confirm('Delete this line and its months?')) return;
          await supa.from('deal_lines').delete().eq('id', model[li].id);
        }
        model.splice(li,1); draw();
      });
      box.querySelector('.newkind').onchange = e => {
        if (!e.target.value) return;
        model.push({ kind:e.target.value,
          params:{ amount:0, fee_pct:0, margin_pct:null, rate:0, hours_per_month:0 }, cells:{} });
        draw();
      };
      box.querySelector('.saveall').onclick = save;
      box.querySelector('.reviewed').onclick = async () => {
        const { error } = await supa.from('deals').update({
          reviewed_at:new Date().toISOString(), set_by:window.__email, set_at:new Date().toISOString()
        }).eq('id', d.id);
        if (!error) loadAll();
      };
      // clicks inside the editor must not toggle the row above it
      box.onclick = e => e.stopPropagation();
      preview();

      function preview() {
        let total = 0; const mgp = {};
        model.forEach((l, li) => {
          let lt = 0;
          fm.forEach(m => { const g = gpMonth(l, m);
            if (g) { mgp[m]=(mgp[m]||0)+g; lt += g; } });
          const cell = box.querySelector(`.gp-line[data-li="${li}"]`);
          if (cell) cell.textContent = lt ? fmtN(lt) : '';
          total += lt;
        });
        fm.forEach(m => { const td = box.querySelector(`td[data-gpm="${m}"]`);
          if (td) td.textContent = mgp[m] ? fmtN(mgp[m]) : ''; });
        const tt = box.querySelector('td[data-gptotal]'); if (tt) tt.textContent = total?fmtN(total):'';
        const cls = asSold && total && Math.abs(total-asSold)/asSold < 0.02 ? 'total-match' : 'total-off';
        box.querySelector('.totals').innerHTML = (total||asSold)
          ? `<span class="${cls}">GP total $${fmtN(total)}</span>` +
            (asSold?`<span class="muted" style="font-size:12px"> · sold $${fmtN(asSold)}</span>`:'') : '';
      }

      async function save() {
        const msg = box.querySelector('.msg');
        const mf = box.querySelector('.mf').value;
        const patch = {};
        // client reassignment — one HubSpot company can hide two entities
        let chosenClient = box.querySelector('.cl').value;
        if (chosenClient === '__new__') {
          const nm = prompt('Name for the new client:');
          if (!nm) { msg.textContent = 'save cancelled — no client name'; msg.className='msg err'; return; }
          const { data, error } = await supa.from('clients')
            .insert({ name: nm.trim(), set_by: window.__email }).select('id').single();
          if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
          chosenClient = data.id;
        }
        if (chosenClient !== d.client_id) patch.client_id = chosenClient;
        const chosenProj = box.querySelector('.qp').value || null;
        if (chosenProj !== d.qbo_project_id) {
          if (chosenProj && projTakenBy[chosenProj] &&
              !confirm(`That project is linked to "${projTakenBy[chosenProj]}". Move it here?`)) {
            msg.textContent = 'save cancelled'; msg.className='msg err'; return;
          }
          patch.qbo_project_id = chosenProj;
        }
        if (flight.start !== d.flight_start) patch.flight_start = flight.start;
        if (flight.end !== d.flight_end)     patch.flight_end   = flight.end;
        if (mf !== d.media_funding)          patch.media_funding = mf;
        if (Object.keys(patch).length) {
          patch.set_by = window.__email; patch.set_at = new Date().toISOString();
          const { error } = await supa.from('deals').update(patch).eq('id', d.id);
          if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
        }
        for (const l of model) {
          const rowData = {
            deal_id:d.id, kind:l.kind, label:null,
            amount:Math.round((l.params.amount||0)*100), budget:0,
            hours_per_month:l.params.hours_per_month||0,
            fee_pct:l.params.fee_pct||0, margin_pct:l.params.margin_pct ?? null,
            rate:Math.round((l.params.rate||0)*100),
            billing_day:BILLING_BY_KIND[l.kind],
            set_by:window.__email, set_at:new Date().toISOString()
          };
          if (l.id) {
            const { error } = await supa.from('deal_lines').update(rowData).eq('id', l.id);
            if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
          } else {
            const { data, error } = await supa.from('deal_lines').insert(rowData).select('id').single();
            if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
            l.id = data.id;
          }
          const cfg = KIND[l.kind];
          if (cfg.cells) {
            const openMonths = monthsBetween(flight.start, flight.end).filter(m=>!closed(m));
            if (openMonths.length) {
              const del = await supa.from('deal_line_months').delete()
                .eq('deal_line_id', l.id).in('month', openMonths);
              if (del.error) { msg.textContent = del.error.message; msg.className='msg err'; return; }
            }
            const rows = Object.entries(l.cells).filter(([m])=>!closed(m)).map(([m,v]) => {
              const r = { deal_line_id:l.id, month:m, set_by:window.__email, set_at:new Date().toISOString() };
              r[cfg.cells==='hours'?'hours':cfg.cells] = cfg.cells==='hours' ? v : Math.round(v*100);
              return r;
            });
            if (rows.length) {
              const ins = await supa.from('deal_line_months').insert(rows);
              if (ins.error) { msg.textContent = ins.error.message; msg.className='msg err'; return; }
            }
          }
        }
        box.querySelector('.msg').textContent = 'saved';
        box.querySelector('.msg').className = 'msg ok';
        loadAll();
      }
    }
    draw();
  }

  await loadAll();
});
</script></body></html>
