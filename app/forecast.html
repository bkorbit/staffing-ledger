          fm.forEach(m => { const r = revMonth(l, m, l.media_funding, flight); if (r) mrev[m]=(mrev[m]||0)+r; revTotal += r; });
          const lrt = box.querySelector(`td[data-lrt="${li}"]`);
          if (lrt) lrt.textContent = lt ? fmtMoney(lt) : '';
          total += lt;
        });
        cols.forEach((c, ci) => {
          const gp = c.months.reduce((s,m)=>s+(mgp[m]||0),0);
          const td = box.querySelector(`td[data-gpcol="${ci}"]`);
          if (td) td.textContent = gp ? fmtMoney(gp) : '';
          const rtd = box.querySelector(`td[data-revcol="${ci}"]`);
          if (rtd) { const rv = c.months.reduce((s,m)=>s+(mrev[m]||0),0);
            rtd.textContent = rv ? fmtMoney(rv) : ''; }
          const dtd = box.querySelector(`td[data-diffcol="${ci}"]`);
          if (dtd) {
            const a = c.months.reduce((s,m)=>s+(closed(m)&&actualByM[m]!==undefined?actualByM[m]:0),0);
            const hasA = c.months.some(m=>closed(m)&&actualByM[m]!==undefined);
            if (!hasA || !gp) { dtd.innerHTML=''; }
            else { const pct = Math.round((a/gp - 1)*100);
              dtd.innerHTML = `<span class="${Math.abs(pct)>15?'err':'ok'}" style="font-size:0.62rem">${pct>=0?'+':''}${pct}%</span>`; }
          }
        });
        const tt = box.querySelector('td[data-gptotal]'); if (tt) tt.textContent = total?fmtMoney(total):'';
        const rt = box.querySelector('td[data-revtotal]'); if (rt) rt.textContent = revTotal?fmtMoney(revTotal):'';
        const cls = asSold && total && Math.abs(total-asSold)/asSold < 0.02 ? 'total-match' : 'total-off';
        box.querySelector('.totals').innerHTML = (total||asSold)
          ? `<span class="${cls}">GP total $${fmtN(total)}</span>` +
            (asSold?`<span class="muted" style="font-size:0.78rem"> · sold $${fmtN(asSold)}</span>`:'') : '';
      }

      async function save() {
        const msg = box.querySelector('.msg');
        const patch = {};
        // client reassignment — one HubSpot company can hide two entities
        let chosenClient = box.querySelector('.cl').value;
        if (chosenClient === '__new__') {
          const nm = prompt('Name for the new client:');
          if (!nm) { msg.textContent = 'save cancelled — no client name'; msg.className='msg err'; return; }
          const { data, error } = await supa.from('clients')
            .insert({ name: nm.trim(), set_by: window.__email }).select('id').single();
          if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
          chosenClient = data.id;
        }
        if (chosenClient !== d.client_id) patch.client_id = chosenClient;
        const newName = box.querySelector('.dname').value.trim();
        if (newName && newName !== d.name) {
          patch.name = newName;
          const mt = document.querySelector('.modal-title');
          if (mt) mt.textContent = `${(clientsById[chosenClient]||{}).name||''} — ${newName}`;
          d.name = newName;
        }
        const chosenProj = box.querySelector('.qp').value || null;
        if (chosenProj !== d.qbo_project_id) {
          if (chosenProj && projTakenBy[chosenProj] &&
              !confirm(`That project is linked to "${projTakenBy[chosenProj]}". Move it here?`)) {
            msg.textContent = 'save cancelled'; msg.className='msg err'; return;
          }
          patch.qbo_project_id = chosenProj;
        }
        // once a human sets flight dates here, no HubSpot-sourced backfill
        // (028 or any future one) may touch this deal's dates again
        if (flight.start !== d.flight_start) { patch.flight_start = flight.start; patch.flight_locked = true; }
        if (flight.end !== d.flight_end)     { patch.flight_end   = flight.end;   patch.flight_locked = true; }
        if (Object.keys(patch).length) {
          patch.set_by = window.__email; patch.set_at = new Date().toISOString();
          const { error } = await supa.from('deals').update(patch).eq('id', d.id);
          if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
        }
        for (const l of model) {
          // which per-month column this line stores
          const isHourly = l.kind==='hourly'
            || (l.kind==='creative' && creativeMode(l)==='hourly');
          const flat = !KIND[l.kind].cells || (l.kind==='creative' && !isHourly);
          const cellCol = KIND[l.kind].cells==='budget' ? 'budget'
            : (KIND[l.kind].cells==='hours' || isHourly) ? 'hours' : 'amount';
          // budget kinds and manual/hourly cells all write month rows; a flat line
          // in auto mode writes none (its amount lives on the line)
          const writesCells = KIND[l.kind].cells==='budget' || isHourly || (flat && l.manual);

          const rowData = {
            deal_id:d.id, kind:l.kind, label:l.label ?? null,
            amount:Math.round((l.params.amount||0)*100), budget:0,
            hours_per_month:l.params.hours_per_month||0,
            fee_pct:l.params.fee_pct||0, margin_pct:l.params.margin_pct ?? null,
            rate:Math.round((l.params.rate||0)*100),
            billing_day:BILLING_BY_KIND[l.kind],
            media_funding:l.media_funding || 'client',
            set_by:window.__email, set_at:new Date().toISOString()
          };
          if (l.id) {
            const { error } = await supa.from('deal_lines').update(rowData).eq('id', l.id);
            if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
          } else {
            const { data, error } = await supa.from('deal_lines').insert(rowData).select('id').single();
            if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
            l.id = data.id;
          }
          // freeze: closed flight months without an explicit row freeze at the
          // line's as-opened value, so editing today never rewrites settled history
          const closedMonths = monthsBetween(flight.start, flight.end).filter(m=>closed(m));
          const freezeField = writesCells ? (cellCol==='hours' ? 'hours' : cellCol) : null;
          if (freezeField && l.hadDlm && closedMonths.length) {
            const freeze = closedMonths.filter(m => !l.hadDlm.has(m)).map(m => {
              const r = { deal_line_id:l.id, month:m, set_by:'freeze-on-close', set_at:new Date().toISOString() };
              r[freezeField] = freezeField==='hours' ? l.orig.hours
                : freezeField==='amount' ? l.orig.amount : 0;
              return r;
            });
            if (freeze.length) {
              const fz = await supa.from('deal_line_months').insert(freeze);
              if (fz.error) { msg.textContent = fz.error.message; msg.className='msg err'; return; }
              freeze.forEach(r => l.hadDlm.add(r.month));
            }
          }
          if (writesCells) {
            const openMonths = monthsBetween(flight.start, flight.end).filter(m=>!closed(m));
            if (openMonths.length) {
              const del = await supa.from('deal_line_months').delete()
                .eq('deal_line_id', l.id).in('month', openMonths);
              if (del.error) { msg.textContent = del.error.message; msg.className='msg err'; return; }
            }
            const rows = Object.entries(l.cells).filter(([m])=>!closed(m)).map(([m,v]) => {
              const r = { deal_line_id:l.id, month:m, set_by:window.__email, set_at:new Date().toISOString() };
              r[cellCol==='hours'?'hours':cellCol] = cellCol==='hours' ? v : Math.round(v*100);
              return r;
            });
            if (rows.length) {
              const ins = await supa.from('deal_line_months').insert(rows);
              if (ins.error) { msg.textContent = ins.error.message; msg.className='msg err'; return; }
            }
          } else {
            // flat auto line: clear any leftover month rows from a prior manual state
            const openMonths = monthsBetween(flight.start, flight.end).filter(m=>!closed(m));
            if (openMonths.length) {
              await supa.from('deal_line_months').delete()
                .eq('deal_line_id', l.id).in('month', openMonths);
            }
          }
        }
        box.querySelector('.msg').textContent = 'saved';
        box.querySelector('.msg').className = 'msg ok';
        loadAll();
      }
    }
    draw();
  }

  await loadAll();
});
</script></body></html>
