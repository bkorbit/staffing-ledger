<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Settings</title><link rel="stylesheet" href="./assets/style.css?v=19792b2"></head><body>
<script type="module">
import { boot, fmt$, esc } from './assets/shell.js?v=19792b2';

boot('settings', async (supa, el) => {
  el.innerHTML = `<div class="sc-panel" id="syncs">loading…</div>
    <div class="sc-panel" id="hsreview"></div>
    <div class="sc-panel" id="banks"></div>
    <div class="sc-panel" id="knobs"></div>
    <div class="sc-panel" id="wcrates"></div>
    <div class="sc-panel" id="sutarates"></div>`;

  const nameKey = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

  // Same 50 states + DC as Team's work_state dropdown — real workers' comp
  // rates are set per state, so exact calculation (042) needs one rate per
  // state actually confirmed from the policy, not a free-text list.
  const US_STATES = [
    ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],
    ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],
    ['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],
    ['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],
    ['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],
    ['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],
    ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],
    ['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],
    ['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],
    ['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],
    ['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']
  ];
  const STATE_NAME = Object.fromEntries(US_STATES);

  async function load() {
    const [syncs, banks, knobs, pipelineDeals, promotions, blockedNames, hsDeals, clientsList, wcRates, sutaRates] = await Promise.all([
      supa.from('sync_state').select('id,last_run_at,last_run_log,import_from,import_from_set_by,import_from_set_at'),
      supa.from('qbo_accounts').select('id,name,balance,is_operating,as_of').eq('account_type','Bank').order('balance',{ascending:false}),
      supa.from('settings').select('key,value,set_by').order('key'),
      supa.from('pipeline_deals').select('hubspot_deal_id,name,company,campaign_start,campaign_end,pipeline,is_won,url,jobcode,stage'),
      supa.from('promotions').select('hubspot_deal_id'),
      supa.from('blocked_company_names').select('name_key'),
      supa.from('deals').select('id,name,client_id,hubspot_deal_id,flight_start,flight_end,flight_locked,status,hidden').not('hubspot_deal_id', 'is', null),
      supa.from('clients').select('id,name'),
      supa.from('workers_comp_rates').select('state,rate,set_by').order('state'),
      supa.from('suta_rates').select('state,wage_base,rate,set_by').order('state')
    ]);

    document.getElementById('syncs').innerHTML = `<div class="muted" style="margin-bottom:8px">Syncs</div>
      <table><tr><th>source</th><th>last run</th><th>status</th><th>detail</th></tr>
      ${(syncs.data||[]).map(s=>{
        const log=s.last_run_log||{}; const ok=log.ok!==false;
        const detail = ok
          ? Object.entries(log).filter(([k])=>typeof log[k]==='number').map(([k,v])=>`${k} ${v}`).slice(0,6).join(' · ')
          : `${log.stage||''}: ${log.error||''}`.slice(0,140);
        return `<tr><td>${esc(s.id)}</td><td>${s.last_run_at?new Date(s.last_run_at).toLocaleString():'never'}</td>
          <td>${ok?'<span class="pill good">ok</span>':'<span class="pill bad">failed</span>'}</td>
          <td class="muted" style="text-align:left">${esc(detail)}</td></tr>`;}).join('')}</table>
      ${(()=>{const qbt=(syncs.data||[]).find(s=>s.id==='qbtime'); return `
      <div style="display:flex;gap:12px;align-items:flex-end;margin-top:12px;flex-wrap:wrap">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          QuickBooks Time import cutoff — hours before this date are never pulled, and are purged from already-synced data
          <input id="qbtime-cutoff" type="date" style="width:160px" value="${qbt&&qbt.import_from?qbt.import_from:''}"></label>
        <button class="primary" id="cutoff-save">Save</button>
        <span id="cutoff-msg" class="ok" style="font-size:12px"></span>
        ${qbt&&qbt.import_from_set_by?`<span class="muted" style="font-size:11px">last set by ${esc(qbt.import_from_set_by)}, ${new Date(qbt.import_from_set_at).toLocaleString()}</span>`:''}
      </div>`;})()}`;

    // ---- HubSpot reconciliation: won-but-blocked (diagnostic) + already-promoted
    // deals whose flight dates have since changed in HubSpot (review + approve).
    // pipeline_deals is a full mirror refreshed every sync run regardless of
    // promotion status — the current HubSpot state is always sitting there,
    // even for a deal the one-way promotion door will never re-touch itself.
    const promotedIds = new Set((promotions.data || []).map(r => r.hubspot_deal_id));
    const blockedSet = new Set((blockedNames.data || []).map(r => r.name_key));
    const gateRow = (knobs.data || []).find(k => k.key === 'hubspot_promote_pipelines');
    const allowedPipelines = new Set((gateRow ? gateRow.value : []).map(nameKey));

    const notPromoted = (pipelineDeals.data || []).filter(d => d.is_won && !promotedIds.has(d.hubspot_deal_id)).map(d => {
      let reason;
      if (!allowedPipelines.has(nameKey(d.pipeline))) reason = `pipeline "${d.pipeline || '(none)'}" not enabled for promotion`;
      else if (!d.company) reason = 'no company';
      else if (blockedSet.has(nameKey(d.company))) reason = 'company blocked (Clients tab)';
      else if (!d.campaign_start) reason = 'no campaign start date';
      else if (!d.campaign_end) reason = 'no campaign end date';
      else if (d.campaign_end < d.campaign_start) reason = 'campaign ends before it starts';
      else reason = 'should promote on the next HubSpot sync run';
      return { ...d, reason };
    });

    // Recruiting is a separate HubSpot pipeline (see db/008) that must never be
    // promotable — filtered out of the picker entirely rather than just
    // unchecked, so it can't clutter the list or be turned on by accident.
    const allPipelines = [...new Set((pipelineDeals.data || []).map(d => d.pipeline).filter(Boolean))]
      .filter(p => !/recruit/i.test(p)).sort();

    const pdByHsId = new Map((pipelineDeals.data || []).map(d => [d.hubspot_deal_id, d]));
    const clientName = new Map((clientsList.data || []).map(c => [c.id, c.name]));
    // flight_locked deals are excluded outright, never just warned about — once a
    // human sets flight dates in the platform editor, HubSpot is never allowed to
    // touch them again (028's own rule, not something a Settings panel should relax).
    const staleDiffs = (hsDeals.data || []).filter(d => !d.flight_locked).map(d => {
      const hs = pdByHsId.get(d.hubspot_deal_id);
      if (!hs || !hs.campaign_start || !hs.campaign_end || hs.campaign_end < hs.campaign_start) return null;
      if (hs.campaign_start === d.flight_start && hs.campaign_end === d.flight_end) return null;
      return { deal: d, client: clientName.get(d.client_id) || '', hsStart: hs.campaign_start, hsEnd: hs.campaign_end, hsUrl: hs.url };
    }).filter(Boolean);

    // A deal marked closed/lost whose own flight falls inside the platform's
    // scope is a contradiction nothing in this codebase ever produces on its
    // own — no sync and no app UI ever sets status to 'closed' or 'lost' (only
    // promotion does, and it always writes 'won'), so this can only come from a
    // direct SQL edit that predates a later flight-date renewal. Every
    // forward-looking page (forecast, cashflow, sales, index) filters status in
    // ('won','active'), so a deal like this silently vanishes everywhere with
    // zero warning — surfaced here instead of requiring a fresh SQL dig each
    // time it happens again.
    //
    // The boundary is the platform's own fixed start date (2026-01-01, same
    // anchor forecast.html's deals query uses), NOT "today" — a deal whose
    // flight has already ended is still very much in scope for matching and
    // measured actuals, and checking against "today" stopped protecting it the
    // moment its flight ended, exactly when the contradiction stops mattering
    // to HubSpot's own view of it and starts mattering to ours.
    const PLATFORM_START = '2026-01-01';
    const statusFlightMismatch = (hsDeals.data || [])
      .filter(d => ['closed', 'lost'].includes(d.status) && !d.hidden && d.flight_end && d.flight_end >= PLATFORM_START)
      .map(d => ({ deal: d, client: clientName.get(d.client_id) || '' }));

    // Raw lookup by name — ground truth for one specific deal instead of another
    // guessed-at category. Covers every HubSpot deal in the mirror, won or not,
    // since a reopened deal can sit in a non-"won" stage and be invisible to
    // every bucket above despite being very real, live business.
    const dealByHsId = new Map((hsDeals.data || []).map(d => [d.hubspot_deal_id, d]));
    function renderLookup(q) {
      const query = nameKey(q);
      const hits = query.length < 2 ? [] : (pipelineDeals.data || [])
        .filter(d => nameKey(d.name).includes(query) || nameKey(d.company || '').includes(query))
        .slice(0, 25);
      document.getElementById('lookup-results').innerHTML = !query.length ? '' : !hits.length
        ? `<div class="muted" style="padding:6px 0">No HubSpot deal matches "${esc(q)}".</div>`
        : `<table><tr><th>deal</th><th>company</th><th>stage</th><th>won?</th><th>pipeline</th>
            <th>campaign dates</th><th>jobcode</th><th>in platform?</th><th></th></tr>
          ${hits.map(d => {
            const promoted = dealByHsId.get(d.hubspot_deal_id);
            return `<tr><td class="textleft">${esc(d.name)}</td><td class="textleft">${esc(d.company || '')}</td>
              <td class="textleft muted">${esc(d.stage || '')}</td>
              <td>${d.is_won ? '<span class="pill good">won</span>' : '<span class="pill">not won</span>'}</td>
              <td class="textleft muted">${esc(d.pipeline || '')}</td>
              <td class="muted">${d.campaign_start || '—'} → ${d.campaign_end || '—'}</td>
              <td class="muted">${esc(d.jobcode || '')}</td>
              <td>${promoted ? `<span class="pill ${promoted.hidden?'bad':'good'}">yes — ${esc(promoted.status)}${promoted.hidden?' · HIDDEN':''} — ${esc(promoted.flight_start||'?')}→${esc(promoted.flight_end||'?')}</span>
                ${promoted.name !== d.name ? `<div class="warn" style="font-size:11px;margin-top:2px">stored as "${esc(promoted.name)}" — promotion is a one-time snapshot; a later HubSpot rename never propagates, so pickers that search by name won't find this deal under its current HubSpot name</div>` : ''}`
                : '<span class="pill">no</span>'}</td>
              <td><a href="${esc(d.url)}" target="_blank" rel="noopener">HubSpot ↗</a></td></tr>`;
          }).join('')}</table>`;
    }

    document.getElementById('hsreview').innerHTML = `<div class="muted" style="margin-bottom:8px">HubSpot reconciliation</div>
      <div class="sc-eyebrow" style="margin-top:0">Look up a deal</div>
      <div style="margin-bottom:6px">
        <input id="lookup-q" placeholder="deal or company name…" style="width:280px">
      </div>
      <div id="lookup-results" style="margin-bottom:12px"></div>
      <div class="sc-eyebrow">Pipelines allowed to promote</div>
      ${allPipelines.length ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:12px">
        ${allPipelines.map(p => `<label class="mono" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" data-pipeline="${esc(p)}" ${allowedPipelines.has(nameKey(p)) ? 'checked' : ''}>${esc(p)}</label>`).join('')}
        <button class="primary" id="pipeline-save">Save</button>
        <span id="pipeline-msg" class="ok" style="font-size:12px"></span>
      </div>` : `<div class="muted" style="padding:8px 0 4px">No pipelines seen yet — run the HubSpot sync at least once.</div>`}
      <div class="sc-eyebrow">Won in HubSpot, not yet promoted (${notPromoted.length})</div>
      ${notPromoted.length ? `<table><tr><th>deal</th><th>company</th><th>pipeline</th><th>why it's blocked</th><th></th></tr>
        ${notPromoted.map(d => `<tr><td class="textleft">${esc(d.name)}</td><td class="textleft">${esc(d.company || '')}</td>
          <td class="textleft muted">${esc(d.pipeline || '')}</td>
          <td class="textleft ${d.reason.startsWith('should') ? 'ok' : 'warn'}">${esc(d.reason)}</td>
          <td><a href="${esc(d.url)}" target="_blank" rel="noopener">HubSpot ↗</a></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">Nothing waiting.</div>`}
      <div class="sc-eyebrow">Already promoted — HubSpot has newer flight dates (${staleDiffs.length})</div>
      ${staleDiffs.length ? `<table><tr><th>deal</th><th>client</th><th>platform dates</th><th>HubSpot dates</th><th></th></tr>
        ${staleDiffs.map((d, i) => `<tr><td class="textleft">${esc(d.deal.name)}</td><td class="textleft">${esc(d.client)}</td>
          <td class="muted">${d.deal.flight_start || '—'} → ${d.deal.flight_end || '—'}</td>
          <td>${d.hsStart} → ${d.hsEnd}</td>
          <td><button class="primary" data-apply="${i}">Apply</button> <a href="${esc(d.hsUrl)}" target="_blank" rel="noopener">HubSpot ↗</a></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">Nothing to reconcile — flight-locked deals excluded.</div>`}
      <div class="sc-eyebrow">Closed/lost but flighted within platform scope (${statusFlightMismatch.length})</div>
      ${statusFlightMismatch.length ? `<table><tr><th>deal</th><th>client</th><th>status</th><th>flight</th><th></th></tr>
        ${statusFlightMismatch.map((d, i) => `<tr><td class="textleft">${esc(d.deal.name)}</td><td class="textleft">${esc(d.client)}</td>
          <td class="warn">${esc(d.deal.status)}</td>
          <td class="muted">${d.deal.flight_start || '—'} → ${d.deal.flight_end || '—'}</td>
          <td><button class="primary" data-reopen="${i}" title="sets status to active — this deal will reappear in every forecast/cashflow/sales view">Reopen</button></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">None — no closed/lost deal has a flight ending on or after ${PLATFORM_START}.</div>`}`;
    document.getElementById('lookup-q').oninput = e => renderLookup(e.target.value);
    if (document.getElementById('pipeline-save')) document.getElementById('pipeline-save').onclick = async () => {
      const selected = [...document.querySelectorAll('input[data-pipeline]:checked')].map(cb => cb.dataset.pipeline);
      const { error } = await supa.from('settings').upsert(
        [{ key: 'hubspot_promote_pipelines', value: selected, set_by: window.__email, set_at: new Date().toISOString() }],
        { onConflict: 'key' });
      document.getElementById('pipeline-msg').textContent = error ? error.message : 'saved — takes effect on the next HubSpot sync run';
      if (!error) load();
    };
    document.querySelectorAll('button[data-apply]').forEach(btn => btn.onclick = async () => {
      const d = staleDiffs[+btn.dataset.apply];
      btn.disabled = true; btn.textContent = '…';
      const { error } = await supa.from('deals').update({
        flight_start: d.hsStart, flight_end: d.hsEnd, set_by: window.__email, set_at: new Date().toISOString()
      }).eq('id', d.deal.id);
      if (error) { btn.disabled = false; btn.textContent = error.message.slice(0, 30); }
      else load();
    });
    document.querySelectorAll('button[data-reopen]').forEach(btn => btn.onclick = async () => {
      const d = statusFlightMismatch[+btn.dataset.reopen];
      if (!confirm(`Set "${d.deal.name}" back to active?\n\nIt will reappear in every forecast, cashflow, and sales view.`)) return;
      btn.disabled = true; btn.textContent = '…';
      const { error } = await supa.from('deals').update({
        status: 'active', set_by: window.__email, set_at: new Date().toISOString()
      }).eq('id', d.deal.id);
      if (error) { btn.disabled = false; btn.textContent = error.message.slice(0, 30); }
      else load();
    });

    document.getElementById('banks').innerHTML = `<div class="muted" style="margin-bottom:8px">Bank accounts
      <span class="muted">— operating accounts form the cashflow opening position</span></div>
      <table><tr><th>account</th><th>balance</th><th>as of</th><th>operating</th></tr>
      ${(banks.data||[]).map(b=>`<tr><td>${esc(b.name)}</td><td>${fmt$(b.balance)}</td>
        <td class="muted">${b.as_of||''}</td>
        <td><input type="checkbox" data-bank="${b.id}" ${b.is_operating?'checked':''}></td></tr>`).join('')}</table>`;
    document.querySelectorAll('input[data-bank]').forEach(cb => cb.onchange = async () => {
      await supa.from('qbo_accounts').update({ is_operating: cb.checked }).eq('id', cb.dataset.bank);
    });
    document.getElementById('cutoff-save').onclick = async () => {
      const v = document.getElementById('qbtime-cutoff').value;
      const { error } = await supa.from('sync_state').update({
        import_from: v || null, import_from_set_by: window.__email, import_from_set_at: new Date().toISOString()
      }).eq('id', 'qbtime');
      document.getElementById('cutoff-msg').textContent = error ? error.message : 'saved — takes effect on the next sync run';
      if (!error) load();
    };

    document.getElementById('knobs').innerHTML = `<div class="sc-eyebrow">Settings</div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          sales probability threshold %
          <input id="k-threshold" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='sales_probability_threshold');return k?k.value:40})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          programmatic margin default %
          <input id="k-margin" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='programmatic_margin_default');return k?k.value:35})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">programmatic COGS due (days after spend-month end)
          <input id="k-cogsdue" type="number" min="0" max="180" style="width:120px"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='programmatic_cogs_due_days');return k?k.value:45})()}"></label>
        <button class="primary" id="k-save" style="align-self:flex-end">Save</button>
        <span id="k-msg" class="ok" style="align-self:flex-end;font-size:12px"></span>
      </div>
      <div class="sc-eyebrow">Payroll burden (employer FICA + FUTA, 040)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Layered on top of base pay for full_time/part_time comp periods only —
        contractors are unaffected. The Social Security wage base is reindexed
        annually by the SSA; the FUTA rate assumes the standard 5.4% state
        credit (higher in a handful of "credit reduction" states). Confirm
        both against your payroll provider before relying on this.</div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          FICA — Social Security %
          <input id="k-ficass" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='fica_ss_rate');return k?k.value:6.2})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          FICA — Medicare %
          <input id="k-ficamed" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='fica_medicare_rate');return k?k.value:1.45})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          Social Security wage base $/yr
          <input id="k-ssbase" style="width:140px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='fica_ss_wage_base');return k?k.value:176100})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          FUTA rate %
          <input id="k-futarate" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='futa_rate');return k?k.value:0.6})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          FUTA wage base $/yr
          <input id="k-futabase" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='futa_wage_base');return k?k.value:7000})()}"></label>
        <button class="primary" id="k-save-burden" style="align-self:flex-end">Save</button>
        <span id="k-burden-msg" class="ok" style="align-self:flex-end;font-size:12px"></span>
      </div>
      <div class="sc-eyebrow">Benefits — 401k match, health insurance, workers' comp, SDI, PEO fee (041)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Each only counts toward a person's cost if their own 401k / Health
        Insurance checkbox is on (set per person on Team). The 401k match
        also waits for that person's own eligibility date (6 months after
        hire, entry on the 1st of the month coinciding with or following) —
        unless they were hired on or before the grandfather cutoff below
        (044), in which case they're eligible immediately, no wait at all.
        Health insurance waits for the plan start date below, company-wide.
        Workers' comp and SUTA apply to every W-2 (non-contractor) staff
        member regardless of either checkbox, calculated exactly per person
        from their own work state (set on Team) against the per-state rates
        below (042/046) — the flat rate/wage-base here is only the fallback
        for a state with no row yet, or a person with no work state set.
        State disability insurance (048) is deliberately NOT modeled for
        most states — it's employee-funded there, not an employer cost.
        Hawaii and New York are the two where the employer genuinely pays
        the difference above what can legally be deducted from the
        employee; both are flat $/month per person in that state, not a %
        of pay (real TDI/DBL premiums don't scale with salary), and apply
        automatically by work state — no opt-in checkbox, since it isn't
        optional. PEO admin fee (050) is the flat per-employee platform
        charge a PEO like JustWorks bills on top of wages/taxes/benefits —
        same automatic, no-checkbox treatment as workers' comp/SUTA, for
        every W-2 person regardless of state.</div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          401k match %
          <input id="k-401krate" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='k401_match_rate');return k?k.value:3})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="Hired on or before this date skips the 6-month wait entirely — eligible immediately from their own hire date">
          401k grandfather cutoff (hired on/before = no wait)
          <input id="k-401kgrandfather" type="date" style="width:160px"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='k401_grandfather_cutoff');return k?k.value:'2026-01-01'})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          health insurance $/mo per enrolled person
          <input id="k-himonthly" style="width:160px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='health_insurance_monthly_cost');return k?k.value:0})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          health insurance plan start date
          <input id="k-histart" type="date" style="width:160px"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='health_insurance_start_date');return k?k.value:'2099-01-01'})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          workers' comp fallback rate (per $100 of pay, as %)
          <input id="k-wcrate" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='workers_comp_rate');return k?k.value:0})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          SUTA fallback rate (as %)
          <input id="k-sutarate" style="width:120px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='suta_rate');return k?k.value:2.7})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">
          SUTA fallback wage base $/yr
          <input id="k-sutabase" style="width:140px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='suta_wage_base');return k?k.value:7000})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="Hawaii TDI — flat employer cost per covered person, not a % of pay">
          HI disability insurance $/mo per person
          <input id="k-hisdi" style="width:160px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='hi_disability_monthly_cost');return k?k.value:0})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="New York DBL — flat employer cost per covered person, not a % of pay">
          NY disability insurance $/mo per person
          <input id="k-nysdi" style="width:160px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='ny_disability_monthly_cost');return k?k.value:0})()}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="PEO platform/admin fee (e.g. JustWorks) — flat per W-2 employee per month, automatic, no per-person opt-in">
          PEO admin fee $/mo per W-2 person
          <input id="k-peofee" style="width:160px;text-align:right"
            value="${(()=>{const k=(knobs.data||[]).find(x=>x.key==='peo_admin_fee_monthly');return k?k.value:99})()}"></label>
        <button class="primary" id="k-save-benefits" style="align-self:flex-end">Save</button>
        <span id="k-benefits-msg" class="ok" style="align-self:flex-end;font-size:12px"></span>
      </div>
      <table><tr><th>key</th><th>value</th><th>set by</th></tr>
      ${(knobs.data||[]).map(k=>`<tr><td>${esc(k.key)}</td>
        <td style="text-align:left">${esc(JSON.stringify(k.value))}</td>
        <td class="muted">${esc(k.set_by||'')}</td></tr>`).join('')}</table>`;
    document.getElementById('k-save').onclick = async () => {
      const rows = [
        { key:'sales_probability_threshold', value:+document.getElementById('k-threshold').value||40,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'programmatic_cogs_due_days', value:+document.getElementById('k-cogsdue').value||45,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'programmatic_margin_default', value:+document.getElementById('k-margin').value||35,
          set_by:window.__email, set_at:new Date().toISOString() }];
      const { error } = await supa.from('settings').upsert(rows, { onConflict:'key' });
      document.getElementById('k-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.getElementById('k-save-burden').onclick = async () => {
      const rows = [
        { key:'fica_ss_rate', value:+document.getElementById('k-ficass').value||6.2,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'fica_medicare_rate', value:+document.getElementById('k-ficamed').value||1.45,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'fica_ss_wage_base', value:+document.getElementById('k-ssbase').value||176100,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'futa_rate', value:+document.getElementById('k-futarate').value||0.6,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'futa_wage_base', value:+document.getElementById('k-futabase').value||7000,
          set_by:window.__email, set_at:new Date().toISOString() }];
      const { error } = await supa.from('settings').upsert(rows, { onConflict:'key' });
      document.getElementById('k-burden-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.getElementById('k-save-benefits').onclick = async () => {
      const rows = [
        { key:'k401_match_rate', value:+document.getElementById('k-401krate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'k401_grandfather_cutoff', value:document.getElementById('k-401kgrandfather').value||'2026-01-01',
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'health_insurance_monthly_cost', value:+document.getElementById('k-himonthly').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'health_insurance_start_date', value:document.getElementById('k-histart').value||'2099-01-01',
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'workers_comp_rate', value:+document.getElementById('k-wcrate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'suta_rate', value:+document.getElementById('k-sutarate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'suta_wage_base', value:+document.getElementById('k-sutabase').value||7000,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'hi_disability_monthly_cost', value:+document.getElementById('k-hisdi').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'ny_disability_monthly_cost', value:+document.getElementById('k-nysdi').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'peo_admin_fee_monthly', value:+document.getElementById('k-peofee').value||0,
          set_by:window.__email, set_at:new Date().toISOString() }];
      const { error } = await supa.from('settings').upsert(rows, { onConflict:'key' });
      document.getElementById('k-benefits-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };

    // Workers' comp by state (042) — a real per-state rate table, not a
    // settings blob, so states get added one at a time as their real rate
    // is confirmed from the policy rather than requiring all 51 up front.
    const configuredStates = new Set((wcRates.data || []).map(r => r.state));
    document.getElementById('wcrates').innerHTML = `<div class="sc-eyebrow">Workers' comp by state (042)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Exact per-person calculation — add a rate for every state you actually
        confirmed from your policy. A state left out here just uses the flat
        fallback rate above, same as before.</div>
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">state
          <select id="wc-state" style="width:220px">
            ${US_STATES.map(([code, stateName]) => `<option value="${code}">${stateName}${configuredStates.has(code)?' (configured)':''}</option>`).join('')}
          </select></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">rate (per $100 of pay, as %)
          <input id="wc-rate" style="width:140px;text-align:right"></label>
        <button class="primary" id="wc-add">Add / Update</button>
        <span id="wc-msg" class="ok" style="font-size:12px"></span>
      </div>
      ${(wcRates.data || []).length ? `<table><tr><th>state</th><th>rate</th><th>set by</th><th></th></tr>
        ${(wcRates.data || []).map(r => `<tr><td class="textleft">${esc(STATE_NAME[r.state] || r.state)}</td>
          <td>${esc(String(r.rate))}%</td><td class="muted">${esc(r.set_by||'')}</td>
          <td><button class="ghost" data-wc-del="${esc(r.state)}" style="padding:2px 8px;font-size:11px;color:var(--rust)">×</button></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">No states configured yet — everyone uses the flat fallback rate above.</div>`}`;
    document.getElementById('wc-add').onclick = async () => {
      const state = document.getElementById('wc-state').value;
      const rate = +document.getElementById('wc-rate').value;
      if (!rate && rate !== 0) { document.getElementById('wc-msg').textContent = 'enter a rate'; return; }
      const { error } = await supa.from('workers_comp_rates').upsert(
        [{ state, rate, set_by: window.__email, set_at: new Date().toISOString() }], { onConflict: 'state' });
      document.getElementById('wc-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.querySelectorAll('[data-wc-del]').forEach(btn => btn.onclick = async () => {
      const state = btn.dataset.wcDel;
      if (!confirm(`Remove the configured rate for ${STATE_NAME[state] || state}? It'll fall back to the flat rate.`)) return;
      const { error } = await supa.from('workers_comp_rates').delete().eq('state', state);
      if (error) { alert(error.message); return; }
      load();
    });

    // SUTA by state (046) — needs two numbers per state, not one: the
    // taxable wage base (real, state law, not experience-rated) AND a rate
    // (experience-rated per employer — even a "confirmed" rate here is a
    // starting point, not your real number, more so than workers' comp).
    // Rate can be blank/cleared independently of wage_base — a state can
    // have a solid wage base but no confirmed rate yet.
    const configuredSuta = new Map((sutaRates.data || []).map(r => [r.state, r]));
    document.getElementById('sutarates').innerHTML = `<div class="sc-eyebrow">SUTA by state (046)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Exact per-person calculation — wage base is real, state-set law; rate
        is experience-rated per employer, so even a filled-in number here is
        a starting point to confirm against your own state rate notices, not
        a final figure. A state left out (or with a blank rate) uses the
        flat fallback above for whichever piece is missing.</div>
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">state
          <select id="suta-state" style="width:220px">
            ${US_STATES.map(([code, stateName]) => `<option value="${code}">${stateName}${configuredSuta.has(code)?' (configured)':''}</option>`).join('')}
          </select></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">taxable wage base $/yr
          <input id="suta-wagebase" style="width:140px;text-align:right"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">rate (as %, blank = use fallback)
          <input id="suta-rate" style="width:160px;text-align:right"></label>
        <button class="primary" id="suta-add">Add / Update</button>
        <span id="suta-msg" class="ok" style="font-size:12px"></span>
      </div>
      ${(sutaRates.data || []).length ? `<table><tr><th>state</th><th>wage base</th><th>rate</th><th>set by</th><th></th></tr>
        ${(sutaRates.data || []).map(r => `<tr><td class="textleft">${esc(STATE_NAME[r.state] || r.state)}</td>
          <td>$${esc(Number(r.wage_base).toLocaleString())}</td>
          <td>${r.rate == null ? '<span class="muted">not confirmed</span>' : esc(String(r.rate)) + '%'}</td>
          <td class="muted">${esc(r.set_by||'')}</td>
          <td><button class="ghost" data-suta-del="${esc(r.state)}" style="padding:2px 8px;font-size:11px;color:var(--rust)">×</button></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">No states configured yet — everyone uses the flat fallback wage base/rate above.</div>`}`;
    document.getElementById('suta-add').onclick = async () => {
      const state = document.getElementById('suta-state').value;
      const wagebaseInput = document.getElementById('suta-wagebase').value;
      const rateInput = document.getElementById('suta-rate').value;
      const wage_base = +wagebaseInput;
      if (!wage_base) { document.getElementById('suta-msg').textContent = 'enter a wage base'; return; }
      const rate = rateInput === '' ? null : +rateInput;
      const { error } = await supa.from('suta_rates').upsert(
        [{ state, wage_base, rate, set_by: window.__email, set_at: new Date().toISOString() }], { onConflict: 'state' });
      document.getElementById('suta-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.querySelectorAll('[data-suta-del]').forEach(btn => btn.onclick = async () => {
      const state = btn.dataset.sutaDel;
      if (!confirm(`Remove the configured SUTA data for ${STATE_NAME[state] || state}? It'll fall back to the flat wage base/rate.`)) return;
      const { error } = await supa.from('suta_rates').delete().eq('state', state);
      if (error) { alert(error.message); return; }
      load();
    });
  }
  await load();
});
</script></body></html>
