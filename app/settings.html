<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Settings</title><link rel="stylesheet" href="./assets/style.css?v=7ae3880"></head><body>
<script type="module">
import { boot, fmt$, esc, wireSearch, fetchAll } from './assets/shell.js?v=7ae3880';

boot('settings', async (supa, el) => {
  // Four tabs, because one flat stack of six panels made everything equally
  // hard to find. The grouping is by WHO is asking, not by which table the
  // value lives in: HR owns what a person costs, Finance owns what money
  // means, CRM sync owns the HubSpot boundary, Integrations owns the plumbing.
  const TABS = [
    ['finance', 'Finance',      'How money is counted, bank accounts, margin defaults'],
    ['hr',      'HR',           'Payroll burden, benefits, and per-state rates'],
    // Clients sits directly before CRM sync because the two share a boundary:
    // the "don't match" flag set here IS the door the promotion gate on that
    // tab describes. It was its own sidebar page under a Setup group until it
    // moved here — a setup screen belongs with the other setup screens.
    ['clients', 'Clients',      'Which QuickBooks customer each client is, and which names HubSpot may never match'],
    ['crm',     'CRM sync',     'HubSpot reconciliation and the promotion gate'],
    // Scoping owns what a plan is measured against: how much of a person's
    // time may be planned onto client work, and the seed that gives Hour
    // Planning a day-one baseline from what people actually logged (095).
    ['scoping', 'Scoping',      'Profit target, approvers, comp bands, hire costs, and the Hour Planning seed'],
    ['int',     'Integrations', 'Sync health, import windows, raw settings']
  ];

  // The tab lives in the URL so a link can point at one, and a reload keeps
  // you where you were. An unknown hash falls back rather than showing nothing.
  const validTab = k => TABS.some(([t]) => t === k);
  let tab = (location.hash || '').replace(/^#/, '');
  if (!validTab(tab)) tab = 'finance';

  el.innerHTML = `
    <div class="settabs" role="tablist" aria-label="Settings sections">
      ${TABS.map(([k, label]) => `<button class="settab" role="tab" data-tab="${k}"
        id="settab-${k}" aria-controls="secpanel-${k}" aria-selected="false">${esc(label)}</button>`).join('')}
    </div>
    <div class="settab-note muted" id="tabnote"></div>
    <section data-sec="finance" id="secpanel-finance" role="tabpanel" aria-labelledby="settab-finance" hidden>
      <div class="sc-panel" id="accounts">loading…</div>
      <div class="sc-panel" id="banks"></div>
      <div class="sc-panel" id="finknobs"></div>
    </section>
    <section data-sec="hr" id="secpanel-hr" role="tabpanel" aria-labelledby="settab-hr" hidden>
      <div class="sc-panel" id="hrknobs"></div>
      <div class="sc-panel" id="wcrates"></div>
      <div class="sc-panel" id="sutarates"></div>
    </section>
    <section data-sec="clients" id="secpanel-clients" role="tabpanel" aria-labelledby="settab-clients" hidden>
      <div class="toolbar" style="margin-top:14px">
        <input id="cl-filter" type="text" placeholder="filter clients…" style="max-width:260px">
        <label class="mono" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="cl-onlytodo" checked style="height:auto"> only unlinked</label>
        <label class="mono" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="cl-showinactive" style="height:auto"> show inactive</label>
        <span class="muted" id="cl-count" style="font-size:12px"></span>
        <span style="flex:1"></span>
        <button class="ghost" id="cl-refresh">Refresh</button>
      </div>
      <div id="cl-list">loading…</div>
    </section>
    <section data-sec="crm" id="secpanel-crm" role="tabpanel" aria-labelledby="settab-crm" hidden>
      <div class="sc-panel" id="hsreview"></div>
      <div class="sc-panel" id="crmknobs"></div>
    </section>
    <section data-sec="scoping" id="secpanel-scoping" role="tabpanel" aria-labelledby="settab-scoping" hidden>
      <div class="sc-panel" id="scopeknobs"></div>
      <div class="sc-panel" id="scopecatalog"></div>
      <div class="sc-panel" id="scopeteams"></div>
      <div class="sc-panel" id="scopetermsp"></div>
      <div class="sc-panel" id="scopeseed"></div>
    </section>
    <section data-sec="int" id="secpanel-int" role="tabpanel" aria-labelledby="settab-int" hidden>
      <div class="sc-panel" id="syncs">loading…</div>
      <div class="sc-panel" id="rawsettings"></div>
    </section>`;

  // Every panel renders on load and is shown or hidden, rather than rendered
  // lazily on tab click. Switching tabs therefore cannot lose a handler, and
  // there is no second code path where a panel exists but is unwired.
  function showTab(k) {
    tab = k;
    el.querySelectorAll('.settab').forEach(b => {
      const on = b.dataset.tab === k;
      b.classList.toggle('current', on);
      b.setAttribute('aria-selected', String(on));
    });
    el.querySelectorAll('section[data-sec]').forEach(s => { s.hidden = s.dataset.sec !== k; });
    const meta = TABS.find(([t]) => t === k);
    el.querySelector('#tabnote').textContent = meta ? meta[2] : '';
    if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
  }
  el.querySelectorAll('.settab').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => {
    const k = (location.hash || '').replace(/^#/, '');
    if (validTab(k) && k !== tab) showTab(k);
  });

  const nameKey = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

  // ---- how money is counted ------------------------------------------------
  // The seven classes a person picks from. Contra-Revenue is deliberately NOT
  // here: an income account is revenue when an invoice line lands on it and
  // contra revenue when a bill or journal line does (025/080), so the role
  // follows the side of the transaction, not a setting. Offering it would put
  // a control on screen that cannot change the arithmetic.
  const CLASS_LABEL = {
    income:   'Revenue',
    cogs:     'COGS',
    payroll:  'Labor',
    overhead: 'Overhead',
    other:    'Other',
    deposit:  'Deposits',
    cash:     'Cash / Bank',
    excluded: 'Excluded'
  };
  // The picker spells out both roles an income account plays, because the
  // table's "which means" column will say Contra-Revenue for a pass-through
  // account and an option list that never mentions the word reads like a gap.
  // It is one class either way: a debit to an income account IS contra revenue,
  // which is how QuickBooks' own P&L nets it, and how 025/080 reproduce it.
  const PICKER_LABEL = Object.assign({}, CLASS_LABEL, { income: 'Revenue / Contra-Revenue' });
  const CLASS_ORDER = ['income', 'cogs', 'payroll', 'overhead', 'other', 'deposit', 'cash', 'excluded'];
  const CLASS_HELP = {
    income:   'Money earned. Counts as revenue when an invoice lands on it, and nets back OUT of revenue when a bill or journal debits it — that debit is what contra revenue is. QuickBooks has no separate contra-revenue account type either; both sides are the same account.',
    cogs:     'Direct cost of delivering the work. Subtracted from revenue to give gross profit.',
    payroll:  'People cost — wages, taxes, benefits.',
    overhead: 'Running the business.',
    other:    'A cost that belongs on the P&L but in none of the buckets above.',
    deposit:  'Customer money held before it is earned. Arrives as cash on the cashflow forecast, never counted as revenue.',
    cash:     'Money the business can spend. Appears under Bank accounts below and forms the cashflow opening position. QuickBooks Bank accounts are already here; class a Stripe, PayPal or clearing balance this way to count it too.',
    excluded: 'Balance-sheet movement. Never counted as revenue or cost anywhere.'
  };
  const REASON_TEXT = {
    liability_on_invoice:
      'An invoice bills against this balance-sheet account. That is a customer deposit or pre-payment — cash you hold before earning it. Class it Deposits.',
    income_needs_side_check:
      'An income account that bills and gets debited. Debits are usually pass-through costs netting out of revenue, which is correct as it stands — but a revenue reclass looks identical, and only you can tell.',
    unclassified:
      'Money is running through this account and it has no class at all. Always a data problem, never a preference.'
  };
  const STATEMENT_LABEL = { pl: 'P&L', bs: 'Balance sheet' };

  let accountsData = { accounts: [], counts: {} };
  let acctSearch = '';
  let acctFilter = 'review';
  let acctSort = { key: 'at_stake', dir: -1 };

  // What an account actually does, derived from the two sides it is used on
  // rather than from anything anyone configured. A bank account is cash before
  // it is anything else, so it says so instead of "Not counted".
  function roleOf(a) {
    if (a.class === 'cash') return a.is_operating ? 'Cash · opening position' : 'Cash';
    if (a.class === 'income') {
      const parts = [];
      if (+a.invoiced_lines > 0) parts.push('Revenue');
      if (+a.costed_lines > 0) parts.push('Contra-Revenue');
      return parts.length ? parts.join(' + ') : 'Revenue';
    }
    if (a.class === 'deposit')  return 'Cash in, never P&L';
    if (a.class === 'excluded') return 'Not counted';
    return CLASS_LABEL[a.class] || 'Unclassified';
  }

  const SORT_VAL = {
    account:   a => String(a.account || '').toLowerCase(),
    statement: a => a.statement || 'zz',
    type:      a => String(a.account_type || '').toLowerCase(),
    class:     a => CLASS_LABEL[a.class] || 'zz',
    means:     a => roleOf(a).toLowerCase(),
    invoiced:  a => +a.invoiced_cents || 0,
    costed:    a => +a.costed_cents || 0,
    at_stake:  a => +a.at_stake_cents || 0
  };
  const COLS = [
    ['account',   'account'],
    ['statement', 'statement'],
    ['type',      'QB type'],
    ['class',     'count it as'],
    ['means',     'which means'],
    ['invoiced',  'invoiced'],
    ['costed',    'costed']
  ];

  function classSelect(a) {
    const auto = a.derived_class ? `${PICKER_LABEL[a.derived_class] || a.derived_class} (from QuickBooks)` : '— unclassified —';
    return `<select class="acct-class" data-id="${esc(a.id)}"
        title="Blank follows the QuickBooks account type. Choosing here overrides it everywhere, past months included.">
      <option value="" ${!a.override_class ? 'selected' : ''}>${esc(auto)}</option>
      ${CLASS_ORDER.map(c => `<option value="${c}" ${a.override_class === c ? 'selected' : ''}
        title="${esc(CLASS_HELP[c])}">${esc(PICKER_LABEL[c])}</option>`).join('')}
    </select>`;
  }

  function stmtPill(a) {
    if (!a.statement) return '<span class="pill bad">no type</span>';
    return `<span class="pill stmt-${a.statement}">${esc(STATEMENT_LABEL[a.statement])}</span>`;
  }

  function renderAccounts() {
    const all = accountsData.accounts || [];
    const c = accountsData.counts || {};
    const review = all.filter(a => a.review_reason);
    const cash = all.filter(a => a.class === 'cash');
    const q = acctSearch.trim().toLowerCase();
    const pool = acctFilter === 'review' ? review
      : acctFilter === 'overridden' ? all.filter(a => a.override_class)
      : acctFilter === 'unclassified' ? all.filter(a => !a.class)
      : acctFilter === 'cash' ? all.filter(a => a.class === 'cash')
      : all;
    const val = SORT_VAL[acctSort.key] || SORT_VAL.at_stake;
    const rows = pool.filter(a => !q || String(a.account).toLowerCase().includes(q))
      .slice().sort((x, y) => {
        const ax = val(x), ay = val(y);
        if (ax !== ay) return (ax < ay ? -1 : 1) * acctSort.dir;
        return String(x.account).localeCompare(String(y.account));
      });

    document.getElementById('accounts').innerHTML =
      `<div class="sc-eyebrow" style="margin-top:0">How money is counted</div>
      <div class="muted" style="font-size:11px;margin-bottom:12px;max-width:680px">
        QuickBooks' own account types classify everything automatically. This is
        where you correct one, and where the handful of accounts a type can't
        settle come to be decided. Nothing here changes QuickBooks — it changes
        what this platform counts, retroactively, for every month.</div>
      <div class="acct-counts">
        <span><b>${+c.total || 0}</b> accounts</span>
        <span class="${review.length ? 'warn' : ''}"><b>${review.length}</b> need review</span>
        <span><b>${+c.acknowledged || 0}</b> confirmed</span>
        <span><b>${+c.overridden || 0}</b> overridden</span>
        <span><b>${cash.length}</b> cash · <b>${cash.filter(a => a.is_operating).length}</b> operating</span>
      </div>

      ${review.length ? `<div class="sc-eyebrow">Needs review — biggest exposure first</div>
        <table class="acct"><tr><th class="textleft">account</th><th class="textleft">what we can't tell</th>
          <th>at stake</th><th class="textleft">count it as</th><th></th></tr>
        ${review.slice().sort((x, y) => (+y.at_stake_cents) - (+x.at_stake_cents)).map(a => `<tr>
          <td class="textleft"><span class="ellip" style="max-width:260px" title="${esc(a.account)}">${esc(a.account)}</span>
            <div class="muted" style="font-size:10px">${esc(a.account_type || '—')} · ${esc(STATEMENT_LABEL[a.statement] || 'no type')}</div></td>
          <td class="textleft muted" style="max-width:340px;white-space:normal;font-size:11px">${esc(REASON_TEXT[a.review_reason] || a.review_reason)}</td>
          <td>${fmt$(+a.at_stake_cents)}</td>
          <td class="textleft">${classSelect(a)}</td>
          <td><button class="ghost acct-ack" data-id="${esc(a.id)}" data-reason="${esc(a.review_reason)}"
              title="This classification is right — stop asking. It comes back only if the account raises a different question.">Looks right</button></td>
        </tr>`).join('')}</table>`
      : `<div class="acct-clear">Nothing to review. Every account with money running through it has been classified or confirmed.</div>`}

      <div class="sc-eyebrow" style="margin-top:18px">All accounts</div>
      <div class="acct-tools">
        <input id="acct-search" placeholder="search accounts…" style="width:240px" value="${esc(acctSearch)}">
        ${[['review', `needs review (${review.length})`], ['all', `all (${+c.total || 0})`],
           ['overridden', `overridden (${+c.overridden || 0})`], ['unclassified', `unclassified (${+c.unclassified || 0})`],
           ['cash', `cash (${cash.length})`]]
          .map(([k, label]) => `<button class="ghost acct-filter${acctFilter === k ? ' current' : ''}"
            data-filter="${k}" aria-pressed="${acctFilter === k}">${esc(label)}</button>`).join('')}
        <span class="muted" style="font-size:11px">${rows.length} shown</span>
      </div>
      <table class="acct"><tr>${COLS.map(([k, label]) => {
        const active = acctSort.key === k;
        return `<th data-sort="${k}" tabindex="0" role="columnheader"
          aria-sort="${active ? (acctSort.dir < 0 ? 'descending' : 'ascending') : 'none'}"
          class="${['account','statement','type','class','means'].includes(k) ? 'textleft' : ''}"
          >${esc(label)}${active ? `<span class="dir">${acctSort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
      }).join('')}</tr>
      ${rows.length ? rows.map(a => `<tr>
        <td class="textleft"><span class="ellip" style="max-width:250px" title="${esc(a.account)}">${esc(a.account)}</span>
          ${a.review_ack_at ? '<span class="pill good" style="margin-left:6px">confirmed</span>' : ''}</td>
        <td class="textleft">${stmtPill(a)}</td>
        <td class="textleft muted"><span class="ellip" style="max-width:140px">${esc(a.account_type || '—')}</span></td>
        <td class="textleft">${classSelect(a)}</td>
        <td class="textleft ${a.class ? 'muted' : 'warn'}" style="font-size:11px">${esc(roleOf(a))}</td>
        <td>${+a.invoiced_cents ? fmt$(+a.invoiced_cents) : '<span class="muted">—</span>'}</td>
        <td>${+a.costed_cents ? fmt$(+a.costed_cents) : '<span class="muted">—</span>'}</td>
      </tr>`).join('')
      : `<tr><td colspan="${COLS.length}" class="empty-note">No account matches "${esc(acctSearch)}".</td></tr>`}
      </table>`;

    wireSearch(document.getElementById('accounts'), '#acct-search', v => { acctSearch = v; renderAccounts(); });
    document.querySelectorAll('.acct-filter').forEach(b => b.onclick = () => { acctFilter = b.dataset.filter; renderAccounts(); });
    document.querySelectorAll('#accounts th[data-sort]').forEach(th => {
      const activate = () => {
        const k = th.dataset.sort;
        acctSort = { key: k, dir: acctSort.key === k ? -acctSort.dir : (k === 'account' ? 1 : -1) };
        renderAccounts();
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });

    // Writing a class clears the acknowledgement in the SAME statement (082):
    // a reclassified account has not been reviewed under its new class, and a
    // stale "confirmed" badge would be worse than no badge at all.
    document.querySelectorAll('.acct-class').forEach(sel => sel.onchange = async () => {
      const value = sel.value || null;
      sel.disabled = true;
      const { error } = await supa.from('qbo_accounts').update({
        override_class: value,
        override_reason: value ? `Set in Settings > Finance, ${new Date().toISOString().slice(0, 10)}` : null,
        override_by: value ? window.__email : null,
        override_at: value ? new Date().toISOString() : null,
        review_ack_at: null, review_ack_by: null, review_ack_reason: null
      }).eq('id', sel.dataset.id);
      sel.disabled = false;
      if (error) { alert(error.message); return; }
      await loadAccounts();
    });

    document.querySelectorAll('.acct-ack').forEach(btn => btn.onclick = async () => {
      btn.disabled = true; btn.textContent = '…';
      const { error } = await supa.from('qbo_accounts').update({
        review_ack_at: new Date().toISOString(),
        review_ack_by: window.__email,
        review_ack_reason: btn.dataset.reason
      }).eq('id', btn.dataset.id);
      if (error) { btn.disabled = false; btn.textContent = error.message.slice(0, 24); return; }
      await loadAccounts();
    });
  }

  // Bank accounts, from the same payload — membership is the 'cash' class
  // (085/086), so a Stripe balance classed by hand appears here beside the
  // accounts QuickBooks happened to type Bank, and both feed the same opening
  // position. No separate query: these are rows the accounts table already has.
  function renderBanks() {
    const cash = (accountsData.accounts || []).filter(a => a.class === 'cash')
      .sort((a, b) => (+b.balance_cents || 0) - (+a.balance_cents || 0));
    const anyOperating = cash.some(a => a.is_operating);
    document.getElementById('banks').innerHTML =
      `<div class="sc-eyebrow" style="margin-top:0">Bank accounts</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:660px">
        Operating accounts form the cashflow opening position.${anyOperating ? ''
          : ' None are ticked, so all of them are counted — tick one to narrow it.'}
        Anything classed <b>Cash / Bank</b> above appears here, so a Stripe or
        clearing balance QuickBooks files as an asset can count too.</div>
      ${cash.length ? `<table><tr><th class="textleft">account</th><th>balance</th><th>as of</th>
        <th class="textleft">source</th><th>operating</th></tr>
      ${cash.map(a => `<tr><td class="textleft">${esc(a.account)}</td>
        <td>${fmt$(+a.balance_cents)}</td>
        <td class="muted">${esc(a.as_of || '')}</td>
        <td class="textleft muted" style="font-size:11px">${a.is_bank
          ? 'QuickBooks bank account' : 'added by hand · ' + esc(a.account_type || 'no type')}</td>
        <td><input type="checkbox" data-bank="${esc(a.id)}" ${a.is_operating ? 'checked' : ''}></td></tr>`).join('')}
      </table>`
      : `<div class="muted" style="padding:8px 0 4px">No cash accounts. QuickBooks bank accounts land here
         automatically — if none have synced yet, class one <b>Cash / Bank</b> above.</div>`}`;

    document.querySelectorAll('#banks input[data-bank]').forEach(cb => cb.onchange = async () => {
      cb.disabled = true;
      const { error } = await supa.from('qbo_accounts').update({ is_operating: cb.checked }).eq('id', cb.dataset.bank);
      cb.disabled = false;
      if (error) { alert(error.message); cb.checked = !cb.checked; return; }
      const acct = (accountsData.accounts || []).find(x => x.id === cb.dataset.bank);
      if (acct) acct.is_operating = cb.checked;
      renderAccounts(); renderBanks();
    });
  }

  async function loadAccounts() {
    const { data, error } = await supa.rpc('accounts_page');
    if (error) {
      document.getElementById('accounts').innerHTML =
        `<div class="sc-eyebrow" style="margin-top:0">How money is counted</div>
         <div class="warn">${esc(error.message)}</div>`;
      return;
    }
    accountsData = data || { accounts: [], counts: {} };
    renderAccounts();
    renderBanks();
  }

  // Same 50 states + DC as Team's work_state dropdown — real workers' comp
  // rates are set per state, so exact calculation (042) needs one rate per
  // state actually confirmed from the policy, not a free-text list.
  const US_STATES = [
    ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],
    ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],
    ['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],
    ['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],
    ['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],
    ['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],
    ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],
    ['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],
    ['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],
    ['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],
    ['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']
  ];
  const STATE_NAME = Object.fromEntries(US_STATES);

  async function load() {
    const [syncs, knobs, pipelineDeals, hsDeals, clientsList, wcRates, sutaRates, staffDepts, productsR, aliasesR, pipeItemsR] = await Promise.all([
      supa.from('sync_state').select('id,last_run_at,last_run_log,import_from,import_from_set_by,import_from_set_at'),
      supa.from('settings').select('key,value,set_by').order('key'),
      supa.from('pipeline_deals').select('hubspot_deal_id,name,company,campaign_start,campaign_end,pipeline,is_won,url,jobcode,stage'),
      supa.from('deals').select('id,name,client_id,hubspot_deal_id,flight_start,flight_end,flight_locked,status,hidden').not('hubspot_deal_id', 'is', null),
      supa.from('clients').select('id,name'),
      supa.from('workers_comp_rates').select('state,rate,set_by').order('state'),
      supa.from('suta_rates').select('state,wage_base,rate,set_by').order('state'),
      supa.from('staff').select('department').eq('active', true).eq('tracks_capacity', true),
      supa.from('products').select('id,name,kind,role,department,setup_hours,monthly_hours,active').order('name'),
      supa.from('product_aliases').select('id,source,external_name,product_id,excluded').order('external_name'),
      supa.from('pipeline_deals').select('line_items')
    ]);
    const products = productsR.data || [], aliases = aliasesR.data || [];
    const knobVal = (key, dflt) => { const k = (knobs.data || []).find(x => x.key === key); return k ? k.value : dflt; };

    document.getElementById('syncs').innerHTML = `<div class="sc-eyebrow" style="margin-top:0">Syncs</div>
      <table><tr><th>source</th><th>last run</th><th>status</th><th>detail</th></tr>
      ${(syncs.data||[]).map(s=>{

    const PLATFORM_START = '2026-01-01';

    const bands = knobVal('scope_comp_bands', [{name:'Band 1',upto_c:4500},{name:'Band 2',upto_c:7500},{name:'Band 3',upto_c:11500},{name:'Band 4',upto_c:null}]);

        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="New York DBL — flat employer cost per covered person, not a % of pay">
          NY disability insurance $/mo per person
          <input id="k-nysdi" style="width:160px;text-align:right" value="${esc(String(knobVal('ny_disability_monthly_cost', 0)))}"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px" title="PEO platform/admin fee (e.g. JustWorks) — flat per W-2 employee per month, automatic, no per-person opt-in">
          PEO admin fee $/mo per W-2 person
          <input id="k-peofee" style="width:160px;text-align:right" value="${esc(String(knobVal('peo_admin_fee_monthly', 99)))}"></label>
        <button class="primary" id="k-save-benefits" style="align-self:flex-end">Save</button>
        <span id="k-benefits-msg" class="ok" style="align-self:flex-end;font-size:12px"></span>
      </div>`;
    document.getElementById('k-save-burden').onclick = async () => {
      const rows = [
        { key:'fica_ss_rate', value:+document.getElementById('k-ficass').value||6.2,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'fica_medicare_rate', value:+document.getElementById('k-ficamed').value||1.45,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'fica_ss_wage_base', value:+document.getElementById('k-ssbase').value||176100,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'futa_rate', value:+document.getElementById('k-futarate').value||0.6,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'futa_wage_base', value:+document.getElementById('k-futabase').value||7000,
          set_by:window.__email, set_at:new Date().toISOString() }];
      const { error } = await supa.from('settings').upsert(rows, { onConflict:'key' });
      document.getElementById('k-burden-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.getElementById('k-save-benefits').onclick = async () => {
      const rows = [
        { key:'k401_match_rate', value:+document.getElementById('k-401krate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'k401_grandfather_cutoff', value:document.getElementById('k-401kgrandfather').value||'2026-01-01',
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'health_insurance_monthly_cost', value:+document.getElementById('k-himonthly').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'health_insurance_start_date', value:document.getElementById('k-histart').value||'2099-01-01',
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'workers_comp_rate', value:+document.getElementById('k-wcrate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'suta_rate', value:+document.getElementById('k-sutarate').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'suta_wage_base', value:+document.getElementById('k-sutabase').value||7000,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'hi_disability_monthly_cost', value:+document.getElementById('k-hisdi').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'ny_disability_monthly_cost', value:+document.getElementById('k-nysdi').value||0,
          set_by:window.__email, set_at:new Date().toISOString() },
        { key:'peo_admin_fee_monthly', value:+document.getElementById('k-peofee').value||0,
          set_by:window.__email, set_at:new Date().toISOString() }];
      const { error } = await supa.from('settings').upsert(rows, { onConflict:'key' });
      document.getElementById('k-benefits-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };

    // Workers' comp by state (042) — a real per-state rate table, not a
    // settings blob, so states get added one at a time as their real rate
    // is confirmed from the policy rather than requiring all 51 up front.
    const configuredStates = new Set((wcRates.data || []).map(r => r.state));
    document.getElementById('wcrates').innerHTML = `<div class="sc-eyebrow" style="margin-top:0">Workers' comp by state (042)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Exact per-person calculation — add a rate for every state you actually
        confirmed from your policy. A state left out here just uses the flat
        fallback rate above, same as before.</div>
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">state
          <select id="wc-state" style="width:220px">
            ${US_STATES.map(([code, stateName]) => `<option value="${code}">${stateName}${configuredStates.has(code)?' (configured)':''}</option>`).join('')}
          </select></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">rate (per $100 of pay, as %)
          <input id="wc-rate" style="width:140px;text-align:right"></label>
        <button class="primary" id="wc-add">Add / Update</button>
        <span id="wc-msg" class="ok" style="font-size:12px"></span>
      </div>
      ${(wcRates.data || []).length ? `<table><tr><th>state</th><th>rate</th><th>set by</th><th></th></tr>
        ${(wcRates.data || []).map(r => `<tr><td class="textleft">${esc(STATE_NAME[r.state] || r.state)}</td>
          <td>${esc(String(r.rate))}%</td><td class="muted">${esc(r.set_by||'')}</td>
          <td><button class="ghost" data-wc-del="${esc(r.state)}" style="padding:2px 8px;font-size:11px;color:var(--rust)">×</button></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">No states configured yet — everyone uses the flat fallback rate above.</div>`}`;
    document.getElementById('wc-add').onclick = async () => {
      const state = document.getElementById('wc-state').value;
      const rate = +document.getElementById('wc-rate').value;
      if (!rate && rate !== 0) { document.getElementById('wc-msg').textContent = 'enter a rate'; return; }
      const { error } = await supa.from('workers_comp_rates').upsert(
        [{ state, rate, set_by: window.__email, set_at: new Date().toISOString() }], { onConflict: 'state' });
      document.getElementById('wc-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.querySelectorAll('[data-wc-del]').forEach(btn => btn.onclick = async () => {
      const state = btn.dataset.wcDel;
      if (!confirm(`Remove the configured rate for ${STATE_NAME[state] || state}? It'll fall back to the flat rate.`)) return;
      const { error } = await supa.from('workers_comp_rates').delete().eq('state', state);
      if (error) { alert(error.message); return; }
      load();
    });

    // SUTA by state (046) — needs two numbers per state, not one: the
    // taxable wage base (real, state law, not experience-rated) AND a rate
    // (experience-rated per employer — even a "confirmed" rate here is a
    // starting point, not your real number, more so than workers' comp).
    // Rate can be blank/cleared independently of wage_base — a state can
    // have a solid wage base but no confirmed rate yet.
    const configuredSuta = new Map((sutaRates.data || []).map(r => [r.state, r]));
    document.getElementById('sutarates').innerHTML = `<div class="sc-eyebrow" style="margin-top:0">SUTA by state (046)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px;max-width:640px">
        Exact per-person calculation — wage base is real, state-set law; rate
        is experience-rated per employer, so even a filled-in number here is
        a starting point to confirm against your own state rate notices, not
        a final figure. A state left out (or with a blank rate) uses the
        flat fallback above for whichever piece is missing.</div>
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap">
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">state
          <select id="suta-state" style="width:220px">
            ${US_STATES.map(([code, stateName]) => `<option value="${code}">${stateName}${configuredSuta.has(code)?' (configured)':''}</option>`).join('')}
          </select></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">taxable wage base $/yr
          <input id="suta-wagebase" style="width:140px;text-align:right"></label>
        <label class="mono" style="display:flex;flex-direction:column;gap:4px">rate (as %, blank = use fallback)
          <input id="suta-rate" style="width:160px;text-align:right"></label>
        <button class="primary" id="suta-add">Add / Update</button>
        <span id="suta-msg" class="ok" style="font-size:12px"></span>
      </div>
      ${(sutaRates.data || []).length ? `<table><tr><th>state</th><th>wage base</th><th>rate</th><th>set by</th><th></th></tr>
        ${(sutaRates.data || []).map(r => `<tr><td class="textleft">${esc(STATE_NAME[r.state] || r.state)}</td>
          <td>$${esc(Number(r.wage_base).toLocaleString())}</td>
          <td>${r.rate == null ? '<span class="muted">not confirmed</span>' : esc(String(r.rate)) + '%'}</td>
          <td class="muted">${esc(r.set_by||'')}</td>
          <td><button class="ghost" data-suta-del="${esc(r.state)}" style="padding:2px 8px;font-size:11px;color:var(--rust)">×</button></td></tr>`).join('')}</table>`
        : `<div class="muted" style="padding:8px 0 4px">No states configured yet — everyone uses the flat fallback wage base/rate above.</div>`}`;
    document.getElementById('suta-add').onclick = async () => {
      const state = document.getElementById('suta-state').value;
      const wagebaseInput = document.getElementById('suta-wagebase').value;
      const rateInput = document.getElementById('suta-rate').value;
      const wage_base = +wagebaseInput;
      if (!wage_base) { document.getElementById('suta-msg').textContent = 'enter a wage base'; return; }
      const rate = rateInput === '' ? null : +rateInput;
      const { error } = await supa.from('suta_rates').upsert(
        [{ state, wage_base, rate, set_by: window.__email, set_at: new Date().toISOString() }], { onConflict: 'state' });
      document.getElementById('suta-msg').textContent = error ? error.message : 'saved';
      if (!error) load();
    };
    document.querySelectorAll('[data-suta-del]').forEach(btn => btn.onclick = async () => {
      const state = btn.dataset.sutaDel;
      if (!confirm(`Remove the configured SUTA data for ${STATE_NAME[state] || state}? It'll fall back to the flat wage base/rate.`)) return;
      const { error } = await supa.from('suta_rates').delete().eq('state', state);
      if (error) { alert(error.message); return; }
      load();
    });
  }

  // ---- clients <-> QuickBooks ----------------------------------------------
  // Was app/clients.html, its own item under a Setup group in the sidebar.
  // It is a setup screen and nothing else, so it lives here now. Ported whole:
  // the roster, the QuickBooks customer each client is linked to, the
  // active/inactive flag, and the "don't match" list HubSpot is held against.
  // Ids are cl- prefixed and every query is scoped to this section, so the
  // panel can't reach a control belonging to another tab.
  // Its own loader, not a limb of load() above — same shape as loadAccounts(),
  // and it reloads itself after every write.
  let clientRoster = [], qboParents = [], parentTakenBy = {}, blockedNames = new Set();
  const clientSetBy = () => window.__email || 'matching-page';
  const clSec = () => el.querySelector('#secpanel-clients');
  const clEl = sel => clSec().querySelector(sel);

  async function loadClients() {
    const [c, q, b] = await Promise.all([
      supa.from('clients').select('id,name,qbo_customer_id,active').order('name'),
      // every QuickBooks parent customer — unbounded, so it pages (habit #7).
      // The page this came from hand-rolled a sequential pager; fetchAll is
      // the wave-parallel one shell.js already exports.
      fetchAll(() => supa.from('qbo_projects').select('id,name,active')
        .is('parent_id', null).eq('hidden', false).order('name')),
      supa.from('blocked_company_names').select('name_key')
    ]);
    if (c.error || q.error || b.error) {
      clEl('#cl-list').innerHTML = `<div class="sc-panel err">${esc((c.error || q.error || b.error).message)}</div>`;
      return;
    }
    clientRoster = c.data; qboParents = q.data;
    blockedNames = new Set((b.data || []).map(r => r.name_key));
    parentTakenBy = {};
    clientRoster.forEach(cl => { if (cl.qbo_customer_id) parentTakenBy[cl.qbo_customer_id] = cl.name; });
    renderClients();
  }

  function renderClients() {
    const f = clEl('#cl-filter').value.trim().toLowerCase();
    const onlyTodo = clEl('#cl-onlytodo').checked;
    const showInactive = clEl('#cl-showinactive').checked;
    const shown = clientRoster.filter(c =>
      (showInactive || c.active !== false) &&
      (!onlyTodo || !c.qbo_customer_id) &&
      (!f || c.name.toLowerCase().includes(f)));
    const act = clientRoster.filter(c => c.active !== false);
    clEl('#cl-count').textContent =
      `${act.filter(c => !c.qbo_customer_id).length} unlinked of ${act.length} active` +
      (clientRoster.length > act.length ? ` (${clientRoster.length - act.length} inactive hidden)` : '');
    clEl('#cl-list').innerHTML = shown.map(c => {
      const linkedName = c.qbo_customer_id
        ? (qboParents.find(p => p.id === c.qbo_customer_id) || {}).name || c.qbo_customer_id
        : null;
      // Free parents first, then taken ones (visible but marked) — a wrong link is
      // fixable here, so nothing is hidden, only labelled.
      const opts = qboParents.map(p => {
        const taken = parentTakenBy[p.id] && parentTakenBy[p.id] !== c.name;
        const sel = p.id === c.qbo_customer_id;
        return `<option value="${p.id}" ${sel ? 'selected' : ''} ${taken ? 'data-taken="1"' : ''}>` +
               `${esc(p.name)}${taken ? ` — already linked to ${esc(parentTakenBy[p.id])}` : ''}</option>`;
      }).join('');
      const inactive = c.active === false;
      const dontMatch = blockedNames.has(nameKey(c.name));
      return `<div class="sc-panel" data-client-id="${esc(c.id)}" ${inactive ? 'style="opacity:.6"' : ''}>
        <div class="row">
          <div class="grow">
            <div class="name">${esc(c.name)}${inactive ? ' <span class="pill">inactive</span>' : ''}${dontMatch ? ' <span class="pill bad">don’t match</span>' : ''}</div>
            <div class="hint">${linkedName ? 'linked to ' + esc(linkedName) : 'not linked to QuickBooks'}${dontMatch ? ' — HubSpot deals for this name are held at the door' : ''}</div>
          </div>
          <span class="pill ${linkedName ? 'good' : 'warn'}">${linkedName ? 'linked' : 'needs link'}</span>
          <div class="grow">
            <select class="pick">
              <option value="">${c.qbo_customer_id ? '— unchanged —' : '— choose QuickBooks customer —'}</option>${opts}
            </select>
          </div>
          <button class="save primary" disabled>Save</button>
          ${linkedName ? '<button class="unlink">Unlink</button>' : ''}
          <button class="toggleactive ${inactive ? '' : 'danger'}">${inactive ? 'Reactivate' : 'Deactivate'}</button>
          <button class="toggleblock ${dontMatch ? '' : 'danger'}" title="${dontMatch ? 'let HubSpot match this company name to a client again' : 'never let a HubSpot deal auto-create or attach to a client for this company name again'}">${dontMatch ? 'Allow matching' : "Don’t match"}</button>
        </div>
        <div class="hint msg"></div>
      </div>`;
    }).join('') || '<div class="sc-panel muted">Nothing to show.</div>';

    clSec().querySelectorAll('.sc-panel[data-client-id]').forEach(card => {
      const pick = card.querySelector('.pick');
      const save = card.querySelector('.save');
      const msg  = card.querySelector('.msg');
      pick.onchange = () => { save.disabled = !pick.value; };
      save.onclick = async () => {
        save.disabled = true;
        const chosen = pick.selectedOptions[0];
        if (chosen.dataset.taken &&
            !confirm(`${chosen.textContent.trim()}\n\nThis QuickBooks customer is already linked to another client. Move the link here?`)) {
          save.disabled = false; return;
        }
        // Moving a link: clear it from the previous holder first (unique column).
        if (chosen.dataset.taken) {
          const prev = clientRoster.find(x => x.qbo_customer_id === pick.value);
          if (prev) {
            const { error } = await supa.from('clients')
              .update({ qbo_customer_id: null, set_by: clientSetBy(), set_at: new Date().toISOString() })
              .eq('id', prev.id);
            if (error) { msg.textContent = error.message; msg.className = 'hint err'; return; }
          }
        }
        const { error } = await supa.from('clients')
          .update({ qbo_customer_id: pick.value, set_by: clientSetBy(), set_at: new Date().toISOString() })
          .eq('id', card.dataset.clientId);
        msg.textContent = error ? error.message : 'saved';
        msg.className = error ? 'hint err' : 'hint ok';
        if (!error) loadClients();
      };
      const unlink = card.querySelector('.unlink');
      if (unlink) unlink.onclick = async () => {
        const { error } = await supa.from('clients')
          .update({ qbo_customer_id: null, set_by: clientSetBy(), set_at: new Date().toISOString() })
          .eq('id', card.dataset.clientId);
        if (!error) loadClients();
      };
      card.querySelector('.toggleactive').onclick = async () => {
        const c = clientRoster.find(x => x.id === card.dataset.clientId);
        const willActivate = c.active === false;
        if (!willActivate && !confirm(`Deactivate "${c.name}"?\n\nIt disappears from Forecast and from this list by default (reversible any time from "show inactive"). Its deals and history are untouched.`)) return;
        const { error } = await supa.from('clients')
          .update({ active: willActivate, set_by: clientSetBy(), set_at: new Date().toISOString() })
          .eq('id', card.dataset.clientId);
        if (!error) loadClients();
      };
      card.querySelector('.toggleblock').onclick = async () => {
        const c = clientRoster.find(x => x.id === card.dataset.clientId);
        const key = nameKey(c.name);
        const isBlocked = blockedNames.has(key);
        if (isBlocked) {
          const { error } = await supa.from('blocked_company_names').delete().eq('name_key', key);
          if (!error) loadClients();
          return;
        }
        if (!confirm(`Don't match "${c.name}"?\n\nAny HubSpot deal whose company matches this name will be held at the door on every future sync — never creating or attaching to any client, this one included. Fix the mismatch in HubSpot, or come back here to allow matching again.`)) return;
        const { error } = await supa.from('blocked_company_names')
          .upsert({ name_key: key, name: c.name, set_by: clientSetBy(), set_at: new Date().toISOString() });
        if (!error) loadClients();
      };
    });
  }

  clEl('#cl-filter').oninput = renderClients;
  clEl('#cl-onlytodo').onchange = renderClients;
  clEl('#cl-showinactive').onchange = renderClients;
  clEl('#cl-refresh').onclick = loadClients;

  showTab(tab);
  await Promise.all([load(), loadAccounts(), loadClients()]);
});
</script></body></html>
