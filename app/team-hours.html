<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Team Hours</title><link rel="stylesheet" href="./assets/style.css?v=7b4abfa">
<style>
/* Same whole-row-clickable focus ring forecast.html (.clientrow/.deallist/
   .projrow) and sales.html (.crow/.drow.hasitems) already give this exact
   role="button" tr pattern — team-hours.html was missing its own copy. */
tr.namerow:focus-visible { outline:none; box-shadow:inset 0 0 0 2px var(--brand-2), inset 0 0 0 4px var(--mint); }

/* Quick-range preset pill group — same .rp/.seg pattern index.html/sales.html
   already use for their own range/span toggles, copied local here rather
   than promoted to style.css for one control. border-radius:0 on the
   grouped .seg is load-bearing: without it each button keeps its own
   corner radius under the shared group border and the pill looks notched
   instead of one continuous shape. */
.rp { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper-raised); }
.rp .seg { font-family:var(--font-mono); font-size:10px; padding:0 11px; height:34px;
  display:inline-flex; align-items:center; border:none; border-left:1px solid var(--line);
  border-radius:0; background:var(--paper-raised); cursor:pointer; color:var(--slate); }
.rp .seg:first-child { border-left:none; }
.rp .seg.on { background:var(--brand); color:#fff; }
.rp .seg:hover:not(.on) { color:var(--ink); }

/* Range/ribbon itself stays crisp and clickable while a range change is in
   flight (see syncRangeControls) — only the data underneath it dims, so the
   button you just clicked visibly responds immediately instead of waiting
   on the round trip to feel like anything happened. */
#panel.is-loading .sc-panel, #panel.is-loading .summary-strip { opacity:.55; pointer-events:none; transition:opacity .12s ease; }
</style>
</head><body>
<script type="module">
import { boot, esc, wireSearch, fetchAll } from './assets/shell.js?v=7b4abfa';

// Read-only by design: this page is for GETTING information, not providing
// it. Salary, capacity, department, and start/end dates are all managed on
// the Team page (Setup) instead.
//
// Per-deal detail (which project a person's hours went to) lives on Project
// Hours, not here — same reasoning as Client Profitability vs. Project
// Hours: each page answers one question, not one drilling into the other.
//
// Five real numbers per person, three of them bars:
//   capacity        — weekly_capacity x weeks in range (comp_periods), plain.
//   composition     — client + internal + time-off hours, ALL against
//                      capacity: "what filled their plate, and how full is it."
//   pacing          — assigned hours against capacity: "how much of their
//                      capacity is even planned" — independent of what's
//                      actually been logged. assignments has no entry
//                      mechanism yet, so this reads 0h/not entered until it
//                      does; the column stays on the page so it's ready.
//   plan vs. logged — logged CLIENT hours against ASSIGNED client hours
//                      specifically: are they tracking to their own plan.
//                      Undefined (not just zero) while assigned is 0 — shown
//                      as an explicit "not assigned yet" state, not a 0%.
//   profit          — bottom-up: a deal's revenue splits across whoever
//                      logged hours on it, proportional to hours, netted
//                      against their own resolved cost (comp_periods). Same
//                      method as Client Profitability/Project Hours, joined
//                      against rev_proj_page()'s rev_proj (051, a literal
//                      copy of forecast_page's own rev_proj) so no page ever
//                      disagrees about what counts as revenue.
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };
// First month of the calendar quarter n quarters away from m's own quarter
// (n=0 is m's own quarter, n=-1 is the quarter before it, etc).
const quarterStart = (m, n = 0) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  const qFirst = Math.floor((mm - 1) / 3) * 3; // 0, 3, 6, 9
  return iso(new Date(Date.UTC(y, qFirst + n * 3, 1))); };
// Count of Monday-Friday calendar days between two ISO dates, inclusive —
// the actual number of business days in the range, not an approximation
// via weeks-in-range (a 30-day month isn't literally "4.29 work weeks,"
// it's however many Mon-Fris actually land in it).
const businessDays = (fromISO, toISO) => {
  let count = 0;
  for (const d = new Date(fromISO + 'T00:00:00Z'), end = new Date(toISO + 'T00:00:00Z');
       d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const day = d.getUTCDay();
    if (day !== 0 && day !== 6) count++;
  }
  return count;
};

// Stacks segments left-to-right, each capped so the running total never
// exceeds 100% of the track — a real over-capacity condition is reported as
// text (the exact overage), not an impossible >100%-wide bar.
function stackSegments(cap, parts) {
  if (cap <= 0) return { html: '', overBy: 0 };
  let used = 0, html = '';
  parts.forEach(([cls, hours]) => {
    const w = Math.min(Math.max(hours / cap * 100, 0), Math.max(100 - used, 0));
    if (w > 0.05) { used += w; html += `<div class="seg ${cls}" style="width:${w}%"></div>`; }
  });
  const total = parts.reduce((s, [, h]) => s + h, 0);
  return { html, overBy: total > cap ? total - cap : 0 };
}

// Utilization bar: internal + PTO reserve their own room first, THEN client
// work gets whatever's left of capacity — so a person loaded with internal
// meetings/time off goes red on CLIENT hours sooner than a raw total-vs-cap
// comparison would show, since their non-client time already ate into the
// budget. Internal/PTO always keep their own color, win or lose; only the
// client segment ever turns red. Scaled to whichever is bigger, capacity or
// actual total hours worked, so the bar always fits its track (no empty
// gray track once someone's at or past capacity) instead of clipping an
// overage into an invisible sliver. A missing comp period no longer shows
// up here at all — hours_page() (038) defaults an unset weekly_capacity to
// 40 server-side, so this only ever sees a real number; an explicit 0 (a
// human actually entered zero hours/week on a comp period) still reads as
// every client hour being red, same as genuine overwork.
function utilizationBar(cap, internalHours, ptoHours, clientHours) {
  const total = internalHours + ptoHours + clientHours;
  const scale = Math.max(cap, total);
  if (scale <= 0) return { html: '', overBy: 0 };
  const available = Math.max(cap - internalHours - ptoHours, 0);
  const greenClient = Math.min(clientHours, available);
  const redClient = Math.max(clientHours - available, 0);
  const seg = (cls, hours) => hours > 0.05 ? `<div class="seg ${cls}" style="width:${hours / scale * 100}%"></div>` : '';
  const html = seg('seg-internal', internalHours) + seg('seg-pto', ptoHours)
    + seg('seg-client', greenClient) + seg('seg-over', redClient);
  return { html, overBy: Math.max(total - cap, 0) };
}

// Same rescale-to-fit approach as utilizationBar, for a single planned-vs-
// logged comparison: logged hours up to the planned amount are green, any
// excess is red. No plan set (planned = 0) isn't a blank bar — every logged
// hour is, by definition, hours beyond a zero plan, so the whole bar reads
// red until a real plan exists.
function planBar(planned, logged) {
  const scale = Math.max(planned, logged);
  if (scale <= 0) return { html: '', overBy: 0 };
  const green = Math.min(logged, planned);
  const over = Math.max(logged - planned, 0);
  const seg = (cls, hours) => hours > 0.05 ? `<div class="seg ${cls}" style="width:${hours / scale * 100}%"></div>` : '';
  return { html: seg('seg-good', green) + seg('seg-over', over), overBy: over };
}

// One comparable number per sortable column. "plan" sorts by the plan-vs-
// logged delta (negative = under plan, positive = over) since that's the
// actual comparison the column shows, not either side of it alone.
const SORT_ACCESSORS = {
  name: r => r.s.name.toLowerCase(),
  cap: r => r.capPct,
  profit: r => r.profit,
  util: r => r.totalLoggedHours,
  pacing: r => r.assignedHours,
  plan: r => r.clientHours - r.assignedHours,
};

boot('teamhours', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  // Quick-range presets, keyed by the label shown on each button. Computed
  // once per load (today doesn't change mid-session) and reused both to
  // render the buttons and to tell which one (if any) matches the current
  // rangeFrom/rangeTo, so the active button always reflects real state
  // instead of just "whichever was clicked last."
  const PRESETS = {
    'Last Month': [shiftM(thisMonth, -1), shiftM(thisMonth, -1)],
    'This Month': [thisMonth, thisMonth],
    'Next Month': [shiftM(thisMonth, 1), shiftM(thisMonth, 1)],
    'Last Quarter': [quarterStart(thisMonth, -1), shiftM(quarterStart(thisMonth, -1), 2)],
    'This Quarter': [quarterStart(thisMonth, 0), shiftM(quarterStart(thisMonth, 0), 2)],
  };
  let rangeFrom = thisMonth, rangeTo = thisMonth;
  let deptFilter = '', query = '', showInactive = false;
  // Default matches the table's old fixed sort (busiest people first);
  // every other column becomes reachable by clicking its header.
  let tableSort = { key: 'util', dir: -1 };
  const openStaff = new Set(); // staff ids currently expanded to show their client/project breakout

  el.innerHTML = `<div id="panel">loading…</div>`;
  // Preset/range clicks fire a new load() while a prior one may still be
  // in flight; network jitter means responses can land out of order. A
  // sequence token lets a stale response's render() be discarded instead
  // of clobbering a newer click's result — without it a fast click after a
  // slow one could silently revert to the earlier range, reading as the
  // click "not responding."
  let loadSeq = 0;
  // deals/clients don't depend on rangeFrom/rangeTo at all, but every
  // preset click used to re-fetch both anyway — two full-table round trips
  // wasted on every single click. Fetched once, alongside the first load's
  // hp/fp calls (still one Promise.all wave), then reused for the life of
  // the page.
  let deals = [], clients = [], staticLoaded = false;
  // hours_page() still does real per-staff compute even after the backend
  // work (db/057/061/062) — resolving everyone's burdened hourly rate isn't
  // free, and people commonly flip back and forth between the same couple
  // of ranges while reviewing (Last Month <-> This Month, etc). Read-only
  // page, so the exact same range always means the exact same answer for
  // the rest of this visit — cache each range's result and skip the round
  // trip entirely the second time it's viewed. Session-only: a fresh page
  // load starts with an empty cache, same as deals/clients above.
  const rangeCache = new Map();

  // Hovering this page's nav link elsewhere in the app may have already
  // kicked off this exact range's fetch in the background (shell.js'
  // prefetchTeamHours) — sessionStorage is how its result survives the
  // full page navigation a plain <a href> does (a JS variable would not).
  // Ignored past 10 minutes: a hover from a much earlier visit shouldn't
  // hand back data that stale.
  const PREFETCH_MAX_AGE_MS = 10 * 60 * 1000;
  function takePrefetched(cacheKey) {
    const key = `th-prefetch:${cacheKey}`;
    try {
      const raw = sessionStorage.getItem(key);
      if (!raw) return null;
      sessionStorage.removeItem(key);
      const { H, RP, at } = JSON.parse(raw);
      return (Date.now() - at) <= PREFETCH_MAX_AGE_MS ? { H, RP } : null;
    } catch { return null; }
  }

  async function load() {
    const seq = ++loadSeq;
    const cacheKey = `${rangeFrom}|${rangeTo}`;
    const cached = rangeCache.get(cacheKey) || takePrefetched(cacheKey);
    if (cached) { rangeCache.set(cacheKey, cached); render(cached.H, cached.RP, deals, clients); return; }
    const panel = el.querySelector('#panel');
    if (panel) panel.classList.add('is-loading');
    const calls = [
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      // Team Hours only needs revenue-per-project (for the profit column),
      // not the whole Forecast page — forecast_page() also computes
      // plan_month/plan_deal/cost_month/cogs_proj/accounts/keep_projects and
      // three cost_runrate_monthly() scans this page never shows, on every
      // single click. rev_proj_page (db/051) is a literal copy of just the
      // rev_proj piece.
      supa.rpc('rev_proj_page', { p_from: rangeFrom, p_to: rangeTo }),
    ];
    if (!staticLoaded) calls.push(
      fetchAll(() => supa.from('deals').select('id,name,client_id,qbo_project_id')),
      supa.from('clients').select('id,name')
    );
    const results = await Promise.all(calls);
    if (seq !== loadSeq) return;
    const [hp, rp, dl, cl] = results;
    for (const r of results) if (r.error) {
      el.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    if (!staticLoaded) { deals = dl.data || []; clients = cl.data || []; staticLoaded = true; }
    const H = hp.data || {}, RP = rp.data || [];
    rangeCache.set(cacheKey, { H, RP });
    render(H, RP, deals, clients);
  }

  function render(H, revProj, deals, clients) {
    const dealsById = {}; deals.forEach(d => dealsById[d.id] = d);
    const clientsById = {}; clients.forEach(c => clientsById[c.id] = c);
    const compByStaff = {}; (H.comp_current || []).forEach(c => compByStaff[c.staff_id] = c);
    const hoursByStaff = {}; // staff_id -> { hours, cost } — actual, client+internal only
    (H.staff_hours_month || []).forEach(r => {
      const a = hoursByStaff[r.staff_id] = hoursByStaff[r.staff_id] || { hours: 0, cost: 0 };
      a.hours += +r.hours; a.cost += +r.cost;
    });
    const dealHoursByStaff = {}; // staff_id -> [{deal_id, hours, cost}]
    (H.staff_hours_deal || []).forEach(r => {
      (dealHoursByStaff[r.staff_id] = dealHoursByStaff[r.staff_id] || []).push(r);
    });
    const plannedByStaff = {}; (H.staff_planned || []).forEach(r => plannedByStaff[r.staff_id] = +r.planned_hours);
    const plannedByStaffDeal = {}; // "staffId|dealId" -> planned hours (db/035)
    (H.staff_deal_planned || []).forEach(r => plannedByStaffDeal[`${r.staff_id}|${r.deal_id}`] = +r.planned_hours);

    const revByProj = {}; (revProj || []).forEach(r => revByProj[r.qbo_project_id] = r.total);
    const revPerHourByDeal = {};
    (H.deal_labor || []).forEach(r => {
      const deal = dealsById[r.deal_id]; if (!deal || !deal.qbo_project_id) return;
      const rev = revByProj[deal.qbo_project_id] || 0;
      if (rev > 0 && +r.hours > 0) revPerHourByDeal[r.deal_id] = rev / +r.hours;
    });

    const rangeToEnd = endOfMonth(rangeTo);
    // Whether this person's own employment window (start_date/end_date, set
    // on Team) overlaps the viewing range at all — a start date after the
    // range, or an end date before it, means they weren't on staff for any
    // of these months and shouldn't appear in this period's table, not just
    // show a zeroed-out capacity row. Either date missing means unbounded on
    // that side, same as bizDaysFor below.
    const activeInRange = s => (!s.start_date || s.start_date <= rangeToEnd)
      && (!s.end_date || s.end_date >= rangeFrom);
    // Capacity only counts business days someone was actually employed —
    // clipped to their own start_date/end_date, not just the viewing range.
    // Either date missing means unbounded on that side, so someone with
    // neither counts every day in the range, same as before this existed.
    // No overlap at all (viewing a month before they started, or after they
    // left) is real zero capacity, not a data gap.
    const bizDaysFor = s => {
      const from = s.start_date && s.start_date > rangeFrom ? s.start_date : rangeFrom;
      const to = s.end_date && s.end_date < rangeToEnd ? s.end_date : rangeToEnd;
      return from <= to ? businessDays(from, to) : 0;
    };

    // time_off.hours (db/032) is a RANGE total, not per-day — prorated by
    // day-overlap when the query window only partially covers a range.
    const ptoByStaff = {};
    (H.time_off || []).forEach(o => {
      const s0 = new Date(o.starts_on < rangeFrom ? rangeFrom : o.starts_on);
      const e0 = new Date(o.ends_on > rangeToEnd ? rangeToEnd : o.ends_on);
      const overlapDays = (e0 - s0) / 86400000 + 1;
      if (overlapDays <= 0) return;
      const totalDays = (new Date(o.ends_on) - new Date(o.starts_on)) / 86400000 + 1;
      ptoByStaff[o.staff_id] = (ptoByStaff[o.staff_id] || 0) + (+o.hours * (overlapDays / totalDays));
    });

    const departments = [...new Set((H.staff || []).map(s => s.department).filter(Boolean))].sort();
    const q = query.trim().toLowerCase();

    let rows = (H.staff || []).map(s => {
      const comp = compByStaff[s.id];
      const hc = hoursByStaff[s.id] || { hours: 0, cost: 0 };
      // comp_current (038) is one row per staff member always, weekly_capacity
      // defaulted to 40 server-side when nobody has a comp period entered yet.
      // Capacity is business-day-weighted: a 40h/wk person's own daily rate
      // (40/5 = 8h) times however many Mon-Fris are actually in the range —
      // not a flat weeks-in-range multiplier, so a 30-day month with 22
      // business days differs from a 31-day month with 21, exactly as the
      // real work calendar does.
      const cap = comp.weekly_capacity / 5 * bizDaysFor(s);
      const deals2 = dealHoursByStaff[s.id] || [];
      const clientHours = deals2.reduce((s2, d) => s2 + +d.hours, 0);
      const internalHours = Math.max(hc.hours - clientHours, 0);
      const ptoHours = ptoByStaff[s.id] || 0;
      // The capacity column's headline figure: everything that counts against
      // capacity — client work, internal work, AND time off — not just hours
      // actually worked. Same total the utilization bar already scales by.
      const totalLoggedHours = clientHours + internalHours + ptoHours;
      const capPct = cap > 0 ? totalLoggedHours / cap * 100 : 0;
      // Four bands: under 75% (orange, flagged) reads as slack worth
      // reassigning; 75-90% is the unremarkable middle, plain ink; 90-100%
      // (gold — a confirmed 3rd exception to the One Gold Rule, see
      // DESIGN.md) is "closing in on full" without being a problem yet;
      // over 100% (rust, flagged) is over capacity, same threshold the
      // utilization bar's own red segment already uses.
      const capStatus = capPct > 100 ? 'over' : capPct >= 90 ? 'high' : capPct >= 75 ? 'normal' : 'under';
      const assignedHours = plannedByStaff[s.id] || 0;
      let attributed = 0;
      deals2.forEach(d => { const rph = revPerHourByDeal[d.deal_id]; if (rph) attributed += +d.hours * rph; });
      const profit = attributed - hc.cost;
      // Which clients/projects this person actually logged hours against —
      // the "assigned to" breakout, revealed by expanding the row.
      const assignments = deals2.map(d => {
        const deal = dealsById[d.deal_id];
        const client = deal ? clientsById[deal.client_id] : null;
        const planned = plannedByStaffDeal[`${s.id}|${d.deal_id}`] || 0;
        return { name: deal ? deal.name : '(unknown deal)', client: client ? client.name : '(no client)', hours: +d.hours, planned };
      }).sort((a, b) => b.hours - a.hours);
      return { s, hc, cap, clientHours, internalHours, ptoHours, totalLoggedHours, capPct, capStatus, assignedHours, profit, assignments };
    });

    // Auto-hide anyone with no logged hours since the current QB Time import
    // cutoff (has_recent_hours, db/033) — a stale roster entry, not a real
    // gap in someone's schedule. Purely computed, never touches the
    // human-owned active flag; "show inactive" reveals both together.
    // activeInRange is separate and unconditional — even with "show
    // inactive" on, someone who hasn't started yet or already left as of the
    // selected range's own dates has no place in that period's table.
    // tracks_capacity (049) is unconditional too — this whole page is a
    // capacity/utilization view, and someone on the non-execution side was
    // never tied to capacity in the first place, "show inactive" or not.
    rows = rows.filter(r => (showInactive || (r.s.active && r.s.has_recent_hours))
      && activeInRange(r.s)
      && r.s.tracks_capacity
      && (!deptFilter || r.s.department === deptFilter)
      && (!q || r.s.name.toLowerCase().includes(q)));
    rows.sort((a, b) => {
      const av = SORT_ACCESSORS[tableSort.key](a), bv = SORT_ACCESSORS[tableSort.key](b);
      if (av !== bv) return (av < bv ? -1 : 1) * tableSort.dir;
      return a.s.name.localeCompare(b.s.name);
    });

    const totalHours = rows.reduce((s, r) => s + r.hc.hours, 0);
    const totalCost = rows.reduce((s, r) => s + r.hc.cost, 0);
    const totalCapacity = rows.reduce((s, r) => s + r.cap, 0);
    const overCount = rows.filter(r => r.capStatus === 'over').length;

    const sortTh = (key, label, cls = '') => {
      const active = tableSort.key === key;
      return `<th${cls ? ` class="${cls}"` : ''} data-sort="${key}" scope="col" tabindex="0" role="columnheader" aria-sort="${active ? (tableSort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${active ? `<span class="dir">${tableSort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
    };

    const panelEl = el.querySelector('#panel');
    panelEl.classList.remove('is-loading');
    panelEl.innerHTML = `
      <div class="range">
        <span class="rl">Range</span>
        <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0,7)}">
        <span class="muted">→</span>
        <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0,7)}">
        <span class="rp" role="group" aria-label="Quick range">
          ${Object.entries(PRESETS).map(([label, [f, t]]) => {
            const on = f === rangeFrom && t === rangeTo;
            return `<button type="button" class="seg${on?' on':''}" data-preset="${esc(label)}" aria-pressed="${on}">${label}</button>`;
          }).join('')}
        </span>
      </div>
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Headcount</div>
          <div class="summary-value">${rows.filter(r=>r.s.active).length}</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="summary-note">of ${fmtHours(totalCapacity)}h capacity</div></div>
        <div class="summary-cell" title="Includes employer FICA + FUTA on top of base pay (040), not just base pay itself"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalCost)}</div></div>
        <div class="summary-cell"><div class="summary-label">Over capacity</div>
          <div class="summary-value ${overCount>0?'neg':'pos'}">${overCount}</div></div>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap">
          <input id="q" placeholder="search name…" value="${esc(query)}" aria-label="Search name" style="width:180px">
          <select id="dept-filter" aria-label="Filter by department">
            <option value="">All departments</option>
            ${departments.map(d=>`<option value="${esc(d)}" ${d===deptFilter?'selected':''}>${esc(d)}</option>`).join('')}
          </select>
          <label class="mono" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate)">
            <input type="checkbox" id="show-inactive" ${showInactive?'checked':''}> show inactive
          </label>
          <span class="muted" id="count" style="font-size:11px">${rows.length} of ${(H.staff||[]).length} shown</span>
        </div>
        <div class="gridwrap">
        <table class="ledger" style="table-layout:fixed">
          <colgroup><col style="width:20%"><col style="width:11%"><col style="width:5%">
            <col style="width:22%"><col style="width:21%"><col style="width:21%"></colgroup>
          <tr>${sortTh('name', 'name')}${sortTh('cap', 'logged / cap')}${sortTh('profit', '<span title="Attributed revenue minus labor cost — cost includes employer FICA + FUTA on top of base pay (040)">profit</span>')}${sortTh('util', 'utilization', 'textleft')}${sortTh('pacing', 'pacing (assigned)', 'textleft')}${sortTh('plan', 'plan vs. logged', 'textleft')}</tr>
          ${!rows.length ? `<tr><td colspan="6" class="empty-note">No people match the current filters.</td></tr>` : rows.map(r => {
            // Utilization: client + internal + time-off, all against capacity.
            const util = utilizationBar(r.cap, r.internalHours, r.ptoHours, r.clientHours);
            // Pacing: assigned hours against capacity — a planning signal,
            // independent of what's actually been logged.
            const pacing = stackSegments(r.cap, [[r.assignedHours > r.cap ? 'seg-over' : 'seg-good', r.assignedHours]]);
            // Plan vs. logged: client hours logged against client hours
            // assigned — undefined (not zero) while nothing's assigned yet.
            const hasPlan = r.assignedHours > 0;
            const planVsLogged = hasPlan
              ? stackSegments(r.assignedHours, [[r.clientHours > r.assignedHours ? 'seg-over' : 'seg-good', r.clientHours]])
              : null;
            const open = openStaff.has(r.s.id);
            const capPill = r.capStatus === 'over'
              ? `<span class="pill bad" title="+${fmtHours(r.totalLoggedHours - r.cap)}h over capacity">Over Capacity</span>`
              : r.capStatus === 'under'
              ? `<span class="pill warn" title="${fmtHours(r.cap - r.totalLoggedHours)}h under capacity">Under Capacity</span>`
              : '';
            const capPctClass = r.capStatus === 'over' ? 'cap-flag over' : r.capStatus === 'under' ? 'cap-flag under' : r.capStatus === 'high' ? 'cap-flag high' : '';
            // One caption line per bar column, always — no conditional extra
            // line (the old "+Xh over plan" div folded into this same line,
            // just its trailing clause). Every barcell is now structurally
            // identical (one bar + one line), so centering them all the same
            // way keeps their bars level with each other in every row,
            // instead of the "+over plan" line quietly making this one
            // column's block taller than the other two.
            const utilCaption = `${fmtHours(r.clientHours)}h client · ${fmtHours(r.internalHours)}h int · ${fmtHours(r.ptoHours)}h PTO / ${fmtHours(r.cap)}h`;
            const pacingCaption = r.assignedHours > 0 ? `${fmtHours(r.assignedHours)}h assigned / ${fmtHours(r.cap)}h` : 'not assigned yet';
            const planCaption = hasPlan
              ? `${fmtHours(r.clientHours)}h logged / ${fmtHours(r.assignedHours)}h assigned${planVsLogged.overBy > 0.05 ? ` · +${fmtHours(planVsLogged.overBy)}h over` : ''}`
              : 'not assigned yet';
            const planCaptionHtml = hasPlan && planVsLogged.overBy > 0.05
              ? `${fmtHours(r.clientHours)}h logged / ${fmtHours(r.assignedHours)}h assigned · <span class="delta-note neg" style="display:inline">+${fmtHours(planVsLogged.overBy)}h over</span>`
              : esc(planCaption);
            return `<tr class="${r.profit<0?'risk-row':''} namerow" data-sid="${r.s.id}" role="button" tabindex="0" aria-expanded="${open}" style="cursor:pointer">
                <td class="textleft">
                  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                    <div style="flex:1;min-width:0">${open?'▾':'▸'} ${esc(r.s.name)}<div class="summary-note">${esc(r.s.department||'')}</div></div>
                    ${capPill}
                  </div>
                </td>
                <td class="textleft" style="white-space:nowrap" title="${fmtHours(r.totalLoggedHours)}h logged (client + internal + PTO) of ${fmtHours(r.cap)}h capacity">${fmtHours(r.totalLoggedHours)}/${fmtHours(r.cap)}h <span class="${capPctClass}">(${Math.round(r.capPct)}%)</span></td>
                <td class="${r.profit<0?'err':'pos'}">${(r.hc.hours>0||r.hc.cost>0)?fmt$0(r.profit):'<span class="muted">—</span>'}</td>
                <td class="textleft">
                  <div class="barcell">
                    <div class="mini-track split wide">${util.html}</div>
                    <div class="delta-note flat" title="${esc(utilCaption)}">${esc(utilCaption)}</div>
                  </div>
                </td>
                <td class="textleft">
                  <div class="barcell">
                    <div class="mini-track wide">${pacing.html}</div>
                    <div class="delta-note flat" title="${esc(pacingCaption)}">${esc(pacingCaption)}</div>
                  </div>
                </td>
                <td class="textleft">
                  <div class="barcell">
                    <div class="mini-track wide">${hasPlan ? planVsLogged.html : ''}</div>
                    <div class="delta-note flat" title="${esc(planCaption)}">${planCaptionHtml}</div>
                  </div>
                </td>
              </tr>
              ${open ? `<tr class="expand-row"><td colspan="6">
                  <div class="expand-grid">
                    <div>
                      <div class="sc-eyebrow" style="margin-bottom:10px">Assigned to — plan vs. logged</div>
                      ${!r.assignments.length ? `<div class="muted" style="font-size:11px">No logged hours against a client project in this range.</div>` : r.assignments.map(a => {
                        const bar = planBar(a.planned, a.hours);
                        return `<div class="assign-line">
                            <div class="assign-label">${esc(a.client)} <span class="muted">— ${esc(a.name)}</span></div>
                            <div class="mini-track wide">${bar.html}</div>
                            <div class="delta-note flat">${a.planned > 0
                              ? `${fmtHours(a.hours)}h logged / ${fmtHours(a.planned)}h planned${bar.overBy > 0.05 ? ` · <span class="delta-note neg" style="display:inline">+${fmtHours(bar.overBy)}h over</span>` : ''}`
                              : `${fmtHours(a.hours)}h logged · not assigned yet`}</div>
                          </div>`;
                      }).join('')}
                    </div>
                    <div>
                      <div class="sc-eyebrow" style="margin-bottom:10px">Time allocation</div>
                      <div class="alloc-stat"><i class="alloc-dot" style="background:var(--brand-2)"></i>client<span>${fmtHours(r.clientHours)}h</span></div>
                      <div class="alloc-stat"><i class="alloc-dot" style="background:var(--brand)"></i>internal<span>${fmtHours(r.internalHours)}h</span></div>
                      <div class="alloc-stat"><i class="alloc-dot" style="background:var(--gold)"></i>time off (PTO)<span>${fmtHours(r.ptoHours)}h</span></div>
                    </div>
                  </div>
                </td></tr>` : ''}`;
          }).join('')}
        </table>
        </div>
      </div>`;

    // Updates just the ribbon/range controls in place — no data, no re-render
    // of the table — so a click's own button lights up (or a typed date
    // un-lights every preset) the instant it happens, not whenever the
    // round trip that follows happens to land. Purely cosmetic: render()
    // recomputes the same "on" state from scratch anyway once real data
    // arrives, so a click and its eventual data can never disagree.
    function syncRangeControls() {
      const panel = el.querySelector('#panel'); if (!panel) return;
      const fromEl = panel.querySelector('#r-from'), toEl = panel.querySelector('#r-to');
      if (fromEl) fromEl.value = rangeFrom.slice(0, 7);
      if (toEl) toEl.value = rangeTo.slice(0, 7);
      panel.querySelectorAll('[data-preset]').forEach(btn => {
        const [f, t] = PRESETS[btn.dataset.preset];
        const on = f === rangeFrom && t === rangeTo;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', String(on));
      });
    }
    el.querySelector('#r-from').onchange = e => { rangeFrom = monthOf(e.target.value); syncRangeControls(); load(); };
    el.querySelector('#r-to').onchange = e => { rangeTo = monthOf(e.target.value); syncRangeControls(); load(); };
    el.querySelectorAll('[data-preset]').forEach(btn => btn.onclick = () => {
      [rangeFrom, rangeTo] = PRESETS[btn.dataset.preset];
      syncRangeControls();
      load();
    });
    el.querySelector('#dept-filter').onchange = e => { deptFilter = e.target.value; render(H, revProj, deals, clients); };
    wireSearch(el, '#q', v => { query = v; render(H, revProj, deals, clients); });
    el.querySelector('#show-inactive').onchange = e => { showInactive = e.target.checked; render(H, revProj, deals, clients); };
    el.querySelectorAll('th[data-sort]').forEach(th => {
      const activate = () => {
        const k = th.dataset.sort;
        tableSort = { key: k, dir: tableSort.key === k ? -tableSort.dir : 1 };
        render(H, revProj, deals, clients);
      };
      th.onclick = activate;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
    });
    el.querySelectorAll('tr.namerow').forEach(tr => {
      const toggle = () => {
        const sid = tr.dataset.sid;
        openStaff.has(sid) ? openStaff.delete(sid) : openStaff.add(sid);
        render(H, revProj, deals, clients);
      };
      tr.onclick = toggle;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    });
  }

  await load();
});
</script></body></html>
