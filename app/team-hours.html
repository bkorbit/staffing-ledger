<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMG — Team Hours</title><link rel="stylesheet" href="./assets/style.css?v=3316d1b"></head><body>
<script type="module">
import { boot, esc } from './assets/shell.js?v=3316d1b';

// Read-only by design: this page is for GETTING information, not providing
// it. Salary, capacity, department, and start/end dates are all managed on
// the Team page (Setup) instead.
//
// Per-deal detail (which project a person's hours went to) lives on Project
// Hours, not here — same reasoning as Client Profitability vs. Project
// Hours: each page answers one question, not one drilling into the other.
//
// Five real numbers per person, three of them bars:
//   capacity        — weekly_capacity x weeks in range (comp_periods), plain.
//   composition     — client + internal + time-off hours, ALL against
//                      capacity: "what filled their plate, and how full is it."
//   pacing          — assigned hours against capacity: "how much of their
//                      capacity is even planned" — independent of what's
//                      actually been logged. assignments has no entry
//                      mechanism yet, so this reads 0h/not entered until it
//                      does; the column stays on the page so it's ready.
//   plan vs. logged — logged CLIENT hours against ASSIGNED client hours
//                      specifically: are they tracking to their own plan.
//                      Undefined (not just zero) while assigned is 0 — shown
//                      as an explicit "not assigned yet" state, not a 0%.
//   profit          — bottom-up: a deal's revenue splits across whoever
//                      logged hours on it, proportional to hours, netted
//                      against their own resolved cost (comp_periods). Same
//                      method as Client Profitability/Project Hours, joined
//                      against forecast_page()'s own rev_proj so no page
//                      ever disagrees about what counts as revenue.
const fmtHours = h => (+h || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt$0 = c => (c < 0 ? '-$' : '$') + Math.abs(Math.round((c || 0) / 100)).toLocaleString();

const iso = d => d.toISOString().slice(0, 10);
const monthOf = s => s.slice(0, 7) + '-01';
const shiftM = (m, n) => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm - 1 + n, 1))); };
const endOfMonth = m => { const [y, mm] = m.slice(0, 7).split('-').map(Number);
  return iso(new Date(Date.UTC(y, mm, 0))); };

// Stacks segments left-to-right, each capped so the running total never
// exceeds 100% of the track — a real over-capacity condition is reported as
// text (the exact overage), not an impossible >100%-wide bar.
function stackSegments(cap, parts) {
  if (cap <= 0) return { html: '', overBy: 0 };
  let used = 0, html = '';
  parts.forEach(([cls, hours]) => {
    const w = Math.min(Math.max(hours / cap * 100, 0), Math.max(100 - used, 0));
    if (w > 0.05) { used += w; html += `<div class="seg ${cls}" style="width:${w}%"></div>`; }
  });
  const total = parts.reduce((s, [, h]) => s + h, 0);
  return { html, overBy: total > cap ? total - cap : 0 };
}

boot('teamhours', async (supa, el) => {
  const thisMonth = monthOf(iso(new Date()));
  let rangeFrom = shiftM(thisMonth, -2), rangeTo = thisMonth;
  let deptFilter = '', query = '', showInactive = false;

  el.innerHTML = `<div class="sc-panel" id="panel">loading…</div>`;

  async function load() {
    const [hp, fp, dl] = await Promise.all([
      supa.rpc('hours_page', { p_from: rangeFrom, p_to: endOfMonth(rangeTo) }),
      supa.rpc('forecast_page', { p_from: rangeFrom, p_to: rangeTo }),
      supa.from('deals').select('id,qbo_project_id')
    ]);
    for (const r of [hp, fp, dl]) if (r.error) {
      el.innerHTML = `<div class="sc-panel err">${esc(r.error.message)}</div>`; return;
    }
    render(hp.data || {}, fp.data || {}, dl.data || []);
  }

  function render(H, P, deals) {
    const dealsById = {}; deals.forEach(d => dealsById[d.id] = d);
    const compByStaff = {}; (H.comp_current || []).forEach(c => compByStaff[c.staff_id] = c);
    const hoursByStaff = {}; // staff_id -> { hours, cost } — actual, client+internal only
    (H.staff_hours_month || []).forEach(r => {
      const a = hoursByStaff[r.staff_id] = hoursByStaff[r.staff_id] || { hours: 0, cost: 0 };
      a.hours += +r.hours; a.cost += +r.cost;
    });
    const dealHoursByStaff = {}; // staff_id -> [{deal_id, hours, cost}]
    (H.staff_hours_deal || []).forEach(r => {
      (dealHoursByStaff[r.staff_id] = dealHoursByStaff[r.staff_id] || []).push(r);
    });
    const plannedByStaff = {}; (H.staff_planned || []).forEach(r => plannedByStaff[r.staff_id] = +r.planned_hours);

    const revByProj = {}; (P.rev_proj || []).forEach(r => revByProj[r.qbo_project_id] = r.total);
    const revPerHourByDeal = {};
    (H.deal_labor || []).forEach(r => {
      const deal = dealsById[r.deal_id]; if (!deal || !deal.qbo_project_id) return;
      const rev = revByProj[deal.qbo_project_id] || 0;
      if (rev > 0 && +r.hours > 0) revPerHourByDeal[r.deal_id] = rev / +r.hours;
    });

    const rangeToEnd = endOfMonth(rangeTo);
    const daysInRange = (new Date(rangeToEnd) - new Date(rangeFrom)) / 86400000 + 1;
    const weeksInRange = daysInRange / 7;

    // time_off.hours (db/032) is a RANGE total, not per-day — prorated by
    // day-overlap when the query window only partially covers a range.
    const ptoByStaff = {};
    (H.time_off || []).forEach(o => {
      const s0 = new Date(o.starts_on < rangeFrom ? rangeFrom : o.starts_on);
      const e0 = new Date(o.ends_on > rangeToEnd ? rangeToEnd : o.ends_on);
      const overlapDays = (e0 - s0) / 86400000 + 1;
      if (overlapDays <= 0) return;
      const totalDays = (new Date(o.ends_on) - new Date(o.starts_on)) / 86400000 + 1;
      ptoByStaff[o.staff_id] = (ptoByStaff[o.staff_id] || 0) + (+o.hours * (overlapDays / totalDays));
    });

    const departments = [...new Set((H.staff || []).map(s => s.department).filter(Boolean))].sort();
    const q = query.trim().toLowerCase();

    let rows = (H.staff || []).map(s => {
      const comp = compByStaff[s.id];
      const hc = hoursByStaff[s.id] || { hours: 0, cost: 0 };
      const cap = comp ? comp.weekly_capacity * weeksInRange : 0;
      const deals2 = dealHoursByStaff[s.id] || [];
      const clientHours = deals2.reduce((s2, d) => s2 + +d.hours, 0);
      const internalHours = Math.max(hc.hours - clientHours, 0);
      const ptoHours = ptoByStaff[s.id] || 0;
      const assignedHours = plannedByStaff[s.id] || 0;
      let attributed = 0;
      deals2.forEach(d => { const rph = revPerHourByDeal[d.deal_id]; if (rph) attributed += +d.hours * rph; });
      const profit = attributed - hc.cost;
      return { s, hc, cap, clientHours, internalHours, ptoHours, assignedHours, profit };
    });

    // Auto-hide anyone with no logged hours since the current QB Time import
    // cutoff (has_recent_hours, db/033) — a stale roster entry, not a real
    // gap in someone's schedule. Purely computed, never touches the
    // human-owned active flag; "show inactive" reveals both together.
    rows = rows.filter(r => (showInactive || (r.s.active && r.s.has_recent_hours))
      && (!deptFilter || r.s.department === deptFilter)
      && (!q || r.s.name.toLowerCase().includes(q)));
    rows.sort((a, b) => b.hc.hours - a.hc.hours);

    const totalHours = rows.reduce((s, r) => s + r.hc.hours, 0);
    const totalCost = rows.reduce((s, r) => s + r.hc.cost, 0);
    const totalCapacity = rows.reduce((s, r) => s + r.cap, 0);
    const overCount = rows.filter(r => r.cap > 0 && (r.hc.hours + r.ptoHours) > r.cap).length;

    el.querySelector('#panel').innerHTML = `
      <h1 style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--brand);margin:0 0 14px;letter-spacing:-.01em">Team Hours</h1>
      <div class="range">
        <span class="rl">Range</span>
        <input type="month" id="r-from" aria-label="Range from" value="${rangeFrom.slice(0,7)}">
        <span class="muted">→</span>
        <input type="month" id="r-to" aria-label="Range to" value="${rangeTo.slice(0,7)}">
      </div>
      <div class="summary-strip">
        <div class="summary-cell"><div class="summary-label">Headcount</div>
          <div class="summary-value">${rows.filter(r=>r.s.active).length}</div></div>
        <div class="summary-cell"><div class="summary-label">Hours logged</div>
          <div class="summary-value">${fmtHours(totalHours)}</div>
          <div class="summary-note">of ${fmtHours(totalCapacity)}h capacity</div></div>
        <div class="summary-cell"><div class="summary-label">Labor cost</div>
          <div class="summary-value">${fmt$0(totalCost)}</div></div>
        <div class="summary-cell"><div class="summary-label">Over capacity</div>
          <div class="summary-value ${overCount>0?'neg':'pos'}">${overCount}</div></div>
      </div>
      <div class="sc-panel" style="padding:0">
        <div class="tbltools" style="padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap">
          <input id="q" placeholder="search name…" value="${esc(query)}" aria-label="Search name" style="width:180px">
          <select id="dept-filter" aria-label="Filter by department">
            <option value="">All departments</option>
            ${departments.map(d=>`<option value="${esc(d)}" ${d===deptFilter?'selected':''}>${esc(d)}</option>`).join('')}
          </select>
          <label class="mono" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate)">
            <input type="checkbox" id="show-inactive" ${showInactive?'checked':''}> show inactive
          </label>
        </div>
        <table class="ledger"><tr><th>name</th><th>capacity</th><th class="textleft">utilization</th><th class="textleft">pacing (assigned)</th><th class="textleft">plan vs. logged</th><th>profit</th></tr>
          ${!rows.length ? `<tr><td colspan="6" class="empty-note">No people match the current filters.</td></tr>` : rows.map(r => {
            // Utilization: client + internal + time-off, all against capacity.
            const util = stackSegments(r.cap, [['seg-client', r.clientHours], ['seg-internal', r.internalHours], ['seg-pto', r.ptoHours]]);
            // Pacing: assigned hours against capacity — a planning signal,
            // independent of what's actually been logged.
            const pacing = stackSegments(r.cap, [[r.assignedHours > r.cap ? 'seg-over' : 'seg-good', r.assignedHours]]);
            // Plan vs. logged: client hours logged against client hours
            // assigned — undefined (not zero) while nothing's assigned yet.
            const hasPlan = r.assignedHours > 0;
            const planVsLogged = hasPlan
              ? stackSegments(r.assignedHours, [[r.clientHours > r.assignedHours ? 'seg-over' : 'seg-good', r.clientHours]])
              : null;
            return `<tr class="${r.profit<0?'risk-row':''}">
                <td class="textleft">${esc(r.s.name)}<div class="summary-note">${esc(r.s.department||'')}</div></td>
                <td>${fmtHours(r.cap)}h</td>
                <td class="textleft">
                  <div class="mini-track split">${util.html}</div>
                  <div class="delta-note flat">${fmtHours(r.clientHours)}h client · ${fmtHours(r.internalHours)}h int · ${fmtHours(r.ptoHours)}h PTO / ${fmtHours(r.cap)}h cap</div>
                  ${util.overBy > 0.05 ? `<div class="delta-note neg">+${fmtHours(util.overBy)}h over capacity</div>` : ''}
                </td>
                <td class="textleft">
                  <div class="mini-track split">${pacing.html}</div>
                  <div class="delta-note flat">${r.assignedHours>0?`${fmtHours(r.assignedHours)}h assigned / ${fmtHours(r.cap)}h cap`:'not assigned yet'}</div>
                </td>
                <td class="textleft">
                  ${hasPlan ? `<div class="mini-track split">${planVsLogged.html}</div>
                    <div class="delta-note flat">${fmtHours(r.clientHours)}h logged / ${fmtHours(r.assignedHours)}h assigned</div>
                    ${planVsLogged.overBy > 0.05 ? `<div class="delta-note neg">+${fmtHours(planVsLogged.overBy)}h over plan</div>` : ''}`
                    : `<div class="mini-track split"></div><div class="delta-note flat">not assigned yet</div>`}
                </td>
                <td class="${r.profit<0?'err':'pos'}">${(r.hc.hours>0||r.hc.cost>0)?fmt$0(r.profit):'<span class="muted">—</span>'}</td>
              </tr>`;
          }).join('')}
        </table>
      </div>`;

    el.querySelector('#r-from').onchange = e => { rangeFrom = monthOf(e.target.value); load(); };
    el.querySelector('#r-to').onchange = e => { rangeTo = monthOf(e.target.value); load(); };
    el.querySelector('#dept-filter').onchange = e => { deptFilter = e.target.value; render(H, P, deals); };
    el.querySelector('#q').oninput = e => { query = e.target.value; render(H, P, deals); };
    el.querySelector('#show-inactive').onchange = e => { showInactive = e.target.checked; render(H, P, deals); };
  }

  await load();
});
</script></body></html>
