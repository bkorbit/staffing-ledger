name: Sync QuickBooks Time actuals

# Every 2 hours during business hours (8am-8pm US Eastern), plus manual dispatch —
# the same schedule as the HubSpot and QBO syncs, so hours logged this morning
# are on Project Hours this afternoon. GitHub Actions cron has no timezone
# support, so two lines cover DST: the first targets EDT (UTC-4, roughly
# Mar-Nov), the second EST (UTC-5, Dec-Feb) — each maps to 8/10/12/14/16/18/20
# Eastern. Safe to run this often since 090: rows are upserted and the previous
# run's swept afterwards, so a run never blanks the window.
on:
  schedule:
    - cron: '0 0,12,14,16,18,20,22 3-11 * *'   # EDT: 8am-8pm Eastern
    - cron: '0 1,13,15,17,19,21,23 1,2,12 * *' # EST: 8am-8pm Eastern
  workflow_dispatch:       # adds a "Run workflow" button for manual syncs
    inputs:
      trace:
        description: 'Trace one client through the sync (substring of a jobcode or person name, e.g. materialplus)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pure logic (jobcode matching, time-off/internal classification,
      # date-range merging) runs before anything touches QuickBooks Time or Supabase.
      - name: Unit tests
        run: node scripts/test/qbtime.test.mjs

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull QB Time hours into Supabase
        run: node scripts/sync-qbtime.mjs
        env:
          QBTIME_TOKEN: ${{ secrets.QBTIME_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          QBTIME_TRACE: ${{ inputs.trace }}
