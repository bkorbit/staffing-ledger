name: Sync QBO (new)

# Nightly at 07:00 UTC, plus manual dispatch. The schedule went on after the pipeline
# proved itself against real data: tests gate the sync, failures are recorded in
# sync_state, and the curves refresh as part of each run.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The pure logic runs before anything touches QuickBooks or the database.
      - name: Unit tests
        run: node scripts/test/qbo.test.mjs
      - name: End-to-end run against stubbed QuickBooks and Supabase
        run: node scripts/test/qbo.e2e.mjs

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync QuickBooks Online into Postgres
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: node scripts/sync-qbo.mjs
