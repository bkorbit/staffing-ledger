name: Sync QBO (new)

# Every 2 hours during business hours (8am-8pm US Eastern), plus manual dispatch.
# GitHub Actions cron has no timezone support, so two lines cover DST: the first
# targets EDT (UTC-4, roughly Mar-Nov), the second EST (UTC-5, Dec-Feb) — each
# maps to 8/10/12/14/16/18/20 Eastern. The schedule went on after the pipeline
# proved itself against real data: tests gate the sync, failures are recorded in
# sync_state, and the curves refresh as part of each run.
on:
  schedule:
    - cron: '0 0,12,14,16,18,20,22 3-11 * *'   # EDT: 8am-8pm Eastern
    - cron: '0 1,13,15,17,19,21,23 1,2,12 * *' # EST: 8am-8pm Eastern
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The pure logic runs before anything touches QuickBooks or the database.
      - name: Unit tests
        run: node scripts/test/qbo.test.mjs
      - name: End-to-end run against stubbed QuickBooks and Supabase
        run: node scripts/test/qbo.e2e.mjs

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync QuickBooks Online into Postgres
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: node scripts/sync-qbo.mjs
